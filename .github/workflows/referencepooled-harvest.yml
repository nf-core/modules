name: harvest-referencepooled-snapshot

# Temporary fork-only workflow: regenerates the referencepooled snapshot on linux/amd64
# (the CI architecture) since no local docker/linux is available.

on:
  push:
    branches: [cnvkit/referencepooled]
  workflow_dispatch:

env:
  NFT_VER: "0.9.5"
  NXF_VER: "25.10.2"
  NXF_ANSI_LOG: false

jobs:
  harvest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "${{ env.NXF_VER }}"

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Set up nf-test
        uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
        with:
          version: "${{ env.NFT_VER }}"
          install-fast-diff: true

      - name: Set up Conda
        uses: conda-incubator/setup-miniconda@be893c923ea9cf1cf7cd510fbdde27c7e18cbdcb # v4
        with:
          auto-update-conda: true
          conda-solver: libmamba
          conda-remove-defaults: true

      - name: Run nf-test with snapshot update
        shell: bash
        run: |
          NFT_WORKDIR=~
          nf-test test \
            --profile=+conda \
            --tap=test.tap \
            --verbose \
            --ci \
            --update-snapshot \
            modules/nf-core/cnvkit/referencepooled/tests

      - name: Upload regenerated snapshot
        uses: actions/upload-artifact@b7c18920e97e0f161b22737ec4ef00db0c45ba43 # v6
        with:
          name: referencepooled-snap
          path: modules/nf-core/cnvkit/referencepooled/tests/main.nf.test.snap

      - name: Upload tap log
        if: always()
        uses: actions/upload-artifact@b7c18920e97e0f161b22737ec4ef00db0c45ba43 # v6
        with:
          name: referencepooled-tap
          path: test.tap
