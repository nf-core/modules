name: update-gpu-snapshot
run-name: update gpu snapshot (automated)
on:
  issue_comment:
    types: [created]

permissions: {}

env:
  # renovate: datasource=github-releases depName=askimed/nf-test versioning=semver
  NFT_VER: "0.9.5"
  NXF_ANSI_LOG: false
  # renovate: datasource=github-releases depName=nextflow/nextflow versioning=semver
  NXF_VER: "26.04.0"

jobs:
  prepare-gpu-update:
    # Only run if comment is on a PR with the main repo, and if it contains the magic keywords.
    if: >
      contains(github.event.comment.html_url, '/pull/') &&
      contains(github.event.comment.body, '@nf-core-bot update gpu snapshot') &&
      github.repository == 'nf-core/modules' &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    permissions:
      issues: write
      pull-requests: read
    runs-on: ubuntu-latest
    outputs:
      head_repo: ${{ steps.pr.outputs.head_repo }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      test_path: ${{ steps.path.outputs.test_path }}
      tags: ${{ steps.path.outputs.tags }}
      valid_path: ${{ steps.path.outputs.valid_path }}
    steps:
      # indication that the snapshot is being updated
      - name: React on comment
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: eyes

      - name: Record pull request head
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          pr_json=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
          head_sha=$(jq -r '.head.sha // empty' <<< "$pr_json")
          head_repo=$(jq -r '.head.repo.full_name // empty' <<< "$pr_json")
          if ! [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || [ -z "$head_repo" ]; then
            echo "The pull request head metadata is invalid."
            exit 1
          fi
          echo "head_sha=$head_sha" >> "$GITHUB_OUTPUT"
          echo "head_repo=$head_repo" >> "$GITHUB_OUTPUT"

      - name: Parse and validate test path
        id: path
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        shell: bash
        run: |
          python3 - << 'EOF'
          import os
          import re
          import sys

          comment_body = os.environ.get("COMMENT_BODY", "")
          github_output = os.environ.get("GITHUB_OUTPUT")

          def write_output(k, v):
              if github_output:
                  with open(github_output, "a") as f:
                      f.write(f"{k}={v}\n")

          command_re = re.compile(r"^\s*@nf-core-bot\s+update\s+gpu\s+snapshot(?:\s+(.*))?$", re.IGNORECASE)
          matches = []
          for line in comment_body.splitlines():
              m = command_re.match(line)
              if m:
                  matches.append(m.group(1) or "")

          if len(matches) != 1:
              write_output("valid_path", "false")
              sys.exit(0)

          arg_str = matches[0].strip()
          tokens = arg_str.split()

          test_path = None
          extra_tags = []

          i = 0
          invalid = False
          while i < len(tokens):
              tok = tokens[i]
              if tok == "path:":
                  if i + 1 < len(tokens):
                      if test_path is not None:
                          invalid = True
                          break
                      test_path = tokens[i + 1]
                      i += 2
                  else:
                      invalid = True
                      break
              elif tok.startswith("path:"):
                  if test_path is not None:
                      invalid = True
                      break
                  test_path = tok[5:]
                  i += 1
              elif tok in ("tag:", "tags:"):
                  if i + 1 < len(tokens):
                      extra_tags.extend(tokens[i + 1].split(","))
                      i += 2
                  else:
                      invalid = True
                      break
              elif tok.startswith("tag:"):
                  extra_tags.extend(tok[4:].split(","))
                  i += 1
              elif tok.startswith("tags:"):
                  extra_tags.extend(tok[5:].split(","))
                  i += 1
              else:
                  invalid = True
                  break

          if invalid:
              write_output("valid_path", "false")
              sys.exit(0)

          if test_path is None:
              test_path = "."

          if not test_path or test_path.startswith("/") or ".." in test_path:
              write_output("valid_path", "false")
              sys.exit(0)

          if not re.match(r"^[a-zA-Z0-9_./*-]+$", test_path):
              write_output("valid_path", "false")
              sys.exit(0)

          if test_path != "." and not (test_path.startswith("modules") or test_path.startswith("subworkflows")):
              write_output("valid_path", "false")
              sys.exit(0)

          cleaned_tags = ["gpu"]
          for t in extra_tags:
              t_str = t.strip()
              if not t_str:
                  continue
              if not re.match(r"^[a-zA-Z0-9_-]+$", t_str):
                  write_output("valid_path", "false")
                  sys.exit(0)
              if t_str not in cleaned_tags:
                  cleaned_tags.append(t_str)

          write_output("test_path", test_path)
          write_output("tags", ",".join(cleaned_tags))
          write_output("valid_path", "true")
          EOF

      - name: React if test path is invalid
        if: steps.path.outputs.valid_path != 'true'
        uses: peter-evans/create-or-update-comment@e8674b075228eee787fea43ef493e45ece1004c9 # v5
        with:
          comment-id: ${{ github.event.comment.id }}
          reactions: "-1"

  update-gpu-snapshot:
    needs: prepare-gpu-update
    if: needs.prepare-gpu-update.outputs.valid_path == 'true'
    permissions:
      contents: read
    runs-on: "runs-on=${{ github.run_id }}/family=g4dn.xlarge/image=ubuntu24-gpu-x64"
    outputs:
      has_patch: ${{ steps.patch.outputs.has_patch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ needs.prepare-gpu-update.outputs.head_repo }}
          ref: ${{ needs.prepare-gpu-update.outputs.head_sha }}
          persist-credentials: false

      - name: Verify test path
        env:
          TEST_PATH: ${{ needs.prepare-gpu-update.outputs.test_path }}
        run: |
          workspace=$(realpath --canonicalize-existing "$GITHUB_WORKSPACE")
          if [[ "$TEST_PATH" == /* ]] || [[ "$TEST_PATH" == *..* ]]; then
            echo "The test path is invalid."
            exit 1
          fi
          if [ "$TEST_PATH" != "." ]; then
            shopt -s nullglob
            matches=( $TEST_PATH )
            shopt -u nullglob
            if [ ${#matches[@]} -eq 0 ]; then
              echo "The test path does not match any file or directory: $TEST_PATH"
              exit 1
            fi
            for match in "${matches[@]}"; do
              real_match=$(realpath --canonicalize-existing "$match" 2>/dev/null || true)
              if [ -z "$real_match" ] || [[ "$real_match" != "${workspace}"/* && "$real_match" != "${workspace}" ]]; then
                echo "Path match is outside the workspace or invalid: $match"
                exit 1
              fi
            done
          fi

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: "temurin"
          java-version: "25"

      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@893c28b667aedeba26e37f296d260ccc5bc4d914 # v3
        with:
          version: "${{ env.NXF_VER }}"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.15"

      - name: Set up nf-test
        uses: nf-core/setup-nf-test@4069fbbaabe94c08faba4ad261bfa88225ba133f # v2
        with:
          version: "${{ env.NFT_VER }}"
          install-fast-diff: true

      - name: Update GPU snapshot
        env:
          TEST_PATH: ${{ needs.prepare-gpu-update.outputs.test_path }}
          TAGS: ${{ needs.prepare-gpu-update.outputs.tags }}
        run: |
          nf-test test \
            --profile=docker,gpu \
            --verbose \
            --ci \
            --update-snapshot \
            --filter process,workflow \
            --tag "$TAGS" \
            "$TEST_PATH"

      - name: Create GPU snapshot patch
        id: patch
        env:
          PATCH_FILE: ${{ runner.temp }}/gpu-snapshot.patch
        run: |
          git add -N -- '*.nf.test.snap' 2>/dev/null || true
          git diff --binary --full-index --no-ext-diff -- '*.nf.test.snap' > "$PATCH_FILE"
          if [ ! -s "$PATCH_FILE" ]; then
            echo "The GPU test did not update any snapshot."
            exit 1
          fi
          echo "has_patch=true" >> "$GITHUB_OUTPUT"

      - name: Upload GPU snapshot patch
        if: steps.patch.outputs.has_patch == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: gpu-snapshot-patch
          path: ${{ runner.temp }}/gpu-snapshot.patch
          if-no-files-found: error
          retention-days: 1

  push-gpu-snapshot:
    needs: [prepare-gpu-update, update-gpu-snapshot]
    if: needs.update-gpu-snapshot.outputs.has_patch == 'true'
    permissions:
      actions: read
      contents: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # Action runs on the issue comment, so we don't get the PR by default.
      # Use the gh cli to check out the PR.
      - name: Checkout exact pull request head
        env:
          EXPECTED_HEAD_SHA: ${{ needs.prepare-gpu-update.outputs.head_sha }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.issue.number }}
        run: |
          gh pr checkout "$PR_NUMBER"
          if [ "$(git rev-parse HEAD)" != "$EXPECTED_HEAD_SHA" ]; then
            echo "The pull request head changed after the GPU test ran."
            exit 1
          fi

      - name: Download GPU snapshot patch
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gpu-snapshot-patch
          path: ${{ runner.temp }}/gpu-snapshot

      - name: Validate and apply GPU snapshot patch
        env:
          PATCH_FILE: ${{ runner.temp }}/gpu-snapshot/gpu-snapshot.patch
          TEST_PATH: ${{ needs.prepare-gpu-update.outputs.test_path }}
        run: |
          if [ ! -f "$PATCH_FILE" ] || [ -L "$PATCH_FILE" ]; then
            echo "The artifact does not contain a regular GPU snapshot patch."
            exit 1
          fi
          git apply --check --index "$PATCH_FILE"
          git apply --index "$PATCH_FILE"

          changed_files=$(git diff --cached --name-only)
          if [ -z "$changed_files" ]; then
            echo "The patch contains no changed files."
            exit 1
          fi

          clean_test_path="${TEST_PATH%/}"
          dir_test_path="$(dirname "$clean_test_path")"

          while IFS= read -r file; do
            [ -z "$file" ] && continue
            if [[ "$file" != *.nf.test.snap ]]; then
              echo "The patch modifies a non-snapshot file: $file"
              exit 1
            fi
            if [ "$TEST_PATH" != "." ]; then
              if ! [[ "$file" == $clean_test_path/* || "$file" == $clean_test_path || "$file" == "$clean_test_path.snap" || "$file" == $dir_test_path/* ]]; then
                echo "The patch changes a file outside the requested path ($TEST_PATH): $file"
                exit 1
              fi
            fi
          done <<< "$changed_files"

      - name: Commit and push GPU snapshot
        env:
          GH_TOKEN: ${{ secrets.nf_core_bot_auth_token }}
        run: |
          gh auth setup-git
          git config user.email "core@nf-co.re"
          git config user.name "nf-core-bot"
          git config push.default upstream
          git status
          git -c core.hooksPath=/dev/null -c commit.gpgsign=false commit --no-verify -m "[automated] Update gpu snapshot"
          git -c core.hooksPath=/dev/null push --no-verify
