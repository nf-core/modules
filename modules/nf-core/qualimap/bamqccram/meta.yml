name: qualimap_bamqccram
description: Evaluate alignment data
keywords:
  - quality control
  - qc
  - bam
tools:
  - qualimap:
      description: |
        Qualimap 2 is a platform-independent application written in
        Java and R that provides both a Graphical User Interface and
        a command-line interface to facilitate the quality control of
        alignment sequencing data and its derivatives like feature counts.
      homepage: http://qualimap.bioinfo.cipf.es/
      documentation: http://qualimap.conesalab.org/doc_html/index.html
      doi: 10.1093/bioinformatics/bts503
      licence:
        - "GPL-2.0-only"
      identifier: biotools:qualimap
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - cram:
        type: file
        description: Input cram file
        pattern: "*.{cram}"
        ontologies: []
    - crai:
        type: file
        description: Index file for cram file
        pattern: "*.{crai}"
        ontologies: []
  - gff:
      type: file
      description: Feature file with regions of interest
      pattern: "*.{gff,gtf,bed}"
      ontologies: []
  - fasta:
      type: file
      description: Reference file of cram file
      pattern: "*.{fasta,fa,fna}"
      ontologies: []
  - fasta_fai:
      type: file
      description: Index file for reference file
      pattern: "*.{fai}"
      ontologies: []
output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}:
          type: directory
          description: Qualimap results dir
          pattern: "*/*"
  versions_qualimap:
    - - ${task.process}:
          type: string
          description: The name of the process
      - qualimap:
          type: string
          description: The name of the tool
      - qualimap -h | sed -n 's/^QualiMap v.//p':
          type: eval
          description: The expression to obtain the version of the tool

  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - qualimap:
          type: string
          description: The name of the tool
      - qualimap -h | sed -n 's/^QualiMap v.//p':
          type: eval
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@FriederikeHanssen"
maintainers:
  - "@FriederikeHanssen"
