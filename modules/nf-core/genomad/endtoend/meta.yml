name: "genomad_endtoend"
description: Identify mobile genetic elements present in genomic assemblies
keywords:
  - metagenomics
  - genomad
  - database
  - download
  - phage
  - virus
  - plasmid
tools:
  - "genomad":
      description: "Identification of mobile genetic elements"
      homepage: https://portal.nersc.gov/genomad/
      documentation: https://portal.nersc.gov/genomad/
      tool_dev_url: https://github.com/apcamargo/genomad/
      doi: 10.1101/2023.03.05.531206
      licence:
        - "Lawrence Berkeley National Labs BSD variant license"
      identifier: biotools:genomad
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: FASTA file containing contigs/scaffolds/chromosomes
        pattern: "*.{fasta,fna,fa}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - genomad_db:
        type: directory
        description: Directory pointing to geNomad database
output:
  genomad_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/:
          type: file
          description: The full output directory from Genomad
          pattern: "${prefix}/"
          ontologies: []
  aggregated_classification:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_aggregated_classification/*_aggregated_classification.tsv:
          type: file
          description: Combined classification scores for each contig/scaffold/chromosome
          pattern: "*_aggregated_classification.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  marker_classification:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_marker_classification/*_marker_classification.tsv:
          type: file
          description: Marker-based classification scores when --disable-nn-classification is used
          pattern: "*_marker_classification.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  taxonomy:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_annotate/*_taxonomy.tsv:
          type: file
          description: Detailed output of geNomad's marker gene taxonomy analysis
          pattern: "*_taxonomy.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  provirus:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_find_proviruses/*_provirus.tsv:
          type: file
          description: Detailed output of each provirus identified by geNomad's find_proviruses module
          pattern: "*_provirus.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  compositions:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_score_calibration/*_compositions.tsv:
          type: file
          description: OPTIONAL - Predicted sample composition when `--enable-score-calibration` is used
          pattern: "*_compositions.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  calibrated_classification:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_score_calibration/*_calibrated_aggregated_classification.tsv:
          type: file
          description: OPTIONAL - Classification scores that have been adjusted based on sample composition when `--enable-score-calibration` is used`
          pattern: "*_calibrated_aggregated_classification.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  plasmid_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_plasmid.fna.gz:
          type: file
          description: FASTA file containing predicted plasmid sequences
          pattern: "*_plasmid.fna"
          ontologies: []
  plasmid_genes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_plasmid_genes.tsv:
          type: file
          description: TSV file containing predicted plasmid genes and their annotations
          pattern: "*_plasmid_genes.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  plasmid_proteins:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_plasmid_proteins.faa.gz:
          type: file
          description: FASTA file containing predicted plasmid protein sequences
          pattern: "*_plasmid_proteins.faa"
          ontologies: []
  plasmid_summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_plasmid_summary.tsv:
          type: file
          description: TSV file containing a summary of geNomad's plasmid predictions
          pattern: "*_plasmid_summary.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  virus_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_virus.fna.gz:
          type: file
          description: FASTA file containing predicted virus sequences
          pattern: "*_virus.fna"
          ontologies: []
  virus_genes:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_virus_genes.tsv:
          type: file
          description: TSV file containing predicted virus genes and their annotations
          pattern: "*_virus_genes.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  virus_proteins:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_virus_proteins.faa.gz:
          type: file
          description: FASTA file containing predicted virus protein sequences
          pattern: "*_virus_proteins.faa"
          ontologies: []
  virus_summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*_summary/*_virus_summary.tsv:
          type: file
          description: TSV file containing a summary of geNomad's virus predictions
          pattern: "*_virus_summary.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_genomad:
    - - ${task.process}:
          type: string
          description: The name of the process
      - genomad:
          type: string
          description: The name of the tool
      - genomad --version 2>&1 | sed 's/^.*geNomad, version //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_genomad_db:
    - - ${task.process}:
          type: string
          description: The name of the process
      - genomad_db:
          type: string
          description: The name of the tool
      - if [ -s ${genomad_db}/version.txt ]; then cat ${genomad_db}/version.txt; else echo 'unknown'; fi:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - genomad:
          type: string
          description: The name of the tool
      - genomad --version 2>&1 | sed 's/^.*geNomad, version //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - genomad_db:
          type: string
          description: The name of the tool
      - if [ -s ${genomad_db}/version.txt ]; then cat ${genomad_db}/version.txt; else echo 'unknown'; fi:
          type: eval
          description: The expression to obtain the version of the tool
