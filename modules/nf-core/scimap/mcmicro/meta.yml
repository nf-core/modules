name: "scimap_mcmicro"
description: SCIMAP is a suite of tools that enables spatial single-cell analyses
keywords:
  - sort
  - spatial
  - single cell
tools:
  - "scimap":
      description: "Scimap is a scalable toolkit for analyzing spatial molecular data."
      homepage: "https://scimap.xyz/"
      documentation: "https://scimap.xyz/All%20Functions/A.%20Pre%20Processing/sm.pp.mcmicro_to_scimap/"
      tool_dev_url: "https://github.com/labsyspharm/scimap"
      licence: ["MIT License"]
      identifier: biotools:SCIMAP
input:
  # Only when we have meta
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - cellbyfeature:
        type: file
        description: CSV file with cell by feature table
        pattern: "*.{csv}"
        ontologies:
          - edam: http://edamontology.org/format_3752 # CSV
output:
  #Only when we have meta
  csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.csv":
          type: file
          description: Sorted CSV file
          pattern: "*.{csv}"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  h5ad:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.h5ad":
          type: file
          description: Sorted H5AD file
          pattern: "*.{h5ad}"
          ontologies: []
  versions_scimap:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scimap:
          type: string
          description: The name of the tool
      - "2.1.3":
          type: string
          description: The version of the tool
          # WARN: Version information not provided by tool on CLI. Please update this string when bumping container versions.

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scimap:
          type: string
          description: The name of the tool
      - "2.1.3":
          type: string
          description: The version of the tool
authors:
  - "@luiskuhn"
maintainers:
  - "@luiskuhn"
