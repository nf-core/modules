name: "stitch"
description: "STITCH is an R program for reference panel free, read aware, low coverage sequencing genotype imputation. STITCH runs on a set of samples with sequencing reads in BAM format, as well as a list of positions to genotype, and outputs imputed genotypes in VCF format."
keywords:
  - imputation
  - genomics
  - vcf
  - bgen
  - cram
  - bam
  - sam
tools:
  - "stitch":
      description: "STITCH - Sequencing To Imputation Through Constructing Haplotypes"
      homepage: "https://github.com/rwdavies/stitch"
      documentation: "https://github.com/rwdavies/stitch"
      tool_dev_url: "https://github.com/rwdavies/stitch"
      doi: "10.1038/ng.3594"
      licence:
        - "GPL v3"
      identifier: biotools:stitch-snijderlab
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing information about the set of samples
          e.g. `[ id:'test' ]`
    - collected_crams:
        type: file
        description: List of sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - collected_crais:
        type: file
        description: List of BAM/CRAM/SAM index files
        pattern: "*.{bai,crai,sai}"
        ontologies: []
    - cramlist:
        type: file
        description: |
          Text file with the path to the cram files to use in imputation, one per line. Since the cram files are staged to the working directory for the process, this file should just contain the file names without any pre-pending path.
        pattern: "*.txt"
        ontologies: []
    - samplename:
        type: file
        description: (Optional) File with list of samples names in the same order as in bamlist to impute. One file per line.
        pattern: "*.{txt}"
        ontologies: []
    - posfile:
        type: file
        description: |
          Tab-separated file describing the variable positions to be used for imputation. Refer to the documentation for the `--posfile` argument of STITCH for more information.
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - input:
        type: directory
        description: |
          Folder of pre-generated input RData objects used when STITCH is called with the `--regenerateInput FALSE` flag. It is generated by running STITCH with the `--generateInputOnly TRUE` flag.
        pattern: "input"
    - genetic_map:
        type: file
        description: (Optional) File with genetic map information, a file with 3 white-space delimited entries giving position (1-based), genetic rate map in cM/Mbp, and genetic map in cM. If no file included, rate is based on physical distance and expected rate (expRate).
        pattern: "*.{txt,map}{,gz}"
        ontologies:
          - edam: http://edamontology.org/format_3989
    - rdata:
        type: directory
        description: |
          Folder of pre-generated input RData objects used when STITCH is called with the `--regenerateInput FALSE` flag. It is generated by running STITCH with the `--generateInputOnly TRUE` flag.
        pattern: "RData"
    - chromosome_name:
        type: string
        description: Name of the chromosome to impute. Should match a chromosome name in the reference genome.
    - start:
        type: integer
        description: Start position of the region to impute.
    - end:
        type: integer
        description: End position of the region to impute.
    - buffer:
        type: integer
        description: Buffer, in base pairs, around the region to impute.
    - K:
        type: integer
        description: Number of ancestral haplotypes to use for imputation. Refer to the documentation for the `--K` argument of STITCH for more information.
    - nGen:
        type: integer
        description: Number of generations since founding of the population to use for imputation. Refer to the documentation for the `--nGen` argument of STITCH for more information.
  - - meta2:
        type: map
        description: |
          Groovy Map containing information about the reference genome used
          e.g. `[ id:'test' ]`
    - fasta:
        type: file
        description: FASTA reference genome file
        pattern: "*.{fa,fasta}"
        ontologies: []
    - fasta_fai:
        type: file
        description: FASTA index file
        pattern: "*.{fai}"
        ontologies: []
  - seed:
      type: integer
      description: Seed for random number generation
output:
  input:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - input:
          type: directory
          description: |
            Folder of pre-generated input RData objects used when STITCH is called with the `--regenerateInput FALSE` flag. It is generated by running STITCH with the `--generateInputOnly TRUE` flag.
          pattern: "input"
  rdata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - RData:
          type: directory
          description: |
            Folder of RData objects generated during the imputation process.
          pattern: "RData"
  plots:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - plots:
          type: directory
          description: |
            Folder of plots generated during the imputation process.
          pattern: "plots"
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "*.vcf.gz":
          type: file
          description: |
            Imputed genotype calls for the positions in `posfile`, in vcf format. This is the default output.
          pattern: ".vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  bgen:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "*.bgen":
          type: file
          description: |
            Imputed genotype calls for the positions in `posfile`, in vcf format. This is the produced if `--output_format bgen` is specified.
          pattern: ".bgen"
          ontologies: []
  versions_r_quilt:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-quilt:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('STITCH')))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_r_base:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
  versions_rsync:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rsync:
          type: string
          description: The name of the tool
      - rsync --version | sed '1!d;s/^rsync  version //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-quilt:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('STITCH')))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed "1!d; s/.*version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
