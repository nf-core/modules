name: hmtnote_annotate
description: Human mitochondrial variants annotation using HmtVar. Contains .plk file with annotation, so can be run offline
deprecated: true
deprecation_date: "2026-05-24"
deprecation_pr: "https://github.com/nf-core/modules/pull/11709"
keywords:
  - hmtnote
  - mitochondria
  - annotation
tools:
  - hmtnote:
      description: Human mitochondrial variants annotation using HmtVar.
      homepage: https://github.com/robertopreste/HmtNote
      documentation: https://hmtnote.readthedocs.io/en/latest/usage.html
      doi: "10.1101/600619"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
    - vcf:
        type: file
        description: vcf file
        pattern: "*.vcf"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
      - "*_annotated.vcf":
          type: file
          description: annotated vcf
          pattern: "*_annotated.vcf"
          ontologies: []
  versions_hmtnote:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmtnote:
          type: string
          description: The name of the tool
      - hmtnote --version 2>&1 | sed 's/.*version //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
