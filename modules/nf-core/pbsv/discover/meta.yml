name: "pbsv_discover"
description: "pbsv - PacBio structural variant (SV) signature discovery tool"
keywords:
  - variant
  - pacbio
  - structural
tools:
  - "pbsv":
      description: "pbsv - PacBio structural variant (SV) calling and analysis tools"
      homepage: "https://github.com/PacificBiosciences/pbsv"
      documentation: "https://github.com/PacificBiosciences/pbsv"
      tool_dev_url: "https://github.com/PacificBiosciences/pbsv"
      licence:
        - "BSD-3-clause-Clear"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference' ]`
    - fasta:
        type: file
        description: fasta file
        pattern: "*.fasta"
        ontologies: []
output:
  svsig:
    - - meta:
          type: file
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
          ontologies: []
      - "*.svsig.gz":
          type: file
          description: structural variant signatures files
          pattern: "*.svsig.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_pbsv:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pbsv:
          type: string
          description: The name of the tool
      - pbsv --version |& sed 's/pbsv //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pbsv:
          type: string
          description: The name of the tool
      - pbsv --version |& sed 's/pbsv //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@tanyasarkjain"
maintainers:
  - "@tanyasarkjain"
