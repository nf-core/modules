name: allelecounter
description: Generates a count of coverage of alleles
keywords:
  - allele
  - count
  - coverage
tools:
  - allelecounter:
      description: Takes a file of locations and a [cr|b]am file and generates a count of coverage of each allele at that location (given any filter settings)
      homepage: https://github.com/cancerit/alleleCount
      documentation: https://github.com/cancerit/alleleCount
      tool_dev_url: https://github.com/cancerit/alleleCount
      licence:
        - "GPL 3.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_3462" # CRAM
          - edam: "http://edamontology.org/format_2573" # SAM
    - input_index:
        type: file
        description: BAM/CRAM/SAM index file
        pattern: "*.{bai,crai,sai}"
        ontologies:
          - edam: "http://edamontology.org/format_3327" # BAI
          - edam: "http://edamontology.org/format_3462" # CRAI
  - loci:
      type: file
      description: loci file <CHR><tab><POS1>
      pattern: "*.{tsv}"
      ontologies:
        - edam: "http://edamontology.org/format_3475" # TSV
  - fasta:
      type: file
      description: Input genome fasta file. Required when passing CRAM files.
      ontologies:
        - edam: "http://edamontology.org/format_1929" # FASTA
output:
  allelecount:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.alleleCount":
          type: file
          description: Allele count file
          pattern: "*.{alleleCount}"
          ontologies: []
  versions_allelecounter:
    - - ${task.process}:
          type: string
          description: The name of the process
      - alleleCounter:
          type: string
          description: The name of the tool
      - alleleCounter --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - alleleCounter:
          type: string
          description: The name of the tool
      - alleleCounter --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@fullama"
  - "@fbdtemme"
maintainers:
  - "@fullama"
  - "@fbdtemme"
