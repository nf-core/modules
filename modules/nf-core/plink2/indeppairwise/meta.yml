      name: oras://community.wave.seqera.io/library/plink2:2.00a5.10--d40179e933fa9ccc
      build_id: bd-d40179e933fa9ccc_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/c7/c7dfbbefb7c4dccd8c211a1c8bf94988dcd6a58a147e5c22e2553e80af907569/data
