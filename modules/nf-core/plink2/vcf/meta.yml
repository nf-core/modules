name: plink2_vcf
description: Import variant genetic data using plink2
keywords:
  - plink2
  - import
  - "variant genetic"
tools:
  - plink2:
      description: |
        Whole genome association analysis toolset, designed to perform a range
        of basic, large-scale analyses in a computationally efficient manner
      homepage: http://www.cog-genomics.org/plink/2.0/
      documentation: http://www.cog-genomics.org/plink/2.0/general_usage
      licence: ["GPL v3"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: Variant calling file (vcf)
        pattern: "*.{vcf}, *.{vcf.gz}"
        ontologies: []
output:
  pgen:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pgen":
          type: file
          description: PLINK 2 binary genotype table
          pattern: "*.{pgen}"
          ontologies: []
  psam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.psam":
          type: file
          description: PLINK 2 sample information file
          pattern: "*.{psam}"
          ontologies: []
  pvar:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pvar":
          type: file
          description: PLINK 2 variant information file
          pattern: "*.{pvar.zst}"
          ontologies: []
  pvar_zst:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pvar.zst":
          type: file
          description: PLINK 2 variant information zst file
          pattern: "*.pvar.zst"
          ontologies:
            - edam: http://edamontology.org/format_4006 # Zstandard format
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\$//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\$//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@nebfield"
maintainers:
  - "@nebfield"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/plink2:2.00a2.3--1c05b6e0948ac0c2
      build_id: bd-1c05b6e0948ac0c2_1
      scan_id: sc-4f2ae30231afeb16_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/plink2:2.00a2.3--b7f9e8379af94ee8
      build_id: bd-b7f9e8379af94ee8_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/27/278e4e95ad25ec7048ab124f16a7cf8b8141ced9e05c51f61803567cd9017f4d/data
  conda:
