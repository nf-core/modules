name: "plink2_filter"
description: Filters plink bfiles or pfiles with filters such as maf or var
keywords:
  - plink2
  - filter
  - samples
  - variants
  - missingness
  - qualty
tools:
  - "plink2":
      description: |
        Whole genome association analysis toolset, designed to perform a range
        of basic, large-scale analyses in a computationally efficient manner
      homepage: http://www.cog-genomics.org/plink/2.0/
      documentation: http://www.cog-genomics.org/plink/2.0/general_usage
      doi: "10.1186/s13742-015-0047-8"
      licence:
        - "GPL v3"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - plink_genotype_file:
        type: file
        description: PLINK binary genotype table file or PLINK 2 binary genotype table file
        pattern: "*.{bed,pgen}"
        ontologies:
          - edam: http://edamontology.org/format_3003
    - plink_variant_file:
        type: file
        description: PLINK extended MAP file or PLINK 2 variant information file
        pattern: "*.{bim,pvar}"
        ontologies: []
    - plink_sample_file:
        type: file
        description: PLINK sample information file or PLINK 2 sample information file
        pattern: "*.{fam,psam}"

        ontologies: []
output:
  bim:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bim":
          type: file
          description: PLINK extended map file
          pattern: "*.bim"
          ontologies: []
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bed":
          type: file
          description: PLINK binary allelic genotype table
          pattern: "*.bed"
          ontologies:
            - edam: http://edamontology.org/format_3003
  fam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fam":
          type: file
          description: PLINK sample information file
          pattern: "*.fam"
          ontologies: []
  pgen:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pgen":
          type: file
          description: PLINK 2 binary genotype table
          pattern: "*.pgen"
          ontologies:
            - edam: http://edamontology.org/format_3003
  psam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.psam":
          type: file
          description: PLINK 2 sample information file
          pattern: "*.psam"
          ontologies: []
  pvar:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pvar":
          type: file
          description: PLINK 2 variant information file
          pattern: "*.pvar"
          ontologies: []
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\$//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\$//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@jodennehy"
maintainers:
  - "@jodennehy"
