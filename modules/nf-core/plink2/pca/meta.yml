name: "plink2_pca"
description: Perform PCA analysis using PLINK
keywords:
  - plink2
  - pca
  - plink2_pca

tools:
  - plink2:
      description: |
        Whole genome association analysis toolset, designed to perform a range
        of basic, large-scale analyses in a computationally efficient manner
      homepage: http://www.cog-genomics.org/plink/2.0/
      documentation: http://www.cog-genomics.org/plink/2.0/general_usage
      doi: "10.1186/s13742-015-0047-8"
      licence: ["GPL v3"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - npcs:
        type: integer
        description: Number of PCs to compute
    - use_approx:
        type: boolean
        description: If true, use the approximate method
    - pgen:
        type: file
        description: PLINK 2 binary genotype table
        pattern: "*.{pgen}"
        ontologies: []
    - psam:
        type: file
        description: PLINK 2 sample information file
        pattern: "*.{psam}"
        ontologies: []
    - pvar:
        type: file
        description: PLINK 2 variant information file
        pattern: "*.{pvar}"

        ontologies: []
output:
  evecfile:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
          pattern: "*.eigenvec"
      - "*.eigenvec":
          type: map
          description: |
            Groovy Map containing sample information
          pattern: "*.eigenvec"
  evfile:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
          pattern: "*.eigenvec"
      - "*.eigenval":
          type: map
          description: |
            Groovy Map containing sample information
          pattern: "*.eigenval"
  logfile:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
          pattern: "*.eigenvec"
      - "*.log":
          type: map
          description: |
            Groovy Map containing sample information
          pattern: "*.log"
  versions_plink2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\$//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plink2:
          type: string
          description: The name of the tool
      - plink2 --version 2>&1 | sed 's/^PLINK v//; s/ 64.*\$//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@bruno-ariano"
maintainers:
  - "@bruno-ariano"
