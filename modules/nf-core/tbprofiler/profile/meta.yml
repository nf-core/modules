name: tbprofiler_profile
description: A tool to detect resistance and lineages of M. tuberculosis genomes
keywords:
  - Mycobacterium tuberculosis
  - resistance
  - serotype
tools:
  - tbprofiler:
      description: Profiling tool for Mycobacterium tuberculosis to detect drug resistance and lineage from WGS data
      homepage: https://github.com/jodyphelan/TBProfiler
      documentation: https://jodyphelan.gitbook.io/tb-profiler/
      tool_dev_url: https://github.com/jodyphelan/TBProfiler
      doi: "10.1186/s13073-019-0650-x"
      licence:
        - "GPL v3"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: FASTQ file
        pattern: "*.{fastq.gz,fq.gz}"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - bam/*.bam:
          type: file
          description: BAM file with alignment details
          pattern: "*.bam"
          ontologies: []
  csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - results/*.csv:
          type: file
          description: Optional CSV formatted result file of resistance and strain type
          pattern: "*.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - results/*.json:
          type: file
          description: JSON formatted result file of resistance and strain type
          pattern: "*.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - results/*.txt:
          type: file
          description: Optional text file of resistance and strain type
          pattern: "*.txt"
          ontologies: []
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - vcf/*.vcf.gz:
          type: file
          description: VCF with variant info again reference genomes
          pattern: "*.vcf"
          ontologies: []
  versions_tb_profiler:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tb-profiler:
          type: string
          description: The tool name
      - tb-profiler --version:
          type: eval
          description: The version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - tb-profiler:
          type: string
          description: The tool name
      - tb-profiler --version:
          type: eval
          description: The version of the tool

authors:
  - "@rpetit3"
maintainers:
  - "@rpetit3"
