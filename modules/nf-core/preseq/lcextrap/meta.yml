name: preseq_lcextrap
description: Software for predicting library complexity and genome coverage in high-throughput sequencing
keywords:
  - preseq
  - library
  - complexity
tools:
  - preseq:
      description: Software for predicting library complexity and genome coverage in high-throughput sequencing
      homepage: http://smithlabresearch.org/software/preseq/
      documentation: http://smithlabresearch.org/wp-content/uploads/manual.pdf
      tool_dev_url: https://github.com/smithlabcode/preseq
      licence:
        - "GPL"
      identifier: biotools:preseq
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
output:
  lc_extrap:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.lc_extrap.txt":
          type: file
          description: File containing output of Preseq lcextrap
          pattern: "*.{lc_extrap.txt}"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.log":
          type: file
          description: Log file containing stderr produced by Preseq
          pattern: "*.{log}"
          ontologies: []
  versions_preseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - preseq:
          type: string
          description: The name of the tool
      - "preseq 2>&1 | sed -n 's/Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - preseq:
          type: string
          description: The name of the tool
      - "preseq 2>&1 | sed -n 's/Version: //p'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@drpatelh"
  - "@edmundmiller"
maintainers:
  - "@drpatelh"
  - "@edmundmiller"
