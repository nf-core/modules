name: preseq_lcextrap
description: Software for predicting library complexity and genome coverage in high-throughput sequencing
keywords:
  - preseq
  - library
  - complexity
tools:
  - preseq:
      description: Software for predicting library complexity and genome coverage in high-throughput sequencing
      homepage: http://smithlabresearch.org/software/preseq/
      documentation: http://smithlabresearch.org/wp-content/uploads/manual.pdf
      tool_dev_url: https://github.com/smithlabcode/preseq
      licence:
        - "GPL"
      identifier: biotools:preseq
input:
  - type: record
    description: A BAM file of one sample
    fields:
      id:
        type: String
        description: Sample identifier, used as the default output prefix
      meta:
        type: Record
        optional: true
        description: Pipeline-specific sample information, passed to the output
      single_end:
        type: Boolean
        description: Whether the reads are single-end; paired-end reads run lc_extrap with `-pe`
      bam:
        type: Path
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
      preseq_lcextrap_args:
        type: String
        optional: true
        description: Additional arguments for preseq lc_extrap (overridden by `ext.args`)
      output_prefix:
        type: String
        optional: true
        description: Output file prefix (overridden by `ext.prefix`)
output:
  - type: record
    description: The complexity extrapolation of one sample
    fields:
      id:
        value: id
        type: String
        description: Sample identifier from the input record
      meta:
        value: meta
        type: Record
        optional: true
        description: The `meta` record from the input, `null` if none was given
      lc_extrap:
        value: file("*.lc_extrap.txt")
        type: Path
        description: File containing output of Preseq lcextrap
        pattern: "*.lc_extrap.txt"
        ontologies: []
      log:
        value: file("*.log")
        type: Path
        description: Log file containing stderr produced by Preseq
        pattern: "*.log"
        ontologies: []
topics:
  versions:
    - type: record
      fields:
        process:
          value: '"${task.process}"'
          type: String
          description: The name of the process
        tool:
          value: "'preseq'"
          type: String
          description: The name of the tool
        version:
          value: 'eval("preseq 2>&1 | sed -n ''s/Version: //p''")'
          type: String
          description: The version of the tool
authors:
  - "@drpatelh"
  - "@edmundmiller"
maintainers:
  - "@drpatelh"
  - "@edmundmiller"
