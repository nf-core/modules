name: "spatialcontinuumtranslational_gist"
description: "Calculate uncalibrated research-only GIST phenotype risk scores from cohort data (TSV, CSV, JSON)."
keywords:
  - oncology
  - gist
  - spatial
  - risk stratification
  - phenotype
tools:
  - "spatial-continuum-translational":
      description: "Deterministic GIST phenotype research profile CLI supporting validated TSV, CSV, and JSON cohort inputs."
      homepage: "https://github.com/Lukecele/spatial-continuum-translational"
      documentation: "https://github.com/Lukecele/spatial-continuum-translational#readme"
      tool_dev_url: "https://github.com/Lukecele/spatial-continuum-translational"
      doi: "10.21203/rs.3.rs-11633521/v1"
      licence:
        - "MIT"
      identifier: "biotools:spatial-continuum-translational"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input:
        type: file
        description: Input file containing GIST clinical/histological features (TSV, CSV, or JSON)
        pattern: "*.{tsv,csv,json}"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
          - edam: "http://edamontology.org/format_3752" # CSV
          - edam: "http://edamontology.org/format_3464" # JSON

output:
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_gist.json":
          type: file
          description: "(Optional) GIST phenotype research profile score in JSON format"
          pattern: "${prefix}_gist.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_gist.tsv":
          type: file
          description: "(Optional) GIST phenotype research profile score in TSV format"
          pattern: "${prefix}_gist.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_spatialcontinuumtranslational:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spatial-continuum-translational":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-continuum-translational''))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - spatial-continuum-translational:
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-continuum-translational''))"':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Lukecele"
maintainers:
  - "@Lukecele"
