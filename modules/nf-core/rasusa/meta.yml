name: rasusa
description: Randomly subsample sequencing reads to a specified coverage
keywords:
  - coverage
  - depth
  - subsampling
tools:
  - rasusa:
      description: Randomly subsample sequencing reads to a specified coverage
      homepage: https://github.com/mbhall88/rasusa
      documentation: https://github.com/mbhall88/rasusa/blob/master/README.md
      tool_dev_url: https://github.com/mbhall88/rasusa
      doi: "10.5281/zenodo.3731394"
      licence:
        - "MIT"
      identifier: biotools:rasusa
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: List of input paired-end FastQ files
        ontologies: []
    - genome_size:
        type: string
        description: Genome size of the species
  - depth_cutoff:
      type: integer
      description: Depth of coverage cutoff
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fastq.gz":
          type: file
          description: Reads with subsampled coverage
          pattern: "*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_rasusa:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rasusa:
          type: string
          description: The name of the tool
      - 'rasusa --version 2>&1 | sed -e "s/rasusa //g"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rasusa:
          type: string
          description: The name of the tool
      - 'rasusa --version 2>&1 | sed -e "s/rasusa //g"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@thanhleviet"
  - "@eit-maxlcummins"
maintainers:
  - "@thanhleviet"
containers:
