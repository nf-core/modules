      name: community.wave.seqera.io/library/rasusa:0.3.0--e22d5c77ebcbec79
      build_id: bd-e22d5c77ebcbec79_1
      scan_id: sc-941976fc47b64d8c_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/rasusa:0.3.0--64440735253eb6cb
