# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: isoseq_groupdedup
description: IsoSeq - GroupDedup - Deduplicate PCR artifacts grouped by cell barcode
keywords:
  - dedup
  - single-cell
  - isoseq
  - Pacbio
tools:
  - isoseq:
      description: IsoSeq - GroupDedup - Deduplicate PCR artifacts grouped by cell barcode
        (barcode-sorted FLTNC to DEDUP)
      homepage: https://isoseq.how/
      documentation: https://isoseq.how/
      tool_dev_url: https://github.com/PacificBiosciences/IsoSeq/tree/master
      licence:
        - "BSD-3-Clause-Clear"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - bam:
        type: file
        description: FLTNC BAM file generated by isoseq refine, sorted by cell barcode
          (CB or XC tags)
        pattern: "*.bam"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.dedup.bam":
          type: file
          description: BAM file of deduplicated consensus reads
          pattern: "*.dedup.bam"
          ontologies: []
  pbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.dedup.bam.pbi":
          type: file
          description: Pacbio index of deduplicated consensus reads
          pattern: "*.dedup.bam.pbi"
          ontologies: []
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.dedup.fasta.gz":
          type: file
          description: Gzipped FASTA of deduplicated consensus reads
          pattern: "*.dedup.fasta.gz"
          ontologies:
            - edam: http://edamontology.org/format_1929
  versions_isoseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - isoseq:
          type: string
          description: The name of the tool
      - isoseq groupdedup --version | sed -n '1s/isoseq groupdedup \([0-9.]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - isoseq:
          type: string
          description: The name of the tool
      - isoseq groupdedup --version | sed -n '1s/isoseq groupdedup \([0-9.]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mahesh-panchal"
maintainers:
  - "@mahesh-panchal"
