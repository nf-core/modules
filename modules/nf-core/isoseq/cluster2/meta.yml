# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: isoseq_cluster2
description: IsoSeq - Cluster2 - Cluster full-length non-chimeric reads into transcripts
keywords:
  - cluster
  - HiFi
  - isoseq
  - Pacbio
tools:
  - isoseq:
      description: IsoSeq - Cluster2 - Cluster full-length non-chimeric reads into transcripts,
        replacing the legacy isoseq cluster command
      homepage: https://isoseq.how/clustering/cli-workflow.html
      documentation: https://isoseq.how/clustering/cli-workflow.html
      tool_dev_url: https://github.com/PacificBiosciences/IsoSeq/tree/master
      licence:
        - "BSD-3-Clause-Clear"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - bam:
        type: file
        description: BAM file generated by isoseq refine
        pattern: "*.bam"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.transcripts.bam":
          type: file
          description: BAM file of clustered transcripts
          pattern: "*.transcripts.bam"
          ontologies: []
  pbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.transcripts.bam.pbi":
          type: file
          description: Pacbio index of clustered transcripts
          pattern: "*.transcripts.bam.pbi"
          ontologies: []
  cluster_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.transcripts.cluster_report.csv":
          type: file
          description: A table of clusters (transcripts) and their members (reads)
          pattern: "*.transcripts.cluster_report.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752
  versions_isoseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - isoseq:
          type: string
          description: The name of the tool
      - isoseq cluster2 --version | sed -n '1s/isoseq cluster2 \([0-9.]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - isoseq:
          type: string
          description: The name of the tool
      - isoseq cluster2 --version | sed -n '1s/isoseq cluster2 \([0-9.]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mahesh-panchal"
maintainers:
  - "@mahesh-panchal"
