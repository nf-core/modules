# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: isoseq_tag
description: Extract UMI and cell barcodes
keywords:
  - isoseq
  - tag
  - pacbio
  - UMI
  - cell_barcodes
tools:
  - isoseq:
      description: IsoSeq - Scalable De Novo Isoform Discovery
      homepage: https://github.com/PacificBiosciences/IsoSeq/tree/master
      documentation: https://isoseq.how/
      tool_dev_url: https://github.com/PacificBiosciences/IsoSeq/tree/master
      licence:
        - "BSD-3-Clause-Clear"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - bam:
        type: file
        description: BAM file, one full-length CCS file generated by lima
        pattern: "*.5p--3p.bam"
        ontologies: []
  - design:
      type: string
      description: Barcoding design. Specifies which bases to use as cell/molecular
        barcodes.
      pattern: "^(?:\\d{1,2}[UBGX]-)+T$|^(?:\\d{1,2}[UBGX]-)+T(?:-\\d{1,2}[UBGX])+$|^T(?:-\\\
        d{1,2}[UBGX])+$"
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1']
      - "*.flt.bam":
          type: file
          description: BAM file with full-length tagged reads
          pattern: "*.flt.bam"
          ontologies: []
  pbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1']
      - "*.flt.bam.pbi":
          type: file
          description: Pacbio index file of full-length tagged reads
          pattern: "*.flt.bam.pbi"
          ontologies: []
  versions_isoseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - isoseq:
          type: string
          description: The name of the tool
      - isoseq tag --version | sed -n '1s/isoseq tag \([0-9.]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - isoseq:
          type: string
          description: The name of the tool
      - isoseq tag --version | sed -n '1s/isoseq tag \([0-9.]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@skraettli"
  - "@mahesh-panchal"
maintainers:
  - "@skraettli"
  - "@mahesh-panchal"
