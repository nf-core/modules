name: "deacon_indexunion"
description: Combine multiple deacon indexes (A ∪ B ...)
keywords:
  - index
  - fasta
  - genome
  - reference
  - minimizer
  - decontamination
tools:
  - "deacon":
      description: "Fast alignment-free sequence filter"
      homepage: "https://github.com/bede/deacon"
      documentation: "https://github.com/bede/deacon#readme"
      tool_dev_url: "https://github.com/bede/deacon"
      doi: "10.1093/bioinformatics/btae004"
      licence: ["MIT"]
      identifier: "biotools:deacon"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing reference index information.
          e.g. [ id:'test', single_end:false ]
    - indices:
        type: file
        description: |
          One or more deacon .idx index files to combine
        pattern: "*.idx"
        ontologies:
          - edam: "http://edamontology.org/data_3210" # Genome index
output:
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference index information.
            e.g. [ id:'test', single_end:false ]
      - "*.idx":
          type: file
          description: Deacon minimizer index file
          pattern: "*.idx"
          ontologies:
            - edam: "http://edamontology.org/data_3210" # Genome index
  versions_deacon:
    - - ${task.process}:
          type: string
          description: The name of the process
      - deacon:
          type: string
          description: The name of the tool
      - deacon --version | head -n1 | sed "s/deacon //g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - deacon:
          type: string
          description: The name of the tool
      - deacon --version | head -n1 | sed "s/deacon //g":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@pmoris"
