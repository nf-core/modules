name: rsem_preparereference
description: Prepare a reference genome for RSEM
keywords:
  - rsem
  - genome
  - index
tools:
  - rsem:
      description: |
        RSEM: accurate transcript quantification from RNA-Seq data with or without a reference genome
      homepage: https://github.com/deweylab/RSEM
      documentation: https://github.com/deweylab/RSEM
      doi: "10.1186/1471-2105-12-323"
      publication:
        author: "Li, B. & Dewey, C. N."
        year: 2011
        title: "RSEM: accurate transcript quantification from RNA-Seq data with or without a reference genome"
        source: "BMC Bioinformatics"
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:rsem
  - star:
      description: |
        STAR is a software package for mapping DNA sequences against
        a large reference genome, such as the human genome.
      homepage: https://github.com/alexdobin/STAR
      doi: "10.1093/bioinformatics/bts635"
      publication:
        author: "Dobin, A., Davis, C. A., Schlesinger, F., Drenkow, J., Zaleski, C., Jha, S., Batut, P., Chaisson, M. & Gingeras, T. R."
        year: 2012
        title: "STAR: ultrafast universal RNA-seq aligner"
        source: "Bioinformatics"
      manual: https://github.com/alexdobin/STAR/blob/master/doc/STARmanual.pdf
      licence: ["MIT"]
      identifier: biotools:star
input:
  - fasta:
      type: file
      description: The Fasta file of the reference genome
      pattern: "*.{fasta,fa}"
      ontologies: []
  - gtf:
      type: file
      description: The GTF file of the reference genome
      pattern: "*.gtf"
      ontologies: []
output:
  index:
    - rsem:
        type: directory
        description: RSEM index directory
        pattern: "rsem"
  transcript_fasta:
    - "*transcripts.fa":
        type: file
        description: Fasta file of transcripts
        pattern: "rsem/*transcripts.fa"
        ontologies: []
  versions_rsem:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rsem:
          type: string
          description: The tool name
      - 'rsem-calculate-expression --version | sed -e "s/Current version: RSEM v//g"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_star:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - star:
          type: string
          description: The tool name
      - STAR --version | sed -e "s/STAR_//g":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rsem:
          type: string
          description: The tool name
      - 'rsem-calculate-expression --version | sed -e "s/Current version: RSEM v//g"':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - star:
          type: string
          description: The tool name
      - STAR --version | sed -e "s/STAR_//g":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@drpatelh"
  - "@kevinmenden"
maintainers:
  - "@drpatelh"
  - "@kevinmenden"
