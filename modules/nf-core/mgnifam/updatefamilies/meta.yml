name: "mgnifam_updatefamilies"
description: Refreshes existing protein family HMM profiles against a new sequence
  database, keeping each family's name stable across releases
keywords:
  - protein families
  - family update
  - database update
  - hidden markov model
  - profile hmm
  - sequence alignment
  - metagenomics
  - hmmer
  - protein sequences
tools:
  - "mgnifam":
      description: Python package for iterative HMM-based protein family generation
        over large sequence databases, building an HMM from each cluster, recruiting
        new members, re-aligning, and either converging on a family or discarding the
        cluster
      homepage: "https://github.com/vagkaratzas/mgnifam"
      documentation: "https://github.com/vagkaratzas/mgnifam"
      tool_dev_url: "https://github.com/vagkaratzas/mgnifam"
      licence:
        - "MIT"
      args_id: "$args"
      identifier: biotools:mgnifam
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - hmms:
        type: file
        description: One or more gzipped profile HMM files (e.g. the `hmm` output of
          mgnifam/generatefamilies) or a single gzipped multi-model HMM library,
          staged under `hmm_input/`. Each model is searched against the new database
          and re-emitted under its original name
        pattern: "*.{hmm,hmm.gz,hmm.lib.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1370 # HMMER format
    - fasta_file:
        type: file
        description: Uncompressed FASTA file of the new protein sequence database to
          search the stored HMMs against
        pattern: "*.{fa,fasta,faa}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
    - fasta_index:
        type: file
        description: Optional. Precomputed Easel SSI index of the FASTA file, e.g.
          from `esl-sfetch --index` (hmmer/eslsfetchindex). Used as given and never
          rebuilt, so parallel chunk tasks can share one read-only index. Built
          automatically when omitted
        pattern: "*.ssi"
        ontologies: []
output:
  seed_msa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/seed_msa/*.sto.gz:
          type: file
          description: Optional. Per-family seed multiple sequence alignment in gzipped
            Stockholm format, named by family id (e.g. `1_7.sto.gz`). Not written
            when the tool is run with `--skip_refine`
          pattern: "*/seed_msa/*.sto.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  full_msa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/full_msa/*.sto.gz:
          type: file
          description: Optional. Per-family full multiple sequence alignment against
            the new database, including recruited members, in gzipped Stockholm
            format, named by family id (e.g. `1_7.sto.gz`)
          pattern: "*/full_msa/*.sto.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  hmm:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/hmm/*.hmm.gz:
          type: file
          description: Optional. Updated per-family profile HMM model in gzipped
            HMMER format, named by family id (e.g. `1_7.hmm.gz`)
          pattern: "*/hmm/*.hmm.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  rf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/rf/*.txt:
          type: file
          description: Optional. Per-family reference annotation (RF) line, marking
            match-state columns of the seed alignment, named by family id (e.g.
            `1_7.txt`). Not written when the tool is run with `--skip_refine`
          pattern: "*/rf/*.txt"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text format
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_families.tsv:
          type: file
          description: Optional. Roster of the updated protein families
          pattern: "*/*_updated_families.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_metadata.csv:
          type: file
          description: Optional. Metadata describing the updated protein families
          pattern: "*/*_updated_metadata.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated.log:
          type: file
          description: Optional. Diagnostic log of the family update run
          pattern: "*/*_updated.log"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text format
  reps_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_reps.fasta.gz:
          type: file
          description: Optional. Representative sequences of the updated families in
            gzipped FASTA format
          pattern: "*/*_updated_reps.fasta.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  successful:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_successful.txt:
          type: file
          description: Optional. List of families that were successfully updated
          pattern: "*/*_updated_successful.txt"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text format
  discarded:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_discarded.csv:
          type: file
          description: Optional. Families discarded during the update, with reasons
          pattern: "*/*_updated_discarded.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  converged:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_converged.txt:
          type: file
          description: Optional. List of families that converged during the update
          pattern: "*/*_updated_converged.txt"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text format
  delta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_updated_delta.csv:
          type: file
          description: Optional. One row per input family describing the change
            against the new database. Columns `family_id` (the model name, e.g.
            `1_7`, not a rank), `model_length_before`, `model_length_after`,
            `round1_recruits`, `full_msa_size`, `retention`, `rounds_run`,
            `converged`, `outcome`
          pattern: "*/*_updated_delta.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  versions_mgnifam:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mgnifam:
          type: string
          description: The name of the tool
      - "mgnifam --version 2>&1":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mgnifam:
          type: string
          description: The name of the tool
      - "mgnifam --version 2>&1":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
