name: "mgnifam_computeclans"
description: Groups protein families into clans from residue-level overlap of their members
keywords:
  - protein families
  - clans
  - family similarity
  - jaccard index
  - metagenomics
  - protein sequences
tools:
  - "mgnifam":
      description: Iterative HMM-based protein family generation over large protein sequence databases
      homepage: "https://github.com/vagkaratzas/mgnifam"
      documentation: "https://vagkaratzas.github.io/mgnifam/"
      tool_dev_url: "https://github.com/vagkaratzas/mgnifam"
      licence:
        - "MIT"
      args_id: "$args"
      identifier: biotools:mgnifam
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - members:
        type: file
        description: One or more headerless TSV files (plain or gzipped) of family members, one family<TAB>member pair per line (e.g. `<chunk>_families.tsv` from mgnifam/generatefamilies). Members are regions (`sequence/start-end`) or bare protein names
        pattern: "*.{tsv,tsv.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3989 # GZIP format
    - fasta_file:
        type: file
        description: Optional. FASTA file of the protein sequence database, required when any member is a bare protein name
        pattern: "*.{fa,fasta,faa}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
output:
  clans:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_clans.csv:
          type: file
          description: Clan assignment of each family, with columns `clan_id,family_id,is_representative`
          pattern: "*/*_clans.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  clan_edges:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_clan_edges.csv:
          type: file
          description: Pairwise family similarities, with columns `family_1,family_2,shared_proteins,protein_jaccard,residue_jaccard,residue_containment`
          pattern: "*/*_clan_edges.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_clans.log:
          type: file
          description: Diagnostic log of the clan computation run
          pattern: "*/*_clans.log"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text format
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/${prefix}_clans_summary.json:
          type: file
          description: Summary of the run - command, version, chunk ID, parameters and counts
          pattern: "*/*_clans_summary.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  versions_mgnifam:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mgnifam:
          type: string
          description: The name of the tool
      - mgnifam --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mgnifam:
          type: string
          description: The name of the tool
      - mgnifam --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
