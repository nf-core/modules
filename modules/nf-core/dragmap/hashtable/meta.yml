name: dragmap_hashtable
description: Create DRAGEN hashtable for reference genome
keywords:
  - index
  - fasta
  - genome
  - reference
tools:
  - dragmap:
      description: Dragmap is the Dragen mapper/aligner Open Source Software.
      homepage: https://github.com/Illumina/dragmap
      documentation: https://github.com/Illumina/dragmap
      tool_dev_url: https://github.com/Illumina/dragmap#basic-command-line-usage
      doi: "10.1038/s41587-024-02382-1"
      publication:
        author: "Behera, S., Catreux, S., Rossi, M., Truong, S., Huang, Z., Ruehle, M., Visvanath, A., Parnaby, G., Roddey, C., Onuchic, V., Finocchio, A., Cameron, D. L., English, A., Mehtalia, S., Han, J., Mehio, R. & Sedlazeck, F. J."
        year: 2024
        title: "Comprehensive genome analysis and variant detection at scale using DRAGEN"
        source: "Nature Biotechnology"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Input genome fasta file
        ontologies:
          - edam: http://edamontology.org/format_1929
output:
  hashmap:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information
            e.g. [ id:'test', single_end:false ]
      - dragmap:
          type: string
          description: DRAGMAP hash table
          pattern: "*.{cmp,.bin,.txt}"
          ontologies: []
  versions_dragmap:
    - - ${task.process}:
          type: string
          description: The name of the process
      - dragmap:
          type: string
          description: DRAGMAP hash table
          pattern: "*.{cmp,.bin,.txt}"
          ontologies: []
      - dragen-os --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - dragmap:
          type: string
          description: DRAGMAP hash table
          pattern: "*.{cmp,.bin,.txt}"
          ontologies: []
      - dragen-os --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@edmundmiller"
maintainers:
  - "@edmundmiller"
containers:
