    linux/amd64:
      name: community.wave.seqera.io/library/dragmap:1.2.1--5d9f1388ce4b8f33
      build_id: bd-5d9f1388ce4b8f33_1
      scan_id: sc-394a45324d872ec6_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/dragmap:1.2.1--8c88bfec3c70031a
      build_id: bd-8c88bfec3c70031a_1
