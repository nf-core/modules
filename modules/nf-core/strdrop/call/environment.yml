---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - conda-forge::pip=25.3
  - conda-forge::python=3.13
  # strdrop imports typing_extensions but does not declare it (newer typer no longer pulls it in)
  - conda-forge::typing_extensions=4.16.0
  - conda-forge::numpy=2.3.5
  - pip:
      - strdrop==0.3.1
