name: "t2pmhc_predictbinding"
description: Predict TCR-pMHC binding from pre-built molecular graphs with t2pmhc graph neural networks
keywords:
  - TCR
  - pMHC
  - binding prediction
  - graph neural network
  - structure-based
  - immunology
tools:
  - "t2pmhc":
      description: "t2pmhc: A Structure-Informed Graph Neural Network to Predict TCR-pMHC Binding"
      homepage: "https://github.com/qbic-pipelines/t2pmhc"
      documentation: "https://github.com/qbic-pipelines/t2pmhc"
      tool_dev_url: "https://github.com/qbic-pipelines/t2pmhc"
      doi: "10.64898/2026.02.27.708137"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - samplesheet:
        type: file
        description: |
          TSV samplesheet with TCR-pMHC data. t2pmhc attaches scores to samplesheet rows by position,
          so this MUST be the same samplesheet (same rows in the same order) that was used to create the graphs.
        pattern: "*.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
    - graphs:
        type: file
        description: PyTorch file containing the molecular graphs created from the samplesheet, e.g. by `t2pmhc/creategraphs`
        pattern: "*.pt"
  - mode:
      type: string
      description: t2pmhc graph neural network architecture, passed to the `--mode` flag
      pattern: "t2pmhc-gcn|t2pmhc-gat"

output:
  pred:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_predicted.tsv":
          type: file
          description: TSV file with the samplesheet rows and the predicted binding probability in the `binder_prob` column
          pattern: "*_predicted.tsv"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_t2pmhc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - t2pmhc:
          type: string
          description: The name of the tool
      - "pip show t2pmhc | grep -i '^Version:' | sed 's/^Version: //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - t2pmhc:
          type: string
          description: The name of the tool
      - "pip show t2pmhc | grep -i '^Version:' | sed 's/^Version: //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mapo9"
maintainers:
  - "@mapo9"
