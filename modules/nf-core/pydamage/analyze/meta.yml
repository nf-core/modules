name: pydamage_analyze
description: Damage parameter estimation for ancient DNA
keywords:
  - ancient DNA
  - aDNA
  - de novo assembly
  - filtering
  - damage
  - deamination
  - miscoding lesions
  - C to T
  - palaeogenomics
  - archaeogenomics
  - palaeogenetics
  - archaeogenetics
tools:
  - pydamage:
      description: Damage parameter estimation for ancient DNA
      homepage: https://github.com/maxibor/pydamage
      documentation: https://pydamage.readthedocs.io/
      tool_dev_url: https://github.com/maxibor/pydamage
      licence: ["GPL v3"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - bai:
        type: file
        description: BAM/CRAM/SAM index file
        pattern: "*.{bai,crai,sai}"
        ontologies: []
output:
  csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}_pydamage_results.csv:
          type: file
          description: PyDamage results as csv files
          pattern: "*.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  versions_pydamage:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pydamage:
          type: string
          description: The name of the tool
      - NUMBA_CACHE_DIR=./tmp pydamage --version | sed -n 's/pydamage, version //p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pydamage:
          type: string
          description: The name of the tool
      - NUMBA_CACHE_DIR=./tmp pydamage --version | sed -n 's/pydamage, version //p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@maxibor"
maintainers:
  - "@maxibor"
