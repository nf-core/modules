name: "xengsort_classify"
description: Classify and sort FASTQ reads into host, graft, both, neither, or ambiguous categories using a xengsort hash index.
keywords:
  - classify
  - sort
  - xenograft
  - fastq
  - cuckoo hash
  - k-mer
tools:
  - "xengsort":
      description: "Fast lightweight accurate xenograft sorting using 3-way bucketed Cuckoo hashing"
      homepage: "https://gitlab.com/genomeinformatics/xengsort"
      documentation: "https://gitlab.com/genomeinformatics/xengsort"
      tool_dev_url: "https://gitlab.com/genomeinformatics/xengsort"
      doi: "10.4230/LIPIcs.WABI.2020.4"
      licence:
        - "MIT"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: Single-end or paired-end FASTQ files to be classified.
        pattern: "*.{fq,fastq,fq.gz,fastq.gz,fq.bz2,fastq.bz2,fq.xz,fastq.xz}"
        ontologies:
          - edam: "http://edamontology.org/format_1930" # FASTQ
  - - meta2:
        type: map
        description: |
          Groovy Map containing index metadata
          e.g. `[ id:'mouse_human_index' ]`
    - hash:
        type: file
        description: Binary Cuckoo hash table file generated by xengsort index.
        pattern: "*.hash"
        ontologies: []
    - info:
        type: file
        description: Header and metadata file containing hash table parameters generated by xengsort index.
        pattern: "*.info"
        ontologies: []
  - mode:
      type: string
      description: |
        Classification mode. Options: 'count', 'coverage', 'quick'.
        'count': Classifies based on the number of k-mers that belong to host or graft.
        'coverage': Classifies based on the proportions covered by k-mers of each class.
        'quick': Classifies based only on the third and third-last k-mer.

output:
  host:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*-host*.fq.gz":
          type: file
          description: FASTQ file(s) containing reads classified as originating from the host genome.
          pattern: "*-host*.fq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"
            - edam: http://edamontology.org/format_3989 # GZIP format
  graft:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*-graft*.fq.gz":
          type: file
          description: FASTQ file(s) containing reads classified as originating from the graft genome.
          pattern: "*-graft*.fq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"
            - edam: http://edamontology.org/format_3989 # GZIP format
  both:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*-both*.fq.gz":
          type: file
          description: FASTQ file(s) containing reads classified as mapping equally well to both host and graft.
          pattern: "*-both*.fq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"
            - edam: http://edamontology.org/format_3989 # GZIP format
  neither:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*-neither*.fq.gz":
          type: file
          description: FASTQ file(s) containing reads classified as mapping to neither the host nor the graft genome.
          pattern: "*-neither*.fq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"
            - edam: http://edamontology.org/format_3989 # GZIP format
  ambiguous:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*-ambiguous*.fq.gz":
          type: file
          description: FASTQ file(s) containing reads that could not be confidently classified.
          pattern: "*-ambiguous*.fq.gz"
          ontologies:
            - edam: "http://edamontology.org/format_1930"
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_xengsort:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "xengsort":
          type: string
          description: The name of the tool
      - "xengsort --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "xengsort":
          type: string
          description: The name of the tool
      - "xengsort --version":
          type: eval
          description: The expression to obtain the version of the tool

