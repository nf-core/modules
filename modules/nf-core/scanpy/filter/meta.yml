name: scanpy_filter
description: Filter cells and genes in single-cell RNA-seq data using Scanpy
keywords:
  - filter
  - quality-control
  - scanpy
  - single-cell
  - preprocessing
tools:
  - scanpy:
      description: Single-Cell Analysis in Python
      homepage: https://scanpy.readthedocs.io
      documentation: https://scanpy.readthedocs.io/en/stable/api/preprocessing.html
      tool_dev_url: https://github.com/scverse/scanpy
      doi: 10.1186/s13059-017-1382-0
      licence:
        - "BSD-3-Clause"
      identifier: biotools:scanpy
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - anndata:
        type: file
        description: AnnData object in h5ad or zarr format
        pattern: "*.{h5ad,zarr}"
        ontologies:
          - edam: "http://edamontology.org/format_3590"
          - edam: "http://edamontology.org/format_3915"
  - min_genes:
      type: integer
      description: Minimum number of genes expressed per cell
  - min_cells:
      type: integer
      description: Minimum number of cells expressing each gene
  - min_counts_gene:
      type: integer
      description: Minimum number of counts per gene
  - min_counts_cell:
      type: integer
      description: Minimum number of counts per cell
  - max_mito_percentage:
      type: integer
      description: Maximum percentage of mitochondrial genes per cell
  - symbol_col:
      type: string
      description: Column name of the gene symbols in the `var` of the AnnData object. Use `index` if the gene symbols are the row names.
output:
  anndata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.{h5ad,zarr}":
          type: file
          description: Filtered AnnData object in h5ad or zarr format
          pattern: "*.{h5ad,zarr}"
          ontologies:
            - edam: "http://edamontology.org/format_3590"
            - edam: "http://edamontology.org/format_3915"
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750
authors:
  - "@nictru"
maintainers:
  - "@nictru"
