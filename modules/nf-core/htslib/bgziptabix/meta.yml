name: "htslib_bgziptabix"
description: "Multi-purpose module to compress, decompress and index files using bgzip and tabix."
keywords:
  - compress
  - decompress
  - index
  - bgzip
  - tabix
  - gzip
  - bzip
  - xz
tools:
  - "htslib":
      description: "C library for high-throughput sequencing data formats."
      homepage: "http://www.htslib.org/"
      documentation: "http://www.htslib.org/doc/"
      tool_dev_url: "https://github.com/samtools/htslib"
      doi: "10.1093/gigascience/giab007"
      licence:
        - "MIT"
      identifier: biotools:htslib
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - infile:
        type: file
        description: Input file to compress or decompress
        pattern: "*"
        ontologies: []
    - infile_tbi:
        type: file
        description: Optional tabix index for the input file.
        pattern: "*.{tbi,csi}"
        ontologies:
          - edam: http://edamontology.org/format_3616 # tabix
    - regions:
        type: file
        description: Optional file of regions to extract (BED or chr:start-end format). Only used when creating an index for the output file.
        pattern: "*.{bed,txt,tsv}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3003 # BED
  - action:
      type: string
      description: Action to perform, either `compress` or `decompress`
  - make_index:
      type: boolean
      description: Whether to create a tabix index for the output file; only used if `action` is `compress`
  - out_ext:
      type: string
      description: Output file extension without `.gz` suffix (for example `vcf`)
output:
  output:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${outfile}:
          type: file
          description: Compressed or decompressed output file
          pattern: "*"
          ontologies: []
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${outfile}.{tbi,csi}:
          type: file
          description: Tabix index file for the compressed output file
          pattern: "*.{tbi,csi}"
          ontologies:
            - edam: http://edamontology.org/format_3616 # tabix
  versions_htslib:
    - - ${task.process}:
          type: string
          description: The name of the process
      - htslib:
          type: string
          description: The name of the tool
      - bgzip --version | sed '1! d; s/bgzip (htslib) //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_xz:
    - - ${task.process}:
          type: string
          description: The name of the process
      - xz:
          type: string
          description: The name of the tool
      - xz --version | sed '1! d; s/xz (XZ Utils) //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - htslib:
          type: string
          description: The name of the tool
      - bgzip --version | sed '1! d; s/bgzip (htslib) //':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - xz:
          type: string
          description: The name of the tool
      - xz --version | sed '1! d; s/xz (XZ Utils) //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@itrujnara"
maintainers:
  - "@itrujnara"
