# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "spatialcontinuum"
description: "Universal biophysical reaction-diffusion transport framework and Bedside Composite Resistance Index (CRI) for NSCLC."
keywords:
  - oncology
  - biophysics
  - reaction-diffusion
  - lung cancer
  - precision oncology
  - osimertinib
tools:
  - "spatial-continuum":
      description: "Zero-dependency biophysical reaction-diffusion solver and Bedside Composite Resistance Index (CRI) calculation engine."
      homepage: "https://github.com/Lukecele/spatial-continuum-oncology"
      documentation: "https://github.com/Lukecele/spatial-continuum-oncology#readme"
      tool_dev_url: "https://github.com/Lukecele/spatial-continuum-oncology"
      doi: "10.21203/rs.3.rs-11530312/v1"
      licence:
        - "CC-BY-4.0"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - pattern:
        type: string
        description: Histologic growth pattern (e.g., lepidic, acinar, papillary, solid, micropapillary)
    - tp53:
        type: string
        description: TP53 mutation status (wt or mutated)
    - rb1:
        type: string
        description: RB1 mutation/loss status (wt or mutated/deleted)
    - stroma:
        type: string
        description: Stromal desmoplastic density (low, moderate, dense)

output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.txt":
          type: file
          description: Bedside Composite Resistance Index (CRI) report and clinical recommendations
          pattern: "*.txt"
  versions_spatialcontinuum:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spatial-continuum":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-continuum''))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - spatial-continuum:
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-continuum''))"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Lukecele"
maintainers:
  - "@Lukecele"
