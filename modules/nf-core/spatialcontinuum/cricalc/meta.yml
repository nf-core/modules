# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "spatialcontinuum_cricalc"
description: "Universal biophysical reaction-diffusion transport framework and In Silico Composite Resistance Index (CRI) for NSCLC (RUO)."
keywords:
  - oncology
  - biophysics
  - reaction-diffusion
  - lung cancer
  - precision oncology
  - osimertinib
tools:
  - "spatial-continuum":
      description: "Zero-dependency biophysical reaction-diffusion solver and In Silico Composite Resistance Index (CRI) calculation engine (RUO)."
      homepage: "https://github.com/Lukecele/spatial-continuum-oncology"
      documentation: "https://github.com/Lukecele/spatial-continuum-oncology#readme"
      tool_dev_url: "https://github.com/Lukecele/spatial-continuum-oncology"
      doi: "10.21203/rs.3.rs-11530312/v1"
      licence:
        - "MIT"
      identifier: "biotools:spatial-continuum-oncology"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - pattern:
        type: string
        description: Histologic growth pattern (e.g., lepidic, acinar, papillary, solid, micropapillary)
    - tp53:
        type: string
        description: TP53 mutation status (wt or mutated)
    - rb1:
        type: string
        description: RB1 mutation/loss status (wt or mutated/deleted)
    - stroma:
        type: string
        description: Stromal desmoplastic density (low, moderate, dense)
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.txt":
          type: file
          description: In Silico Composite Resistance Index (CRI) report and translational cohort stratification (RUO)
          pattern: "*.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  versions_spatialcontinuum:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spatial-continuum":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-continuum''))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - spatial-continuum:
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-continuum''))"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Lukecele"
maintainers:
  - "@Lukecele"
