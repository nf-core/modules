name: vcfanno
description: quickly annotate your VCF with any number of INFO fields from any number of VCFs or BED files
keywords:
  - vcf
  - bed
  - annotate
  - variant
  - lua
  - toml
tools:
  - vcfanno:
      description: annotate a VCF with other VCFs/BEDs/tabixed files
      documentation: https://github.com/brentp/vcfanno#vcfanno
      tool_dev_url: https://github.com/brentp/vcfanno
      doi: "10.1186/s13059-016-0973-5"
      license: ["MIT"]
      identifier: biotools:vcfanno
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: query VCF file
        pattern: "*.{vcf, vcf.gz}"
        ontologies: []
    - tbi:
        type: file
        description: tabix index file for the query VCF
        pattern: "*.tbi"
        ontologies: []
    - specific_resources:
        type: map
        description: A list of sample specific reference files defined in toml config, must also include indices if bgzipped.
  - toml:
      type: file
      description: configuration file with reference file basenames
      pattern: "*.toml"
      ontologies: []
  - lua:
      type: file
      description: Lua file for custom annotations
      pattern: "*.lua"
      ontologies: []
  - resources:
      type: map
      description: List of reference files defined in toml config, must also include indices if bgzipped.
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.vcf.gz"
      - "*.vcf.gz":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.vcf.gz"
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.vcf.gz"
      - "*.vcf.gz.tbi":
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
          pattern: "*.vcf.gz.tbi"
  versions_vcfanno:
    - - ${task.process}:
          type: string
          description: The name of the process
      - vcfanno:
          type: string
          description: The name of the tool
      - vcfanno 2>&1 | sed -n 's/.*version \([0-9.]\+\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - vcfanno:
          type: string
          description: The name of the tool
      - vcfanno 2>&1 | sed -n 's/.*version \([0-9.]\+\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
