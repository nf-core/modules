name: "artic_aligntrim"
description: Standalone version of fieldbioinformatics aligntrim. Soft clips amplicon scheme primer sites in BAM/SAM files.
keywords:
  - artic
  - primer trimming
  - amplicon
  - genomics
  - sequencing
  - nanopore
  - illumina
tools:
  - "align_trim":
      description: "ARTIC align_trim: A tool for trimming amplicon sequencing primers from aligned reads."
      homepage: "https://github.com/artic-network/align_trim"
      documentation: "https://github.com/artic-network/align_trim/blob/master/README.md"
      tool_dev_url: "https://github.com/artic-network/align_trim"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - samfile:
        type: file
        description: BAM or SAM file containing aligned reads
        pattern: "*.{bam,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_2573" # SAM
    - scheme_bed:
        type: file
        description: BED file containing amplicon scheme primer locations
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3617"
    - normalise_depth:
        type: integer
        description: Normalise the read depth to this value
  - sort_bam:
      type: boolean
      description: Optionally sort the BAM file after trimming
output:
  primertrimmed_bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.primertrimmed*.bam":
          type: file
          description: BAM file with primer sequences soft clipped
          pattern: "*.primertrimmed*.bam"
          ontologies:
            - edam: http://edamontology.org/format_2572
  align_trim_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.align_trim_report.tsv":
          type: file
          description: TSV report containing full details of primer trimming for each read / read pair
          pattern: "*.align_trim_report.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  amp_depth_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.amp_depth_report.tsv":
          type: file
          description: TSV report containing mean depth per amplicon
          pattern: "*.amp_depth_report.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  pre_normalisation_coverage_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pre-normalisation.coverage.tsv":
          type: file
          description: TSV report containing per-base coverage depth before normalisation
          pattern: "*.pre-normalisation.coverage.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  post_normalisation_coverage_report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.post-normalisation.coverage.tsv":
          type: file
          description: TSV report containing per-base coverage depth after normalisation
          pattern: "*.post-normalisation.coverage.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  qc_summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.summary.tsv":
          type: file
          description: TSV report containing the number of fragments kept and removed for each removal reason
          pattern: "*.summary.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  qc_amplicons:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.amplicons.tsv":
          type: file
          description: TSV report containing the number of fragments kept and removed for each amplicon in the scheme
          pattern: "*.amplicons.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  qc_primer_pairs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.primer_pairs.tsv":
          type: file
          description: TSV report containing counts of each combination of primers matched at the fragment ends
          pattern: "*.primer_pairs.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  qc_split_reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.split_reads.tsv":
          type: file
          description: TSV report containing joins in split (supplementary) alignments, e.g. amplicon chimeras
          pattern: "*.split_reads.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  qc_overlaps:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.overlaps.tsv":
          type: file
          description: TSV report containing base frequency concordance between neighbouring amplicons in their overlapping regions
          pattern: "*.overlaps.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3750
            - edam: http://edamontology.org/format_3475
  rejected_bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.rejected.bam":
          type: file
          description: Unsorted BAM file containing the untrimmed reads removed during trimming, each tagged with the reason for removal (ZR tag)
          pattern: "*.rejected.bam"
          ontologies:
            - edam: http://edamontology.org/format_2572
  versions_align_trim:
    - - ${task.process}:
          type: string
          description: The name of the process
      - align_trim:
          type: string
          description: The name of the tool
      - align_trim --version | sed 's/align_trim //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - align_trim:
          type: string
          description: The name of the tool
      - align_trim --version | sed 's/align_trim //':
          type: eval
          description: The expression to obtain the version of the tool
