name: agat_convertspgff2gtf
description: |
  Converts a GFF/GTF file into a proper GTF file
keywords:
  - genome
  - gff
  - gtf
  - conversion
tools:
  - agat:
      description: "AGAT is a toolkit for manipulation and getting information from GFF/GTF files"
      homepage: "https://github.com/NBISweden/AGAT"
      documentation: "https://agat.readthedocs.io/"
      tool_dev_url: "https://github.com/NBISweden/AGAT"
      doi: "10.5281/zenodo.3552717"
      licence:
        - "GPL v3"
      identifier: biotools:AGAT
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - gff:
        type: file
        description: Annotation file in GFF3/GTF format
        pattern: "*.{gff, gtf}"
        ontologies:
          - edam: "http://edamontology.org/format_1975"
          - edam: "http://edamontology.org/format_2306"
output:
  output_gtf:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.agat.gtf":
          type: file
          description: Annotation file in GTF format
          pattern: "*.{gtf}"
          ontologies:
            - edam: "http://edamontology.org/format_2306"
  versions_agat:
    - - ${task.process}:
          type: string
          description: The name of the process
      - agat:
          type: string
          description: The name of the tool
      - agat --version | sed 's/v//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - agat:
          type: string
          description: The name of the tool
      - agat --version | sed 's/v//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@toniher"
maintainers:
  - "@toniher"
  - "@gallvp"
