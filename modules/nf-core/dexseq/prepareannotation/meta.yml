name: "dexseq_prepareannotation"
description: Flatten a GTF annotation into the exonic counting bins used by DEXSeq
keywords:
  - dexseq
  - exon
  - annotation
  - gtf
  - alternative splicing
  - differential exon usage
tools:
  - "dexseq":
      description: "Inference of differential exon usage in RNA-Seq"
      homepage: "https://bioconductor.org/packages/release/bioc/html/DEXSeq.html"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/DEXSeq/inst/doc/DEXSeq.html"
      tool_dev_url: "https://git.bioconductor.org/packages/DEXSeq"
      doi: "10.1101/gr.133744.111"
      licence: ["GPL >=3"]
      identifier: biotools:dexseq
  - "htseq":
      description: "HTSeq is a Python library to facilitate processing and analysis of data from high-throughput sequencing (HTS) experiments."
      homepage: "https://htseq.readthedocs.io/en/latest/"
      documentation: "https://htseq.readthedocs.io/en/latest/index.html"
      doi: "10.1093/bioinformatics/btu638"
      licence: ["GPL v3"]
      identifier: biotools:htseq
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. `[ id:'genome' ]`
    - gtf:
        type: file
        description: Gene annotation in GTF format
        pattern: "*.gtf"
        ontologies:
          - edam: "http://edamontology.org/format_2306"
  - random_seed:
      type: integer
      description: |
        Optional seed for the Python hash function (`PYTHONHASHSEED`), which sets the order of
        the aggregate gene IDs and of the transcripts attribute. Pass `[]` to leave it unset,
        in which case the order may change between runs.
output:
  gff:
    - - meta:
          type: map
          description: |
            Groovy Map containing annotation information
            e.g. `[ id:'genome' ]`
      - "*.gff":
          type: file
          description: Flattened annotation of exonic counting bins for DEXSeq
          pattern: "*.gff"
          ontologies:
            - edam: "http://edamontology.org/format_2305"
  versions_dexseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-dexseq:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('DEXSeq')))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_htseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - htseq:
          type: string
          description: The name of the tool
      - python -c "import HTSeq; print(HTSeq.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-dexseq:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('DEXSeq')))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - htseq:
          type: string
          description: The name of the tool
      - python -c "import HTSeq; print(HTSeq.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
