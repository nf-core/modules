name: "dexseq_count"
description: Count the reads overlapping the exonic counting bins of a DEXSeq annotation
keywords:
  - dexseq
  - exon
  - count
  - alternative splicing
  - differential exon usage
tools:
  - "dexseq":
      description: "Inference of differential exon usage in RNA-Seq"
      homepage: "https://bioconductor.org/packages/release/bioc/html/DEXSeq.html"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/DEXSeq/inst/doc/DEXSeq.html"
      tool_dev_url: "https://git.bioconductor.org/packages/DEXSeq"
      doi: "10.1101/gr.133744.111"
      licence: ["GPL >=3"]
      identifier: biotools:dexseq
  - "htseq":
      description: "HTSeq is a Python library to facilitate processing and analysis of data from high-throughput sequencing (HTS) experiments."
      homepage: "https://htseq.readthedocs.io/en/latest/"
      documentation: "https://htseq.readthedocs.io/en/latest/index.html"
      doi: "10.1093/bioinformatics/btu638"
      licence: ["GPL v3"]
      identifier: biotools:htseq
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: |
          BAM file of the aligned reads, sorted by position. For a BAM sorted
          by name, pass `--order name` through `ext.args`; a mismatched sort
          order gives wrong counts without any error.
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
  - - meta2:
        type: map
        description: |
          Groovy Map containing annotation information
          e.g. `[ id:'genome' ]`
    - gff:
        type: file
        description: Flattened DEXSeq annotation, as created by dexseq/prepareannotation
        pattern: "*.gff"
        ontologies:
          - edam: "http://edamontology.org/format_2305"
output:
  counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.txt":
          type: file
          description: Read counts for each exonic counting bin
          pattern: "*.txt"
          ontologies:
            - edam: "http://edamontology.org/format_3475"
  versions_dexseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-dexseq:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('DEXSeq')))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_htseq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - htseq:
          type: string
          description: The name of the tool
      - python -c "import HTSeq; print(HTSeq.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bioconductor-dexseq:
          type: string
          description: The name of the tool
      - Rscript -e "cat(as.character(packageVersion('DEXSeq')))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - htseq:
          type: string
          description: The name of the tool
      - python -c "import HTSeq; print(HTSeq.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
