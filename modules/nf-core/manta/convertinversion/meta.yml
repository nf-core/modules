name: "manta_convertinversion"
description: Manta calls structural variants (SVs) and indels from mapped paired-end
  sequencing reads. This script reformats inversions into single inverted sequence
  junctions which was the format used in Manta versions <= 1.4.0.
keywords:
  - structural variants
  - conversion
  - indels
tools:
  - manta:
      description: Structural variant and indel caller for mapped sequencing data
      homepage: https://github.com/Illumina/manta
      documentation: https://github.com/Illumina/manta/blob/v1.6.0/docs/userGuide/README.md
      tool_dev_url: https://github.com/Illumina/manta
      doi: "10.1093/bioinformatics/btv710"
      licence: ["GPL v3"]
      identifier: biotools:manta_sv
  - samtools:
      description: |
        SAMtools is a set of utilities for interacting with and post-processing
        short DNA sequence read alignments in the SAM, BAM and CRAM formats, written by Heng Li.
        These files are generated as output by short read aligners like BWA.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      publication:
        author: "Li, H., Handsaker, B., Wysoker, A., Fennell, T., Ruan, J., Homer, N., Marth, G., Abecasis, G., Durbin, R. & 1000 Genome Project Data Processing Subgroup"
        year: 2009
        title: "The Sequence Alignment/Map format and SAMtools"
        source: "Bioinformatics"
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: VCF file produces by Manta
        pattern: "*.vcf.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
  - - meta2:
        type: map
        description: |
          Groovy Map containing fasta information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: The reference fasta file
        pattern: "*.{fasta,fa,fna}"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz":
          type: file
          description: VCF file with reformatted inversions
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz.tbi":
          type: file
          description: TBI file produces by Manta
          pattern: "*.vcf.gz.tbi"
          ontologies: []
  versions_manta:
    - - ${task.process}:
          type: string
          description: The name of the process
      - manta:
          type: string
          description: The name of the tool
      - configManta.py --version:
          type: eval
          description: The expression to obtain the version of the tool
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools --version | head -1 | sed -e s'/samtools //':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - manta:
          type: string
          description: The name of the tool
      - configManta.py --version:
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools --version | head -1 | sed -e s'/samtools //':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@FriederikeHanssen"
maintainers:
  - "@FriederikeHanssen"
