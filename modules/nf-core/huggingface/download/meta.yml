name: huggingface_download
description: |
  Download a file or an entire Hugging Face Hub repository using the `hf` CLI.
  Pass an empty list or empty string for hf_file to download the repository into
  a directory named by ext.prefix (default: meta.id). Repository type, revision
  and include/exclude filters can be supplied through ext.args, for example
  --repo-type dataset --revision <commit> --include 'data/*'.
  If SSL_CERT_FILE is unset, the certifi CA bundle is used; export SSL_CERT_FILE
  to trust custom (e.g. proxy) certificate authorities.
keywords:
  - download
  - dataset
  - gguf
  - huggingface
  - hub
  - inference
  - llm
  - model
tools:
  - huggingface_hub:
      description: "Client library for interacting with the Hugging Face Hub, providing the `hf` CLI for downloading and uploading repositories, models and datasets."
      homepage: "https://huggingface.co/docs/huggingface_hub"
      documentation: "https://huggingface.co/docs/huggingface_hub/guides/cli"
      tool_dev_url: "https://github.com/huggingface/huggingface_hub"
      licence:
        - "Apache-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - hf_repo:
        type: string
        description: |
          Hugging Face repository identifier in `<owner>/<repo>` form,
          e.g. `ggml-org/gemma-3-1b-it-GGUF`.
    - hf_file:
        type: string
        description: |
          Path of the file to download within the repository,
          e.g. `gemma-3-1b-it-Q4_K_M.gguf`. The downloaded file is emitted
          with this name in the task work directory. Pass [] or an empty string
          to download the entire repository, optionally filtered by ext.args.
output:
  output:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - output_path:
          type: file
          description: |
            Downloaded file, or the repository directory when hf_file is empty.
            Repository directories are named by ext.prefix (default: meta.id).
            Single-file downloads retain the path specified by hf_file.
          ontologies: []
  versions_huggingface_hub:
    - - ${task.process}:
          type: string
          description: The name of the process
      - huggingface_hub:
          type: string
          description: The name of the tool
      - hf --version 2>&1 | tail -n1 | awk '{print \$NF}':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - huggingface_hub:
          type: string
          description: The name of the tool
      - hf --version 2>&1 | tail -n1 | awk '{print \$NF}':
          type: eval
          description: The expression to obtain the version of the tool
