# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "inflammatoryoncophysics_calc"
description: "Bedside Host-Tumor Biophysical Index (HTBI) calculator, ctDNA lead time kinetics, and recurrence risk stratification engine (RUO)."
keywords:
  - oncology
  - biophysics
  - reaction-diffusion
  - ctdna
  - htbi
  - precision oncology
tools:
  - "inflammatory-onco-physics":
      description: "Continuous reaction-diffusion solver and survival pipeline for microvascular pharmacological sanctuaries."
      homepage: "https://github.com/Lukecele/inflammatory-onco-physics"
      documentation: "https://github.com/Lukecele/inflammatory-onco-physics#readme"
      tool_dev_url: "https://github.com/Lukecele/inflammatory-onco-physics"
      doi: "10.21203/rs.3.rs-11695210/v1"
      licence:
        - "MIT"
      identifier: "biotools:inflammatory-onco-physics"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - stage:
        type: integer
        description: Pathologic TNM Stage (1, 2, or 3)
    - grade:
        type: integer
        description: Histological differentiation grade (1, 2, or 3)
    - nlr:
        type: float
        description: Complete blood count neutrophil-to-lymphocyte ratio
    - crp:
        type: float
        description: Serum high-sensitivity C-reactive protein (hs-CRP) in mg/L
    - alb:
        type: float
        description: Serum albumin concentration in g/L

output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.txt":
          type: file
          description: Bedside Host-Tumor Biophysical Index (HTBI) risk stratification and ctDNA lead time report (RUO)
          pattern: "*.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  versions_inflammatoryoncophysics:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "inflammatory-onco-physics":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''inflammatory-onco-physics''))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - inflammatory-onco-physics:
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''inflammatory-onco-physics''))"':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Lukecele"
maintainers:
  - "@Lukecele"
