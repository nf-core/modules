name: "glimpse2_splitreference"
description: Tool to create a binary reference panel for quick reading time.
keywords:
  - split
  - reference
  - phasing
  - imputation
tools:
  - "glimpse2":
      description: "GLIMPSE2 is a phasing and imputation method for large-scale low-coverage sequencing studies."
      homepage: "https://odelaneau.github.io/GLIMPSE"
      documentation: "https://odelaneau.github.io/GLIMPSE/"
      tool_dev_url: "https://github.com/odelaneau/GLIMPSE"
      doi: "10.1038/s41588-020-00756-0"
      licence:
        - "MIT"
      identifier: biotools:glimpse2
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reference:
        type: file
        description: Reference panel of haplotypes in VCF/BCF format.
        pattern: "*.{vcf.gz,bcf.gz}"
        ontologies: []
    - reference_index:
        type: file
        description: Index file of the Reference panel file.
        pattern: "*.{vcf.gz.csi,bcf.gz.csi}"
        ontologies: []
    - input_region:
        type: string
        description: Target region used for imputation, including left and right buffers (e.g. chr20:1000000-2000000).
        pattern: "chrXX:leftBufferPosition-rightBufferPosition"
    - output_region:
        type: string
        description: Target imputed region, excluding left and right buffers (e.g. chr20:1000000-2000000).
        pattern: "chrXX:leftBufferPosition-rightBufferPosition"
    - map:
        type: file
        description: File containing the genetic map.
        pattern: "*.gmap"
        ontologies: []
output:
  bin_ref:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bin":
          type: file
          description: binary reference panel
          pattern: "*.bin"
          ontologies: []
  versions_glimpse2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glimpse2:
          type: string
          description: The name of the tool
      - GLIMPSE2_split_reference --help | grep -oE 'v[0-9.]+' | cut -c2-:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glimpse2:
          type: string
          description: The name of the tool
      - GLIMPSE2_split_reference --help | grep -oE 'v[0-9.]+' | cut -c2-:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@LouisLeNezet"
maintainers:
  - "@LouisLeNezet"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/glimpse-bio:2.0.1--13883817364cf3d3
      build_id: bd-13883817364cf3d3_1
      scan_id: sc-303d6d41a9035b2e_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/glimpse-bio:2.0.1--5c2b509c6dd2009b
      build_id: bd-5c2b509c6dd2009b_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/a6/a6db4ab0bf9cdc87502f93289dc3eb4f3ff28a7125703bcc778ff88d4bd4dd2a/data
  conda:
    linux/amd64:
      lock_file: modules/nf-core/glimpse2/splitreference/.conda-lock/linux_amd64-bd-13883817364cf3d3_1.txt
requirements:
