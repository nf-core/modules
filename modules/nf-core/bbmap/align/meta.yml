name: bbmap_align
description: Align short or PacBio reads to a reference genome using BBMap
keywords:
  - align
  - map
  - fasta
  - fastq
  - genome
  - reference
tools:
  - bbmap:
      description: BBMap is a short read aligner, as well as various other
        bioinformatic tools.
      homepage: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/
      documentation: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/
      licence:
        - "UC-LBL license (see package)"
      identifier: biotools:bbmap
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fastq:
        type: file
        description: |
          List of input FastQ files of size 1 and 2 for single-end and paired-end data,
          respectively.
        ontologies: []
  - ref:
      type: file
      description: |
        Either "ref" a directory containing an index, the name of another directory
        with a "ref" subdirectory containing an index or the name of a fasta formatted
        nucleotide file containing the reference to map to.
      ontologies: []
  - output_format:
      type: string
      description: |
        Format of the output reads, one of "bam", "fastq", "fastq.gz", "fasta" or
        "fasta.gz". Defaults to "bam" if empty.
  - output_reads:
      type: string
      description: |
        Which reads to write, one of "all" (bbmap `out`), "mapped" (`outm`) or
        "unmapped" (`outu`). Defaults to "all" if empty.
  - interleaved:
      type: boolean
      description: |
        Whether to write paired-end fastq/fasta output to a single interleaved
        file instead of two files. Has no effect on single-end or bam output.
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bam":
          type: file
          description: BAM file, written when output_format is "bam"
          pattern: "*.{bam}"
          ontologies: []
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{fastq,fastq.gz,fasta,fasta.gz}":
          type: file
          description: |
            Reads in fastq/fasta format, written when output_format is not "bam".
            Paired-end reads are split into `_1` and `_2` files unless interleaved.
          pattern: "*.{fastq,fastq.gz,fasta,fasta.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
            - edam: http://edamontology.org/format_1929 # FASTA
            - edam: http://edamontology.org/format_3989 # GZIP
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.log":
          type: file
          description: Log file
          pattern: "*.{log}"
          ontologies: []
  versions_bbmap:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbversion.sh | grep -v "Duplicate cpuset":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbversion.sh | grep -v "Duplicate cpuset":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
