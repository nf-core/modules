name: bbmap_filterbyname
description: Filter reads by name, removing the named reads or keeping only them (`include=t`)
keywords:
  - filter
  - reads
  - read names
  - genomics
  - fastq
  - fasta
tools:
  - bbmap:
      description: BBMap is a short read aligner, as well as various other bioinformatic tools.
      homepage: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/
      documentation: https://jgi.doe.gov/data-and-tools/software-tools/bbtools/bb-tools-user-guide/
      tool_dev_url: https://github.com/bbushnell/BBTools/blob/master/filterbyname.sh
      licence:
        - "UC-LBL license (see package)"
      identifier: biotools:bbmap
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - reads:
        type: file
        description: FASTQ or FASTA reads, one file for single-end and two for paired-end data
        pattern: "*.{fastq,fq,fasta,fa}{,.gz,.bz2}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3989 # GZIP format
    - names_file:
        type: file
        description: Optional. Files of read names, one per line, or FASTA/FASTQ/SAM files whose read names are used
        pattern: "*.{txt,fasta,fa,fastq,fq,sam}"
        ontologies:
          - edam: http://edamontology.org/format_2330 # Textual format
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_1930 # FASTQ
          - edam: http://edamontology.org/format_2573 # SAM
  - names_to_filter:
      type: string
      description: Optional. Comma-separated read names, matched against the full header unless `ext.args` sets `substring=` or `prefix=`
  - output_format:
      type: string
      description: Output file extension that sets format and compression, e.g. fastq.gz, fasta or fastq.bz2
  - interleaved_output:
      type: boolean
      description: Whether to write paired reads to one interleaved file instead of two files
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - reads_out:
          type: file
          description: Filtered reads, as `${prefix}.<format>` or `${prefix}_1.<format>` and `${prefix}_2.<format>` for paired reads
          pattern: "*.{fastq,fq,fasta,fa}{,.gz,.bz2}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
            - edam: http://edamontology.org/format_1929 # FASTA
            - edam: http://edamontology.org/format_3989 # GZIP format
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.log:
          type: file
          description: BBTools report with the reads and bases processed and kept
          pattern: "*.log"
          ontologies:
            - edam: http://edamontology.org/format_2330 # Textual format
  versions_bbmap:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbversion.sh | grep -v "Duplicate cpuset":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - bbmap:
          type: string
          description: The name of the tool
      - bbversion.sh | grep -v "Duplicate cpuset":
          type: eval
          description: The expression to obtain the version of the tool
authors:
