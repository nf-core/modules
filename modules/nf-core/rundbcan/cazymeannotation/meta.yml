name: "rundbcan_cazymeannotation"
description: CAZyme annotation module for the dbcan pipeline. This module is used to annotate carbohydrate-active enzymes (CAZymes) from genomic data using the dbCAN annotation tool.
keywords:
  - dbCAN
  - download
  - CAZyme
  - CAZyme gene Cluster
  - genomes
tools:
  - "dbcan":
      description: "Standalone version of dbCAN annotation tool for automated CAZyme annotation."
      homepage: "https://bcb.unl.edu/dbCAN2/"
      documentation: "https://run-dbcan.readthedocs.io/en/latest/"
      tool_dev_url: "https://github.com/bcb-unl/run_dbcan"
      doi: "10.1093/nar/gkad328"
      licence:
        - "GPL v3-or-later"
      identifier: biotools:dbcan
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input_raw_data:
        type: file
        description: FASTA file for protein sequences.
        pattern: "*.{fasta,fa,faa}"
        ontologies:
          - edam: "http://edamontology.org/data_2044"
          - edam: "http://edamontology.org/format_1929"
  - dbcan_db:
      type: directory
      description: Path to the dbCAN database directory.
output:
  cazyme_annotation:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_overview.tsv:
          type: file
          description: |
            TSV file containing the results of dbCAN CAZyme annotation.
          ontologies: []
  dbcanhmm_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_dbCAN_hmm_results.tsv:
          type: file
          description: |
            TSV file containing the detailed dbCAN HMM results for CAZyme annotation.
          ontologies: []
  dbcansub_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_dbCANsub_hmm_results.tsv:
          type: file
          description: |
            TSV file containing the detailed dbCAN subfamily results for CAZyme annotation.
          ontologies: []
  dbcandiamond_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_diamond.out:
          type: file
          description: |
            TSV file containing the detailed dbCAN diamond results for CAZyme annotation.
          ontologies: []
  versions_rundbcan:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rundbcan:
          type: string
          description: The name of the tool
      - "run_dbcan version | sed 's/dbCAN version: //g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rundbcan:
          type: string
          description: The name of the tool
      - "run_dbcan version | sed 's/dbCAN version: //g'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Xinpeng021001"
maintainers:
  - "@Xinpeng021001"
