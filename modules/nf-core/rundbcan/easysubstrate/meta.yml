name: "rundbcan_easysubstrate"
description: Substrate annotation module for the dbcan pipeline. This module is used to annotate carbohydrate-active enzymes (CAZymes) from genomic data using the dbCAN annotation tool.
keywords:
  - dbCAN
  - download
  - CAZyme
  - CAZyme gene Cluster
  - genomes
tools:
  - "dbcan":
      description: "Standalone version of dbCAN annotation tool for automated CAZyme annotation."
      homepage: "https://bcb.unl.edu/dbCAN2/"
      documentation: "https://run-dbcan.readthedocs.io/en/latest/"
      tool_dev_url: "https://github.com/bcb-unl/run_dbcan"
      doi: "10.1093/nar/gkad328"
      licence:
        - "GPL v3-or-later"
      identifier: biotools:dbcan
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1']`
    - input_raw_data:
        type: file
        description: FASTA file for protein sequences.
        pattern: "*.{fasta,fa,faa}"
        ontologies:
          - edam: "http://edamontology.org/data_2044"
          - edam: "http://edamontology.org/format_1929"
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1']`
    - input_gff:
        type: file
        description: GFF file for protein sequences.
        ontologies: []
    - gff_type:
        type: string
        description: |
          Type of GFF file. Options are `NCBI_prok`, `JGI`, `NCBI_euk`, and `prodigal`. This is used to parse the GFF file correctly.
  - dbcan_db:
      type: directory
      description: Path to the dbCAN database directory.
output:
  cazyme_annotation:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_overview.tsv:
          type: file
          description: |
            TSV file containing the results of dbCAN CAZyme annotation.
          ontologies: []
  dbcanhmm_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_dbCAN_hmm_results.tsv:
          type: file
          description: |
            TSV file containing the detailed dbCAN HMM results for CAZyme annotation.
          ontologies: []
  dbcansub_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_dbCANsub_hmm_results.tsv:
          type: file
          description: |
            TSV file containing the detailed dbCAN subfamily results for CAZyme annotation.
          ontologies: []
  dbcandiamond_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_diamond.out:
          type: file
          description: |
            TSV file containing the detailed dbCAN diamond results for CAZyme annotation.
          ontologies: []
  cgc_gff:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_cgc.gff:
          type: file
          description: |
            GFF file containing the CAZyme gene clusters (CGC) identified by dbCAN. This file is generated from the dbCAN annotation and contains the locations of CAZyme gene clusters in the genome.
          ontologies: []
  cgc_standard_out:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_cgc_standard_out.tsv:
          type: file
          description: |
            Standard output file from dbCAN for CAZyme gene clusters (CGC) in a tabular format. This file summarizes the CAZyme gene clusters identified in the genome.
          ontologies: []
  diamond_out_tc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_diamond.out.tc:
          type: file
          description: |
            TSV file containing the diamond output for transporter annotation.
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  diamond_out_tf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_diamond.out.tf:
          type: file
          description: |
            TSV file containing the diamond output for prokaryotic transcription factor annotation. Not written with `--no-prokaryotic`.
          pattern: "*_diamond.out.tf"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  diamond_out_peptidase:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_diamond.out.peptidase:
          type: file
          description: |
            TSV file containing the diamond output for peptidase annotation.
          pattern: "*_diamond.out.peptidase"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  diamond_out_sulfatase:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_diamond.out.sulfatase:
          type: file
          description: |
            TSV file containing the diamond output for sulfatase annotation.
          pattern: "*_diamond.out.sulfatase"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  tf_hmm_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_TF_hmm_results.tsv:
          type: file
          description: |
            TSV file containing the results of Transcription factor.
          ontologies: []
  stp_hmm_results:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_STP_hmm_results.tsv:
          type: file
          description: |
            TSV file containing the results of signaling transduction proteins (STP) annotation.
          ontologies: []
  total_cgc_info:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_total_cgc_info.tsv:
          type: file
          description: |
            TSV file summarising the total additional genes in the genome.
          pattern: "*_total_cgc_info.tsv"
          ontologies: []
  cgc_faa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_CGC.faa:
          type: file
          description: |
            Protein sequences of the genes in the CAZyme gene clusters (CGC), the query for the dbCAN-PUL DIAMOND search.
          pattern: "*_CGC.faa"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  pul_blast:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_PUL_blast.out:
          type: file
          description: |
            DIAMOND tabular output of the CGC proteins searched against dbCAN-PUL.
          pattern: "*_PUL_blast.out"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  substrate_prediction:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_substrate_prediction.tsv:
          type: file
          description: |
            TSV file containing the substrate predictions based on the CGC annotations from dbCAN.
          ontologies: []
  synteny_pdf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1']`
      - ${prefix}_synteny_pdf/:
          type: directory
          description: |
            Directory containing the synteny plots in PDF format for the CAZyme gene clusters (CGC) identified by dbCAN. This directory will contain one or more PDF files showing the syntenic regions of the CGC in the genome.
  versions_rundbcan:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rundbcan:
          type: string
          description: The name of the tool
      - "run_dbcan version | sed 's/dbCAN version: //g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rundbcan:
          type: string
          description: The name of the tool
      - "run_dbcan version | sed 's/dbCAN version: //g'":
          type: eval
          description: The expression to obtain the version of the tool
