name: "pretextgraph"
description: Converts bedgraph formatted data and embeds it as a graph track inside a Pretext contact map
keywords:
  - pretext
  - bedgraph
  - hic
  - contact maps
  - graph
tools:
  - "pretextgraph":
      description: "Embeds bedgraph data into Pretext contact maps."
      homepage: "https://github.com/sanger-tol/PretextGraph"
      documentation: "https://github.com/sanger-tol/PretextGraph/blob/master/README.md"
      tool_dev_url: "https://github.com/sanger-tol/PretextGraph"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - pretext:
        type: file
        description: Pretext contact map to embed the graph into
        pattern: "*.pretext"
        ontologies: []
    - bedgraph:
        type: file
        description: |
          Bedgraph formatted data (tab separated, may be gzip/bgzip compressed).
          Sequence names must match those in the Pretext map.
        pattern: "*.{bedgraph,bedgraph.gz,bedgraph.bgz,bg,bg.gz,bg.bgz,bed,bed.gz,bed.bgz}"
        ontologies:
          - edam: http://edamontology.org/format_3583 # bedGraph
    - graph_name:
        type: string
        description: |
          Name of the graph track. The name selects how values are accumulated:
          PretextGraph matches it case-insensitively by substring against the known
          types (not_weighted, gap, repeat_density, coverage, coverage_avg, telomere).
          Any other name (e.g. "GC") falls back to telomere-style accumulation.
output:
  pretext:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pretext":
          type: file
          description: Pretext contact map with the embedded graph track
          pattern: "*.pretext"
          ontologies: []
  versions_pretextgraph:
    - - ${task.process}:
          type: string
          description: Name of the process
      - PretextGraph:
          type: string
          description: Name of the tool
      - PretextGraph 2>&1 | sed "/Version/!d; s/.*Version //":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - PretextGraph:
          type: string
          description: Name of the tool
      - PretextGraph 2>&1 | sed "/Version/!d; s/.*Version //":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@villekytola-spb"
maintainers:
