name: nanolyse
description: DNA contaminant removal using NanoLyse
keywords:
  - contaminant
  - removal
  - dna
tools:
  - nanolyse:
      description: |
        DNA contaminant removal using NanoLyse
      homepage: https://github.com/wdecoster/nanolyse
      documentation: https://github.com/wdecoster/nanolyse#nanolyse
      licence: ["GPL-3.0-or-later"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fastq:
        type: file
        description: |
          Basecalled reads in FASTQ.GZ format
        pattern: "*.fastq.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
  - fasta:
      type: file
      description: |
        A reference fasta file against which to filter.
      pattern: "*.fasta"
      ontologies: []
output:
  fastq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fastq.gz":
          type: file
          description: Reads with contaminants removed in FASTQ format
          pattern: "*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  log:
    - "*.log":
        type: file
        description: Log of the Nanolyse run.
        pattern: "*.log"
        ontologies: []
  versions_nanolyse:
    - - ${task.process}:
          type: string
          description: The name of the process
      - nanolyse:
          type: string
          description: The name of the tool
      - NanoLyse --version 2>&1 | sed -e "s/NanoLyse //g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - nanolyse:
          type: string
          description: The name of the tool
      - NanoLyse --version 2>&1 | sed -e "s/NanoLyse //g":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@yuukiiwa"
maintainers:
  - "@yuukiiwa"
