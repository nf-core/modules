name: samtools_ampliconclip
description: Clips read alignments where they match BED file defined regions
keywords:
  - amplicon
  - clipping
  - ampliconclip
  - samtools
tools:
  - samtools:
      description: |
        SAMtools is a set of utilities for interacting with and post-processing
        short DNA sequence read alignments in the SAM, BAM and CRAM formats, written by Heng Li.
        These files are generated as output by short read aligners like BWA.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      licence:
        - "MIT"
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - bed:
      type: file
      description: BED file of regions to be removed (e.g. amplicon primers)
      pattern: "*.{bed}"
      ontologies: []
  - save_cliprejects:
      type: boolean
      description: Save filtered reads to a file
  - save_clipstats:
      type: boolean
      description: Save clipping stats to a file
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.clipallowed.bam":
          type: file
          description: Clipped reads BAM file
          pattern: "*.{bam}"
          ontologies: []
  stats:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.clipstats.txt":
          type: file
          description: Clipping statistics text file
          pattern: "*.{clipstats.txt}"
          ontologies: []
  rejects_bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.cliprejects.bam":
          type: file
          description: Filtered reads BAM file
          pattern: "*.{cliprejects.bam}"
          ontologies: []
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
