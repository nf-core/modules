name: samtools_fastq
description: Converts a SAM/BAM/CRAM file to FASTQ
keywords:
  - bam
  - sam
  - cram
  - fastq
tools:
  - samtools:
      description: |
        SAMtools is a set of utilities for interacting with and post-processing
        short DNA sequence read alignments in the SAM, BAM and CRAM formats, written by Heng Li.
        These files are generated as output by short read aligners like BWA.
      homepage: http://www.htslib.org/
      documentation: http://www.htslib.org/doc/samtools.html
      doi: 10.1093/bioinformatics/btp352
      publication:
        author: "Li H., Handsaker B., Wysoker A., Fennell T., Ruan J., Homer N., Marth G., Abecasis G., Durbin R., 1000 Genome Project Data Processing Subgroup"
        year: 2009
        title: "The Sequence Alignment/Map format and SAMtools"
        source: "Bioinformatics"
      licence:
        - "MIT"
      identifier: biotools:samtools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - interleave:
      type: boolean
      description: Set true for interleaved fastq file
output:
  fastq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_{1,2}.fastq.gz":
          type: file
          description: Compressed FASTQ file(s) with reads with either the READ1 or READ2 flag set in separate files.
          pattern: "*_{1,2}.fastq.gz"
          ontologies: []
  interleaved:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_interleaved.fastq":
          type: file
          description: Compressed FASTQ file with reads with either the READ1 or READ2 flag set in a combined file. Needs collated input file.
          pattern: "*_interleaved.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  singleton:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_singleton.fastq.gz":
          type: file
          description: Compressed FASTQ file with singleton reads
          pattern: "*_singleton.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  other:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_other.fastq.gz":
          type: file
          description: Compressed FASTQ file with reads with either both READ1 and READ2 flags set or unset
          pattern: "*_other.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
