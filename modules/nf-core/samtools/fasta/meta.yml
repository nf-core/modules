name: "samtools_fasta"
description: Converts a SAM/BAM/CRAM file to FASTA
keywords:
  - bam
  - sam
  - cram
  - fasta
tools:
  - "samtools":
      description: "Tools for dealing with SAM, BAM and CRAM files"
      homepage: "http://www.htslib.org"
      documentation: "https://www.htslib.org/doc/samtools-fasta.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      publication:
        author: "Li H., Handsaker B., Wysoker A., Fennell T., Ruan J., Homer N., Marth G., Abecasis G., Durbin R., 1000 Genome Project Data Processing Subgroup"
        year: 2009
        title: "The Sequence Alignment/Map format and SAMtools"
        source: "Bioinformatics"
      licence: ["MIT"]
      identifier: biotools:samtools
input:
  # Only when we have meta
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - interleave:
      type: boolean
      description: Set true for interleaved fasta files
output:
  #Only when we have meta
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_{1,2}.fasta.gz":
          type: file
          description: Compressed FASTA file(s) with reads with either the READ1 or READ2 flag set in separate files.
          pattern: "*_{1,2}.fasta.gz"
          ontologies: []
  interleaved:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_interleaved.fasta.gz":
          type: file
          description: Compressed FASTA file with reads with either the READ1 or READ2 flag set in a combined file. Needs collated input file.
          pattern: "*_interleaved.fasta.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  singleton:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_singleton.fasta.gz":
          type: file
          description: Compressed FASTA file with singleton reads
          pattern: "*_singleton.fasta.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  other:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_other.fasta.gz":
          type: file
          description: Compressed FASTA file with reads with either both READ1 and READ2 flags set or unset
          pattern: "*_other.fasta.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - samtools:
          type: string
          description: The tool name
      - "samtools version | sed '1!d;s/.* //'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - samtools:
          type: string
          description: The tool name
      - "samtools version | sed '1!d;s/.* //'":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@priyanka-surana"
maintainers:
  - "@priyanka-surana"
  - "@matthdsm"
