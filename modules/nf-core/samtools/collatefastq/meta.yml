name: samtools_collatefastq
description: |
  The module uses collate and then fastq methods from samtools to
  convert a SAM, BAM or CRAM file to FASTQ format
keywords:
  - bam2fq
  - samtools
  - fastq
tools:
  - samtools:
      description: Tools for dealing with SAM, BAM and CRAM files
      homepage: "http://www.htslib.org"
      documentation: "https://www.htslib.org/doc/samtools.html"
      tool_dev_url: "https://github.com/samtools/samtools"
      doi: "10.1093/bioinformatics/btp352"
      licence: ["MIT"]
      identifier: biotools:samtools

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: Reference genome file
        pattern: "*.{fa,fasta}"
        ontologies: []
    - fai:
        type: file
        description: Reference genome index file
        pattern: "*.fai"
        ontologies: []
  - interleave:
      type: boolean
      description: |
        If true, the output is a single interleaved paired-end FASTQ
        If false, the output split paired-end FASTQ
      default: false
output:
  fastq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_{1,2}.fq.gz":
          type: file
          description: |
            R1 and R2 FASTQ files
          pattern: "*_{1,2}.fq.gz"
          ontologies: []
  fastq_interleaved:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_interleaved.fq":
          type: file
          description: |
            Interleaved paired end FASTQ files
          pattern: "*_interleaved.fq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  fastq_other:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_other.fq.gz":
          type: file
          description: |
            FASTQ files with reads where the READ1 and READ2 FLAG bits set are either both set or both unset.
          pattern: "*_other.fq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  fastq_singleton:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_singleton.fq.gz":
          type: file
          description: |
            FASTQ files with singleton reads.
          pattern: "*_singleton.fq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@lescai"
  - "@maxulysse"
  - "@matthdsm"
