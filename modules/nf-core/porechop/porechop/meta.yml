name: "porechop_porechop"
description: Adapter removal and demultiplexing of Oxford Nanopore reads
keywords:
  - adapter
  - nanopore
  - demultiplexing
tools:
  - porechop:
      description: Adapter removal and demultiplexing of Oxford Nanopore reads
      homepage: "https://github.com/rrwick/Porechop"
      documentation: "https://github.com/rrwick/Porechop"
      tool_dev_url: "https://github.com/rrwick/Porechop"
      doi: "10.1099/mgen.0.000132"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: fastq/fastq.gz file
        pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fastq.gz":
          type: file
          description: Demultiplexed and/or adapter-trimmed fastq.gz file
          pattern: "*.{fastq.gz}"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.log":
          type: file
          description: Log file containing stdout information
          pattern: "*.log"
          ontologies: []
  versions_porechop:
    - - ${task.process}:
          type: string
          description: The name of the process
      - porechop:
          type: string
          description: The name of the tool
      - porechop --version:
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - porechop:
          type: string
          description: The name of the tool
      - porechop --version:
          type: eval
          description: The expression to obtain the version of the tool

