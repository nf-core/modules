      build_id: bd-9445270256470baf_1
      scan_id: sc-7576fc5ce0e29679_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/varlociraptor:8.9.5--8503a32f53215922
      build_id: bd-8503a32f53215922_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/f1/f1d2b5a7830e21d0407be9958b69810f16fac8008fb899c345f635ff5636de04/data
