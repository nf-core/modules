---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - bioconda::comebin-llmopt=1.1.2
  # CheckM's post-link script downloads its reference database and unpacks it at
  # build time; the container base image provides neither tool, so without these
  # the database silently ends up missing. See the PR for the build log.
  - conda-forge::gzip=1.14
  - conda-forge::tar=1.35
  # lowest CUDA pytorch 2.13 ships on linux-64, so it runs on the widest range of hosts
  - conda-forge::pytorch-gpu=2.13
  - conda-forge::cuda-version=12.9
