name: "comebinllmopt_comebinllmopt"
description: |
  COMEBin-LLMopt bins metagenomic contigs with contrastive multi-view representation learning.
  It is a faster, more robust version of COMEBin v1.1.0 by Ziye Wang et al.,
  improved with the help of an LLM coding agent and benchmarked against the original on fixed datasets.
keywords:
  - metagenomics
  - binning
  - clustering
tools:
  - "comebin":
      description: "COMEBin-LLMopt allows effective binning of metagenomic contigs using COntrastive Multi-viEw representation learning"
      homepage: "https://github.com/paulzierep/COMEBin-LLMopt"
      documentation: "https://github.com/paulzierep/COMEBin-LLMopt"
      tool_dev_url: "https://github.com/paulzierep/COMEBin-LLMopt"
      doi: "10.1038/s41467-023-44290-z"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - assembly:
        type: file
        description: FASTA file of contigs for binning
        pattern: "*.{fa,fas,fasta,fna,fa.gz,fas.gz,fasta.gz,fna.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1929
    - bam_or_bedgraph:
        type: file
        description: |
          List of sorted bam files of reads mapped to the reference assembly, or bedgraph coverage
          files produced by "bedtools genomecov -bga -ibam sample.bam"
        pattern: "*.{bam,bedgraph,bg}"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
          - edam: http://edamontology.org/format_3583 # BEDGRAPH
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - checkm2db:
        type: file
        description: CheckM2 reference database for marker gene detection and bin quality assessment
        pattern: "*.dmnd"
        ontologies: []
output:
  bins:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/comebin_res_bins/*.fa.gz:
          type: file
          description: List of FASTA files of binned contigs
          pattern: "*.fna.gz"
          ontologies:
            - edam: http://edamontology.org/format_1929
            - edam: http://edamontology.org/format_3989 # GZIP format
  tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/comebin_res.tsv:
          type: file
          description: |
            TSV mapping the output clusters to contigs
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/comebin.log:
          type: file
          description: |
            COMEBin log file
          pattern: "*.log"
          ontologies:
            - edam: http://edamontology.org/format_3671
  embeddings:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/embeddings.npy:
          type: file
          description: |
            NumPy array of the contig embeddings, rows in the order of `embedding_ids.txt`
          pattern: "*.npy"
          ontologies:
            - edam: http://edamontology.org/format_4003 # NumPy format
  covembeddings:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/covembeddings.npy:
          type: file
          description: |
            NumPy array of the coverage embeddings, rows in the order of `embedding_ids.txt`
          pattern: "*.npy"
          ontologies:
            - edam: http://edamontology.org/format_4003 # NumPy format
  embedding_ids:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/embedding_ids.txt:
          type: file
          description: |
            Contig identifiers, one per line, giving the row order of both embedding arrays
          pattern: "*.txt"
          ontologies: []
  final_selection:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - ${prefix}/final_selection.txt:
          type: file
          description: |
            Final bin selection when running with CheckM2
          pattern: "*.txt"
          ontologies: []
  versions_comebin:
    - - ${task.process}:
          type: string
          description: The name of the process
      - comebin-llmopt:
          type: string
          description: The name of the tool
      - "comebin-llmopt -V | sed 's/COMEBin-LLMopt version: //; s/(.*)//'":
          type: eval
          description: The expression to obtain the version of the tool
  versions_cuda:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cuda:
          type: string
          description: The name of the runtime
      - python -c "import torch; print(torch.version.cuda or 'no CUDA available')":
          type: eval
          description: CUDA version bundled with the task's pytorch build, or `no CUDA available` on the non-GPU path
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - comebin-llmopt:
          type: string
          description: The name of the tool
      - "comebin-llmopt -V | sed 's/COMEBin-LLMopt version: //; s/(.*)//'":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - cuda:
          type: string
          description: The name of the runtime
      - python -c "import torch; print(torch.version.cuda or 'no CUDA available')":
          type: eval
          description: CUDA version bundled with the task's pytorch build, or `no CUDA available` on the non-GPU path
authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
