name: "quantmsutils_diann2mztab"
description: "Convert DIA-NN results to mzTab, MSstats, and Triqler formats using quantms-utils"
keywords:
  - "quantms-utils"
  - "diann"
  - "mztab"
  - "msstats"
  - "triqler"
  - "proteomics"
tools:
  - "quantms-utils":
      description: "quantms-utils is a Python package for proteomics data processing"
      homepage: "https://github.com/bigbio/quantms-utils"
      documentation: "https://github.com/bigbio/quantms-utils"
      tool_dev_url: "https://github.com/bigbio/quantms-utils"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', name:'test', condition:'test' ]
    - report:
        type: file
        description: "DIA-NN main report file (tsv or parquet)"
        pattern: "*.{tsv,parquet}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - report_pg:
        type: file
        description: "DIA-NN protein group matrix file"
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - report_pr:
        type: file
        description: "DIA-NN precursor matrix file"
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - diann_version:
        type: string
        description: |
          DIA-NN version
    - exp_design:
        type: file
        description: "Experimental design file describing sample conditions"
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - ms_information:
        type: file
        description: "MS statistics/information files in parquet format"
        pattern: "*.parquet"
        ontologies: []
    - fasta:
        type: file
        description: "FASTA database file used for the search"
        pattern: "*.{fasta,fa}"
        ontologies: []
output:
  out_msstats:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', name:'test', condition:'test' ]
      - "*msstats_in.csv":
          type: file
          description: "MSstats input file for statistical analysis"
          pattern: "*msstats_in.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  out_triqler:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', name:'test', condition:'test' ]
      - "*triqler_in.tsv":
          type: file
          description: "Triqler input file for protein quantification with uncertainty"
          pattern: "*triqler_in.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  out_mztab:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', name:'test', condition:'test' ]
      - "*.mzTab":
          type: file
          description: "mzTab output file (standard proteomics exchange format)"
          pattern: "*.mzTab"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', name:'test', condition:'test' ]
      - "*.log":
          type: file
          description: "Log file from conversion process"
          pattern: "*.log"
          ontologies: []
  versions_quantmsutils:
    - - ${task.process}:
          type: string
          description: The name of the process
      - quantms-utils:
          type: string
          description: The name of the tool
      - quantmsutilsc --version 2>&1 | sed -n 's/quantmsutils //p':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - quantms-utils:
          type: string
          description: The name of the tool
      - quantmsutilsc --version 2>&1 | sed -n 's/quantmsutils //p':
          type: eval
          description: The expression to obtain the version of the tool

authors:
