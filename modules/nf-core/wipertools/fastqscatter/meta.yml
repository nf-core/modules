name: "wipertools_fastqscatter"
description: A tool of the wipertools suite that splits FASTQ files into chunks
keywords:
  - fastq
  - split
  - partitioning
tools:
  - "fastqscatter":
      description: "A tool of the wipertools suite that splits FASTQ files into chunks."
      homepage: "https://github.com/mazzalab/fastqwiper"
      documentation: "https://github.com/mazzalab/fastqwiper"
      tool_dev_url: "https://github.com/mazzalab/fastqwiper"
      doi: "no DOI available"
      licence:
        - "GPL v2-or-later"
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - fastq:
        type: file
        description: FASTQ file
        pattern: "*.{fastq,fastq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1930"
  - num_splits:
      type: integer
      description: Number of desired chunks
      pattern: "[1-9][0-9]*"
output:
  fastq_chunks:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - ${out_folder}/*:
          type: file
          description: Chunk FASTQ files
          pattern: "*.{fastq,fastq.gz}"
          ontologies:
            - edam: "http://edamontology.org/format_1930"
            - edam: "http://edamontology.org/format_3989"
  versions_wipertools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - wipertools:
          type: string
          description: The name of the tool
      - wipertools fastqscatter --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - wipertools:
          type: string
          description: The name of the tool
      - wipertools fastqscatter --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@tm4zza"
maintainers:
  - "@mazzalab"
  - "@tm4zza"
