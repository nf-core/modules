name: "openms_idconflictresolver"
description: Resolves ambiguous annotations of features with peptide identifications, keeping the best-scoring hit per feature.
keywords:
  - quantification
  - consensusXML
  - openms
  - proteomics
tools:
  - "openms":
      description: "OpenMS is an open-source software C++ library for LC-MS data management and analyses"
      homepage: "https://openms.de"
      documentation: "https://openms.readthedocs.io/en/latest/index.html"
      tool_dev_url: "https://github.com/OpenMS/OpenMS"
      doi: "10.1038/s41592-024-02197-7"
      licence: ["BSD"]
      identifier: "biotools:openms"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - consensus_file:
        type: file
        description: Feature map with conflicting identifications.
        pattern: "*.{consensusXML,featureXML}"
        ontologies:
          - edam: http://edamontology.org/data_2536 # Mass spectrometry data
output:
  resolved:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.${consensus_file.extension}:
          type: file
          description: Feature map with conflicting identifications resolved, same format as the input.
          pattern: "*.{consensusXML,featureXML}"
          ontologies:
            - edam: http://edamontology.org/data_2536 # Mass spectrometry data
  versions_openms:
    - - ${task.process}:
          type: string
          description: The name of the process
      - openms:
          type: string
          description: The name of the tool
      - "FileInfo --help 2>&1 | sed -nE 's/^Version: ([0-9.]+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - openms:
          type: string
          description: The name of the tool
      - "FileInfo --help 2>&1 | sed -nE 's/^Version: ([0-9.]+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@jonasscheid"
maintainers:
  - "@jonasscheid"
