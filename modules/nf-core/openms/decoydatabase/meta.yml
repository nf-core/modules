name: "openms_decoydatabase"
description: Create a decoy peptide database from a standard FASTA database.
keywords:
  - decoy
  - database
  - openms
  - proteomics
  - fasta
tools:
  - "openms":
      description: "OpenMS is an open-source software C++ library for LC-MS data management and analyses"
      homepage: "https://openms.de"
      documentation: "https://openms.readthedocs.io/en/latest/index.html"
      tool_dev_url: "https://github.com/OpenMS/OpenMS"
      doi: "10.1038/s41592-024-02197-7"
      licence: ["BSD"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - fasta:
        type: file
        description: Fasta file containing protein sequences
        pattern: "*.{fasta}"
        ontologies: []
output:
  decoy_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.fasta":
          type: file
          description: Fasta file containing proteins and decoy proteins
          pattern: "*.{fasta}"
          ontologies: []
  versions_openms:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - openms:
          type: string
          description: The tool name
      - "FileInfo --help 2>&1 | sed -nE 's/^Version: ([0-9.]+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - openms:
          type: string
          description: The tool name
      - "FileInfo --help 2>&1 | sed -nE 's/^Version: ([0-9.]+).*/\\1/p'":
          type: eval
          description: The expression to obtain the version of the tool

