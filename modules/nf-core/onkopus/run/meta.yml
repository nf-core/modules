name: "onkopus_run"
description: |
  Annotates, interprets and prioritises cancer variants in a VCF file with Onkopus.
  Variant data are sent to the public Onkopus web services (https://mtb.bioinf.med.uni-goettingen.de),
  so tasks need internet access and data leave the compute environment: consider data-privacy rules for patient data.
  Pass `-m <modules>` (default `all`) and `-t <target genome>` via `ext.args`; running one `-m` module per process is safest,
  as with several modules only the last one's annotations may be kept.
keywords:
  - cancer
  - variant annotation
  - variant interpretation
  - variant prioritisation
  - precision oncology
  - vcf
  - genomics
tools:
  - "onkopus":
      description: "Modular framework to annotate, interpret and prioritise genetic alterations in cancer, including pathogenicity and functional-effect prediction, ClinVar and potential therapies"
      homepage: "https://gitlab.gwdg.de/MedBioinf/mtb/onkopus/onkopus"
      documentation: "https://pypi.org/project/onkopus/"
      tool_dev_url: "https://gitlab.gwdg.de/MedBioinf/mtb/onkopus/onkopus"
      doi: "10.1093/nar/gkaf376"
      licence:
        - "GPL-3.0-only"
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - vcf:
        type: file
        description: Variant calls in VCF format, plain or BGZF (bgzip)-compressed
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3016 # VCF
          - edam: http://edamontology.org/format_3615 # BGZF
  - genome:
      type: string
      description: Genome assembly of the input variants (`hg19`, `hg38` or `t2t`)
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.ann.vcf.gz:
          type: file
          description: Annotated variants in BGZF (bgzip)-compressed VCF format
          pattern: "*.ann.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3016 # VCF
            - edam: http://edamontology.org/format_3615 # BGZF
  versions_onkopus:
    - - ${task.process}:
          type: string
          description: The name of the process
      - onkopus:
          type: string
          description: The name of the tool
      - python -c "import importlib.metadata as m; print(m.version('onkopus'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - onkopus:
          type: string
          description: The name of the tool
      - python -c "import importlib.metadata as m; print(m.version('onkopus'))":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
