name: "fastqe"
description: fastqe is a bioinformatics command line tool that uses emojis to
  represent and analyze genomic data.
keywords:
  - quality control
  - fastq
  - emoji
  - visualization
tools:
  - fastqe:
      description: "A tool for visualizing FASTQ file quality using emoji"
      homepage: "https://github.com/fastqe/fastqe"
      documentation: "https://github.com/fastqe/fastqe#readme"
      tool_dev_url: "https://github.com/fastqe/fastqe"
      doi: "10.24918/cs.2021.17"
      publication:
        author: "St. Jacques, R. M., Maza, W. M., Robertson, S. D., Lonsdale, A., Murray, C. S., Williams, J. J. & Enke, R. A."
        year: 2021
        title: "A Fun Introductory Command Line Lesson: Next Generation Sequencing Quality Analysis with Emoji!"
        source: "CourseSource"
      licence:
        - "MIT"
      identifier: "biotools:fastqe"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - fastq:
        type: file
        description: |
          List of input FastQ files of size 1 and 2 for single-end and paired-end data,
          respectively.
        ontologies: []
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.tsv":
          type: file
          description: Text file containing emoji
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  versions_fastqe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fastqe:
          type: string
          description: The name of the tool
      - 0.5.2:
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fastqe:
          type: string
          description: The name of the tool
      - 0.5.2:
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@adamrtalbot"
maintainers:
  - "@adamrtalbot"
