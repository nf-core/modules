# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gcta_addgrms"
description: Combine multiple GRMs listed in an MGRM manifest into a single dense GRM
keywords:
  - gcta
  - genome-wide complex trait analysis
  - grm
  - genetic relationship matrix
  - genetics
tools:
  - "gcta":
      description: "Genome-wide Complex Trait Analysis (GCTA) estimates genetic relationships, variance components, and association statistics from genome-wide data."
      homepage: "https://yanglab.westlake.edu.cn/software/gcta/"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/static/gcta_doc_latest.pdf"
      tool_dev_url: "https://yanglab.westlake.edu.cn/software/gcta/"
      licence: ["GPL-3.0-only"]
      identifier: "biotools:gcta"

input:
  - - meta:
        type: map
        description: |
          Groovy map containing combined GRM metadata
          e.g. `[ id:'plink_simulated' ]`
    - mgrm_file:
        type: file
        description: MGRM manifest listing the GRM prefixes to combine
        pattern: "*.mgrm"
        ontologies:
          - edam: "http://edamontology.org/format_2330"
    - grm_files:
        type: file
        description: GRM sidecar files referenced by `mgrm_file`
        pattern: "*"
        ontologies: []
output:
  combined_grm:
    - - meta:
          type: map
          description: |
            Groovy map containing combined GRM metadata
            e.g. `[ id:'plink_simulated' ]`
      - "*.grm.*":
          type: file
          description: Combined dense GRM sidecar files
          pattern: "*.grm.{id,bin,N.bin}"
          ontologies: []
  versions_gcta:
    - - "${task.process}":
          type: string
          description: The process the version was collected from
      - "gcta":
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to retrieve the GCTA version

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - gcta:
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to retrieve the GCTA version

authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gcta:1.94.1--e22d27187f066d3c
      build_id: bd-e22d27187f066d3c_1
      scan_id: sc-b6cc55fb8a03cfda_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gcta:1.94.1--466cdc5f0ba301ae
      build_id: bd-466cdc5f0ba301ae_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/56/56e7d9dd85fa648387dcb28e6f9c2eb293c5b2f444f5419266be7732cac23f3d/data
  conda:
    linux/amd64:
      lock_file: modules/nf-core/gcta/addgrms/.conda-lock/linux_amd64-bd-e22d27187f066d3c_1.txt
