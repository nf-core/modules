# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "gcta_makegrm"
description: Compute a whole dense GRM with GCTA
keywords:
  - gcta
  - genome-wide complex trait analysis
  - grm
  - genetic relationship matrix
  - genetics
tools:
  - "gcta":
      description: "GCTA is a tool for genome-wide complex trait analysis."
      homepage: "https://yanglab.westlake.edu.cn/software/gcta/"
      documentation: "https://yanglab.westlake.edu.cn/software/gcta/static/gcta_doc_latest.pdf"
      tool_dev_url: "https://github.com/jianyangqt/gcta"
      licence:
        - "GPL-3.0-only"
      identifier: biotools:gcta

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing GRM sample metadata
          e.g. `[ id:'gcta_grm' ]`
    - mfile:
        type: file
        description: GCTA multi-input manifest consumed by `--mbfile` or `--mpfile`
        pattern: "*.{mbfile,mpfile,txt}"
        ontologies:
          - edam: "http://edamontology.org/format_2330"
    - bed_pgen:
        type: file
        description: Collection of PLINK primary genotype files referenced by the multi-input manifest
        pattern: "*.{bed,pgen}"
        ontologies:
          - edam: "http://edamontology.org/format_3003"
    - bim_pvar:
        type: file
        description: Collection of PLINK variant metadata files referenced by the multi-input manifest
        pattern: "*.{bim,pvar}"
        ontologies: []
    - fam_psam:
        type: file
        description: Collection of PLINK sample metadata files referenced by the multi-input manifest
        pattern: "*.{fam,psam}"
        ontologies: []
output:
  grm_files:
    - - meta:
          type: map
          description: |
            Groovy Map containing GRM sample metadata
            e.g. `[ id:'gcta_grm' ]`
      - "*.grm.*":
          type: file
          description: Dense GRM sidecar files
          pattern: "*.grm.{id,bin,N.bin}"
          ontologies: []
  versions_gcta:
    - - ${task.process}:
          type: string
          description: The process the version was collected from
      - gcta:
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to generate the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - gcta:
          type: string
          description: The tool name
      - "gcta --version | sed -En 's/^[*] version v([0-9.]*).*/\\1/p'":
          type: eval
          description: The command used to generate the version of the tool

authors:
  - "@lyh970817"
maintainers:
  - "@lyh970817"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gcta:1.94.1--e22d27187f066d3c
      build_id: bd-e22d27187f066d3c_1
      scan_id: sc-b6cc55fb8a03cfda_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gcta:1.94.1--466cdc5f0ba301ae
      build_id: bd-466cdc5f0ba301ae_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/56/56e7d9dd85fa648387dcb28e6f9c2eb293c5b2f444f5419266be7732cac23f3d/data
  conda:
    linux/amd64:
      lock_file: modules/nf-core/gcta/makegrm/.conda-lock/linux_amd64-bd-e22d27187f066d3c_1.txt
