name: medaka
description: A tool to create consensus sequences and variant calls from nanopore sequencing data
keywords:
  - assembly
  - polishing
  - nanopore
tools:
  - medaka:
      description: Neural network sequence error correction.
      homepage: https://github.com/nanoporetech/medaka
      documentation: https://github.com/nanoporetech/medaka
      tool_dev_url: https://github.com/nanoporetech/medaka
      licence:
        - "Mozilla Public License 2.0"
      identifier: biotools:medaka
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: List of input nanopore fasta/FastQ files
        pattern: "*.{fasta,fa,fastq,fastq.gz,fq,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930
    - assembly:
        type: file
        description: Genome assembly
        pattern: "*.{fasta,fa}"
        ontologies: []
output:
  assembly:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fa.gz":
          type: file
          description: Polished genome assembly
          pattern: "*.fa.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  versions_medaka:
    - - ${task.process}:
          type: string
          description: The name of the process
      - medaka:
          type: string
          description: The name of the tool
      - medaka --version 2>&1 | sed "s/medaka //g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - medaka:
          type: string
          description: The name of the tool
      - medaka --version 2>&1 | sed "s/medaka //g":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@avantonder"
maintainers:
