name: cellranger_mkvdjref
description: Module to build the VDJ reference needed by the 10x Genomics Cell
  Ranger tool. Uses the cellranger mkvdjref command.
keywords:
  - reference
  - mkvdjref
  - index
  - immunoprofiling
  - single-cell
  - cellranger
tools:
  - cellranger:
      description: Cell Ranger processes data from 10X Genomics Chromium kits.
        `cellranger vdj` takes FASTQ files from `cellranger mkfastq` or
        `bcl2fastq` for V(D)J libraries and performs sequence assembly and paired
        clonotype calling. It uses the Chromium cellular barcodes and UMIs to
        assemble V(D)J transcripts per cell. Clonotypes and CDR3 sequences are
        output as a `.vloupe` file which can be loaded into Loupe V(D)J Browser.
      homepage: https://support.10xgenomics.com/single-cell-vdj/software/pipelines/latest/what-is-cell-ranger
      documentation: https://support.10xgenomics.com/single-cell-vdj/software/pipelines/latest/advanced/references
      tool_dev_url: https://support.10xgenomics.com/single-cell-vdj/software/pipelines/latest/advanced/references
      doi: "10.1038/ncomms14049"
      publication:
        author: "Zheng, G. X. Y., Terry, J. M., Belgrader, P., Ryvkin, P., Bent, Z. W., Wilson, R., Ziraldo, S. B., Wheeler, T. D., McDermott, G. P., Zhu, J., Gregory, M. T., Shuga, J., Montesclaros, L., Underwood, J. G., Masquelier, D. A., Nishimura, S. Y., Schnall-Levin, M., Wyatt, P. W., Hindson, C. M., Bharadwaj, R., Wong, A., Ness, K. D., Beppu, L. W., Deeg, H. J., McFarland, C., Loeb, K. R., Valente, W. J., Ericson, N. G., Stevens, E. A., Radich, J. P., Mikkelsen, T. S., Hindson, B. J. & Bielas, J. H."
        year: 2017
        title: "Massively parallel digital transcriptional profiling of single cells"
        source: "Nature Communications"
      licence:
        - "10x Genomics EULA"
      identifier: ""
input:
  - fasta:
      type: file
      description: Reference genome FASTA file (optional)
      pattern: "*.{fasta,fa}"
      ontologies: []
  - gtf:
      type: file
      description: Reference genome GTF file (optional)
      pattern: "*.gtf"
      ontologies: []
  - seqs:
      type: file
      description: Reference genome FASTA file from the 10X Genomics fetch-imgt
        workflow (optional)
      pattern: "*.{fasta,fa}"
      ontologies: []
  - reference_name:
      type: string
      description: The name to give the new reference folder, e.g. `my_vdj_ref`.
        This flag is required
      pattern: str
output:
  reference:
    - ${reference_name}:
        type: directory
        description: Folder containing all the reference indices needed by Cell
          Ranger
  versions_cellranger:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cellranger:
          type: string
          description: The name of the tool
      - cellranger --version | sed "s/.*-//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cellranger:
          type: string
          description: The name of the tool
      - cellranger --version | sed "s/.*-//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ggabernet"
  - "@klkeys"
maintainers:
  - "@ggabernet"
  - "@klkeys"
