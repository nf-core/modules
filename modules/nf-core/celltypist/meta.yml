name: "celltypist"
description: Automated cell type annotation of single-cell RNA-seq data using a pre-trained CellTypist model
keywords:
  - single-cell
  - scrna-seq
  - cell type annotation
  - classification
tools:
  - "celltypist":
      description: "A tool for semi-automatic cell type annotation."
      homepage: "https://www.celltypist.org"
      documentation: "https://celltypist.readthedocs.io"
      tool_dev_url: "https://github.com/Teichlab/celltypist"
      doi: "10.1126/science.abl5197"
      licence: ["MIT"]
      identifier: biotools:celltypist

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - h5ad:
        type: file
        description: |
          AnnData object with log1p-normalised expression (10,000 counts per cell)
          and gene symbols as variable names
        pattern: "*.h5ad"
        ontologies: []
    - over_clustering:
        type: file
        description: |
          Optional text file with the over-clustering result, one cluster label per
          cell. Used with `--majority-voting`. Pass an empty list to let CellTypist
          cluster the cells itself.
        pattern: "*.{txt,csv,tsv}"
        optional: true
        ontologies: []
    - gene_file:
        type: file
        description: |
          Optional text file with one gene per line, for matrix market input.
          Pass an empty list when the input is an h5ad file.
        pattern: "*.{txt,tsv}"
        optional: true
        ontologies: []
    - cell_file:
        type: file
        description: |
          Optional text file with one cell per line, for matrix market input.
          Pass an empty list when the input is an h5ad file.
        pattern: "*.{txt,tsv}"
        optional: true
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing model information
          e.g. `[ id:'Immune_All_Low' ]`
    - model:
        type: file
        description: Pre-trained CellTypist model
        pattern: "*.pkl"
        ontologies: []
output:
  predicted_labels:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_predicted_labels.csv":
          type: file
          optional: true
          description: Predicted cell type label for each cell
          pattern: "*predicted_labels.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  decision_matrix:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_decision_matrix.csv":
          type: file
          optional: true
          description: Decision scores of each cell for each cell type in the model
          pattern: "*decision_matrix.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  probability_matrix:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_probability_matrix.csv":
          type: file
          optional: true
          description: Probability of each cell belonging to each cell type in the model
          pattern: "*probability_matrix.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  xlsx:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}_annotation_result.xlsx":
          type: file
          description: |
            Excel workbook with all result tables, written when `--xlsx` is given in
            `task.ext.args`. In that case the three CSV files are not written.
          pattern: "*.xlsx"
          optional: true
          ontologies:
            - edam: "http://edamontology.org/format_3620" # XLSX
  plots:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.pdf":
          type: file
          description: Plots of the prediction results, written when `--plot-results` is given in `task.ext.args`
          pattern: "*.pdf"
          optional: true
          ontologies:
            - edam: "http://edamontology.org/format_3508" # PDF
  versions_celltypist:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "celltypist":
          type: string
          description: The name of the tool
      - 'python3 -c ''import importlib.metadata; print(importlib.metadata.version("celltypist"))''':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - celltypist:
          type: string
          description: The name of the tool
      - python3 -c 'import importlib.metadata; print(importlib.metadata.version("celltypist"))':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@iraajgangavaram"
maintainers:
