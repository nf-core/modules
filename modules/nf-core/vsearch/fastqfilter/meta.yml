name: "vsearch_fastqfilter"
description: Performs quality filtering and / or conversion of a FASTQ file to FASTA format.
keywords:
  - vsearch/fastqfilter
  - vsearch
  - fastqfilter
  - amplicon sequences
  - metagenomics
  - genomics
  - population genetics
tools:
  - "vsearch":
      description: "VSEARCH is a versatile open-source tool for microbiome analysis, including chimera detection, clustering, dereplication and rereplication, extraction, FASTA/FASTQ/SFF file processing, masking, orienting, pair-wise alignment, restriction site cutting, searching, shuffling, sorting, subsampling, and taxonomic classification of amplicon sequences for metagenomics, genomics, and population genetics. (USEARCH alternative)"
      homepage: "https://github.com/torognes/vsearch"
      documentation: https://github.com/torognes/vsearch/releases/download/v2.31.0/vsearch_manual.pdf
      tool_dev_url: "https://github.com/torognes/vsearch"
      doi: "10.7717/peerj.2584"
      licence: ["GPL v3-or-later OR BSD-2-clause"]
      identifier: biotools:vsearch
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information e.g. [ id:'sample1']
    - fastq:
        type: file
        description: FASTQ file to filter
        pattern: "*.{fastq,fq,fastq.gz,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
output:
  fasta:
    - - meta:
          type: map
          description: Groovy Map containing sample information e.g. [ id:'sample1']
      - "*.fasta":
          type: file
          description: Filtered FASTA file
          pattern: "*.fasta"
          ontologies: []
  log:
    - "*.log":
        type: file
        description: Log file of the run
        pattern: "*.log"
        ontologies: []
  versions_vsearch:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - vsearch:
          type: string
          description: The tool name
      - vsearch --version 2>&1 | sed -n "1s/.*v\([0-9.]*\).*/\\1/p":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - vsearch:
          type: string
          description: The tool name
      - vsearch --version 2>&1 | sed -n "1s/.*v\([0-9.]*\).*/\\1/p":
          type: eval
          description: The expression to obtain the version of the tool

