# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "svdss_search"
description: Extract sample-specific strings (SFS) from reads with SVDSS by searching them against an FM-index of the reference genome
keywords:
  - structural variants
  - sv calling
  - sample-specific strings
  - long reads
  - fm-index
tools:
  - svdss:
      description: "Structural Variant Discovery from Sample-specific Strings."
      homepage: "https://github.com/Parsoa/SVDSS"
      documentation: "https://github.com/Parsoa/SVDSS/blob/v2.1.1/README.md"
      tool_dev_url: "https://github.com/Parsoa/SVDSS"
      doi: "10.1038/s41592-022-01674-1"
      licence:
        - "MIT"
      identifier: biotools:svdss
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads:
        type: file
        description: |
          Reads in BAM format, ideally smoothed with SVDSS smooth, or in FASTQ format (plain or gzip-compressed).
          Files ending in `.bam` are passed with `--bam`, all others with `--fastx`.
        pattern: "*.{bam,fastq,fq,fastq.gz,fq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_1930" # FASTQ
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'genome' ]`
    - index:
        type: file
        description: FM-index of the reference genome produced by SVDSS index
        pattern: "*.{fmd,fmr}"
        ontologies: []
output:
  sfs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.sfs.txt:
          type: file
          description: Tab-separated list of sample-specific strings found in each read
          pattern: "*.sfs.txt"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions_svdss:
    - - ${task.process}:
          type: string
          description: The name of the process
      - svdss:
          type: string
          description: The name of the tool
      - SVDSS --version 2>&1 | sed 's/SVDSS, v//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - svdss:
          type: string
          description: The name of the tool
      - SVDSS --version 2>&1 | sed 's/SVDSS, v//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@krannich479"
maintainers:
  - "@krannich479"
