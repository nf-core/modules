name: "td2_longorfs"
description: TD2 identifies candidate coding regions within transcript
  sequences, such as those generated by de novo RNA-Seq transcript assembly
keywords:
  - td2
  - orfs
  - longorfs
  - transcripts
tools:
  - td2:
      description: "TD2 identifies candidate coding regions within transcript sequences,
        such as those generated by de novo RNA-Seq transcript assembly"
      homepage: "https://github.com/Markusjsommer/TD2"
      documentation: "https://github.com/Markusjsommer/TD2"
      tool_dev_url: "https://github.com/Markusjsommer/TD2"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - fasta:
        type: file
        description: Fasta file containing the target transcript sequences
        pattern: "*.{fasta}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - min_len:
        type: integer
        description: minimum protein length for proteins in long transcripts,
          default=90
        default: 90
    - abs_min_len:
        type: integer
        description: minimum protein length for proteins in short transcripts,
          default=90
        default: 90
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - gene_transmap:
        type: file
        description: Gene to transcript mapping file, default=none
        pattern: "*.tsv"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  orfs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}/longorfs/longest_orfs.{cds,pep,gff3}:
          type: file
          description: Longest ORFs in the transcript sequences
          pattern: "*.{cds,pep,gff3}"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
            - edam: http://edamontology.org/format_1960 # GFF3
            - edam: http://edamontology.org/format_3603 # PEP
  versions_td2:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - TD2.LongOrfs:
          type: string
          description: The tool name
      - 1.1.0:
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - TD2.LongOrfs:
          type: string
          description: The tool name
      - 1.1.0:
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@khersameesh24"
maintainers:
  - "@khersameesh24"
