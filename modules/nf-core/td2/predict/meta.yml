name: "td2_predict"
description: TD2 identifies candidate coding regions within transcript
  sequences, such as those generated by de novo RNA-Seq transcript assembly
keywords:
  - predict
  - orfs
  - coding regions
  - td2.predict
tools:
  - "td2":
      description: "TD2 identifies candidate coding regions within transcript sequences,
        such as those generated by de novo RNA-Seq transcript assembly"
      homepage: "https://github.com/Markusjsommer/TD2"
      documentation: "https://github.com/Markusjsommer/TD2"
      tool_dev_url: "https://github.com/Markusjsommer/TD2"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - fasta:
        type: file
        description: Transcripts fasta file
        pattern: "*.fasta"
        ontologies:
          - edam: http://edamontology.org/format_1929
    - orfs_dir:
        type: directory
        description: Directory containing the ORF prediction files generated by
          the `td2_longorfs` module
        pattern: "orfs_dir/"
        ontologies: []
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.TD2.bed":
          type: file
          description: TD2 ORF predictions in BED format
          pattern: "*.TD2.bed"
          ontologies:
            - edam: http://edamontology.org/format_3003 # BED
  cds:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.TD2.cds":
          type: file
          description: TD2 ORF predictions in CDS format
          pattern: "*.TD2.cds"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  pep:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.TD2.pep":
          type: file
          description: TD2 ORF predictions in peptide format
          pattern: "*.TD2.pep"
          ontologies:
            - edam: http://edamontology.org/format_1960 # PEP
  gff3:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.TD2.gff3":
          type: file
          description: TD2 ORF predictions in GFF3 format
          pattern: "*.TD2.gff3"
          ontologies:
            - edam: http://edamontology.org/format_3603 # GFF3
  versions_td2:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - TD2.Predict:
          type: string
          description: The tool name
      - 1.1.0:
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - TD2.Predict:
          type: string
          description: The tool name
      - 1.1.0:
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@khersameesh24"
maintainers:
  - "@khersameesh24"
