name: dnaapler_all
description: Reorients complete bacterial chromosomes, plasmids and phages to start at a conserved gene
keywords:
  - reorientation
  - genome assembly
  - chromosome
  - plasmid
  - phage
  - dnaA
  - fasta
  - gfa
tools:
  - dnaapler:
      description: |
        Reorients complete microbial chromosomes, plasmids and phages to begin with
        a conserved start gene (e.g. dnaA, repA or terL) using MMseqs2 searches
        against a bundled protein database.
      homepage: https://github.com/gbouras13/dnaapler
      documentation: https://dnaapler.readthedocs.io
      tool_dev_url: https://github.com/gbouras13/dnaapler
      doi: "10.21105/joss.05968"
      licence:
        - "MIT"
      identifier: ""
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - assembly:
        type: file
        description: |
          Complete assembly in FASTA or GFA format, optionally compressed
          with gzip, bzip2 or xz
        pattern: "*.{fasta,fa,fna,gfa}{,.gz,.bz2,.xz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3975 # GFA 1
    - ignore:
        type: file
        description: |
          Optional. Text file listing contig IDs (one per line) to leave
          un-reoriented. Only the first whitespace-delimited token of each line is used.
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_2330 # Textual format
  - - meta2:
        type: map
        description: |
          Groovy Map containing custom database information
          e.g. `[ id:'custom_db' ]`
    - custom_db:
        type: file
        description: |
          Optional. Uncompressed amino acid FASTA file used as a custom database
          instead of the bundled one (passed with `--custom_db`).
        pattern: "*.{fasta,fa,faa}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
output:
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_reoriented.fasta:
          type: file
          description: Reoriented assembly in FASTA format
          pattern: "*_reoriented.fasta"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  gfa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_reoriented.gfa:
          type: file
          description: Optional. Reoriented assembly graph, only emitted for GFA input
          pattern: "*_reoriented.gfa"
          ontologies:
            - edam: http://edamontology.org/format_3975 # GFA 1
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_all_reorientation_summary.tsv:
          type: file
          description: Per-contig summary of the reorientation performed
          pattern: "*_all_reorientation_summary.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  hits:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_MMseqs2_output.txt:
          type: file
          description: |
            Optional. Tabular MMseqs2 hits against the reorientation database.
            Not emitted for a GFA input without circular contigs
          pattern: "*_MMseqs2_output.txt"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.log:
          type: file
          description: dnaapler run log
          pattern: "*.log"
          ontologies:
            - edam: http://edamontology.org/format_2330 # Textual format
  versions_dnaapler:
    - - ${task.process}:
          type: string
          description: The name of the process
      - dnaapler:
          type: string
          description: The name of the tool
      - dnaapler --version | sed 's/.*version //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - dnaapler:
          type: string
          description: The name of the tool
      - dnaapler --version | sed 's/.*version //':
          type: eval
          description: The expression to obtain the version of the tool
