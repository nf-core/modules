name: "ataqv_mkarv"
description: mkarv function of a corresponding ataqv tool
keywords:
  - ataqv
  - ATAC-seq
  - qc
  - mkarv
tools:
  - "ataqv":
      description: "ataqv is a toolkit for measuring and comparing ATAC-seq results. It was written to help understand how well ATAC-seq assays have worked, and to make it easier to spot differences that might be caused by library prep or sequencing."
      homepage: "https://github.com/ParkerLab/ataqv/blob/master/README.rst"
      documentation: "https://github.com/ParkerLab/ataqv/blob/master/README.rst"
      tool_dev_url: "https://github.com/ParkerLab/ataqv"
      licence:
        - "GPL v3"
      identifier: biotools:ataqv
input:
  - jsons/*:
      type: file
      description: JSON files
      pattern: "*.json"
      ontologies:
        - edam: http://edamontology.org/format_3464 # JSON
output:
  html:
    - html:
        type: directory
        description: Web application to visualize results in HTML format
        pattern: "*.html"
  versions_ataqv:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ataqv:
          type: string
          description: The name of the tool
      - ataqv --version 2>&1 || true:
          type: eval
          description: The expression to obtain the version of the tool

  versions_mkarv:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mkarv:
          type: string
          description: The name of the tool
      - mkarv --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ataqv:
          type: string
          description: The name of the tool
      - ataqv --version 2>&1 || true:
          type: eval
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - mkarv:
          type: string
          description: The name of the tool
      - mkarv --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@bjlang"
maintainers:
  - "@bjlang"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/ataqv:1.3.1--13b9c1b1eb8ada3f
