name: "raxmlng_evaluate"
description: Optimise the branch lengths and model parameters of a fixed tree topology with RAxML-NG, without searching for a better topology
keywords:
  - phylogeny
  - newick
  - maximum likelihood
  - branch lengths
tools:
  - "raxmlng":
      description: RAxML-NG is a phylogenetic tree inference tool which uses maximum-likelihood (ML) optimality criterion.
      homepage: https://github.com/amkozlov/raxml-ng
      documentation: https://github.com/amkozlov/raxml-ng/wiki
      tool_dev_url: https://github.com/amkozlov/raxml-ng
      doi: 10.1093/bioinformatics/btz305
      licence:
        - "AGPL v3"
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
    - alignment:
        type: file
        description: A FASTA/PHYLIP format multiple sequence alignment file. Must not be compressed.
        pattern: "*.{fasta,fas,fa,mfa,phy}"
        ontologies: []
    - tree:
        type: file
        description: |
          The tree to evaluate in Newick format, not compressed.
          Its topology is kept, only branch lengths and model parameters are optimised.
          The output tree is unrooted, also if the input is rooted.
        pattern: "*.{nwk,newick,tree,treefile,bestTree}"
        ontologies: []
    - model:
        type: string
        description: |
          The substitution model, e.g. "GTR+G". Only the model string is accepted, so for the
          model file of `raxmlng/moose` or of a previous run (`GTR+FO+G4m{...}, noname = 1-1478`)
          pass the text before the first comma. A model selection keyword such as "DNA" is accepted
          by RAxML-NG too, but runs the whole model selection on the given tree, which is slow;
          use `raxmlng/moose` for that.
output:
  phylogeny:
    - - meta:
          type: map
          description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
      - "*.raxml.bestTree":
          type: file
          description: The input tree with optimised branch lengths, in Newick format
          pattern: "*.raxml.bestTree"
          ontologies: []
  best_model:
    - - meta:
          type: map
          description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
      - "*.raxml.bestModel":
          type: file
          description: RAxML-NG model file with the optimised model parameters
          pattern: "*.raxml.bestModel"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
      - "*.raxml.log":
          type: file
          description: RAxML-NG's run log, including the final log-likelihood
          pattern: "*.raxml.log"
          ontologies: []
  versions_raxmlng:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"

