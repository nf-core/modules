name: raxmlng
description: RAxML-NG is a phylogenetic tree inference tool which uses maximum-likelihood (ML) optimality criterion.
keywords:
  - phylogeny
  - newick
  - maximum likelihood
tools:
  - raxmlng:
      description: RAxML-NG is a phylogenetic tree inference tool which uses maximum-likelihood (ML) optimality criterion.
      homepage: https://github.com/amkozlov/raxml-ng
      documentation: https://github.com/amkozlov/raxml-ng/wiki
      tool_dev_url: https://github.com/amkozlov/raxml-ng
      doi: 10.1093/bioinformatics/btz305
      license:
        - "GPL v2-or-later"
      identifier: ""
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
    - alignment:
        type: file
        description: A FASTA format multiple sequence alignment file
        pattern: "*.{fasta,fas,fa,mfa}"
        ontologies: []
    - model:
        type: string
        description: The substitution model to use for the phylogenetic inference

output:
  phylogeny:
    - - meta:
          type: map
          description: Groovy Map containing sample information
          pattern: "*.{raxml.bestTree}"
      - "*.raxml.bestTree":
          type: file
          description: A phylogeny in Newick format
          pattern: "*.{raxml.bestTree}"
          ontologies: []
  phylogeny_bootstrapped:
    - - meta:
          type: map
          description: Groovy Map containing sample information
          pattern: "*.{raxml.bestTree}"
      - "*.raxml.bootstraps":
          type: file
          description: A phylogeny in Newick format with bootstrap values
          pattern: "*.{raxml.bootstraps}"
          optional: true
          ontologies: []
  versions_raxmlng:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@avantonder"
  - "@aunderwo"
maintainers:
  - "@avantonder"
  - "@aunderwo"
