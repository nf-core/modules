name: "raxmlng_moose"
description: Select a substitution model for an alignment with RAxML-NG's integrated model selection (MOOSE), without searching a tree
keywords:
  - phylogeny
  - model selection
  - maximum likelihood
tools:
  - "raxmlng":
      description: RAxML-NG is a phylogenetic tree inference tool which uses maximum-likelihood (ML) optimality criterion.
      homepage: https://github.com/amkozlov/raxml-ng
      documentation: https://github.com/amkozlov/raxml-ng/wiki
      tool_dev_url: https://github.com/amkozlov/raxml-ng
      doi: 10.1093/bioinformatics/btz305
      licence:
        - "AGPL v3"
      identifier: ""

input:
  - - meta:
        type: map
        description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
    - alignment:
        type: file
        description: A FASTA/PHYLIP format multiple sequence alignment file. Must not be compressed.
        pattern: "*.{fasta,fas,fa,mfa,phy}"
        ontologies: []
    - data_type:
        type: string
        description: The data type of the alignment, as RAxML-NG's `--data-type` takes it
        enum:
          - DNA
          - AA
          - BIN
output:
  best_model:
    - - meta:
          type: map
          description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
      - "*.raxml.moose.bestModel":
          type: file
          description: |
            The selected model as a model string without fitted parameter values,
            followed by RAxML-NG's partition name and site range, e.g. `GTR+FO+R10, noname = 1-1478`.
            The text before the first comma is accepted by `raxml-ng --model`.
          pattern: "*.raxml.moose.bestModel"
          ontologies: []
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information (e.g. [ id:'sample1' ])
      - "*.raxml.log":
          type: file
          description: RAxML-NG's run log, including the models evaluated
          pattern: "*.raxml.log"
          ontologies: []
  versions_raxmlng:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - raxmlng:
          type: string
          description: The name of the tool
      - raxml-ng --version 2>&1 | sed '/RAxML-NG v/!d;s/.*v. //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"

