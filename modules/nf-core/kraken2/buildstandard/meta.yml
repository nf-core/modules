name: "kraken2_buildstandard"
description: Downloads and builds Kraken2 standard database
keywords:
  - metagenomics
  - db
  - classification
  - build
  - kraken2
  - standard
  - download
tools:
  - kraken2:
      description: "Kraken2 is a system for assigning taxonomic labels to short DNA sequences, usually obtained through metagenomic studies."
      homepage: https://ccb.jhu.edu/software/kraken2/
      documentation: https://github.com/DerrickWood/kraken2/wiki/Manual
      tool_dev_url: "https://github.com/DerrickWood/kraken2"
      doi: 10.1186/s13059-019-1891-0
      publication:
        author: "Wood D.E., Lu J. & Langmead B."
        year: 2019
        title: "Improved metagenomic analysis with Kraken 2"
        source: "Genome Biology"
      licence:
        - "MIT"
      args_id: "$args"
      identifier: biotools:kraken2
input:
  - cleaning:
      type: boolean
      description: activate or deactivate (true or false) cleaning of intermediate files
output:
  db:
    - ${prefix}:
        type: directory
        description: Directory containing the Kraken2 'standard' database that can be used to perform taxonomic classification
        pattern: "*/"
        ontologies:
          - edam: http://edamontology.org/data_1049 # Directory
  versions_kraken2:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kraken2:
          type: string
          description: The name of the tool
      - kraken2 --version 2>&1 | head -1 | sed "s/^.*Kraken version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kraken2:
          type: string
          description: The name of the tool
      - kraken2 --version 2>&1 | head -1 | sed "s/^.*Kraken version //; s/ .*//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@egreenberg7"
maintainers:
  - "@egreenberg7"
