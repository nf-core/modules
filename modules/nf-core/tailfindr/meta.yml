name: "tailfindr"
description: Estimating poly(A)-tail lengths from basecalled fast5 files produced by Nanopore sequencing of RNA and DNA
keywords:
  - polya tail
  - fast5
  - nanopore
tools:
  - "tailfindr":
      description: "An R package for estimating poly(A)-tail lengths in Oxford Nanopore RNA and DNA reads."
      homepage: "https://github.com/adnaniazi/tailfindr"
      documentation: "https://github.com/adnaniazi/tailfindr/blob/master/README.md"
      tool_dev_url: "https://github.com/adnaniazi/tailfindr"
      doi: "10.1261/rna.071332.119"
      licence:
        - "AGPL v3"
      identifier: biotools:tailfindr
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - fast5:
        type: file
        description: fast5 file
        pattern: "*.fast5"
        ontologies: []
output:
  csv_gz:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.csv.gz":
          type: file
          description: Compressed csv file
          pattern: "*.csv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  versions_tailfindr:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tailfindr:
          type: string
          description: The name of the tool
      - Rscript -e "cat(paste(packageVersion('tailfindr'), collapse='.'))":
          type: eval
          description: The expression to obtain the version of the tool
  versions_ont_fast5_api:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ont-fast5-api:
          type: string
          description: The name of the tool
      - python -c "import ont_fast5_api; print(ont_fast5_api.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tailfindr:
          type: string
          description: The name of the tool
      - Rscript -e "cat(paste(packageVersion('tailfindr'), collapse='.'))":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - ont-fast5-api:
          type: string
          description: The name of the tool
      - python -c "import ont_fast5_api; print(ont_fast5_api.__version__)":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@lucacozzuto"
maintainers:
  - "@lucacozzuto"
