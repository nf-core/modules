name: "bismark_coverage2cytosine"
description: Relates methylation calls back to genomic cytosine contexts.
keywords:
  - bismark
  - consensus
  - map
  - methylation
  - 5mC
  - methylseq
  - bisulphite
  - bisulfite
  - bam
  - bedGraph
tools:
  - bismark:
      description: |
        Bismark is a tool to map bisulfite treated sequencing reads
        and perform methylation calling in a quick and easy-to-use fashion.
      homepage: https://github.com/FelixKrueger/Bismark
      documentation: https://github.com/FelixKrueger/Bismark/tree/master/docs
      doi: 10.1093/bioinformatics/btr167
      licence:
        - "GPL-3.0-or-later"
      identifier: biotools:bismark
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - coverage_file:
        type: file
        description: |
          A file containing methylation calls per position, in the format produced by bismark_methylation_extractor.
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: |
          Reference genome FASTA file
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - index:
        type: directory
        description: Bismark genome index directory
        pattern: "BismarkIndex"
output:
  coverage:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.cov.gz":
          type: file
          description: A file containing methylation calls per position.
          pattern: "*.cov.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*report.txt.gz":
          type: file
          description: Genomic cytosine context results.
          pattern: "*report.txt.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*cytosine_context_summary.txt":
          type: file
          description: Cyotosine context summary report.
          pattern: "*cytosine_context_summary.txt"
          ontologies: []
  versions_bismark:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bismark:
          type: string
          description: The name of the tool
      - "bismark --version 2>&1 | grep -Eo '[0-9]+\\.[0-9]+\\.[0-9]+'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bismark:
          type: string
          description: The name of the tool
      - "bismark --version 2>&1 | grep -Eo '[0-9]+\\.[0-9]+\\.[0-9]+'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ewels"
maintainers:
  - "@ewels"
  - "@sateeshperi"
