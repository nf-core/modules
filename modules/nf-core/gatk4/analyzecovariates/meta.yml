name: "gatk4_analyzecovariates"
description: Evaluate and compare base quality score recalibration (BQSR) tables
keywords:
  - bqsr
  - gatk4
  - genomics
tools:
  - gatk4:
      description: |
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - before_table:
        type: file
        description: Base quality score recalibration (BQSR) table before recalibration
        pattern: "*.table"
        ontologies: []
    - after_table:
        type: file
        description: Base quality score recalibration (BQSR) table after recalibration
        pattern: "*.table"
        ontologies: []
    - additional_table:
        type: file
        description: An additional base quality score recalibration (BQSR) table to be included in the comparison (optional)
        pattern: "*.table"
        ontologies: []
output:
  plots:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "*.pdf":
          type: file
          description: PDF file containing the plots generated by AnalyzeCovariates
          pattern: "*.pdf"
          ontologies:
            - edam: "http://edamontology.org/format_3508" # PDF
  data:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "*.csv":
          type: file
          description: CSV file containing the data generated by AnalyzeCovariates
          pattern: "*.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@thomasisensee"
maintainers:
  - "@thomasisensee"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gatk4-lite_r-base_r-ggplot2_r-gplots_r-gsalib:c2ff597f2b22489d
      build_id: bd-c2ff597f2b22489d_1
      scan_id: sc-7708d2534a8102a5_2
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gatk4-lite_r-base_r-ggplot2_r-gplots_r-gsalib:197223e88fceb392
      build_id: bd-197223e88fceb392_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/99/995b2a710d77be89a04150c6d0e8303236da166648a37e072d5f5e0ca2eca593/data
  conda:
    linux/amd64:
      lock_file: modules/nf-core/gatk4/analyzecovariates/.conda-lock/linux_amd64-bd-c2ff597f2b22489d_1.txt
