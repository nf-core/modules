name: gatk4_calibratedragstrmodel
description: estimates the parameters for the DRAGstr model
keywords:
  - gatk4
  - bam
  - cram
  - sam
  - calibratedragstrmodel
tools:
  - gatk4:
      description: Genome Analysis Toolkit (GATK4). Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools with a primary focus on variant discovery and genotyping. Its powerful processing engine and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/articles/360057441571-CalibrateDragstrModel-BETA-
      tool_dev_url: https://github.com/broadinstitute/gatk
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["Apache-2.0"]
      identifier: ""
input:
  # Only when we have meta
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - bam_index:
        type: file
        description: index of the BAM/CRAM/SAM file
        pattern: "*.{bai,crai,sai}"
        ontologies: []
  - fasta:
      type: file
      description: The reference FASTA file
      pattern: "*.{fasta,fa}"
      ontologies: []
  - fasta_fai:
      type: file
      description: The index of the reference FASTA file
      pattern: "*.fai"
      ontologies: []
  - dict:
      type: file
      description: The sequence dictionary of the reference FASTA file
      pattern: "*.dict"
      ontologies: []
  - strtablefile:
      type: file
      description: The StrTableFile zip folder of the reference FASTA file
      pattern: "*.zip"
      ontologies:
        - edam: http://edamontology.org/format_3987 # ZIP format
output:
  #Only when we have meta
  dragstr_model:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: The DragSTR model
          pattern: "*.txt"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gatk4-lite:4.7.0.0--79918b8b2632f4b1
      build_id: bd-79918b8b2632f4b1_1
      scan_id: sc-3494a4d719069a23_2
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gatk4-lite:4.7.0.0--f28eb03ad3b2bcd5
      build_id: bd-f28eb03ad3b2bcd5_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/ce/ce8f4142326abbb74e28b97633a200b09439c54480803343b1cf13dc19e51ae5/data
  conda:
