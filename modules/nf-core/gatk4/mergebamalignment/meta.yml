name: gatk4_mergebamalignment
description: Merge unmapped with mapped BAM files
keywords:
  - alignment
  - bam
  - gatk4
  - merge
  - mergebamalignment
tools:
  - gatk4:
      description: |
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test']
    - aligned:
        type: file
        description: The aligned bam file
        pattern: "*.{bam}"
        ontologies: []
    - unmapped:
        type: file
        description: The unmapped bam file
        pattern: "*.{bam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: The reference fasta file
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - dict:
        type: file
        description: GATK sequence dictionary
        ontologies: []
output:
  bam:
    - - meta:
          type: file
          description: The merged bam file
          pattern: "*.bam"
          ontologies: []
      - "*.bam":
          type: file
          description: The merged bam file
          pattern: "*.bam"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@kevinmenden"
  - "@ramprasadn"
maintainers:
  - "@kevinmenden"
  - "@ramprasadn"
