name: "gatk4_preprocessintervals"
description: Prepares bins for coverage collection.
keywords:
  - bed
  - gatk4
  - interval
  - preprocessintervals
tools:
  - "gatk4":
      description: Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools with a primary focus on variant discovery and genotyping. Its powerful processing engine and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: "10.1158/1538-7445.AM2017-3590"
      licence:
        - "Apache-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: The reference fasta file
        pattern: "*.fasta"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - fai:
        type: file
        description: Index of reference fasta file
        pattern: "*.fasta.fai"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - dict:
        type: file
        description: GATK sequence dictionary
        pattern: "*.dict"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - intervals:
        type: file
        description: Interval file (bed or interval_list) with the genomic regions to be included from the analysis (optional)
        pattern: "*.{bed,interval_list}"
        ontologies: []
  - - meta5:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - exclude_intervals:
        type: file
        description: Interval file (bed or interval_list) with the genomic regions to be excluded from the analysis (optional)
        pattern: "*.{bed,interval_list}"
        ontologies: []
output:
  interval_list:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information
            e.g. [ id:'test' ]
      - ${prefix}.interval_list:
          type: file
          description: Processed interval list file
          pattern: "*.interval_list"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ryanjameskennedy"
  - "@ViktorHy"
  - "@ramprasadn"
maintainers:
  - "@ryanjameskennedy"
  - "@ViktorHy"
  - "@ramprasadn"
containers:
