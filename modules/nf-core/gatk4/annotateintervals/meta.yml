name: "gatk4_annotateintervals"
description: Annotates intervals with GC content, mappability, and segmental-duplication content
keywords:
  - annotateintervals
  - annotation
  - bed
  - gatk4
  - intervals
tools:
  - gatk4:
      description: |
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - intervals:
        type: file
        description: One or more interval files to annotate
        pattern: "*.{interval_list,list,bed}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: The reference FASTA file
        pattern: "*.{fasta,fa}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - fasta_fai:
        type: file
        description: The index of the reference FASTA file
        pattern: "*.fai"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - dict:
        type: file
        description: The sequence dictionary reference FASTA file
        pattern: "*.dict"
        ontologies: []
  - - meta5:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - mappable_regions:
        type: file
        description: |
          Optional - Umap single-read mappability track
          The track should correspond to the appropriate read length and overlapping intervals must be merged
        pattern: "*.bed(.gz)?"
        ontologies: []
  - - meta6:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - mappable_regions_tbi:
        type: file
        description: Optional - The index of the gzipped umap single-read mappability track
        pattern: "*.bed.gz.tbi"
        ontologies: []
  - - meta7:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - segmental_duplication_regions:
        type: file
        description: Optional - Segmental-duplication track
        pattern: "*.bed(.gz)?"
        ontologies: []
  - - meta8:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - segmental_duplication_regions_tbi:
        type: file
        description: Optional - The index of the gzipped segmental-duplication track
        pattern: "*.bed.gz.tbi"
        ontologies: []
output:
  annotated_intervals:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.tsv":
          type: file
          description: The output TSV file with a SAM-style header containing the annotated intervals
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
containers:
