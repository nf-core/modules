name: "gatk4_svannotate"
description: Adds predicted functional consequence, gene overlap, and noncoding element overlap annotations to SV VCF from GATK-SV pipeline. Input files are an SV VCF, a GTF file containing primary or canonical transcripts, and a BED file containing noncoding elements. Output file is an annotated SV VCF.
keywords:
  - annotate
  - gatk4
  - structural variants
  - svannotate
  - vcf
tools:
  - gatk4:
      description: Genome Analysis Toolkit (GATK4)
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      tool_dev_url: https://github.com/broadinstitute/gatk
      doi: "10.1158/1538-7445.AM2017-3590"
      licence: ["BSD-3-clause"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: A VCF file created with a structural variant caller
        pattern: "*.vcf.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
    - tbi:
        type: file
        description: The index file of the VCF
        pattern: "*.vcf.gz.tbi"
        ontologies: []
    - bed:
        type: file
        description: Regions to limit the analysis to
        pattern: "*.bed"
        ontologies: []
    - non_coding_bed:
        type: file
        description: File containing noncoding regions
        pattern: "*.bed"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing FASTA information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Optional - reference FASTA file needed when the input is a CRAM file
        pattern: "*.{fasta,fa}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing FAI information
          e.g. [ id:'test', single_end:false ]
    - fasta_fai:
        type: file
        description: Optional - index of the reference FASTA file needed when the input is a CRAM file
        pattern: "*.fai"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing DICT information
          e.g. [ id:'test', single_end:false ]
    - dict:
        type: file
        description: Optional - sequence dictionary of the reference FASTA file needed when the input is a CRAM file
        pattern: "*.dict"
        ontologies: []
  - - meta5:
        type: map
        description: |
          Groovy Map containing GTF information
          e.g. [ id:'test', single_end:false ]
    - gtf:
        type: file
        description: Optional - GTF file containing transcript information
        pattern: "*.gtf"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz":
          type: file
          description: The annotated structural variant VCF
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz.tbi":
          type: file
          description: The index of the VCF
          pattern: "*.vcf.gz.tbi"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@nvnieuwk"
maintainers:
