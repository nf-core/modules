name: gatk4_intervallisttools
description: Splits the interval list file into unique, equally-sized interval files and place it under a directory
keywords:
  - bed
  - gatk4
  - interval_list
  - sort
tools:
  - gatk4:
      description: |
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - intervals:
        type: file
        description: Interval file
        ontologies: []
output:
  interval_list:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*_split/*/*.interval_list":
          type: file
          description: Interval list files
          pattern: "*.interval_list"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@praveenraj2018"
maintainers:
  - "@praveenraj2018"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gatk4-lite_python:fb04467550379e2f
      build_id: bd-fb04467550379e2f_1
      scan_id: sc-3507f10debf20a56_2
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gatk4-lite_python:18a7e10410f573fe
