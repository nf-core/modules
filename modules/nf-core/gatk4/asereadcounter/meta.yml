name: "gatk4_asereadcounter"
description: Calculates the allele-specific read counts for allele-specific expression analysis of RNAseq data
keywords:
  - allele-specific
  - asereadcounter
  - gatk4
  - vcf
tools:
  - "gatk4":
      description: |
        Developed in the Data Sciences Platform at the Broad Institute, the toolkit offers a wide variety of tools
        with a primary focus on variant discovery and genotyping. Its powerful processing engine
        and high-performance computing features make it capable of taking on projects of any size.
      homepage: https://gatk.broadinstitute.org/hc/en-us
      documentation: https://gatk.broadinstitute.org/hc/en-us/categories/360002369672s
      doi: 10.1158/1538-7445.AM2017-3590
      licence: ["Apache-2.0"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM file
        pattern: "*.{bam}"
        ontologies: []
    - bai:
        type: file
        description: index file for BAM file
        pattern: "*.{bai}"
        ontologies: []
    - vcf:
        type: file
        description: VCF file
        pattern: "*.{vcf.gz}"
        ontologies: []
    - tbi:
        type: file
        description: index file for VCF file
        pattern: "*.{vcf.gz.tbi}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference' ]`
    - fasta:
        type: file
        description: fasta file
        pattern: "*.{fasta,fa}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference' ]`
    - fai:
        type: file
        description: fasta index file
        pattern: "*.{fai}"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference' ]`
    - dict:
        type: file
        description: dictionary file
        pattern: "*.{dict}"
        ontologies: []
  - intervals:
      type: file
      description: interval file
      ontologies: []
output:
  csv:
    - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Lucpen"
maintainers:
  - "@Lucpen"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gatk4-lite:4.7.0.0--79918b8b2632f4b1
      build_id: bd-79918b8b2632f4b1_1
      scan_id: sc-3494a4d719069a23_2
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gatk4-lite:4.7.0.0--f28eb03ad3b2bcd5
      build_id: bd-f28eb03ad3b2bcd5_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/ce/ce8f4142326abbb74e28b97633a200b09439c54480803343b1cf13dc19e51ae5/data
  conda:
