name: "gatk4_condensedepthevidence"
description: Merges adjacent DepthEvidence records
keywords:
  - condensedepthevidence
  - evidence
  - gatk4
tools:
  - "gatk4":
      description: "Genome Analysis Toolkit (GATK4)"
      homepage: "https://gatk.broadinstitute.org/hc/en-us"
      tool_dev_url: "https://github.com/broadinstitute/gatk"
      doi: "10.1158/1538-7445.AM2017-3590"
      licence: ["BSD-3-clause"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - depth_evidence:
        type: file
        description: The depth evidence file
        pattern: "*.rd.txt.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
    - depth_evidence_index:
        type: file
        description: The index of the depth evidence file
        pattern: "*.rd.txt.gz.tbi"
        ontologies: []
  - fasta:
      type: file
      description: Reference FASTA file needed when the input is a CRAM file
      pattern: "*.{fasta,fa}"
      ontologies: []
  - fasta_fai:
      type: file
      description: Index of the reference FASTA file needed when the input is a CRAM file
      pattern: "*.fai"
      ontologies: []
  - dict:
      type: file
      description: Sequence dictionary of the reference FASTA file needed when the input is a CRAM file
      pattern: "*.dict"
      ontologies: []
output:
  condensed_evidence:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.rd.txt.gz":
          type: file
          description: The condensed depth evidence
          pattern: "*.rd.txt.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  condensed_evidence_index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.rd.txt.gz.tbi":
          type: file
          description: The condensed depth evidence
          pattern: "*.rd.txt.gz.tbi"
          ontologies: []
  versions_gatk4:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gatk4:
          type: string
          description: The name of the tool
      - gatk --version | sed -n '/GATK.*v/s/.*v//p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/gatk4-lite:4.7.0.0--79918b8b2632f4b1
      build_id: bd-79918b8b2632f4b1_1
      scan_id: sc-3494a4d719069a23_2
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/gatk4-lite:4.7.0.0--f28eb03ad3b2bcd5
      build_id: bd-f28eb03ad3b2bcd5_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/ce/ce8f4142326abbb74e28b97633a200b09439c54480803343b1cf13dc19e51ae5/data
  conda:
