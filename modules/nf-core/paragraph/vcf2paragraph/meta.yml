name: "paragraph_vcf2paragraph"
description: Convert a VCF file to a JSON graph
keywords:
  - vcf
  - json
  - structural_variants
tools:
  - "paragraph":
      description: "Graph realignment tools for structural variants"
      homepage: "https://github.com/Illumina/paragraph"
      documentation: "https://github.com/Illumina/paragraph"
      tool_dev_url: "https://github.com/Illumina/paragraph"
      doi: "10.1101/635011"
      licence:
        - "Apache License 2.0"
      identifier: biotools:Paragraph
  - bgzip:
      description: Block compression/decompression utility
      homepage: https://www.htslib.org/doc/bgzip.html
      documentation: https://www.htslib.org/doc/bgzip.html
      tool_dev_url: https://github.com/samtools/htslib
      doi: 10.1093/gigascience/giab007
      publication:
        author: "Bonfield, J. K., Marshall, J., Danecek, P., Li, H., Ohan, V., Whitwham, A., Keane, T. & Davies, R. M."
        year: 2021
        title: "HTSlib: C library for reading/writing high-throughput sequencing data"
        source: "GigaScience"
      licence: ["MIT"]
      identifier: biotools:htslib
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: The VCF/BCF file
        pattern: "*.{vcf,bcf}(.gz)?"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - fasta:
        type: file
        description: Reference genome VCF was generated against
        pattern: "*.{fasta,fna,fa}"
        ontologies: []
output:
  graph:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.json.gz":
          type: file
          description: The created graph in BGZIP format
          pattern: "*.json.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  versions_paragraph:
    - - ${task.process}:
          type: string
          description: The name of the process
      - paragraph:
          type: string
          description: The name of the tool
      - "2.3":
          type: string
          description: The expression to obtain the version of the tool
  versions_bgzip:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bgzip:
          type: string
          description: The name of the tool
      - "bgzip -h 2>&1 | tr '\n' ' ' | sed 's/^.*Version: //; s/ .*\\$//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - paragraph:
          type: string
          description: The name of the tool
      - "2.3":
          type: string
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - bgzip:
          type: string
          description: The name of the tool
      - "bgzip -h 2>&1 | tr '\n' ' ' | sed 's/^.*Version: //; s/ .*\\$//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
