name: "varnet_getref"
description: Downloads the GRCh38 germline filtering resources that VarNet needs for tumor-only
  calling, and checks their md5 sums. The outputs feed varnet/filter and varnet/predict.
keywords:
  - variant calling
  - somatic
  - tumor-only
  - reference
  - download
tools:
  - "varnet":
      description: "A deep learning-based somatic variant caller"
      homepage: "https://github.com/skandlab/VarNet"
      documentation: "https://github.com/skandlab/VarNet"
      tool_dev_url: "https://github.com/skandlab/VarNet"
      doi: "10.1038/s41467-022-31765-8"
      licence:
        - "PolyForm Noncommercial License 1.0.0"
      identifier: ""
input:
  - meta:
      type: map
      description: |
        Groovy Map naming the resources
        e.g. `[ id:'varnet_resources' ]`
output:
  dbsnp:
    - - meta:
          type: map
          description: |
            Groovy Map naming the resources
            e.g. `[ id:'varnet_resources' ]`
      - ${prefix}/GrCh38-dbSNP-build-156-common-variants-0-indexed-CHROMPOS.npz:
          type: file
          description: Common dbSNP build 156 variant sites for germline filtering, as a NumPy archive
          pattern: "GrCh38-dbSNP-build-156-common-variants-0-indexed-CHROMPOS.npz"
          ontologies: []
  gnomad:
    - - meta:
          type: map
          description: |
            Groovy Map naming the resources
            e.g. `[ id:'varnet_resources' ]`
      - ${prefix}/combined_gnomAD_v4.1_genomes_exomes_dict.hg38.chunks.npz:
          type: file
          description: gnomAD v4.1 genome and exome variants for germline filtering, as a NumPy
            archive
          pattern: "combined_gnomAD_v4.1_genomes_exomes_dict.hg38.chunks.npz"
          ontologies: []
  pon:
    - - meta:
          type: map
          description: |
            Groovy Map naming the resources
            e.g. `[ id:'varnet_resources' ]`
      - ${prefix}/1000g_pon.hg38.vcf.gz:
          type: file
          description: 1000 Genomes panel of normals
          pattern: "1000g_pon.hg38.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3016 # VCF
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_varnet:
    - - ${task.process}:
          type: string
          description: The name of the process
      - varnet:
          type: string
          description: The name of the tool
      - "varnet-filter --version | sed 's/VarNet //'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - varnet:
          type: string
          description: The name of the tool
      - "varnet-filter --version | sed 's/VarNet //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@kiranchari"
maintainers:
  - "@kiranchari"
