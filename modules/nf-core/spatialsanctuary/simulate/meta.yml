name: "spatialsanctuary_simulate"
description: "Simulate biophysical reaction-diffusion concentration profiles and pharmacological sanctuary shell geometry in avascular tumor cords."
keywords:
  - oncology
  - biophysics
  - reaction-diffusion
  - osimertinib
  - sanctuary
  - pharmacology
tools:
  - "spatial-sanctuary":
      description: "Biophysical reaction-diffusion transport solver and evolutionary sanctuary dynamics in EGFR-mutant lung adenocarcinoma."
      homepage: "https://github.com/Lukecele/spatial-oncology-master"
      documentation: "https://github.com/Lukecele/spatial-oncology-master#readme"
      tool_dev_url: "https://github.com/Lukecele/spatial-oncology-master"
      doi: "10.5281/zenodo.23623653"
      licence:
        - "GPL-3.0-or-later"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - modality:
        type: string
        description: Therapeutic modality ('tki' for small molecule or 'adc' for antibody-drug conjugate)
    - c0:
        type: float
        description: Boundary unbound drug concentration in nM (e.g. 40.0)
    - theta:
        type: float
        description: Subclonal eradication threshold fraction C/C0 (e.g. 0.35 for IC50 threshold)
    - r_ox:
        type: float
        description: Krogh cylinder oxygen viability limit radius in micrometers (e.g. 200.0)

output:
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*_sanctuary.json":
          type: file
          description: Simulated biophysical transport and sanctuary geometry profile in JSON format
          pattern: "*_sanctuary.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
  versions_spatialsanctuary:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spatial-sanctuary":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-sanctuary''))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - spatial-sanctuary:
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''spatial-sanctuary''))"':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Lukecele"
maintainers:
  - "@Lukecele"
