      name: oras://community.wave.seqera.io/library/bigscape:2.0.3--aed310da2cd1ca1d
      build_id: bd-aed310da2cd1ca1d_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/ac/acb20daff43670baa2f5599e97ef0d96f3eeeaaaeb31e7dfa7a23066c908b44a/data
