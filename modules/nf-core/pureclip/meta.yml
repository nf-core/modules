name: "pureclip"
description: PureCLIP is a tool to detect protein-RNA interaction footprints from single-nucleotide CLIP-seq data, such as iCLIP and eCLIP.
keywords:
  - iCLIP
  - eCLIP
  - CLIP
tools:
  - "pureclip":
      description: "PureCLIP is a tool to detect protein-RNA interaction footprints from single-nucleotide CLIP-seq data, such as iCLIP and eCLIP."
      homepage: "https://github.com/skrakau/PureCLIP"
      documentation: "https://pureclip.readthedocs.io/en/latest/GettingStarted/index.html"
      tool_dev_url: "https://github.com/skrakau/PureCLIP"
      doi: "10.1186/s13059-017-1364-2"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - ipbam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - controlbam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - ipbai:
        type: file
        description: BAM index
        pattern: "*.{bai}"
        ontologies: []
    - controlbai:
        type: file
        description: BAM index
        pattern: "*.{bai}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information.
          e.g. [ id:'test', single_end:false ]
    - genome_fasta:
        type: file
        description: FASTA file of reference genome
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
        ontologies: []
  - input_control:
      type: boolean
      description: Whether to run PureCLIP with an input control
output:
  crosslinks:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}_pureclip_crosslinks.bed:
          type: file
          description: Bed file of crosslinks
          pattern: "*.{bed}"
          ontologies: []
  peaks:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}_pureclip_peaks.bed:
          type: file
          description: Bed file of peaks
          pattern: "*.{bed}"
          ontologies: []
  versions_pureclip:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pureclip:
          type: string
          description: The name of the tool
      - "pureclip --version 2>&1 | sed -n 's/^.*pureclip version: //p'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pureclip:
          type: string
          description: The name of the tool
      - "pureclip --version 2>&1 | sed -n 's/^.*pureclip version: //p'":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@charlotteanne"
  - "@marcjones"
maintainers:
  - "@charlotteanne"
  - "@marcjones"
