name: "hmmer_hmmfetch"
description: extract hmm from hmm database file or create index for hmm database
keywords:
  - hidden Markov model
  - HMM
  - hmmer
  - hmmfetch
tools:
  - "hmmer":
      description: "Biosequence analysis using profile hidden Markov models"
      homepage: http://hmmer.org/
      documentation: http://hmmer.org/documentation.html
      tool_dev_url: https://github.com/EddyRivasLab/hmmer
      doi: "10.1371/journal.pcbi.1002195"
      licence:
        - "BSD"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - hmm:
        type: file
        description: HMM file with multiple HMM models
        pattern: "*.hmm"
        ontologies: []
  - key:
      type: string
      description: Name of HMM to extract. Specify either this or keyfile. If none is specified, an index will be built.
  - keyfile:
      type: file
      description: File containing list of HMM models to extract. Specify either this or key. If none is specified, an index will be built.
      pattern: "*.txt"
      ontologies:
        - edam: http://edamontology.org/format_2330 # Textual format
  - index:
      type: file
      description: Index file from another run.
      ontologies: []
output:
  hmm:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.hmm":
          type: file
          description: File with one or more HMM models
          pattern: "selection.hmm"
          ontologies: []
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.ssi":
          type: file
          description: Index for HMM database. Created if neither key nor keyfile is specified.
          pattern: "*.ssi"
          ontologies: []
  versions_hmmer:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmmer:
          type: string
          description: The name of the tool
      - hmmsearch -h | sed '2!d;s/^# HMMER *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmmer:
          type: string
          description: The name of the tool
      - hmmsearch -h | sed '2!d;s/^# HMMER *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
