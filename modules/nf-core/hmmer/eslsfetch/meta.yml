name: "hmmer_eslsfetch"
description: |
  Retrieves one or more complete sequences or subsequences from a sequence
  file. The esl-sfetch utility is an Easel miniapp bundled with the HMMER
  package. Unless an existing SSI index is supplied, the module first
  indexes the (uncompressed) sequence file (esl-sfetch --index), producing
  an SSI index; if an index is supplied, indexing is skipped and the index
  is passed through unchanged. If a keyfile is also given, it is used to
  fetch the named sequences (-f), or, with ext.args = '-C', parsed as a
  subsequence coordinate file (-Cf) to extract and rename subsequences
  (giving from > to yields the reverse complement).
keywords:
  - hmmer
  - easel
  - sequence retrieval
  - subsequence extraction
  - indexing
  - fasta
tools:
  - "hmmer":
      description: |
        Biosequence analysis using profile hidden Markov models. The
        esl-sfetch utility is an Easel miniapp bundled with the HMMER
        package, used to index a sequence file and retrieve sequences or
        subsequences from it.
      homepage: "http://hmmer.org/"
      documentation: "http://eddylab.org/software/hmmer/Userguide.pdf"
      tool_dev_url: "https://github.com/EddyRivasLab/hmmer"
      doi: "10.1371/journal.pcbi.1002195"
      licence:
        - "BSD-3-Clause"
      identifier: "biotools:hmmer"
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - seqfile:
        type: file
        description: |
          Sequence file, in any format supported by esl-sfetch (fasta, embl,
          genbank, stockholm, a2m, afa, psiblast, clustal, phylip). Must NOT
          be gzip-compressed: esl-sfetch --index cannot index a .gz file.
          Mandatory.
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_1927 # EMBL format
          - edam: http://edamontology.org/format_1936 # GenBank format
          - edam: http://edamontology.org/format_1961 # Stockholm format
          - edam: http://edamontology.org/format_1982 # ClustalW format
          - edam: http://edamontology.org/format_1997 # Phylip format
          - edam: http://edamontology.org/format_1984 # FASTA-aln (a2m/afa)
          - edam: http://edamontology.org/format_2554 # Alignment format (text) — covers PSI-BLAST and other Easel-readable formats without a dedicated EDAM term
    - keyfile:
        type: file
        description: |
          Optional (pass [] to skip): plain-text list of sequence
          names/accessions to retrieve, one name/accession per line (first
          whitespace-delimited field; blank lines and lines starting with
          '#' are ignored), used with -f for multi-sequence retrieval. With
          ext.args = '-C' (i.e. -Cf), instead parsed as a subsequence
          coordinate file for -Cf retrieval: four whitespace-delimited
          fields per line, new_name from to name/accession.
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_3671 # Plain text
    - ssi:
        type: file
        description: |
          Optional (pass [] to build a fresh index): pre-built SSI index of
          seqfile, as produced by esl-sfetch --index. If supplied, the
          indexing step is skipped and this file is reused as-is, then
          re-emitted unchanged through the `ssi` output.
        pattern: "*.ssi"
        ontologies: []
output:
  ssi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "*.ssi":
          type: file
          description: |
            SSI index of the sequence file. Freshly built by esl-sfetch
            --index when no ssi input is supplied, otherwise the supplied
            ssi passed through unchanged. Always produced.
          pattern: "*.ssi"
          ontologies: []
  sequences:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}.fasta:
          type: file
          description: |
            Retrieved sequences or subsequences in FASTA format. Optional:
            only produced when a keyfile is supplied.
          pattern: "*.fasta"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  versions_hmmer:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmmer:
          type: string
          description: The name of the tool
      - hmmsearch -h | sed '2!d;s/^# HMMER *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_easel:
    - - ${task.process}:
          type: string
          description: The name of the process
      - easel:
          type: string
          description: The name of the tool
      - esl-sfetch -h | sed '2!d;s/^# Easel *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmmer:
          type: string
          description: The name of the tool
      - hmmsearch -h | sed '2!d;s/^# HMMER *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - easel:
          type: string
          description: The name of the tool
      - esl-sfetch -h | sed '2!d;s/^# Easel *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
