name: "hmmer_eslsfetchindex"
description: |
  Builds an SSI (sequence/subsequence index) file for a sequence file,
  using the esl-sfetch utility, an Easel miniapp bundled with the HMMER
  package (esl-sfetch --index). The resulting index lets esl-sfetch
  retrieve sequences from the file in constant time. This module is the
  indexing half of a pair: hmmer/eslsfetchindex builds the SSI index,
  hmmer/eslsfetch consumes it (or an equivalent one) to fetch sequences
  or subsequences.
keywords:
  - hmmer
  - easel
  - indexing
  - sequence retrieval
  - ssi index
  - fasta
tools:
  - "hmmer":
      description: |
        Biosequence analysis using profile hidden Markov models. The
        esl-sfetch utility is an Easel miniapp bundled with the HMMER
        package, used here to build an SSI index of a sequence file.
      homepage: "http://hmmer.org/"
      documentation: "http://eddylab.org/software/hmmer/Userguide.pdf"
      tool_dev_url: "https://github.com/EddyRivasLab/hmmer"
      doi: "10.1371/journal.pcbi.1002195"
      licence:
        - "BSD-3-Clause"
      identifier: "biotools:hmmer"
  - "coreutils":
      description: "GNU utilities for basic file, shell, and text manipulation, including sort."
      homepage: "https://www.gnu.org/software/coreutils/"
      documentation: "https://www.gnu.org/software/coreutils/manual/"
      tool_dev_url: "https://git.savannah.gnu.org/cgit/coreutils.git"
      licence:
        - "GPL v3-or-later"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - seqfile:
        type: file
        description: |
          Sequence file, in any format supported by esl-sfetch (fasta, embl,
          genbank, stockholm, a2m, afa, psiblast, clustal, phylip). Must NOT
          be gzip-compressed: esl-sfetch --index cannot index a .gz file.
          Very large indexing jobs may need substantial temporary disk under
          `$TMPDIR` for GNU sort.
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_1927 # EMBL format
          - edam: http://edamontology.org/format_1936 # GenBank format
          - edam: http://edamontology.org/format_1961 # Stockholm format
          - edam: http://edamontology.org/format_1982 # ClustalW format
          - edam: http://edamontology.org/format_1997 # Phylip format
          - edam: http://edamontology.org/format_1984 # FASTA-aln (a2m/afa)
          - edam: http://edamontology.org/format_2554 # Alignment format (text) — covers PSI-BLAST and other Easel-readable formats without a dedicated EDAM term
output:
  ssi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${seqfile}.ssi:
          type: file
          description: |
            SSI index built by `esl-sfetch --index`. The filename is dictated
            by the tool: it is always the input seqfile's filename with
            `.ssi` appended (not a `${prefix}`-based name), so downstream
            consumers such as hmmer/eslsfetch see an index basename that
            still matches the seqfile after staging.
          pattern: "*.ssi"
          ontologies: []
  versions_hmmer:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmmer:
          type: string
          description: The name of the tool
      - hmmsearch -h | sed '2!d;s/^# HMMER *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_easel:
    - - ${task.process}:
          type: string
          description: The name of the process
      - easel:
          type: string
          description: The name of the tool
      - esl-sfetch -h | sed '2!d;s/^# Easel *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_coreutils:
    - - ${task.process}:
          type: string
          description: The name of the process
      - coreutils:
          type: string
          description: The name of the tool
      - sort --version |& sed '1!d ; s/sort (GNU coreutils) //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hmmer:
          type: string
          description: The name of the tool
      - hmmsearch -h | sed '2!d;s/^# HMMER *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - easel:
          type: string
          description: The name of the tool
      - esl-sfetch -h | sed '2!d;s/^# Easel *//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - coreutils:
          type: string
          description: The name of the tool
      - sort --version |& sed '1!d ; s/sort (GNU coreutils) //':
          type: eval
          description: The expression to obtain the version of the tool
