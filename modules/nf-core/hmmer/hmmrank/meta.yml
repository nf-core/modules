name: "hmmer_hmmrank"
description: |
  Ranks hmmer/hmmsearch hits by score/e-value and, optionally, attaches per-hit domain
  coordinates -- reading the already-parsed, already-typed Parquet table(s) hmmer/formattsv
  + duckdb/table2parquet produce, rather than parsing raw hmmsearch tblout/domtblout text
  itself. The ranking and domain-coordinate merge run as DuckDB SQL (window functions,
  disk-spillable temp tables) instead of in-memory R/dplyr, so memory use no longer scales
  with the full width of every input row held at once.
keywords:
  - hmmer
  - hmmsearch
  - rank
  - duckdb
tools:
  - "hmmer":
      description: "Biosequence analysis using profile hidden Markov models"
      homepage: http://hmmer.org/
      documentation: http://hmmer.org/documentation.html
      tool_dev_url: https://github.com/EddyRivasLab/hmmer
      doi: "10.1371/journal.pcbi.1002195"
      licence:
        - "BSD"
      identifier: ""
  - "duckdb":
      description: "An in-process SQL OLAP database management system"
      homepage: "https://duckdb.org"
      documentation: "https://duckdb.org/docs/"
      tool_dev_url: "https://github.com/duckdb/duckdb"
      licence:
        - "MIT"
      identifier: "biotools:duckdb"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - tblout:
        type: file
        description: |
          A single Parquet table combining every hmmsearch per-sequence hit table (--tblout)
          for this meta, as produced by hmmer/formattsv (format 'tblout') followed by
          duckdb/table2parquet -- one profile-labelled row per hit, columns already typed.
        pattern: "*.parquet"
        ontologies: []
    - domtblout:
        type: file
        description: |
          Optional single Parquet table combining every hmmsearch per-domain hit table
          (--domtblout) for this meta, as produced by hmmer/formattsv (format 'domtblout')
          followed by duckdb/table2parquet. When supplied ([] when not), the ranked table
          gains the target and profile lengths and, for each of the three coordinate sets,
          the outer bounds of the match, the size of the union of the pair's domains, and
          the number of separate stretches that union spans. Every domain hmmsearch reported
          is counted, whatever its own significance: a hit can clear the full-sequence
          threshold while each of its domains is weak in isolation, and dropping those would
          leave exactly such hits without coordinates. Domains are grouped by query name as
          well as by profile, so an HMM file holding several models searched in one go still
          yields one row per (sequence, model).
        pattern: "*.parquet"
        ontologies: []
output:
  hmmrank:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.hmmrank.tsv.gz":
          type: file
          description: |
            TSV file with ranked hmmer results: one row per (accno, profile, profile_desc)
            combination -- profile_desc holds the query name, i.e. the model, which one file
            may hold several of -- with profile, accno, profile_desc, evalue, score and rank.
            When domtblout is supplied it also carries tlen and qlen, plus from, to,
            len and n_islands for
            each of the hmm, ali and env coordinate sets. n_islands is 1 when the domains
            merge into a single continuous stretch and rises as they scatter; coordinates
            are inclusive, so domains that abut with no gap between them count as one.
            All fourteen are NA where a hit has no domain records behind it: hmmsearch
            reports a sequence on the per-sequence threshold, while a domain also has to
            clear the per-domain one, so the two tables need not agree on every hit.
          pattern: "*.hmmrank.tsv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_duckdb:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "duckdb":
          type: string
          description: The name of the tool
      - "duckdb --version | sed 's/^v//; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "duckdb":
          type: string
          description: The name of the tool
      - "duckdb --version | sed 's/^v//; s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool

