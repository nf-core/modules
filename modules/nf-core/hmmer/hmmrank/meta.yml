name: "hmmer_hmmrank"
description: R script that scores output from multiple runs of hmmer/hmmsearch
keywords:
  - hmmer
  - hmmsearch
  - rank
tools:
  - "hmmer":
      description: "Biosequence analysis using profile hidden Markov models"
      homepage: http://hmmer.org/
      documentation: http://hmmer.org/documentation.html
      tool_dev_url: https://github.com/EddyRivasLab/hmmer
      doi: "10.1371/journal.pcbi.1002195"
      licence:
        - "BSD"
      identifier: ""
  - "R":
      description: "A Language and Environment for Statistical Computing"
      homepage: https://www.r-project.org/
      documentation: https://www.r-project.org/
      licence:
        - "GPL v2"
      identifier: ""
  - "Tidyverse":
      description: "Tidyverse: R packages for data science"
      homepage: https://www.tidyverse.org/
      documentation: https://www.tidyverse.org/
      tool_dev_url: https://github.com/tidyverse
      doi: "10.21105/joss.01686"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - tblouts:
        type: file
        description: per-sequence hit tables from hmmsearch (--tblout)
        pattern: "*.tbl.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
    - domtblouts:
        type: file
        description: |
          Optional per-domain hit tables from hmmsearch (--domtblout). When supplied, the
          ranked table gains the target and profile lengths and, for each of the three
          coordinate sets, the outer bounds of the match, the size of the union of the
          pair's domains, and the number of separate stretches that union spans. Every
          domain hmmsearch reported is counted, whatever its own significance: a hit can
          clear the full-sequence threshold while each of its domains is weak in isolation,
          and dropping those would leave exactly such hits without coordinates.
        pattern: "*.domtbl.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
output:
  hmmrank:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.hmmrank.tsv.gz":
          type: file
          description: |
            TSV file with ranked hmmer results: one row per (accno, profile) pair with
            profile, accno, profile_desc, evalue, score and rank. When domtblouts are
            supplied it also carries tlen and qlen, plus from, to, len and n_islands for
            each of the hmm, ali and env coordinate sets. n_islands is 1 when the domains
            merge into a single continuous stretch and rises as they scatter; coordinates
            are inclusive, so domains that abut with no gap between them count as one.
          pattern: "*.hmmrank.tsv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
