name: "kaiju_kaiju2table"
description: write your description here
keywords:
  - classify
  - metagenomics
  - taxonomic profiling
tools:
  - kaiju:
      description: Fast and sensitive taxonomic classification for metagenomics
      homepage: https://kaiju.binf.ku.dk/
      documentation: https://github.com/bioinformatics-centre/kaiju/blob/master/README.md
      tool_dev_url: https://github.com/bioinformatics-centre/kaiju
      doi: "10.1038/ncomms11257"
      licence:
        - "GNU GPL v3"
      identifier: biotools:kaiju
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: Kaiju input file
        ontologies: []
  - db:
      type: file
      description: Kaiju database
      ontologies: []
  - taxon_rank:
      type: string
      description: |
        Taxonomic rank to display in report
        pattern: "phylum|class|order|family|genus|species"
output:
  summary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: Kaiju output file
          pattern: "*.txt"
          ontologies: []
  versions_kaiju:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kaiju:
          type: string
          description: The name of the tool
      - kaiju -h 2>&1 | sed -n 1p | sed 's/^.*Kaiju //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kaiju:
          type: string
          description: The name of the tool
      - kaiju -h 2>&1 | sed -n 1p | sed 's/^.*Kaiju //':
          type: eval
          description: The expression to obtain the version of the tool
