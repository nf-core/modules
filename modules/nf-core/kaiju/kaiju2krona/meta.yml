name: kaiju_kaiju2krona
description: Convert Kaiju's tab-separated output file into a tab-separated text file which can be imported into Krona.
keywords:
  - taxonomy
  - visualisation
  - krona chart
  - metagenomics
tools:
  - "kaiju":
      description: Fast and sensitive taxonomic classification for metagenomics
      homepage: https://kaiju.binf.ku.dk/
      documentation: https://github.com/bioinformatics-centre/kaiju/blob/master/README.md
      tool_dev_url: https://github.com/bioinformatics-centre/kaiju
      doi: "10.1038/ncomms11257"
      licence:
        - "GNU GPL v3"
      identifier: biotools:kaiju
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - tsv:
        type: file
        description: Kaiju tab-separated output file
        pattern: "*.{tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3475
  - db:
      type: file
      description: Kaiju database file
      ontologies: []
output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: Krona text-based input file converted from Kaiju report
          pattern: "*.{txt,krona}"
          ontologies: []
  versions_kaiju:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kaiju:
          type: string
          description: The name of the tool
      - kaiju -h 2>&1 | sed -n 1p | sed 's/^.*Kaiju //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kaiju:
          type: string
          description: The name of the tool
      - kaiju -h 2>&1 | sed -n 1p | sed 's/^.*Kaiju //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@MillironX"
maintainers:
  - "@MillironX"
