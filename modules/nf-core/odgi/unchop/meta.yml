name: "odgi_unchop"
description: Merge unitigs into a single node preserving the node order.
keywords:
  - variation graph
  - pangenome graph
  - gfa
  - graph unchopping
tools:
  - "odgi":
      description: "An optimized dynamic genome/graph implementation"
      homepage: "https://github.com/pangenome/odgi"
      documentation: "https://odgi.readthedocs.io/en/latest/"
      tool_dev_url: "https://github.com/pangenome/odgi"
      doi: "10.1093/bioinformatics/btac308"
      licence:
        - "MIT"
      identifier: biotools:odgi
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - graph:
        type: file
        description: Pangenome graph in GFA v1.0 format or in ODGI binary format
        pattern: "*.{gfa,og}"
        ontologies:
          - edam: http://edamontology.org/format_3975
output:
  unchopped_graph:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.og":
          type: file
          description: Unchopped pangenome graph in ODGI binary format
          pattern: "*.{og}"
          ontologies: []
  versions_odgi:
    - - ${task.process}:
          type: string
          description: The name of the process
      - odgi:
          type: string
          description: The name of the tool
      - odgi version | sed 's/^v//; s/-.*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - odgi:
          type: string
          description: The name of the tool
      - odgi version | sed 's/^v//; s/-.*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@subwaystation"
maintainers:
  - "@subwaystation"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/odgi:0.9.0--48ccb29b570a8d65
      build_id: bd-48ccb29b570a8d65_1
      scan_id: sc-5cbf9960d28e5d32_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/odgi:0.9.0--3af430c3f5c8b1ee
      build_id: bd-3af430c3f5c8b1ee_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/6c/6c519019f443966467de7ce3245a9bcc384e27b576cade1dafa675df199367c4/data
  conda:
