name: "tauglymphatic_calc"
description: "Biophysical reaction-diffusion and perivascular glymphatic tau clearance calculator (RUO)."
keywords:
  - neuroscience
  - biophysics
  - reaction-diffusion
  - glymphatic
  - tauopathy
  - dti-alps
tools:
  - "tau-glymphatic-continuum":
      description: "Multiscale biophysical reaction-diffusion and perivascular glymphatic clearance engine for tau spreading."
      homepage: "https://github.com/Lukecele/tau-glymphatic-continuum"
      documentation: "https://github.com/Lukecele/tau-glymphatic-continuum#readme"
      tool_dev_url: "https://github.com/Lukecele/tau-glymphatic-continuum"
      doi: "10.5281/zenodo.24393484"
      licence:
        - "MIT"
      identifier: "biotools:tau-glymphatic-continuum"
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - alps:
        type: float
        description: Patient DTI-ALPS index (e.g. 1.60 for healthy, 1.15 for AD)
    - apoe_e4:
        type: integer
        description: Number of APOE-e4 high-risk alleles (0, 1, or 2)
    - trem2_r47h:
        type: boolean
        description: Whether the sample carries the TREM2 R47H loss-of-function variant
    - nlrp3:
        type: boolean
        description: Whether chronic NLRP3 inflammasome hyper-activation is present

output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "${prefix}.{txt,json}":
          type: file
          description: Biophysical glymphatic clearance report in text or structured JSON format (with --json)
          pattern: "*.{txt,json}"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
            - edam: "http://edamontology.org/format_3464" # JSON
  versions_tauglymphatic:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "tau-glymphatic-continuum":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''tau-glymphatic-continuum''))"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "tau-glymphatic-continuum":
          type: string
          description: The name of the tool
      - 'python3 -c "import importlib.metadata; print(importlib.metadata.version(''tau-glymphatic-continuum''))"':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Lukecele"
maintainers:
  - "@Lukecele"
