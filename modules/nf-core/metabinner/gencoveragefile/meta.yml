name: "metabinner_gencoveragefile"
description: |
  Generates per-contig coverage profiles from an assembly and sequencing reads
  (bwa mem, samtools sort and jgi_summarize_bam_contig_depths) for MetaBinner
keywords:
  - metagenomics
  - binning
  - coverage
  - depth
  - contigs
  - alignment
tools:
  - "metabinner":
      description: "Ensemble binning method to recover individual genomes from complex microbial communities"
      homepage: "https://github.com/ziyewang/MetaBinner"
      documentation: "https://github.com/ziyewang/MetaBinner"
      tool_dev_url: "https://github.com/ziyewang/MetaBinner"
      doi: "10.1186/s13059-022-02832-6"
      licence:
        - "GPL-3.0-only"
      identifier: biotools:metabinner
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`.
          `single_end` is required unless `--interleaved` is set in `ext.args`.
    - assembly:
        type: file
        description: Assembly contigs in FASTA format, optionally gzipped
        pattern: "*.{fasta,fa,fna}{,.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
    - reads:
        type: file
        description: |
          FASTQ reads (optionally gzipped) from one or more samples. Paired-end reads must be ordered as R1, R2 pairs per sample; single-end and interleaved inputs take one file per sample.
          The read mode is set by `meta.single_end`, or by `--interleaved` in `ext.args` for interleaved input; `--single-end` must not be passed in `ext.args`.
        pattern: "*.{fastq,fq}{,.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
output:
  coverage:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}_coverage_profile.tsv:
          type: file
          description: Per-contig mean depth for each sample, as input for MetaBinner
          pattern: "*_coverage_profile.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  coverage_f1k:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}_coverage_profile_f1k.tsv:
          type: file
          description: |
            Coverage profile restricted to contigs longer than 1000 bp.
            The threshold is fixed in metabinner 1.4.4, so `-l` in `ext.args` has no effect.
          pattern: "*_coverage_profile_f1k.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  depth:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}_depth.txt:
          type: file
          description: Contig depth table from jgi_summarize_bam_contig_depths, including contigLen and totalAvgDepth columns
          pattern: "*_depth.txt"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}_s*.bam:
          type: file
          description: |
            Coordinate-sorted alignments of each sample's reads against the assembly, named
            `${prefix}_s<index>_<read file name>.bam` with a zero-padded index following the input order
            (these names are also the column headers of the coverage profiles)
          pattern: "*_s*.bam"
          ontologies:
            - edam: http://edamontology.org/format_2572 # BAM
  versions_metabinner:
    - - ${task.process}:
          type: string
          description: The name of the process
      - metabinner:
          type: string
          description: The name of the tool
      - 1.4.4:
          type: string
          description: Hardcoded tool version, as gen_coverage_file.sh has no version flag
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - metabinner:
          type: string
          description: The name of the tool
      - 1.4.4:
          type: string
          description: Hardcoded tool version, as gen_coverage_file.sh has no version flag
authors:
  - "@HR-cruk"
maintainers:
  - "@HR-cruk"
