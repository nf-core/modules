name: modkit_extractfull
description: |
  Transform the probabilities from the MM/ML tags in a modBAM into a
  tab-separated per-read-per-position table. Emits one row for every
  modified-base probability call in every read — useful for downstream
  custom filtering, plotting, and ML training. Optionally BGZF-compressed
  via `--bgzf` in `ext.args`.
keywords:
  - modkit
  - methylation
  - extract
  - read-level
  - modbam
  - nanopore
  - ont
tools:
  - "modkit":
      description: A bioinformatics tool for working with modified bases in Oxford Nanopore sequencing data.
      homepage: https://github.com/nanoporetech/modkit
      documentation: https://nanoporetech.github.io/modkit/
      tool_dev_url: https://github.com/nanoporetech/modkit
      licence:
        - "Oxford Nanopore Technologies PLC. Public License Version 1.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`. The output inherits this meta.
    - bam:
        type: file
        description: Input modBAM with MM/ML tags.
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: http://edamontology.org/format_2572
    - bai:
        type: file
        description: BAM index (`.bai` or `.csi`). Optional — if absent, modkit does a serial scan of the BAM (see `--ignore-index`).
        pattern: "*.{bai,csi}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'mm10' ]`. May be `[[], [], []]` to skip (modkit works
          unaligned, but reference context columns will be missing).
    - fasta:
        type: file
        description: Reference FASTA. Required to populate reference-context columns in the output (`ref_kmer`, strand, etc.).
        pattern: "*.{fa,fasta,fna}"
        ontologies:
          - edam: http://edamontology.org/format_1929
    - fai:
        type: file
        description: Samtools FASTA index for `fasta`.
        pattern: "*.fai"
        ontologies:
          - edam: http://edamontology.org/format_3475
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`.
      - "*.tsv{,.gz}":
          type: file
          description: |
            Per-read-per-position probability table. BGZF-compressed when
            `--bgzf` is passed via `ext.args`.
          pattern: "*.{tsv,tsv.gz}"
          ontologies:
            - edam: http://edamontology.org/format_3475
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`.
      - "*.log":
          type: file
          description: |
            Optional modkit debug log (only emitted when `--log-filepath
            <name>.log` is passed via `ext.args`).
          pattern: "*.log"
          ontologies: []
  versions_modkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - modkit:
          type: string
          description: The name of the tool
      - modkit --version | sed 's/modkit //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - modkit:
          type: string
          description: The name of the tool
      - modkit --version | sed 's/modkit //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
