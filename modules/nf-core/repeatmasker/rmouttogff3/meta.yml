name: "repeatmasker_rmouttogff3"
description: A utility script to assist to convert old RepeatMasker *.out files to version 3 gff files.
keywords:
  - sort
  - repeatmasker
  - genomics
tools:
  - repeatmasker:
      description: |
        RepeatMasker is a program that screens DNA sequences for interspersed
        repeats and low complexity DNA sequences
      homepage: "https://www.repeatmasker.org/"
      documentation: "https://www.repeatmasker.org/webrepeatmaskerhelp.html"
      tool_dev_url: "https://github.com/rmhubley/RepeatMasker"
      licence:
        - "Open Software License v. 2.1"
      identifier: biotools:repeatmasker

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - out:
        type: file
        description: RepeatMasker out file
        pattern: "*.{out}"
        ontologies: []
output:
  gff3:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.gff3":
          type: file
          description: Sorted BAM/CRAM/SAM file
          pattern: "*.{gff3}"
          ontologies: []
  versions_repeatmasker:
    - - ${task.process}:
          type: string
          description: The name of the process
      - repeatmasker:
          type: string
          description: The name of the tool
      - RepeatMasker -v | sed 's/RepeatMasker version //1':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - repeatmasker:
          type: string
          description: The name of the tool
      - RepeatMasker -v | sed 's/RepeatMasker version //1':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@GallVp"
maintainers:
  - "@GallVp"
