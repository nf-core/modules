name: humann3_humann
description: |
  Functional profiling of metagenome or metatranscriptome data (gene families, pathway abundance and coverage)
  Tables are collected as gzipped TSV, so `--output-format biom` in `ext.args` stops the process with an error.
keywords:
  - function
  - metagenomics
  - metatranscriptomics
  - profiling
  - community
tools:
  - humann:
      description: "HUMAnN: The HMP Unified Metabolic Analysis Network"
      homepage: http://huttenhower.sph.harvard.edu/humann
      documentation: https://github.com/biobakery/biobakery/wiki/humann3
      tool_dev_url: https://github.com/biobakery/humann
      doi: "10.7554/eLife.65088"
      licence:
        - "MIT"
      args_id: "$args"
      identifier: biotools:humann
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - input:
        type: file
        description: Reads (FASTQ or FASTA), alignments (SAM, BAM, BLAST tabular) or a pre-computed gene table (TSV, BIOM)
        pattern: "*.{fastq,fastq.gz,fasta,fasta.gz,sam,bam,blastm8,tsv,biom}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3989 # GZIP format
          - edam: http://edamontology.org/format_2573 # SAM
          - edam: http://edamontology.org/format_2572 # BAM
          - edam: http://edamontology.org/format_1333 # BLAST results
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3746 # BIOM format
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - profile:
        type: file
        description: Pre-computed MetaPhlAn taxonomic profile
        pattern: "*.txt"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
  - nucleotide_db:
      type: directory
      description: ChocoPhlAn nucleotide database directory, searched for `*.ffn.gz` files
  - protein_db:
      type: directory
      description: UniRef protein database directory, searched for `*.dmnd` files
  - utility_db:
      type: directory
      description: HUMAnN utility mapping database directory
output:
  genefamilies:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}_genefamilies.tsv.gz:
          type: file
          description: Gzipped gene families abundance table
          pattern: "*_genefamilies.tsv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
            - edam: http://edamontology.org/format_3989 # GZIP format
  pathabundance:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}_pathabundance.tsv.gz:
          type: file
          description: Gzipped pathway abundance table
          pattern: "*_pathabundance.tsv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
            - edam: http://edamontology.org/format_3989 # GZIP format
  pathcoverage:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}_pathcoverage.tsv.gz:
          type: file
          description: Optional. Gzipped pathway coverage table
          pattern: "*_pathcoverage.tsv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
            - edam: http://edamontology.org/format_3989 # GZIP format
  reactions:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}_reactions.tsv.gz:
          type: file
          description: Optional. Never produced by HUMAnN 3.6.1 (only gene families, pathway abundance and coverage)
          pattern: "*_reactions.tsv.gz"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
            - edam: http://edamontology.org/format_3989 # GZIP format
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}.log:
          type: file
          description: HUMAnN run log
          pattern: "*.log"
          ontologies:
            - edam: http://edamontology.org/format_2330 # Textual format
  versions_humann:
    - - ${task.process}:
          type: string
          description: The name of the process
      - HUMAnN:
          type: string
          description: The name of the tool
      - humann --version 2>&1 | sed 's/humann v//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_metaphlan:
    - - ${task.process}:
          type: string
          description: The name of the process
      - MetaPhlAn:
          type: string
          description: The name of the tool
      - metaphlan --version 2>&1 | sed 's/MetaPhlAn version //; s/ (.*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_python:
    - - ${task.process}:
          type: string
          description: The name of the process
      - Python:
          type: string
          description: The name of the tool
      - python --version 2>&1 | sed 's/Python //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - HUMAnN:
