name: "bamstats_generalstats"
description: write your description here
keywords:
  - bam
  - statistics
  - genomics
tools:
  - "bamstats":
      description: "A command line tool to compute mapping statistics from a BAM file"
      homepage: "https://github.com/guigolab/bamstats/"
      documentation: "https://github.com/guigolab/bamstats/"
      tool_dev_url: "https://github.com/guigolab"
      licence: ["BSD-3-clause"]
      identifier: biotools:bamstats-ip

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
output:
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.json":
          type: file
          description: json containing bam statistics
          pattern: "*.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  versions_bamstats:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bamstats:
          type: string
          description: The name of the tool
      - 'bamstats --version | grep "version: " | sed -e s"/version: //"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bamstats:
          type: string
          description: The name of the tool
      - 'bamstats --version | grep "version: " | sed -e s"/version: //"':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@johnoooh"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/bamstats:0.3.5--0a6b61f4dd590324
      build_id: bd-0a6b61f4dd590324_1
      scan_id: sc-5168be3d3aa08d44_1
  singularity:
