name: "ngsbits_bedcoverage"
description: Annotates a BED file with the average coverage of the regions from one or several BAM/CRAM file(s).
keywords:
  - bed
  - coverage
  - regions
tools:
  - "ngsbits":
      description: "Short-read sequencing tools"
      homepage: "https://github.com/imgag/ngs-bits"
      documentation: "https://github.com/imgag/ngs-bits"
      tool_dev_url: "https://github.com/imgag/ngs-bits"
      licence:
        - "MIT"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: Input BAM/CRAM/SAM file(s), can be one file or a list of files
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: "http://edamontology.org/format_25722"
          - edam: "http://edamontology.org/format_2573"
          - edam: "http://edamontology.org/format_3462"
    - reads_index:
        type: file
        description: The index file(s) from the input BAM/CRAM/SAM file(s)
        pattern: "*.{bai,crai}"
        ontologies: []
    - bed:
        type: file
        description: Input BED file containing regions to annotate
        pattern: "*.bed"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference fasta information
          e.g. `[ id:'sample1', single_end:false ]`
    - fasta:
        type: file
        description: The reference FASTA to use (mandatory when CRAM files are used, otherwise optional)
        pattern: "*.{fasta,fa,fna}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference fasta information
          e.g. `[ id:'sample1', single_end:false ]`
    - fai:
        type: file
        description: The index file from the reference FASTA
        pattern: "*.fai"

        ontologies: []
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.bed":
          type: file
          description: Output BED file with average coverage of the regions
          pattern: "*.bed"

          ontologies: []
  versions_ngsbits:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ngsbits:
          type: string
          description: The name of the tool
      - BedCoverage --version 2>&1 | sed -n 's/BedCoverage //p':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ngsbits:
          type: string
          description: The name of the tool
      - BedCoverage --version 2>&1 | sed -n 's/BedCoverage //p':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
