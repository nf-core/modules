name: "rastair2_mbias"
description: |
  Measure methylation by position in read (M-bias) of 5mC->T converted
  paired-end reads with rastair version 2, and suggest how many bases to
  ignore at each read end. Runs `rastair per-read` (options in `ext.args`,
  e.g. `--region`) and then `rastair mbias` on its output (options in
  `ext.args2`). Writes an HTML report and, for each contig with enough data,
  a cutoffs file to pass to rastair2/call.
  Non-commercial licence: see the rastair tool description.
keywords:
  - methylation
  - mbias
  - taps
  - 5-base
  - qc
  - trimming
tools:
  - "rastair":
      description: |
        Simultaneous detection of genetic variants and methylated positions from
        TAPS+, Illumina 5-base or other 5mC->T converted sequencing data.
        Licensing: rastair version 2 and newer is free for non-commercial research
        use only. Commercial use (including providing paid services or developing
        products) requires a licence from Oxford University Innovation
        (enquiries@innovation.ox.ac.uk, reference 24811). Run `rastair license` for
        the full terms. Publications using results must include the notice
        "Copyright © 2025, University of Oxford".
      homepage: "https://www.rastair.com"
      documentation: "https://docs.rastair.com"
      tool_dev_url: "https://github.com/bsbludwig/rastair"
      licence: ["LicenseRef-NonCommercial"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information. Reads must be paired-end:
          `single_end: true` is an error.
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Coordinate-sorted BAM or CRAM file of 5mC->T converted paired-end reads
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
          - edam: "http://edamontology.org/format_3462"
    - index:
        type: file
        description: Index of the BAM or CRAM file
        pattern: "*.{bai,csi,crai}"
        ontologies:
          - edam: "http://edamontology.org/format_3327"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'genome' ]`
    - fasta:
        type: file
        description: Reference genome FASTA, used by `rastair per-read`
        pattern: "*.{fa,fasta,fna}{,.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929"
    - fai:
        type: file
        description: |
          samtools faidx index of the reference FASTA. Staged next to the FASTA,
          where rastair finds it; it is not passed on the command line.
        pattern: "*.fai"
        ontologies:
          - edam: "http://edamontology.org/format_3475"
output:
  html:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*.mbias.html":
          type: file
          description: |
            HTML report with M-bias plots per contig and the suggested cutoffs drawn
            on them. V-bias and GC plots are not produced.
          pattern: "*.mbias.html"
          ontologies:
            - edam: "http://edamontology.org/format_2331"
  cutoffs:
    - - meta:
          type: map
          description: Groovy Map containing sample information. e.g. `[ id:'sample1' ]`
      - "*.cutoffs.txt":
          type: file
          description: |
            One file per contig, `<prefix>.<contig>.cutoffs.txt`. Line 1 is the value
            for rastair2/call `--nOT`, line 2 for `--nOB`, each as
            `r1_start,r1_end,r2_start,r2_end` bases to ignore. Restrict the run to one
            contig or region with `--region` in `ext.args` to get a single file:
            this also keeps memory down, as the report loads every read in range.
            Contigs with too little data get no file, and if no read in range has a
            CpG there are no cutoffs files at all (the report says so), so callers
            can fall back to no trimming.
          pattern: "*.cutoffs.txt"
          ontologies:
            - edam: "http://edamontology.org/format_3475"
  versions_rastair:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rastair:
          type: string
          description: The name of the tool
      - "rastair --version | sed 's/^rastair //'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - rastair:
          type: string
          description: The name of the tool
      - "rastair --version | sed 's/^rastair //'":
          type: eval
          description: The expression to obtain the version of the tool
