name: "happy_report"
description: Generate standalone HTML benchmarking reports from GA4GH / hap.py variant-calling metrics CSVs
keywords:
  - happy
  - benchmark
  - report
  - html
  - variant-calling
tools:
  - "happy":
      description: "Generate standalone HTML benchmarking reports from GA4GH / hap.py variant-calling metrics CSVs"
      homepage: "https://github.com/bag-cnag/ga4gh-happy-report"
      documentation: "https://github.com/bag-cnag/ga4gh-happy-report"
      tool_dev_url: "https://github.com/bag-cnag/ga4gh-happy-report"
      licence:
        - "Apache-2.0"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - csv_meta:
        type: list
        description: |
          A list of maps, one per entry in `csv`, in the same order. Each map
          must contain a `method` string key (e.g. the variant caller name,
          such as `gatk4` or `deepvariant`) and may contain a
          `comparison_method` string key (e.g. `vcfeval` or `happy`). Together
          they build the GA4GH `<method>_<comparisonmethod>:<file>` label used
          to identify each file's results in the report, e.g.
          `[ method:'gatk4', comparison_method:'vcfeval' ]`. Omit
          `comparison_method` to use just `<method>:<file>` for that file.
    - csv:
        type: file
        description: One or more GA4GH metrics ROC CSV files (e.g. the
          `*.roc.all.csv.gz` output of hap.py/som.py), one report entry per
          file. Gzip-compressed files are read transparently. Each file is
          labelled using the corresponding entry in `csv_meta`.
        pattern: "*.{csv,csv.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3752" # CSV
output:
  html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.html":
          type: file
          description: Standalone HTML benchmarking report
          pattern: "*.html"
          ontologies:
            - edam: "http://edamontology.org/format_2331" # HTML
  versions_happy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ga4gh-happy-report:
          type: string
          description: The name of the tool
      - 0.1.2:
          type: string
          description: The version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ga4gh-happy-report:
          type: string
          description: The name of the tool
      - 0.1.2:
          type: string
          description: The version of the tool

