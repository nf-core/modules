name: paraclu
description: Paraclu finds clusters in data attached to sequences.
keywords:
  - sort
  - cluster
  - bed
tools:
  - paraclu:
      description: Paraclu finds clusters in data attached to sequences.
      homepage: https://gitlab.com/mcfrith/paraclu
      documentation: https://gitlab.com/mcfrith/paraclu
      tool_dev_url: https://gitlab.com/mcfrith/paraclu
      licence:
        - "GPL v3-or-later"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bed:
        type: file
        description: BED file
        pattern: "*.bed"
        ontologies: []
  - min_cluster:
      type: integer
      description: Minimum size of cluster
      pattern: "*.bed"
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bed":
          type: file
          description: clustered BED file
          pattern: "*.bed"
          ontologies: []
  versions_paraclu:
    - - ${task.process}:
          type: string
          description: The name of the process
      - paraclu:
          type: string
          description: The name of the tool
      - "10":
          type: string
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - paraclu:
          type: string
          description: The name of the tool
      - "10":
          type: string
          description: The expression to obtain the version of the tool

authors:
  - "@mashehu"
maintainers:
  - "@mashehu"
