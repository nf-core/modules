# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "tobias_scorebigwig"
description: Calculate ATAC-seq footprint scores from a BigWig signal track with TOBIAS ScoreBigwig
keywords:
  - ATAC-seq
  - footprinting
  - bigWig
  - transcription factors
tools:
  - tobias:
      description: "Transcription factor Occupancy prediction By Investigation of ATAC-seq Signal"
      homepage: "https://github.com/loosolab/TOBIAS"
      documentation: "https://github.com/loosolab/TOBIAS/wiki"
      tool_dev_url: "https://github.com/loosolab/TOBIAS"
      doi: "10.1038/s41467-020-18035-1"
      licence: ["MIT"]
      identifier: "biotools:tobias"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - signal:
        type: file
        description: BigWig ATAC-seq cut-site signal, typically generated by TOBIAS ATACorrect
        pattern: "*.bw"
        ontologies:
          - edam: "http://edamontology.org/format_3006"
    - regions:
        type: file
        description: BED file containing genomic regions for footprint scoring
        pattern: "*.bed"
        ontologies:
          - edam: "http://edamontology.org/format_3003"
output:
  footprints:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*_footprints.bw":
          type: file
          description: BigWig track containing TOBIAS footprint scores
          pattern: "*_footprints.bw"
          ontologies:
            - edam: "http://edamontology.org/format_3006"
  versions_tobias:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tobias:
          type: string
          description: The name of the tool
      - TOBIAS --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tobias:
          type: string
          description: The name of the tool
      - TOBIAS --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@PFRoux"
maintainers:
  - "@PFRoux"
