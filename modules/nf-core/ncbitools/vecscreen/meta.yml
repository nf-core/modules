name: "NCBITOOLS_VECSCREEN"
description: NCBI tool for detecting vector contamination in nucleic acid
  sequences. This tool is older than NCBI's FCS-adaptor, which is for the same
  purpose
keywords:
  - assembly
  - genomics
  - quality control
  - contamination
  - vector
  - NCBI
tools:
  - "ncbitools":
      description: |
        "NCBI libraries for biology applications (text-based utilities)"
      homepage: "https://www.ncbi.nlm.nih.gov/tools/vecscreen/"
      documentation: "https://www.ncbi.nlm.nih.gov/tools/vecscreen/interpretation/"
      tool_dev_url: "https://www.ncbi.nlm.nih.gov/tools/vecscreen/"
      licence:
        - "The Open Database License"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', taxid:'6973' ]
    - fasta_file:
        type: file
        description: FASTA file that will be screened for contaminants
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - adapters_database_directory:
        type: directory
        description: Directory containing the adapters database
output:
  vecscreen_output:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', taxid:'9606' ]
      - ${prefix}.vecscreen.out:
          type: file
          description: VecScreen report file. This can be in different formats
            depending on the value of the optional -f  parameter. 0 = HTML format,
            with alignments. 1 = HTML format, no alignments. 2 = Text list, with
            alignments. 3 = Text list, no alignments. default = 0
          pattern: "*.vecscreen.out"
          ontologies: []
  versions_vecscreen:
    - - ${task.process}:
          type: string
          description: The name of the process
      - vecscreen:
          type: string
          description: The name of the tool
      - "1.0":
          type: string
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - vecscreen:
          type: string
          description: The name of the tool
      - "1.0":
          type: string
          description: The expression to obtain the version of the tool

authors:
  - "@eeaunin"
