name: "toulligqc"
description: "A post sequencing QC tool for Oxford Nanopore sequencers"
keywords:
  - nanopore sequencing
  - quality control
  - genomics
tools:
  - "toulligqc":
      description: "A post sequencing QC tool for Oxford Nanopore sequencers"
      homepage: https://github.com/GenomiqueENS/toulligQC
      documentation: https://github.com/GenomiqueENS/toulligQC
      tool_dev_url: https://github.com/GenomiqueENS/toulligQC
      licence:
        - "CECILL-2.1"
      identifier: biotools:ToulligQC
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - ontfile:
        type: file
        description: Input ONT file
        pattern: "*.{fastq,fastq.gz,fq,fq.gz,txt,txt.gz,bam}"
        ontologies:
          - edam: http://edamontology.org/format_1930
output:
  report_data:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*/*.data":
          type: file
          description: Report data emitted from toulligqc
          pattern: "*.data"
          ontologies: []
  report_html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*/*.html":
          type: file
          description: Report data in html format
          pattern: "*.html"
          ontologies: []
  plots_html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*/images/*.html":
          type: file
          description: Plots emitted in html format
          pattern: "*.html"
          ontologies: []
  plotly_js:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*/images/plotly.min.js":
          type: file
          description: Plots emitted from toulligqc
          pattern: "plotly.min.js"
          ontologies: []
  versions_toulligqc:
    - - ${task.process}:
          type: string
          description: Name of the process
      - toulligqc:
          type: string
          description: Name of the tool
      - toulligqc --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: Name of the process
      - toulligqc:
          type: string
          description: Name of the tool
      - toulligqc --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Salome-Brunon"
maintainers:
  - "@Salome-Brunon"
