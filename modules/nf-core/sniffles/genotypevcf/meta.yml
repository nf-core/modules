name: "sniffles_genotypevcf"
description: Determine the genotypes of known structural variants in a long-read alignment with Sniffles (forced calling with --genotype-vcf). The input VCF is read as plain text, a gzipped VCF is decompressed first. As of Sniffles 2.8.1 each sample value of the output carries one more value (a PS value) than the FORMAT declares (fritzsedlazeck/Sniffles#615).
keywords:
  - sniffles
  - structural variants
  - genotyping
  - forced calling
  - long-read
tools:
  - "sniffles":
      description: "Sniffles is a structural variation caller using third generation sequencing (PacBio or Oxford Nanopore)."
      homepage: "https://github.com/fritzsedlazeck/Sniffles/wiki"
      documentation: "https://github.com/fritzsedlazeck/Sniffles/wiki"
      tool_dev_url: "https://github.com/fritzsedlazeck/Sniffles"
      doi: 10.1038/s41587-023-02024-y
      licence: ["MIT"]
      identifier: biotools:sniffles

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - input:
        type: file
        description: A single coordinate-sorted .bam/.cram file
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: http://edamontology.org/format_3989
    - index:
        type: file
        description: Index of the BAM/CRAM file
        pattern: "*.{bai,crai}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'fasta' ]
    - fasta:
        type: file
        description: Reference sequence in FASTA format (optional)
        pattern: "*.{fa,fasta,fna}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing information about the known structural variants
          e.g. [ id:'sites' ]
    - vcf:
        type: file
        description: VCF of the known structural variants to genotype, plain or gzipped
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3016
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.vcf.gz":
          type: file
          description: Compressed VCF file with the genotypes (GT:GQ:DR:DV) of the input structural variants
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.vcf.gz.tbi":
          type: file
          description: Index of the compressed VCF file
          pattern: "*.tbi"
          ontologies: []
  versions_sniffles:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sniffles:
          type: string
          description: The name of the tool
      - sniffles --version | sed 's/.* //g':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sniffles:
          type: string
          description: The name of the tool
      - sniffles --version | sed 's/.* //g':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@aksenia"
maintainers:
  - "@aksenia"
