name: "oatk"
description: An nf-core module for the OATK
keywords:
  - organelle
  - mitochondrion
  - plastid
  - PacBio
  - HiFi
  - assembly
tools:
  - "oatk":
      description: "An organelle genome assembly toolkit"
      homepage: "https://github.com/c-zhou/oatk"
      documentation: "https://github.com/c-zhou/oatk"
      tool_dev_url: "https://github.com/c-zhou/oatk"
      doi: "10.5281/zenodo.10400173"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'Cladonia_norvegica' ]
    - reads:
        type: file
        description: HiFi reads in FASTA format for organellar assembly
        pattern: "*.{fasta,fasta.gz,fa,fa.gz}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'Cladonia_norvegica' ]
    - mito_hmm_files:
        type: file
        description: |
          HMM profile for mitochondrial gene annotation, with corresponding
          .h3i, h3f, .h3p, .h3m files from hmmpress. Can be generated using
          OatkDB (https://github.com/c-zhou/OatkDB/).
        pattern: "*.{fam,h3i,h3f,h3p,h3m}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'Cladonia_norvegica' ]
    - pltd_hmm_files:
        type: file
        description: |
          HMM profile for plastid gene annotation, with corresponding
          .h3i, h3f, .h3p, .h3m files from hmmpress. Can be generated using
          OatkDB (https://github.com/c-zhou/OatkDB/).
        pattern: "*.{fam,h3i,h3f,h3p,h3m}"
        ontologies: []
output:
  mito_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*mito.ctg.fasta":
          type: file
          description: Linearised mitochondrial contigs in FASTA format
          pattern: "*mito.ctg.fasta"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  pltd_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*pltd.ctg.fasta":
          type: file
          description: Linearised plastid contigs in FASTA format
          pattern: "*pltd.ctg.fasta"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  mito_bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*mito.ctg.bed":
          type: file
          description: Gene annotations for the mito contigs
          pattern: "*mito.ctg.bed"
          ontologies:
            - edam: http://edamontology.org/format_3003 # BED
  pltd_bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*pltd.ctg.bed":
          type: file
          description: Gene annotations for the plastid contigs
          pattern: "*pltd.ctg.bed"
          ontologies:
            - edam: http://edamontology.org/format_3003 # BED
  mito_utg_bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*mito.bed":
          type: file
          description: Gene annotations for the mito unitigs
          pattern: "*mito.bed"
          ontologies:
            - edam: http://edamontology.org/format_3003 # BED
  pltd_utg_bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*pltd.bed":
          description: Gene annotations for the plastid unitigs
          type: file
          pattern: "*pltd.bed"
          ontologies:
            - edam: http://edamontology.org/format_3003 # BED
  mito_gfa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*mito.gfa":
          type: file
          description: The mitochondrial genome assembly subgraph in GFA format
          pattern: "*mito.gfa"
          ontologies:
            - edam: http://edamontology.org/format_3975 # GFA 1
  pltd_gfa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*pltd.gfa":
          type: file
          description: The plastid genome assembly subgraph in GFA format
          pattern: "*pltd.gfa"
          ontologies:
            - edam: http://edamontology.org/format_3975 # GFA 1
  annot_mito_txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*annot_mito.txt":
          type: file
          description: The MT gene annotation file from nhmmscan for all unitigs
          pattern: "*annot_mito.txt"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  annot_pltd_txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*annot_pltd.txt":
          type: file
          description: The PT gene annotation file from nhmmscan for all unitigs
          pattern: "*annot_pltd.txt"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  final_gfa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*utg.final.gfa":
          type: file
          description: The GFA file for the final genome assembly
          pattern: "*utg.final.gfa"
          ontologies:
            - edam: http://edamontology.org/format_3975 # GFA 1
  initial_gfa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*utg.gfa":
          type: file
          description: The GFA file for the initial genome assembly
          pattern: "*utg.gfa"
          ontologies:
            - edam: http://edamontology.org/format_3975 # GFA 1
  oatk_log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.log":
          type: file
          description: The log file describing oatk run
          pattern: "*.log"
          ontologies:
            - edam: http://edamontology.org/data_2526 # Text
  versions_oatk:
    - - ${task.process}:
          type: string
          description: The name of the process
      - oatk:
          type: string
          description: The name of the tool
      - oatk --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - oatk:
          type: string
          description: The name of the tool
      - oatk --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ksenia-krasheninnikova"
