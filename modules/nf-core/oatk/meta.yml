      name: community.wave.seqera.io/library/oatk:1.0--a8817603c2ec042f
      build_id: bd-a8817603c2ec042f_1
      scan_id: sc-f1e069d187d0493f_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/oatk:1.0--cd6a3fe033cd2aa8
      build_id: bd-cd6a3fe033cd2aa8_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/b0/b0c742ba43df9d7be62c96beb1425f558de8744b125fe3f1f4b7781e1064a7e1/data
  conda:
    linux/amd64:
      lock_file: modules/nf-core/oatk/.conda-lock/linux_amd64-bd-a8817603c2ec042f_1.txt
