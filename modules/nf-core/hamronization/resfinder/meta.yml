name: "hamronization_resfinder"
description: Tool to convert and summarize ResFinder outputs using the
  hAMRonization specification
keywords:
  - amr
  - antimicrobial resistance
  - reporting
  - resfinder
tools:
  - "hamronization":
      description: "Tool to convert and summarize AMR gene detection outputs using the
        hAMRonization specification"
      homepage: "https://github.com/pha4ge/hAMRonization/"
      documentation: "https://github.com/pha4ge/hAMRonization/"
      tool_dev_url: "https://github.com/pha4ge/hAMRonization"
      licence:
        - "GNU Lesser General Public v3 (LGPL v3)"
      identifier: biotools:hamronization
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - report:
        type: file
        description: JSON output file from ResFinder (v4.2 or later), e.g. data_resfinder.json
        pattern: "*.json"
        ontologies:
          - edam: http://edamontology.org/format_3464 # JSON
  - format:
      type: string
      description: Type of report file to be produced
      pattern: "tsv|json"
output:
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.json":
          type: file
          description: hAMRonised report in JSON format
          pattern: "*.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.tsv":
          type: file
          description: hAMRonised report in TSV format
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_hamronization:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hamronization:
          type: string
          description: The name of the tool
      - hamronize --version 2>&1 | sed 's/hamronize //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - hamronization:
          type: string
          description: The name of the tool
      - hamronize --version 2>&1 | sed 's/hamronize //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@pabloestepaa"
maintainers:
  - "@pabloestepaa"
