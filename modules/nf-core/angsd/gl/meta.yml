name: "angsd_gl"
description: Calculated genotype likelihoods from BAM files.
keywords:
  - angsd
  - genotype likelihood
  - genomics
tools:
  - "angsd":
      description: "ANGSD: Analysis of next generation Sequencing Data"
      homepage: "http://www.popgen.dk/angsd/"
      documentation: "http://www.popgen.dk/angsd/"
      tool_dev_url: "https://github.com/ANGSD/angsd"
      doi: "10.1186/s12859-014-0356-4"
      licence: ["GPL v3", "MIT"]
      identifier: biotools:angsd
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: A list of BAM or CRAM files
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_3462" # CRAM
    - bai:
        type: file
        description: A list of BAM or CRAM indices
        pattern: "*.{bam.bai,cram.crai}"
        ontologies:
          - edam: "http://edamontology.org/format_3327" # BAI
          - edam: "http://edamontology.org/format_3462" # CRAM (no dedicated CRAI term in EDAM)
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - fasta:
        type: file
        description: A reference genome in FASTA format
        pattern: "*.fasta"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
    - fai:
        type: file
        description: Index of the reference genome FASTA file
        pattern: "*.{fasta,fa}.fai"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA (no dedicated FAI term in EDAM)
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - error_file:
        type: file
        description: A file containing information about type specific errors.
        pattern: "*.error.chunkunordered"
        ontologies: []
output:
  genotype_likelihood:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.{glf,beagle}.gz":
          type: file
          description: File containing genotype likelihoods per sample
          pattern: "*.{glf,beagle}.gz"
          ontologies: []
  versions_angsd:
    - - ${task.process}:
          type: string
          description: The name of the process
      - angsd:
          type: string
          description: The name of the tool
      - "angsd 2>&1 | sed '1!d;s/.*version: //;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - angsd:
          type: string
          description: The name of the tool
      - "angsd 2>&1 | sed '1!d;s/.*version: //;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
