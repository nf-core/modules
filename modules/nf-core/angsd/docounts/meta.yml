name: "angsd_docounts"
description: Calculates base frequency statistics across reference positions from BAM.
keywords:
  - angsd
  - population genetics
  - allele counts
  - doCounts
tools:
  - "angsd":
      description: "ANGSD: Analysis of next generation Sequencing Data"
      homepage: "http://www.popgen.dk/angsd/"
      documentation: "http://www.popgen.dk/angsd/"
      tool_dev_url: "https://github.com/ANGSD/angsd"
      doi: "10.1186/s12859-014-0356-4"
      licence:
        - "GPL v3, MIT"
      identifier: biotools:angsd
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: A list of BAM or CRAM files
        pattern: "*.{bam,cram}"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
          - edam: "http://edamontology.org/format_3462" # CRAM
    - bai:
        type: file
        description: List of BAM/CRAM index files
        pattern: "*.{bai,csi}"
        ontologies:
          - edam: "http://edamontology.org/format_3327" # BAI
    - minqfile:
        type: file
        description: File with individual quality score thresholds
        pattern: "*"
        ontologies: []
output:
  depth_sample:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.depthSample":
          type: file
          description: Distribution of sequencing depths
          pattern: "*.depthSample"
          ontologies: []
  depth_global:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.depthGlobal":
          type: file
          description: Distribution of sequencing depths
          pattern: "*.depthGlobal"
          ontologies: []
  qs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.qs":
          type: file
          description: Distribution of scores
          pattern: "*.qs"
          ontologies: []
  pos:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pos.gz":
          type: file
          description: Various types of depth statistics (depending on value for -dumpCounts)
          pattern: "*.pos.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3675" # Compressed file
            - edam: http://edamontology.org/format_3989 # GZIP format
  counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.counts.gz":
          type: file
          description: Various types of statistics (related to pos.gz)
          pattern: "*.counts.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  icounts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.icnts.gz":
          type: file
          description: Internal format for dumping binary single chrs. Useful for ANGSD contamination
          pattern: "*.icnts.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_angsd:
    - - ${task.process}:
          type: string
          description: The name of the process
      - angsd:
          type: string
          description: The name of the tool
      - "angsd 2>&1 | sed '1!d;s/.*version: //;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - angsd:
          type: string
          description: The name of the tool
      - "angsd 2>&1 | sed '1!d;s/.*version: //;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@jfy133"
maintainers:
  - "@jfy133"
