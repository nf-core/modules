name: blast_blastdbcmd
description: Retrieve entries from a BLAST database
keywords:
  - fasta
  - blast
  - database
  - retrieval
  - identifier
tools:
  - blast:
      description: |
        BLAST finds regions of similarity between biological sequences.
      homepage: https://blast.ncbi.nlm.nih.gov/Blast.cgi
      documentation: https://blast.ncbi.nlm.nih.gov/Blast.cgi?CMD=Web&PAGE_TYPE=Blastdocs
      doi: 10.1016/S0022-2836(05)80360-2
      licence:
        - "US-Government-Work"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - entry:
        type: string
        description: Entry identifier of sequence in database. It cannot be used along with entry_batch
    - entry_batch:
        type: file
        description: |
          File with a list of entry identifiers of sequences in database (one identifier per line). It cannot be used along with entry
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing db information
          e.g. [ id:'test2', single_end:false ]
    - db:
        type: file
        description: Input BLAST-indexed database
        pattern: "*.{fa.*,fasta.*}"
        ontologies: []
output:
  fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.fasta":
          type: file
          description: Output fasta file (default format)
          pattern: "*.{fasta}"
          ontologies: []
  text:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: |
            Output text file (generic format if fasta not used, i.e. `--outfmt` is supplied to `ext.args`)
          pattern: "*.{txt}"
          ontologies: []
  versions_blastdbcmd:
    - - ${task.process}:
          type: string
          description: The name of the process
      - blastdbcmd:
          type: string
          description: The name of the tool
      - "blastdbcmd -version 2>&1 | head -n1 | sed 's/^.*blastdbcmd: //; s/ .*\\$//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - blastdbcmd:
          type: string
          description: The name of the tool
      - "blastdbcmd -version 2>&1 | head -n1 | sed 's/^.*blastdbcmd: //; s/ .*\\$//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@toniher"
maintainers:
  - "@toniher"
