name: blast_tblastn
description: Queries a BLAST DNA database
keywords:
  - fasta
  - blast
  - tblastn
  - DNA sequence
tools:
  - blast:
      description: |
        Protein to Translated Nucleotide BLAST.
      homepage: https://blast.ncbi.nlm.nih.gov/Blast.cgi
      documentation: https://blast.ncbi.nlm.nih.gov/Blast.cgi?CMD=Web&PAGE_TYPE=Blastdocs
      doi: 10.1016/S0022-2836(05)80360-2
      licence:
        - "US-Government-Work"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Input fasta file containing queries sequences
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing db information
          e.g. [ id:'test2', single_end:false ]
    - db:
        type: directory
        description: Directory containing the blast database
        pattern: "*"
output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: File containing blastn hits
          pattern: "*.txt"
          ontologies: []
  versions_tblastn:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tblastn:
          type: string
          description: The name of the tool
      - "tblastn -version 2>&1 | sed 's/^.*tblastn: //; s/ .*\\$//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tblastn:
          type: string
          description: The name of the tool
      - "tblastn -version 2>&1 | sed 's/^.*tblastn: //; s/ .*\\$//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@yumisims"
  - "@gq2"
maintainers:
  - "@yumisims"
  - "@gq2"
  - "@vagkaratzas"
