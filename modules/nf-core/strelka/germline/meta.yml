name: strelka_germline
description: Strelka2 is a fast and accurate small variant caller optimized for analysis of germline variation
keywords:
  - variantcalling
  - germline
  - wgs
  - vcf
  - variants
tools:
  - strelka:
      description: Strelka calls somatic and germline small variants from mapped sequencing reads
      homepage: https://github.com/Illumina/strelka
      documentation: https://github.com/Illumina/strelka/blob/v2.9.x/docs/userGuide/README.md
      tool_dev_url: https://github.com/Illumina/strelka
      doi: 10.1038/s41592-018-0051-x
      publication:
        author: "Kim, S., Scheffler, K., Halpern, A. L., Bekritsky, M. A., Noh, E., Källberg, M., Chen, X., Kim, Y., Beyter, D., Krusche, P. & Saunders, C. T."
        year: 2018
        title: "Strelka2: fast and accurate calling of germline and somatic variants"
        source: "Nature Methods"
      licence:
        - "GPL v3"
      identifier: biotools:strelka
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test']
    - input:
        type: file
        description: BAM/CRAM file
        pattern: "*.{bam,cram}"
        ontologies: []
    - input_index:
        type: file
        description: BAM/CRAI index file
        pattern: "*.{bai,crai}"
        ontologies: []
    - target_bed:
        type: file
        description: BED file containing target regions for variant calling
        pattern: "*.{bed}"
        ontologies: []
    - target_bed_index:
        type: file
        description: Index for BED file containing target regions for variant calling
        pattern: "*.{bed.tbi}"
        ontologies: []
  - fasta:
      type: file
      description: Genome reference FASTA file
      pattern: "*.{fa,fasta}"
      ontologies: []
  - fai:
      type: file
      description: Genome reference FASTA index file
      pattern: "*.{fa.fai,fasta.fai}"
      ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test']
      - "*variants.vcf.gz":
          type: file
          description: gzipped germline variant file
          pattern: "*.{vcf.gz}"
          ontologies: []
  vcf_tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test']
      - "*variants.vcf.gz.tbi":
          type: file
          description: index file for the vcf file
          pattern: "*.vcf.gz.tbi"
          ontologies: []
  genome_vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test']
      - "*genome.vcf.gz":
          type: file
          description: variant records and compressed non-variant blocks
          pattern: "*_genome.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  genome_vcf_tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test']
      - "*genome.vcf.gz.tbi":
          type: file
          description: index file for the genome_vcf file
          pattern: "*_genome.vcf.gz.tbi"
          ontologies: []
  versions_strelka:
    - - ${task.process}:
          type: string
          description: The name of the process
      - strelka:
          type: string
          description: The name of the tool
      - configureStrelkaGermlineWorkflow.py --version:
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - strelka:
          type: string
          description: The name of the tool
      - configureStrelkaGermlineWorkflow.py --version:
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@arontommi"
maintainers:
  - "@arontommi"
containers:
