name: narfmap_hashtable
description: Create DRAGEN hashtable for reference genome
keywords:
  - index
  - fasta
  - genome
  - reference
tools:
  - narfmap:
      description: narfmap is a fork of the Dragen mapper/aligner Open Source Software.
      homepage: https://github.com/edmundmiller/narfmap
      documentation: https://github.com/edmundmiller/NARFMAP/blob/main/doc/usage.md#basic-command-line-usage
      tool_dev_url: https://github.com/edmundmiller/narfmap
      licence: ["GPL v3"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: Input genome fasta file
        ontologies: []
output:
  hashmap:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information
            e.g. [ id:'test', single_end:false ]
      - narfmap:
          type: file
          description: NARFMAP hash table
          pattern: "*.{cmp,.bin,.txt}"
          ontologies: []
  versions_narfmap:
    - - ${task.process}:
          type: string
          description: The name of the process
      - narfmap:
          type: string
          description: The name of the tool
      - dragen-os --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - narfmap:
          type: string
          description: The name of the tool
      - dragen-os --version 2>&1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@edmundmiller"
maintainers:
  - "@edmundmiller"
