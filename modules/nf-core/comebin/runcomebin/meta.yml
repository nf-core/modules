      name: oras://community.wave.seqera.io/library/comebin:1.1.0--aa0791bc0dce0162
      build_id: bd-aa0791bc0dce0162_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/72/72a0296d1cef48031110d012695efbc67dc4a2d5cdeda0598ff8758bfd11b40c/data
