name: "edger_differential"
description: |
  Runs a differential expression analysis on a raw count matrix with edgeR,
  using a generalised linear model with quasi-likelihood F-tests (default) or
  likelihood ratio tests. The default quasi-likelihood method is the one
  introduced in edgeR 4 (Chen et al. 2025, doi:10.1093/nar/gkaf018).
  Analysis options are passed through ext.args: probe_id_col, sample_id_col,
  blocking_variables, subset_to_contrast_samples, exclude_samples_col,
  exclude_samples_values, filter_by_expr, norm_method, robust, test,
  adjust.method, prior_count and round_digits. Their defaults and allowed
  values are documented at the top of templates/edger_differential.R.
keywords:
  - differential
  - expression
  - rna-seq
  - edger
  - glm
  - quasi-likelihood
tools:
  - "edger":
      description: "Empirical Analysis of Digital Gene Expression Data in R"
      homepage: "https://bioconductor.org/packages/release/bioc/html/edgeR.html"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/edgeR/inst/doc/edgeRUsersGuide.pdf"
      tool_dev_url: "https://git.bioconductor.org/packages/edgeR"
      doi: "10.1093/bioinformatics/btp616"
      licence:
        - "GPL >=2"
      identifier: biotools:edger
  - "limma":
      description: "Linear Models for Microarray Data"
      homepage: "https://bioconductor.org/packages/release/bioc/html/limma.html"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/limma/inst/doc/usersguide.pdf"
      tool_dev_url: "https://git.bioconductor.org/packages/limma"
      doi: "10.1093/nar/gkv007"
      licence:
        - "LGPL >=3"
      identifier: biotools:limma
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing contrast information, e.g. [ id:'contrast1' ].
          Optional parameters such as blocking variables are not read from the
          meta map; pass them through ext.args, e.g.
          `--blocking_variables ${meta.blocking}`.
    - contrast_variable:
        type: string
        description: |
          (Optional, required if reference and target are used) The column in the sample sheet that should be used to define groups for
          comparison
    - reference:
        type: string
        description: |
          (Optional, required if contrast_variable and target are used) The value within the contrast_variable column of the sample sheet that
          should be used to derive the reference samples
    - target:
        type: string
        description: |
          (Optional, required if contrast_variable and reference are used) The value within the contrast_variable column of the sample sheet that
          should be used to derive the target samples
    - formula:
        type: string
        description: (Optional, requires comparison if used) R formula string used
          for modeling, e.g. '~ treatment'.
    - comparison:
        type: string
        description: (Optional, mandatory if formula is used) Literal string
          passed to `limma::makeContrasts`, e.g. 'treatmentmCherry'.
  - - meta2:
        type: map
        description: |
          Groovy map containing study-wide metadata related to the sample sheet
          and matrix
    - samplesheet:
        type: file
        description: Sample sheet file (CSV or TSV) with one row per sample
        pattern: "*.{csv,tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3752 # CSV
    - counts:
        type: file
        description: |
          Raw (unnormalised) count matrix in CSV or TSV format with genes by row
          and samples by column
        pattern: "*.{csv,tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3752 # CSV
output:
  results:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.edger.results.tsv":
          type: file
          description: |
            TSV-format table of differential expression results from edgeR
            `topTags`, with one row per feature in input order. Columns are the
            feature ID (named after `probe_id_col`), `logFC`, `logCPM`, `F`
            (QLF) or `LR` (LRT), `PValue` and the adjusted p-value. The adjusted
            p-value column is `FDR` for `adjust.method` BH, BY or fdr, `FWER`
            for holm, hochberg, hommel or bonferroni, and absent for none.
          pattern: "*.edger.results.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  md_plot:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.edger.mean_difference.png":
          type: file
          description: edgeR mean difference (MD) plot
          pattern: "*.edger.mean_difference.png"
          ontologies:
            - edam: http://edamontology.org/format_3603 # PNG
  bcv_plot:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.edger.bcv.png":
          type: file
          description: edgeR biological coefficient of variation (BCV) plot
          pattern: "*.edger.bcv.png"
          ontologies:
            - edam: http://edamontology.org/format_3603 # PNG
  rdata:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.DGEGLM.edger.rds":
          type: file
          description: Serialised DGEGLM object (RDS)
          pattern: "*.DGEGLM.edger.rds"
          ontologies: []
  model:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.edger.model.txt":
          type: file
          description: Text file containing the model formula, the contrast string and the test used (QLF or LRT)
          pattern: "*.edger.model.txt"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text
  norm_factors:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.edger.norm_factors.tsv":
          type: file
          description: TSV-format table of library sizes and normalisation factors per sample
          pattern: "*.edger.norm_factors.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  normalised_counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.normalised_counts.tsv":
          type: file
          description: |
            Normalised log2-CPM TSV-format expression matrix with genes by row
            and samples by column. Includes all features, including any removed
            by filter_by_expr, computed with the effective library sizes of the
            fitted data.
          pattern: "*.normalised_counts.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  session_info:
    - - meta:
          type: map
          description: |
            Groovy Map containing contrast information, e.g. [ id:'contrast1' ]
      - "*.R_sessionInfo.log":
          type: file
          description: Dump of R sessionInfo
          pattern: "*.R_sessionInfo.log"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@HR-cruk"
maintainers:
  - "@HR-cruk"
