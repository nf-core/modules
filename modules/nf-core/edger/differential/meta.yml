name: edger_differential
description: |
  Runs a differential expression analysis on count data with edgeR.
  Options are passed via `ext.args` as `--option value` pairs:
  `gene_id_col` (default `gene_id`), `sample_id_col` (`experiment_accession`),
  `blocking_variables` (`;`-separated sample sheet columns, not combinable with a formula),
  `subset_to_contrast_samples` (`FALSE`), `exclude_samples_col` and `exclude_samples_values` (`;`-separated),
  `filter_by_expr` (`FALSE`), `min_count` (`10`), `norm_method` (`TMM`), `test_method` (`qlf` for
  glmQLFit/glmQLFTest or `lrt` for glmFit/glmLRT), `robust` (`TRUE`), `prior_count` (`2`),
  `adjust_method` (`BH`) and `round_digits` (no rounding).
  Defaults that differ from edgeR's own: `robust` is `TRUE` for both `estimateDisp` and `glmQLFit`
  (edgeR default `FALSE`), and `filterByExpr` is off by default because pipelines usually filter
  upstream; when enabled, `min_count` is passed as `min.count`.
  Sample sheet column names, including those used in a formula, are converted with `make.names()`.
keywords:
  - differential
  - expression
  - rna-seq
  - counts
  - edger
tools:
  - edger:
      description: Empirical Analysis of Digital Gene Expression Data in R
      homepage: https://bioconductor.org/packages/release/bioc/html/edgeR.html
      documentation: https://bioconductor.org/packages/release/bioc/vignettes/edgeR/inst/doc/edgeRUsersGuide.pdf
      tool_dev_url: https://code.bioconductor.org/browse/edgeR/
      doi: 10.1093/bioinformatics/btp616
      licence:
        - GPL >=2
      identifier: biotools:edger
input:
  - - meta:
        type: map
        description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
    - contrast_variable:
        type: string
        description: (Optional, required if reference and target are used) The column in the sample sheet that should be used to define groups for comparison
    - reference:
        type: string
        description: (Optional, required if contrast_variable and target are used) The value within the contrast_variable column of the sample sheet that should be used to derive the reference samples
    - target:
        type: string
        description: (Optional, required if contrast_variable and reference are used) The value within the contrast_variable column of the sample sheet that should be used to derive the target samples
    - formula:
        type: string
        description: (Optional, requires comparison if used) R formula string used to build the design matrix, e.g. '~ genotype * treatment'. Cannot be combined with `blocking_variables`
    - comparison:
        type: string
        description: (Optional, mandatory if formula is used; requires either formula or contrast_variable) Literal contrast string passed to `limma::makeContrasts`, using design matrix column names after `make.names()`, e.g. 'genotypeWT.treatmentTreated'
  - - meta2:
        type: map
        description: Groovy map containing study-wide metadata related to the sample sheet and count matrix
    - samplesheet:
        type: file
        description: CSV or TSV sample sheet with one row per sample
        pattern: "*.{csv,tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3752
          - edam: http://edamontology.org/format_3475
    - counts:
        type: file
        description: CSV or TSV raw count matrix with features by row and samples by column. Columns not matching a sample in the sample sheet (e.g. gene names) are ignored
        pattern: "*.{csv,tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3752
          - edam: http://edamontology.org/format_3475
output:
  results:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.results.tsv":
          type: file
          description: TSV table of differential expression statistics (logFC, logCPM, F or LR, PValue, FDR) as output by edgeR topTags
          pattern: "*.edger.results.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  md_plot:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.mean_difference.png":
          type: file
          description: Mean-difference (MD) plot of the tested contrast
          pattern: "*.edger.mean_difference.png"
          ontologies:
            - edam: http://edamontology.org/format_3603
  bcv_plot:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.bcv.png":
          type: file
          description: Biological coefficient of variation (BCV) plot of the estimated dispersions
          pattern: "*.edger.bcv.png"
          ontologies:
            - edam: http://edamontology.org/format_3603
  rdata:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.DGEGLM.edger.rds":
          type: file
          description: Serialised DGEGLM object of the fitted edgeR model
          pattern: "*.DGEGLM.edger.rds"
          ontologies: []
  model:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.model.txt":
          type: file
          description: Text file containing the model formula
          pattern: "*.edger.model.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330
  normalised_counts:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.normalised_counts.tsv":
          type: file
          description: TSV table of normalised log2 counts per million
          pattern: "*.normalised_counts.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  session_info:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.R_sessionInfo.log":
          type: file
          description: R session information
          pattern: "*.R_sessionInfo.log"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750
