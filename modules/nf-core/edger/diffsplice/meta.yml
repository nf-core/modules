# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: edger_diffsplice
description: |
  Tests for differential exon usage (or differential transcript usage) with edgeR,
  fitting a model with `glmQLFit` or `glmFit` and testing each gene's features
  against the gene average with `diffSpliceDGE`, for one contrast.
  The count matrix has one row per feature (e.g. exon or transcript), a gene ID column
  and a feature ID column. A multi-sample featureCounts table can be passed as it is with
  e.g. `--gene_id_col Geneid --feature_id_col Start --count_col_suffix .bam`.
  Options are passed via `ext.args` as `--option value` pairs:
  `gene_id_col` (default `gene_id`), `feature_id_col` (`feature_id`, the exon or transcript ID column),
  `annotation_cols` (`;`-separated count table columns carried into the results, e.g. `Chr;End;Strand`),
  `count_col_suffix` (removed from the end of count table column names to match sample IDs, e.g. `.bam`),
  `sample_id_col` (`experiment_accession`),
  `blocking_variables` (`;`-separated sample sheet columns, not combinable with a formula),
  `subset_to_contrast_samples` (`FALSE`, needs a contrast variable), `exclude_samples_col` and `exclude_samples_values` (`;`-separated),
  `filter_by_expr` (`FALSE`), `min_count` (`10`), `norm_method` (`TMM`), `test_method` (`qlf` for
  glmQLFit or `lrt` for glmFit), `robust` (`TRUE`), `adjust_method` (`BH`),
  `plot_n` (`10`, number of top genes by Simes p-value drawn with `plotSpliceDGE`) and `round_digits` (no rounding).
  Defaults that differ from edgeR's own: `robust` is `TRUE` for both `estimateDisp` and `glmQLFit`
  (edgeR default `FALSE`), and `filterByExpr` is off by default because pipelines usually filter
  upstream; when enabled, `min_count` is passed as `min.count`.
  Sample sheet column names, including those used in a formula, are converted with `make.names()`.
  With a contrast variable, design matrix columns are named `<variable>.<level>` (e.g. `condition.YRI`),
  so a comparison string given with a contrast variable uses that form (`condition.YRI-condition.GBR`);
  with a formula they keep the `model.matrix` names (e.g. `conditionYRI`).
  The result tables are in the order topSpliceDGE returns them, sorted by p-value, not in input order.
keywords:
  - differential
  - splicing
  - exon usage
  - transcript usage
  - rna-seq
  - edger
tools:
  - edger:
      description: Empirical Analysis of Digital Gene Expression Data in R
      homepage: https://bioconductor.org/packages/release/bioc/html/edgeR.html
      documentation: https://bioconductor.org/packages/release/bioc/vignettes/edgeR/inst/doc/edgeRUsersGuide.pdf
      tool_dev_url: https://code.bioconductor.org/browse/edgeR/
      doi: 10.1093/bioinformatics/btp616
      licence:
        - GPL >=2
      identifier: biotools:edger
input:
  - - meta:
        type: map
        description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
    - contrast_variable:
        type: string
        description: (Optional, required if reference and target are used) The column in the sample sheet that should be used to define groups for comparison
    - reference:
        type: string
        description: (Optional, required if contrast_variable and target are used) The value within the contrast_variable column of the sample sheet that should be used to derive the reference samples
    - target:
        type: string
        description: (Optional, required if contrast_variable and reference are used) The value within the contrast_variable column of the sample sheet that should be used to derive the target samples
    - formula:
        type: string
        description: (Optional, requires comparison if used) R formula string used to build the design matrix, e.g. '~ genotype * treatment'. Cannot be combined with `blocking_variables`
    - comparison:
        type: string
        description: (Optional, mandatory if formula is used; requires either formula or contrast_variable) Literal contrast string passed to `limma::makeContrasts`, using design matrix column names after `make.names()`, e.g. 'genotypeWT.treatmentTreated'
  - - meta2:
        type: map
        description: Groovy map containing study-wide metadata related to the sample sheet and count matrix
    - samplesheet:
        type: file
        description: CSV or TSV sample sheet with one row per sample
        pattern: "*.{csv,tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3752
          - edam: http://edamontology.org/format_3475
    - counts:
        type: file
        description: CSV or TSV raw count matrix with one row per feature (e.g. exon or transcript), a gene ID column, a feature ID column and one column per sample. Lines starting with '#' are skipped and columns that are neither annotation nor a sample in the sample sheet are ignored, so a multi-sample featureCounts table can be used with `--gene_id_col Geneid --feature_id_col Start` and `--count_col_suffix`
        pattern: "*.{csv,tsv,txt}"
        ontologies:
          - edam: http://edamontology.org/format_3752
          - edam: http://edamontology.org/format_3475
output:
  results:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.diffsplice.results.tsv":
          type: file
          description: TSV table of the feature-level test of each feature against the other features of its gene, as output by edgeR topSpliceDGE with test 'exon', sorted by p-value. Columns are the gene, feature and annotation columns, then `logFC`, `exon.F` (`qlf`) or `exon.LR` (`lrt`), `P.Value` and `FDR`
          pattern: "*.edger.diffsplice.results.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  simes:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.diffsplice.simes.tsv":
          type: file
          description: TSV table of gene-level results combining the feature-level p-values with Simes' method, as output by edgeR topSpliceDGE with test 'Simes', sorted by p-value. Columns are the gene-level annotation columns, then `NExons`, `P.Value` and `FDR`
          pattern: "*.edger.diffsplice.simes.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  gene:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.diffsplice.gene.tsv":
          type: file
          description: TSV table of gene-level F or likelihood ratio test results, as output by edgeR topSpliceDGE with test 'gene', sorted by p-value. Columns are the gene-level annotation columns, then `NExons`, `gene.F` (`qlf`) or `gene.LR` (`lrt`), `P.Value` and `FDR`
          pattern: "*.edger.diffsplice.gene.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  plots:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.diffsplice.pdf":
          type: file
          description: PDF with one plotSpliceDGE page per top gene by Simes p-value
          pattern: "*.edger.diffsplice.pdf"
          ontologies:
            - edam: http://edamontology.org/format_3508
  bcv_plot:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.bcv.png":
          type: file
          description: Biological coefficient of variation (BCV) plot of the estimated dispersions
          pattern: "*.edger.bcv.png"
          ontologies:
            - edam: http://edamontology.org/format_3603
  rdata:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.DGEGLM.edger.rds":
          type: file
          description: Serialised DGEGLM object of the fitted edgeR model
          pattern: "*.DGEGLM.edger.rds"
          ontologies: []
  lrt:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.DGELRT.edger.rds":
          type: file
          description: Serialised DGELRT object returned by diffSpliceDGE
          pattern: "*.DGELRT.edger.rds"
          ontologies: []
  model:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.edger.model.txt":
          type: file
          description: Text file containing the model formula
          pattern: "*.edger.model.txt"
          ontologies:
            - edam: http://edamontology.org/format_2330
  session_info:
    - - meta:
          type: map
          description: "Groovy Map containing contrast information, e.g. [ id:'contrast1', blocking:'patient' ].\nThis can be used at the workflow level to pass optional parameters to the module via ext.args,\ne.g. '--blocking_variables $meta.blocking'."
      - "*.R_sessionInfo.log":
          type: file
          description: R session information
          pattern: "*.R_sessionInfo.log"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: versions.yml
        ontologies:
          - edam: http://edamontology.org/format_3750
