name: "tcoffee_tcs"
description: Compute the TCS score for a MSA or for a MSA plus a library file. Outputs the tcs as it is and a csv with just the total TCS score.
keywords:
  - alignment
  - MSA
  - evaluation
tools:
  - "tcoffee":
      description: "A collection of tools for Multiple Alignments of DNA, RNA, Protein Sequence"
      homepage: "https://tcoffee.org/Projects/tcoffee/index.html"
      documentation: "https://tcoffee.readthedocs.io/en/latest/tcoffee_main_documentation.html"
      tool_dev_url: "https://github.com/cbcrg/tcoffee"
      doi: "10.1006/jmbi.2000.4042"
      licence:
        - "GPL v3"
      identifier: ""
  - "pigz":
      description: "Parallel implementation of the gzip algorithm."
      homepage: "https://zlib.net/pigz/"
      documentation: "https://zlib.net/pigz/pigz.pdf"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', ... ]
    - msa:
        type: file
        description: fasta file containing the alignment to be evaluated. May be gzipped or uncompressed.
        pattern: "*.{aln,fa,fasta,fas}{.gz,}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_2554 # ALIGNMENT FORMAT TXT
          - edam: http://edamontology.org/format_1921 # ALIGNMENT FORMAT
          - edam: http://edamontology.org/format_1984 # FASTA-ALN
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - lib:
        type: file
        description: lib file containing the alignment library of the given msa.
        pattern: "*{.tc_lib,*_lib}"
        ontologies: []
output:
  tcs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.tcs":
          type: file
          description: The msa represented in tcs format, prepended with TCS scores
          pattern: "*.tcs"
          ontologies: []
  scores:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.scores":
          type: file
          description: a file containing the score of the alignment in csv format
          pattern: "*.scores"
          ontologies: []
  versions_tcoffee:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tcoffee:
          type: string
          description: The name of the tool
      - t_coffee -version | sed -n 's/.*Version_\([^ ]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool

  versions_pigz:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - pigz --version 2>&1 | sed "s/^.*pigz[[:space:]]*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tcoffee:
          type: string
          description: The name of the tool
      - t_coffee -version | sed -n 's/.*Version_\([^ ]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - pigz --version 2>&1 | sed "s/^.*pigz[[:space:]]*//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@alessiovignoli"
