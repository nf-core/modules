name: "tcoffee_regressive"
description: Aligns sequences using the regressive algorithm as implemented in the T_COFFEE package
keywords:
  - alignment
  - MSA
  - genomics
tools:
  - "tcoffee":
      description: "A collection of tools for Computing, Evaluating and Manipulating Multiple Alignments of DNA, RNA, Protein Sequences and Structures."
      homepage: "https://tcoffee.org/Projects/tcoffee/index.html"
      documentation: "https://tcoffee.readthedocs.io/en/latest/tcoffee_main_documentation.html"
      tool_dev_url: "https://github.com/cbcrg/tcoffee"
      doi: "10.1038/s41587-019-0333-6"
      licence:
        - "GPL v3"
      identifier: ""
  - "pigz":
      description: "Parallel implementation of the gzip algorithm."
      homepage: "https://zlib.net/pigz/"
      documentation: "https://zlib.net/pigz/pigz.pdf"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test']`
    - fasta:
        type: file
        description: Input sequences in FASTA format
        pattern: "*.{fa,fasta}"
        ontologies:
          - edam: http://edamontology.org/format_1919 # SEQUENCE-LIKE
          - edam: http://edamontology.org/format_1929 # FASTA
  - - meta2:
        type: map
        description: |
          Groovy Map containing tree information
          e.g. `[ id:'test_tree']`
    - tree:
        type: file
        description: Input guide tree in Newick format
        pattern: "*.{dnd}"
        ontologies:
          - edam: http://edamontology.org/format_2006 # PHYLOGENETIC TREE
  - - meta3:
        type: map
        description: |
          Groovy Map containing tree information
          e.g. `[ id:'test_infos']`
    - template:
        type: file
        description: T_coffee template file that maps sequences to the accessory information files to be used.
        ontologies:
          - edam: http://edamontology.org/format_1476 # PDB
    - accessory_information:
        type: file
        description: Accessory files to be used in the alignment. For example, it could be protein structures or secondary structures.
        ontologies:
          - edam: http://edamontology.org/format_1476 # PDB
  - compress:
      type: boolean
      description: Flag representing whether the output MSA should be compressed. Set to true to enable/false to disable compression. Compression is done using pigz, and is multithreaded.
output:
  alignment:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test']`
      - "*.aln{.gz,}":
          type: file
          description: Alignment file in FASTA format. May be gzipped.
          pattern: "*.aln{.gz,}"
          ontologies:
            - edam: http://edamontology.org/format_2554 # ALIGNMENT FORMAT TXT
            - edam: http://edamontology.org/format_1921 # ALIGNMENT FORMAT
            - edam: http://edamontology.org/format_1984 # FASTA-ALN
  versions_tcoffee:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tcoffee:
          type: string
          description: The name of the tool
      - t_coffee -version | sed -n 's/.*Version_\([^ ]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool

  versions_pigz:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - pigz --version 2>&1 | sed "s/^.*pigz[[:space:]]*//":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tcoffee:
          type: string
          description: The name of the tool
      - t_coffee -version | sed -n 's/.*Version_\([^ ]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - pigz:
          type: string
          description: The name of the tool
      - pigz --version 2>&1 | sed "s/^.*pigz[[:space:]]*//":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@luisas"
maintainers:
  - "@luisas"
