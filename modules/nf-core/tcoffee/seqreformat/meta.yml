name: "tcoffee_seqreformat"
description: Reformats files with t-coffee
keywords:
  - reformatting
  - alignment
  - genomics
tools:
  - "tcoffee":
      description: "A collection of tools for Computing, Evaluating and Manipulating Multiple Alignments of DNA, RNA, Protein Sequences and Structures."
      homepage: "https://tcoffee.org/Projects/tcoffee/index.html"
      documentation: "https://tcoffee.readthedocs.io/en/latest/tcoffee_main_documentation.html"
      tool_dev_url: "https://github.com/cbcrg/tcoffee"
      doi: "10.1006/jmbi.2000.4042"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - infile:
        type: file
        description: Input file to be reformatted
        ontologies: []
output:
  formatted_file:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - ${prefix}.txt:
          type: file
          description: Formatted file
          pattern: "*"
          ontologies: []
  versions_tcoffee:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tcoffee:
          type: string
          description: The name of the tool
      - t_coffee -version | sed -n 's/.*Version_\([^ ]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tcoffee:
          type: string
          description: The name of the tool
      - t_coffee -version | sed -n 's/.*Version_\([^ ]*\).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@luisas"
  - "@JoseEspinosa"
