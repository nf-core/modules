# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: somalier_contamination
description:
  "Estimate contamination with somalier (>= 0.3.2): CHARR per sample and exact anchored (conpair-like) contamination
  MLEs for every ordered pair of extracted samples"
keywords:
  - contamination
  - QC
  - somalier
  - bam
  - cram
  - charr
tools:
  - somalier:
      description:
        Somalier can extract informative sites, evaluate relatedness, and perform quality-control on BAM/CRAM/BCF/VCF/GVCF
        or from jointly-called VCFs
      homepage: https://github.com/brentp/somalier
      documentation: https://github.com/brentp/somalier/blob/master/README.md
      tool_dev_url: https://github.com/brentp/somalier
      doi: 10.1186/s13073-020-00761-2
      licence:
        - MIT
      identifier: biotools:somalier
input:
  - - meta:
        type: map
        description: "Groovy Map containing group information

          e.g. [ id:'batch1' ]

          "
    - extract:
        type: file
        description: List of .somalier files from somalier extract
        pattern: "*.somalier"
        ontologies: []
  - - meta2:
        type: map
        description: "Groovy Map containing sites information

          e.g. [ id:'hg38' ]

          "
    - sites:
        type: file
        description: Sites VCF with INFO/AF; must be the sites file used for somalier extract
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3016
output:
  samples_tsv:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.samples.tsv":
          type: file
          description: Per-sample CHARR contamination estimates
          pattern: "*.samples.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  pairs_tsv:
    - - meta:
          type: map
          description: "Groovy Map containing sample information

            e.g. [ id:'sample1' ]

            "
      - "*.pairs.tsv":
          type: file
          description: Anchored contamination MLE for every ordered sample pair
          pattern: "*.pairs.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475
  versions_somalier:
    - &id001
      - ${task.process}:
          type: string
          description: The name of the process
      - somalier:
          type: string
          description: The name of the tool
      - 'somalier 2>&1 | sed -n ''s/.*version: \([0-9.]*\).*/\1/p''':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - *id001
authors:
  - "@apeltzer"
maintainers:
  - "@apeltzer"
