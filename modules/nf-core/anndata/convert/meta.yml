name: anndata_convert
description: Convert an AnnData H5AD file to Seurat and SingleCellExperiment RDS objects
keywords:
  - single-cell
  - anndata
  - conversion
tools:
  - "anndata":
      description: "An annotated data matrix."
      homepage: "https://anndata.readthedocs.io"
      documentation: "https://anndata.readthedocs.io"
      tool_dev_url: "https://github.com/theislab/anndata"
      doi: "10.21105/joss.04371"
      licence:
        - "BSD-3-clause"
      identifier: biotools:anndata
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - h5ad:
        type: file
        description: Anndata object as H5AD file
        pattern: "*.h5ad"
output:
  seurat:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "${prefix}.seurat.rds":
          type: file
          description: Seurat object saved as an RDS file
          pattern: "*.seurat.rds"
          ontologies: []
  sce:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "${prefix}.sce.rds":
          type: file
          description: SingleCellExperiment object saved as an RDS file
          pattern: "*.sce.rds"
          ontologies: []
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750"
authors:
  - "@fmalmeida"
  - "@nictru"
maintainers:
  - "@fmalmeida"
