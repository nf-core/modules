name: seacr_callpeak
description: Call peaks using SEACR on sequenced reads in bedgraph format
keywords:
  - peak-caller
  - peaks
  - bedgraph
  - cut&tag
  - cut&run
  - chromatin
  - seacr
tools:
  - seacr:
      description: |
        SEACR is intended to call peaks and enriched regions from sparse CUT&RUN
        or chromatin profiling data in which background is dominated by "zeroes"
        (i.e. regions with no read coverage).
      homepage: https://github.com/FredHutch/SEACR
      documentation: https://github.com/FredHutch/SEACR
      licence:
        - "GPL-2.0-only"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bedgraph:
        type: file
        description: |
          The target bedgraph file from which the peaks will be calculated.
        ontologies: []
    - ctrlbedgraph:
        type: file
        description: |
          Control (IgG) data bedgraph file to generate an empirical threshold for peak calling.
        ontologies: []
  - threshold:
      type: integer
      description: |
        Threshold value used to call peaks if the ctrlbedgraph input is set to []. Set to 1 if using a control bedgraph
output:
  bed:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bed":
          type: file
          description: Bed file containing the calculated peaks.
          pattern: "*.bed"
          ontologies: []
  versions_scramble:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scramble:
          type: string
          description: The name of the tool
      - "1.3":
          type: string
          description: The expression to obtain the version of the tool

  versions_bedtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bedtools:
          type: string
          description: The name of the tool
      - bedtools --version | sed -e 's/bedtools v//g':
          type: eval
          description: The expression to obtain the version of the tool

  versions_rbase:
    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed '1!d; s/.*version //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scramble:
          type: string
          description: The name of the tool
      - "1.3":
          type: string
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - bedtools:
          type: string
          description: The name of the tool
      - bedtools --version | sed -e 's/bedtools v//g':
          type: eval
          description: The expression to obtain the version of the tool

    - - ${task.process}:
          type: string
          description: The name of the process
      - r-base:
          type: string
          description: The name of the tool
      - R --version | sed '1!d; s/.*version //; s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@chris-cheshire"
maintainers:
  - "@chris-cheshire"
