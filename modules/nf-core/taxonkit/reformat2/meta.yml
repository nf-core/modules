name: "taxonkit_reformat2"
description: Reformat the lineage of NCBI TaxIds into a chosen set of ranks
keywords:
  - taxonomy
  - taxids
  - lineage
  - ranks
  - ncbi
tools:
  - "taxonkit":
      description: "A practical and efficient NCBI taxonomy toolkit"
      homepage: "https://bioinf.shenwei.me/taxonkit/"
      documentation: "https://bioinf.shenwei.me/taxonkit/usage/#reformat2"
      tool_dev_url: "https://github.com/shenwei356/taxonkit"
      doi: "10.1016/j.jgg.2021.03.006"
      licence:
        - "MIT"
      identifier: biotools:taxonkit
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - taxid:
        type: string
        description: Optional. Inline TaxId(s) to reformat (provide either this or taxidfile, not both)
    - taxidfile:
        type: file
        description: Optional. File with TaxIds, one record per line (provide either this or taxid, not both)
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_3671 # Plain text
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3989 # GZIP format
  - - meta2:
        type: map
        description: |
          Groovy Map containing taxonomy database information
          e.g. `[ id:'taxdump' ]`
    - taxdb:
        type: directory
        description: Directory with the unpacked NCBI taxdump (names.dmp, nodes.dmp, delnodes.dmp, merged.dmp)
        pattern: "*"
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.reformat2.tsv:
          type: file
          description: TSV file with the input line(s) followed by the reformatted lineage (and the lineage TaxIds with `-t`)
          pattern: "*.reformat2.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_taxonkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxonkit:
          type: string
          description: The name of the tool
      - taxonkit version | sed 's/.* v//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxonkit:
          type: string
          description: The name of the tool
      - taxonkit version | sed 's/.* v//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@plazanas"
maintainers:
  - "@plazanas"
