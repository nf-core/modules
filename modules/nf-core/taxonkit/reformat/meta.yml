name: "taxonkit_reformat"
description: Reformat NCBI taxonomy lineages into canonical ranks
keywords:
  - taxonomy
  - taxids
  - lineage
  - ranks
  - ncbi
tools:
  - "taxonkit":
      description: "A practical and efficient NCBI taxonomy toolkit"
      homepage: "https://bioinf.shenwei.me/taxonkit/"
      documentation: "https://bioinf.shenwei.me/taxonkit/usage/#reformat"
      tool_dev_url: "https://github.com/shenwei356/taxonkit"
      doi: "10.1016/j.jgg.2021.03.006"
      licence:
        - "MIT"
      identifier: biotools:taxonkit
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input:
        type: file
        description: Tab-separated lineage table (lineage in field 2 by default, e.g. from taxonkit/lineage)
        pattern: "*.{tsv,tsv.gz,txt,txt.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
          - edam: http://edamontology.org/format_3989 # GZIP
  - - meta2:
        type: map
        description: |
          Groovy Map containing taxonomy database information
          e.g. `[ id:'taxdump' ]`
    - taxdb:
        type: directory
        description: NCBI taxdump directory containing names.dmp, nodes.dmp, delnodes.dmp and merged.dmp
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.reformat.tsv:
          type: file
          description: Input columns followed by the reformatted lineage (and lineage TaxIds with `--show-lineage-taxids`)
          pattern: "*.reformat.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_taxonkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxonkit:
          type: string
          description: The name of the tool
      - taxonkit version | sed 's/.* v//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - taxonkit:
          type: string
          description: The name of the tool
      - taxonkit version | sed 's/.* v//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@plazanas"
maintainers:
  - "@plazanas"
