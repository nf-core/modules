---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  - "bioconda::colabfold=1.5.5"
  # CUDA 12.0 is the lowest CUDA whose jaxlib build ships ptxas (via cuda-nvcc)
  - "conda-forge::cuda-version=12.0"
  # colabfold 1.5.5 needs jax <0.4.26; newer dm-haiku releases need a newer jax
  - "conda-forge::dm-haiku=0.0.12"
  - "conda-forge::flax=0.8.2"
  - "conda-forge::jax=0.4.25"
  - "conda-forge::jaxlib=0.4.25=*cuda*"
