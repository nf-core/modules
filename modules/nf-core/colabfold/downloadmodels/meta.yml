name: colabfold_downloadmodels
description: Downloads the AlphaFold2 (or DeepFold) parameters that ColabFold needs, once, as a data directory for colabfold/colabfold
keywords:
  - protein structure
  - structure prediction
  - AlphaFold2
  - model
  - download
tools:
  - colabfold:
      description: |
        ColabFold runs AlphaFold2 (and other folding models) while sourcing its
        multiple sequence alignment from a remote MMseqs2 server. This module
        calls ColabFold's own downloader, `download_alphafold_params()`, which
        extracts the parameters into `params/` and writes the empty
        `params/download*_finished.txt` marker that `colabfold_batch` checks
        before using a data directory.
      homepage: https://github.com/sokrypton/ColabFold
      documentation: https://github.com/sokrypton/ColabFold
      doi: 10.1038/s41592-022-01488-1
      licence: ["MIT"]
      identifier: biotools:colabfold

input:
  - model_type:
      type: string
      description: |
        Set of parameters to download, as named by `colabfold_batch --model-type`:
        `alphafold2_ptm` (monomers, ~3.5 GB), `alphafold2_multimer_v1`,
        `alphafold2_multimer_v2`, `alphafold2_multimer_v3` (complexes) or `deepfold_v1`
output:
  weights:
    - - meta:
          type: map
          description: |
            Groovy Map naming the downloaded parameter set
            e.g. [ id:'alphafold2_ptm' ]
      - weights:
          type: directory
          description: ColabFold data directory with the parameters and the download marker in `params/`, to pass as `weights` to colabfold/colabfold
          pattern: "weights"
          ontologies: []
  versions_colabfold:
    - - ${task.process}:
          type: string
          description: The name of the process
      - colabfold:
          type: string
          description: The name of the tool
      - python -c 'import importlib.metadata as m; print(m.version("colabfold"))':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - colabfold:
          type: string
          description: The name of the tool
      - python -c 'import importlib.metadata as m; print(m.version("colabfold"))':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@Bboy010"
maintainers:
