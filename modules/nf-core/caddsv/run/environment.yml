---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  # All workflow rule dependencies (coordinate, SegmentNT and scoring), so the
  # module runs `caddsv run --no-use-conda`.
  # Snakemake >=9: 8.x calls `conda info` when reporting a failed rule and then
  # hangs. The bundled models need numpy 2 and scikit-learn 1.5.2.
  - bioconda::bedops=2.4.36
  - bioconda::bedtools=2.27.1
  - bioconda::caddsv=2.0.4
  - bioconda::htslib=1.21
  - bioconda::pysam=0.22.1
  - bioconda::samtools=1.21
  - bioconda::snakemake-minimal=9.22.0
  - conda-forge::h5py=3.12.1
  - conda-forge::huggingface_hub=0.36.0
  - conda-forge::joblib=1.4.2
  - conda-forge::numpy=2.1.3
  - conda-forge::pandas=2.2.3
  - conda-forge::pip=24.3.1
  - conda-forge::pulp=2.7.0
  - conda-forge::python=3.12.8
  - conda-forge::safetensors=0.4.5
  - conda-forge::scikit-learn=1.5.2
  - conda-forge::tokenizers=0.19.1
  - pip:
      # PyPI torch bundles CUDA, so one image serves CPU and GPU; conda-forge
      # CUDA builds cannot be solved on a GPU-less build host.
      # conda-forge transformers 4.44.2 caps numpy<2.
      - torch==2.5.1
      - transformers==4.44.2
