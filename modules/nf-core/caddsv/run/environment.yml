---
# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/environment-schema.json
channels:
  - conda-forge
  - bioconda
dependencies:
  # CADD-SV CLI and its workflow engine (caddsv pins snakemake<9 and pulp==2.7)
  # Coordinate-based workflow rule dependencies, so the module runs with
  # `caddsv run --no-use-conda` instead of per-rule conda envs or containers.
  # scikit-learn must match the version the bundled CADD-SV models were pickled with.
  - bioconda::bedops=2.4.36
  - bioconda::bedtools=2.27.1
  - bioconda::caddsv=2.0.4
  - bioconda::htslib=1.21
  - bioconda::pysam=0.22.1
  - bioconda::samtools=1.21
  - bioconda::snakemake=8.30.0
  - conda-forge::joblib=1.4.2
  - conda-forge::numpy=2.1.3
  - conda-forge::pandas=2.2.3
  - conda-forge::pulp=2.7.0
  - conda-forge::python=3.12
  - conda-forge::scikit-learn=1.5.2
