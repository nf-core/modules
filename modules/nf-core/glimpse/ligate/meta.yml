name: "glimpse_ligate"
description: Concatenates imputation chunks in a single VCF/BCF file ligating phased information.
keywords:
  - ligate
  - low-coverage
  - glimpse
  - imputation
tools:
  - "glimpse":
      description: "GLIMPSE is a phasing and imputation method for large-scale low-coverage sequencing studies."
      homepage: "https://odelaneau.github.io/GLIMPSE"
      documentation: "https://odelaneau.github.io/GLIMPSE/"
      tool_dev_url: "https://github.com/odelaneau/GLIMPSE"
      doi: "10.1038/s41588-020-00756-0"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input_list:
        type: file
        description: VCF/BCF file containing genotype probabilities (GP field).
        pattern: "*.{vcf,bcf,vcf.gz,bcf.gz}"
        ontologies: []
    - input_index:
        type: file
        description: Index file of the input VCF/BCF file containing genotype likelihoods.
        pattern: "*.{vcf.gz.csi,bcf.gz.csi}"
        ontologies: []
  - extension:
      type: string
      description: |
        File extension of the output file, which determines the output format.
        Defaults to 'vcf.gz' if empty.
      enum: ["vcf", "vcf.gz", "bcf", "bcf.gz"]
output:
  merged_variants:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{vcf,bcf,vcf.gz,bcf.gz}":
          type: file
          description: |
            Output VCF/BCF file for the merged regions.
            Phased information (HS field) is updated accordingly for the full region.
          pattern: "*.{vcf,bcf,vcf.gz,bcf.gz}"
          ontologies: []
  versions_glimpse:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glimpse:
          type: string
          description: The name of the tool
      - "GLIMPSE_ligate --help | sed -n '/Version/s/.*: //p'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glimpse:
          type: string
          description: The name of the tool
      - "GLIMPSE_ligate --help | sed -n '/Version/s/.*: //p'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@louislenezet"
maintainers:
  - "@louislenezet"
