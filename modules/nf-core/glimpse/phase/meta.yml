name: "glimpse_phase"
description: main GLIMPSE algorithm, performs phasing and imputation refining genotype likelihoods
keywords:
  - phase
  - imputation
  - low-coverage
  - glimpse
tools:
  - "glimpse":
      description: "GLIMPSE is a phasing and imputation method for large-scale low-coverage sequencing studies."
      homepage: "https://odelaneau.github.io/GLIMPSE"
      documentation: "https://odelaneau.github.io/GLIMPSE/"
      tool_dev_url: "https://github.com/odelaneau/GLIMPSE"
      doi: "10.1038/s41588-020-00756-0"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: Input VCF/BCF file containing genotype likelihoods.
        pattern: "*.{vcf.gz,bcf.gz}"
        ontologies: []
    - input_index:
        type: file
        description: Index file of the input VCF/BCF file containing genotype likelihoods.
        pattern: "*.{vcf.gz.csi,bcf.gz.csi}"
        ontologies: []
    - samples_file:
        type: file
        description: |
          File with sample names and ploidy information.
          One sample per line with a mandatory second column indicating ploidy (1 or 2).
          Sample names that are not present are assumed to have ploidy 2 (diploids).
          GLIMPSE does NOT handle the use of sex (M/F) instead of ploidy.
        pattern: "*.{txt,tsv}"
        ontologies:
          - edam: http://edamontology.org/format_3475
    - input_region:
        type: string
        description: Target region used for imputation, including left and right buffers (e.g. chr20:1000000-2000000).
        pattern: "chrXX:leftBufferPosition-rightBufferPosition"
    - output_region:
        type: string
        description: Target imputed region, excluding left and right buffers (e.g. chr20:1000000-2000000).
        pattern: "chrXX:leftBufferPosition-rightBufferPosition"
    - reference:
        type: file
        description: Reference panel of haplotypes in VCF/BCF format.
        pattern: "*.{vcf.gz,bcf.gz}"
        ontologies: []
    - reference_index:
        type: file
        description: Index file of the Reference panel file.
        pattern: "*.{vcf.gz.csi,bcf.gz.csi}"
        ontologies: []
    - map:
        type: file
        description: File containing the genetic map.
        pattern: "*.gmap"
        ontologies: []
  - extension:
      type: string
      description: |
        File extension of the output file, which determines the output format.
        Defaults to 'vcf.gz' if empty.
      enum: ["vcf", "vcf.gz", "bcf", "bcf.gz"]
output:
  phased_variants:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{vcf,bcf,vcf.gz,bcf.gz}":
          type: file
          description: |
            Output VCF/BCF file containing genotype probabilities (GP field),
            imputed dosages (DS field), best guess genotypes (GT field),
            sampled haplotypes in the last (max 16) main iterations (HS field) and info-score.
          pattern: "*.{vcf,bcf,vcf.gz,bcf.gz}"
          ontologies: []
  versions_glimpse:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glimpse:
          type: string
          description: The name of the tool
      - "GLIMPSE_phase --help | sed -n '/Version/s/.*: //p'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - glimpse:
          type: string
          description: The name of the tool
      - "GLIMPSE_phase --help | sed -n '/Version/s/.*: //p'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@louislenezet"
maintainers:
  - "@louislenezet"
