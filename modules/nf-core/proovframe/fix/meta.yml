name: "proovframe_fix"
description: frame-shift correction for long read (meta)genomics - fix frameshifts in reads
keywords:
  - frame-shift correction
  - long-read sequencing
  - sequence analysis
tools:
  - "proovframe":
      description: "frame-shift correction for long read (meta)genomics"
      homepage: "https://github.com/thackl/proovframe"
      documentation: "https://github.com/thackl/proovframe"
      tool_dev_url: "https://github.com/thackl/proovframe"
      doi: "10.1101/2021.08.23.457338"
      licence:
        - "MIT"
      identifier: biotools:proovframe

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - fa:
        type: file
        description: "A FASTA file containing a database of guide protein sequences"
        pattern: "*.{faa,fasta,fa}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'test' ]
    - tsv:
        type: file
        description: "Output TSV file from proovframe/map with the frameshift-aware protein to read alignments from proovframe/map"
        pattern: "*.{tsv}"

        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  out_fa:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.fa":
          type: file
          description: "Result FASTA with fixed frameshift reads"
          pattern: "*.{fa}"
          ontologies: []
  versions_proovframe:
    - - ${task.process}:
          type: string
          description: The name of the process
      - proovframe:
          type: string
          description: The name of the tool
      - proovframe 2>&1 | sed '/proovframe-v/!d;s/proovframe-v//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - proovframe:
          type: string
          description: The name of the tool
      - proovframe 2>&1 | sed '/proovframe-v/!d;s/proovframe-v//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@mcarbajo"
  - "@vagkaratzas"
maintainers:
  - "@vagkaratzas"
  - "@Ge94"
