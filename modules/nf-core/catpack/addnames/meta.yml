name: "catpack_addnames"
description: Taxonomic classification of long DNA sequences and metagenome assembled genomes (e.g. MAGs / bins).
keywords:
  - taxonomic classification
  - classification
  - long reads
  - mags
  - assembly
tools:
  - "catpack":
      description: "CAT/BAT: tool for taxonomic classification of contigs and metagenome-assembled genomes (MAGs)"
      homepage: "https://github.com/MGXlab/CAT_pack"
      documentation: "https://github.com/MGXlab/CAT_pack"
      tool_dev_url: "https://github.com/MGXlab/CAT_pack"
      doi: "10.1186/s13059-019-1817-x"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`

    - input:
        type: file
        description: Classification or ORF2LCA output file from CAT/BAT/RAT
        pattern: "*.txt"
        ontologies:
          - edam: "http://edamontology.org/format_3475"

  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`

    - taxonomy:
        type: directory
        description: "Directory containing taxonomy files: names.dmp, nodes.dmp, acc2taxid.txt"
        pattern: "*/"
        ontologies:
          - edam: "http://edamontology.org/data_1049"

output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`

      - ${prefix}.txt:
          type: map
          description: |
            CAT/BAT/RAT classification file with added taxonomic names
          pattern: "*.{bam,cram,sam}"
          ontologies:
            - edam: "http://edamontology.org/format_3475"

  versions_catpack:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - catpack:
          type: string
          description: The tool name
      - "CAT_pack --version | sed 's/CAT_pack pack v//g;s/ .*//g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - catpack:
          type: string
          description: The name of the tool
      - "CAT_pack --version | sed 's/CAT_pack pack v//g;s/ .*//g'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@jfy133"
maintainers:
  - "@jfy133"
