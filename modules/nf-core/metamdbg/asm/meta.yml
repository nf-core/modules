name: "metamdbg_asm"
description: Metagenome assembler for long-read sequences (HiFi and ONT).
keywords:
  - assembly
  - long reads
  - metagenome
  - metagenome assembler
tools:
  - "metamdbg":
      description: "MetaMDBG: a lightweight assembler for long and accurate metagenomics reads."
      homepage: "https://github.com/GaetanBenoitDev/metaMDBG"
      documentation: "https://github.com/GaetanBenoitDev/metaMDBG"
      tool_dev_url: "https://github.com/GaetanBenoitDev/metaMDBG"
      doi: "10.1038/s41587-023-01983-6"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: Long read sequence data from ONT or HiFi in fasta format (can be gzipped)
        pattern: "*.{fa,fasta,fa.gz,fasta.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - input_type:
      type: string
      description: Sequencing technology for reads - either "hifi" for PacBio HiFi reads or "ont" for Oxford Nanopore reads.

output:
  contigs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.contigs.fasta.gz":
          type: file
          description: |
            Gzipped fasta file containing the assembled contigs from the input
            reads.
          pattern: "*.contigs.fasta.gz"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.metaMDBG.log":
          type: file
          description: Log file describing the metaMDBG run.
          pattern: "*.metaMDBG.log"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text
  versions_metamdbg:
    - - ${task.process}:
          type: string
          description: The name of the process
      - metamdbg:
          type: string
          description: The name of the tool
      - 'metaMDBG | sed -n "s/.*Version: //p"':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - metamdbg:
          type: string
          description: The name of the tool
      - 'metaMDBG | sed -n "s/.*Version: //p"':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@prototaxites"
  - "@eit-maxlcummins"
maintainers:
  - "@prototaxites"
containers:
