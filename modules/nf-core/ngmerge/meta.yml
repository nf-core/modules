name: "ngmerge"
description: Merging paired-end reads and removing sequencing adapters.
keywords:
  - sort
  - reads merging
  - merge mate pairs
tools:
  - "ngmerge":
      description: "Merging paired-end reads and removing sequencing adapters."
      homepage: "https://github.com/jsh58/NGmerge"
      documentation: "https://github.com/jsh58/NGmerge"
      tool_dev_url: "https://github.com/jsh58/NGmerge"
      doi: "10.1186/s12859-018-2579-2"
      licence: ["MIT"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - reads:
        type: file
        description: |
          List of input FastQ files of size 2; i.e., paired-end data.
        pattern: "*.{fa,fasta,fastq,fq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
output:
  merged_reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.merged.fq.gz":
          type: file
          description: fastq file merged reads
          pattern: "*.{fa,fasta,fastq,fq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  unstitched_read1:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_1.fastq.gz":
          type: file
          description: fastq file unstitched read 1
          pattern: "*.{fa,fasta,fastq,fq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  unstitched_read2:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*_2.fastq.gz":
          type: file
          description: fastq file unstitched read 2
          pattern: "*.{fa,fasta,fastq,fq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  versions_ngmerge:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ngmerge:
          type: string
          description: The name of the tool
      - NGmerge --version 2>&1 | sed -n '1s/^NGmerge, version //p':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ngmerge:
          type: string
          description: The name of the tool
      - NGmerge --version 2>&1 | sed -n '1s/^NGmerge, version //p':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@charlotteanne"
  - "@jsh58"
maintainers:
  - "@charlotteanne"
  - "@jsh58"
