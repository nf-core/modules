name: snpsites
description: Rapidly extracts SNPs from a multi-FASTA alignment.
keywords:
  - SNPs
  - invariant
  - constant
tools:
  - snpsites:
      description: Rapidly extracts SNPs from a multi-FASTA alignment.
      homepage: https://www.sanger.ac.uk/tool/snp-sites/
      documentation: https://github.com/sanger-pathogens/snp-sites
      licence:
        - "GPL-3.0-or-later"
      identifier: ""
input:
  - alignment:
      type: file
      description: fasta alignment file
      pattern: "*.{fasta,fas,fa,aln}"
      ontologies: []
output:
  fasta:
    - "*.fas":
        type: file
        description: Variant fasta file
        pattern: "*.{fas}"
        ontologies: []
  constant_sites:
    - "*.sites.txt":
        type: file
        description: Text file containing counts of constant sites
        pattern: "*.{sites.txt}"
        ontologies: []
  versions_snpsites:
    - - ${task.process}:
          type: string
          description: The name of the process
      - snpsites:
          type: string
          description: The name of the tool
      - snp-sites -V 2>&1 | sed "s/snp-sites //":
          type: eval
          description: The expression to obtain the version of the tool

  constant_sites_string:
    - CONSTANT_SITES:
        type: integer
        description: Value with the number of constant sites
        pattern: "*.{sites.txt}"
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - snpsites:
          type: string
          description: The name of the tool
      - snp-sites -V 2>&1 | sed "s/snp-sites //":
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@avantonder"
maintainers:
  - "@avantonder"
