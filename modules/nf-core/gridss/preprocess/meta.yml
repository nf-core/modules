name: "gridss_preprocess"
description: Run the preprocess step of GRIDSS to extract multiple Picard metrics (insert size, MAPQ, CIGAR, IDSV, tag and coverage metrics) from an input BAM file prior to assembly and variant calling.
keywords:
  - gridss
  - preprocess
  - structural variants
  - bam
tools:
  - gridss:
      description: "GRIDSS: the Genomic Rearrangement IDentification Software Suite"
      homepage: "https://github.com/PapenfussLab/gridss"
      documentation: "https://github.com/PapenfussLab/gridss/wiki/GRIDSS-Documentation"
      tool_dev_url: "https://github.com/PapenfussLab/gridss"
      doi: "10.1186/s13059-021-02423-x"
      licence:
        - "GPL v3"
      identifier: biotools:gridss
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - bam:
        type: file
        description: Input BAM file
        pattern: "*.bam"
        ontologies:
          - edam: http://edamontology.org/format_2572
    - bai:
        type: file
        description: Index of the input BAM file
        pattern: "*.bai"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
    - fasta:
        type: file
        description: The reference fasta
        pattern: "*.{fa,fna,fasta}"
        ontologies: []
    - fasta_fai:
        type: file
        description: The index of the reference fasta
        pattern: "*.fai"
        ontologies: []
    - bwa_index:
        type: directory
        description: The BWA index created from the reference fasta, will be generated by Gridss in the setupreference step
output:
  preprocess_dir:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.gridss.working":
          type: directory
          description: The working directory produced by the GRIDSS preprocess step containing Picard metrics (insert size, MAPQ, CIGAR, IDSV, tag, coverage) and SV-relevant reads used by downstream GRIDSS steps
          pattern: "*.gridss.working"
  versions_gridss:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gridss:
          type: string
          description: The tool name
      - CallVariants --version 2>&1 | sed 's/-gridss//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gridss:
          type: string
          description: The tool name
      - CallVariants --version 2>&1 | sed 's/-gridss//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@imsarath"
maintainers:
  - "@imsarath"
