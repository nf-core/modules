name: plasmidid
description: assembles bacterial plasmids
keywords:
  - assembly
  - plasmid
  - bacterial
tools:
  - plasmidid:
      description: Pipeline for plasmid identification and reconstruction
      homepage: https://github.com/BU-ISCIII/plasmidID/wiki
      documentation: https://github.com/BU-ISCIII/plasmidID#readme
      tool_dev_url: https://github.com/BU-ISCIII/plasmidID
      licence:
        - "GPL v3"
      identifier: biotools:plasmidid
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - scaffold:
        type: file
        description: |
          Fasta file containing scaffold
        ontologies: []
  - fasta:
      type: file
      description: FASTA reference file
      pattern: "*.{fasta,fa}"
      ontologies: []
output:
  html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*final_results.html:
          type: file
          description: html file with results rendered
          pattern: "*.{html}"
          ontologies: []
  tab:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/*final_results.tab:
          type: file
          description: Results in a tabular file
          pattern: "*.{tab}"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  images:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/images/:
          type: directory
          description: Directory containing the images produced by plasmidid
          pattern: "images"
  logs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/logs/:
          type: directory
          description: Directory containing the logs produced by plasmidid
          pattern: "logs"
  data:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/data/:
          type: directory
          description: Directory containing the data produced by plasmidid
          pattern: "data"
  database:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/database/:
          type: directory
          description: Directory containing the database produced by plasmidid
          pattern: "database"
  fasta_files:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/fasta_files/:
          type: directory
          description: Directory containing the fasta files produced by plasmidid
          pattern: "fasta_files"
  kmer:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}/kmer/:
          type: directory
          description: Directory containing the kmer files produced by plasmidid
          pattern: "database"
  versions_plasmidid:
    - - ${task.process}:
          type: string
          description: The name of the process
      - plasmidid:
          type: string
          description: The name of the tool
      - plasmidID --version 2>&1 | sed 's/^plasmidID //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_parallel:
    - - ${task.process}:
          type: string
          description: The name of the process
      - parallel:
          type: string
          description: The name of the tool
      - parallel --version | sed '1!d;s/GNU parallel //':
          type: eval
          description: The expression to obtain the version of the tool
  versions_blast:
    - - ${task.process}:
          type: string
          description: The name of the process
      - blast:
          type: string
          description: The name of the tool
      - blastn -version | sed '2!d;s/.*blast //;s/,.*//':
          type: eval
          description: The expression to obtain the version of the tool

  versions_prokka:
    - - ${task.process}:
          type: string
          description: The name of the process
      - prokka:
          type: string
          description: The name of the tool
      - prokka --version 2>&1 | sed 's/prokka //':
          type: eval
          description: The expression to obtain the version of the tool

  versions_circos:
    - - ${task.process}:
          type: string
          description: The name of the process
      - circos:
          type: string
          description: The name of the tool
      - circos --version | sed 's/.*v //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool

  versions_mash:
    - - ${task.process}:
          type: string
          description: The name of the process
      - mash:
          type: string
          description: The name of the tool
      - mash --version:
          type: eval
          description: The expression to obtain the version of the tool

