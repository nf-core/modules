name: "vt_normalize"
description: normalizes variants in a VCF file
keywords:
  - normalization
  - vcf
  - snps
  - indels
tools:
  - "vt":
      description: "A tool set for short variant discovery in genetic sequence data"
      homepage: "https://genome.sph.umich.edu/wiki/Vt"
      documentation: "https://genome.sph.umich.edu/wiki/Vt"
      tool_dev_url: "https://github.com/atks/vt"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - vcf:
        type: file
        description: The VCF file to normalize
        pattern: "*.vcf(.gz)?"
        ontologies: []
    - tbi:
        type: file
        description: The tabix index of the VCF file when bgzipped
        pattern: "*.tbi"
        ontologies: []
    - intervals:
        type: file
        description: The intervals of the variants of normalize
        pattern: "*.bed"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'test', single_end:false ]`
    - fasta:
        type: file
        description: The reference fasta file
        pattern: "*.{fasta,fn,fna,fa}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference index information
          e.g. `[ id:'test', single_end:false ]`
    - fai:
        type: file
        description: The index of the reference fasta file (OPTIONAL)
        pattern: "*.fai"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.vcf.gz":
          type: file
          description: The normalized VCF file
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  fai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${fasta}.fai:
          type: file
          description: The created index of the reference fasta file (only when the fai wasn't supplied)
          pattern: "*.fai"
          ontologies: []
  versions_vt:
    - - ${task.process}:
          type: string
          description: The name of the process
      - vt:
          type: string
          description: The name of the tool
      - 2015.11.10:
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - vt:
          type: string
          description: The name of the tool
      - 2015.11.10:
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
