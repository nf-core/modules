name: tmalign
description: Align one or more protein structures against a reference structure with TM-align and report TM-score, RMSD, sequence identity and aligned length
keywords:
  - structural alignment
  - TM-score
  - protein structure
  - fold comparison
tools:
  - tmalign:
      description: |
        TM-align performs sequence-order-independent structural alignment of
        two protein structures and reports a TM-score, a length-independent
        measure of fold similarity. A TM-score above 0.5 generally indicates
        the same fold, while a TM-score below 0.3 is close to random
        structural similarity.
      homepage: https://zhanggroup.org/TM-align/
      doi: 10.1093/nar/gki524
      licence: ["free for academic use"]
      identifier: biotools:tm-align
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - structures:
        type: file
        description: One or more query protein structures, each aligned against the reference
        pattern: "*.{pdb,cif}"
        ontologies:
          - edam: http://edamontology.org/format_1476 # PDB
          - edam: http://edamontology.org/format_1477 # mmCIF
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'reference' ]
    - reference:
        type: file
        description: Reference protein structure
        pattern: "*.{pdb,cif}"
        ontologies:
          - edam: http://edamontology.org/format_1476 # PDB
          - edam: http://edamontology.org/format_1477 # mmCIF

output:
  tsv:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.tsv":
          type: file
          description: TM-align tabular output (`-outfmt 2`), one row per query; TM1/TM2 are the TM-scores normalised by query/reference length
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_tmalign:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tmalign:
          type: string
          description: The name of the tool
      - TMalign -v | sed -n '/Version/{s/.*Version //;s/).*//;p}':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - tmalign:
          type: string
          description: The name of the tool
      - TMalign -v | sed -n '/Version/{s/.*Version //;s/).*//;p}':
          type: eval
          description: The expression to obtain the version of the tool

