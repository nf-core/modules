name: snpeff_snpeff
description: Genetic variant annotation and functional effect prediction toolbox
keywords:
  - annotation
  - effect prediction
  - genomics
  - variant
  - vcf
tools:
  - snpeff:
      description: |
        SnpEff is a variant annotation and effect prediction tool.
        It annotates and predicts the effects of genetic variants on genes and proteins (such as amino acid changes).
      homepage: https://pcingola.github.io/SnpEff/
      documentation: https://pcingola.github.io/SnpEff/snpeff/introduction/
      licence:
        - MIT
      identifier: biotools:snpeff
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - vcf:
        type: file
        description: VCF file containing variants to annotate
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_3989 # VCF
  - db:
      type: string
      description: Name of the SnpEff genome database
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'sample1' ]
    - cache:
        type: directory
        description: Optional. Directory containing the SnpEff genome database cache
  - canon_list:
      type: file
      description: Optional. Tab-separated gene ID and transcript ID pairs that define canonical transcripts
      pattern: "*.{txt,tsv}"
      ontologies:
        - edam: http://edamontology.org/format_3475 # TSV
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - "*.ann.vcf":
          type: file
          description: Annotated VCF file
          pattern: "*.ann.vcf"
          ontologies:
            - edam: http://edamontology.org/format_3989 # VCF
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${task.process}:
          type: string
          description: The name of the process
      - snpeff:
          type: string
          description: The name of the tool
      - "*.csv":
          type: file
          description: SnpEff report in CSV format
          pattern: "*.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  summary_html:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${task.process}:
          type: string
          description: The name of the process
      - snpeff:
          type: string
          description: The name of the tool
      - "*.html":
          type: file
          description: SnpEff summary statistics in HTML format
          pattern: "*.html"
          ontologies:
            - edam: http://edamontology.org/format_2331 # HTML
  genes_txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'sample1' ]
      - ${task.process}:
          type: string
          description: The name of the process
      - snpeff:
          type: string
          description: The name of the tool
      - "*.genes.txt":
          type: file
          description: Tab-separated counts of variants affecting each transcript and gene
          pattern: "*.genes.txt"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_snpeff:
    - - ${task.process}:
          type: string
          description: The name of the process
      - snpeff:
          type: string
          description: The name of the tool
      - "snpEff -version 2>&1 | cut -f 2 -d '\t'":
          type: eval
          description: The expression to obtain the version of the tool
