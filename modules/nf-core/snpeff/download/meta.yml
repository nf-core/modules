name: snpeff_download
description: Genetic variant annotation and functional effect prediction toolbox
keywords:
  - annotation
  - effect prediction
  - snpeff
  - variant
  - vcf
tools:
  - snpeff:
      description: |
        SnpEff is a variant annotation and effect prediction tool.
        It annotates and predicts the effects of genetic variants on genes and proteins (such as amino acid changes).
      homepage: https://pcingola.github.io/SnpEff/
      documentation: https://pcingola.github.io/SnpEff/snpeff/introduction/
      doi: "10.4161/fly.19695"
      publication:
        author: "Cingolani, P., Platts, A., Wang, L. L., Coon, M., Nguyen, T., Wang, L., Land, S. J., Lu, X. & Ruden, D. M."
        year: 2012
        title: "A program for annotating and predicting the effects of single nucleotide polymorphisms, SnpEff: SNPs in the genome of Drosophila melanogaster strain w1118; iso-2; iso-3"
        source: "Fly"
      licence: ["MIT"]
      identifier: biotools:snpeff
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - snpeff_db:
        type: string
        description: SnpEff database name
        ontologies: []
output:
  cache:
    - - meta:
          type: file
          description: |
            snpEff cache
          ontologies: []
      - snpeff_cache:
          type: file
          description: |
            snpEff cache
          ontologies: []
  versions_snpeff:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - snpeff:
          type: string
          description: The tool name
      - "snpEff -version 2>&1 | cut -f 2 -d '\t'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - snpeff:
          type: string
          description: The tool name
      - "snpEff -version 2>&1 | cut -f 2 -d '\t'":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@maxulysse"
maintainers:
  - "@maxulysse"
