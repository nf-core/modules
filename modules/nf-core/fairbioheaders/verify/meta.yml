name: "fairbioheaders_verify"
description: |
  Verify the FAIR-bioHeaders header (FHR, FHP or FHGFF3) of a FASTA, protein FASTA, GFA or
  GFF3 file: validate the header against its schema and check that the SHA-512/256 checksum
  it records matches the file. The task fails when the file has no header, the header is
  invalid or the checksum does not match, so a failed check cannot pass unnoticed.
keywords:
  - fasta
  - gfa
  - gff3
  - metadata
  - provenance
  - fair
  - checksum
  - validation
tools:
  - "fair-bioheaders":
      description: "Toolkit to validate, convert, combine, strip and verify FAIR-bioHeaders (FHR, FHP, FHGFF3) provenance metadata embedded in FASTA, GFA and GFF3 headers"
      homepage: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      documentation: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools#readme"
      tool_dev_url: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      doi: "10.1093/bib/bbae122"
      licence: ["MPL-2.0"]
      identifier: biotools:fair-bioheaders
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - sequence:
        type: file
        description: |
          Genome FASTA or GFA with an FHR header, protein FASTA with an FHP header, or
          GFF3 with an FHGFF3 header, plain or gzip/BGZF-compressed (`.gz` or `.bgz`)
        pattern: "*.{fa,fasta,fna,fas,faa,ffn,frn,fsa,mpfa,gfa,gff,gff3}{,.gz,.bgz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
          - edam: "http://edamontology.org/format_3975" # GFA 1
          - edam: "http://edamontology.org/format_1975" # GFF3
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.verify.txt:
          type: file
          description: Text report naming the verified file and the result
          pattern: "*.verify.txt"
          ontologies:
            - edam: "http://edamontology.org/format_2330" # Textual format
  versions_fairbioheaders:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
