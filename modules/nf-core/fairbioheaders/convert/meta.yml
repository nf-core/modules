name: "fairbioheaders_convert"
description: |
  Convert FAIR-bioHeaders metadata (FHR, FHP or FHGFF3) to JSON, YAML, JSON-LD or HTML,
  for example to extract the header of a FASTA, GFA or GFF3 file written by
  fairbioheaders/combine as a sidecar YAML file that carries the file's checksum.
  The metadata is validated against its schema; the task fails when it is invalid,
  when a sequence file has no header, or when the output name would overwrite the input
  (choose a different `ext.prefix` in that case). The output is named
  `<prefix>.<format>`, where the prefix defaults to `<meta.id>_converted`.
  FHGFF3 metadata cannot be written as JSON-LD or HTML.
keywords:
  - metadata
  - provenance
  - fair
  - conversion
  - json
  - yaml
  - json-ld
tools:
  - "fair-bioheaders":
      description: "Toolkit to validate, convert, combine, strip and verify FAIR-bioHeaders (FHR, FHP, FHGFF3) provenance metadata embedded in FASTA, GFA and GFF3 headers"
      homepage: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      documentation: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools#readme"
      tool_dev_url: "https://github.com/FAIR-bioHeaders/FAIR-bioHeaders-Tools"
      doi: "10.1093/bib/bbae122"
      licence: ["MPL-2.0"]
      identifier: biotools:fair-bioheaders
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input:
        type: file
        description: |
          FASTA, protein FASTA, GFA or GFF3 file with a FAIR-bioHeaders header (plain or
          gzip/BGZF-compressed, `.gz` or `.bgz`), or standalone metadata as JSON, YAML,
          JSON-LD or HTML
        pattern: "*.{fa,fasta,fna,fas,faa,ffn,frn,fsa,mpfa,gfa,gff,gff3,json,yaml,yml,jsonld,html}{,.gz,.bgz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
          - edam: "http://edamontology.org/format_3975" # GFA 1
          - edam: "http://edamontology.org/format_1975" # GFF3
          - edam: "http://edamontology.org/format_3464" # JSON
          - edam: "http://edamontology.org/format_3750" # YAML
          - edam: "http://edamontology.org/format_3749" # JSON-LD
          - edam: "http://edamontology.org/format_2331" # HTML
  - format:
      type: string
      description: Output format and file extension, one of `json`, `yaml`, `jsonld` or `html`
output:
  metadata:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}.${format}:
          type: file
          description: The metadata in the requested format, named `<prefix>.<format>`
            (prefix defaults to `<meta.id>_converted`)
          pattern: "*.{json,yaml,jsonld,html}"
          ontologies:
            - edam: "http://edamontology.org/format_3464" # JSON
            - edam: "http://edamontology.org/format_3750" # YAML
            - edam: "http://edamontology.org/format_3749" # JSON-LD
            - edam: "http://edamontology.org/format_2331" # HTML
  versions_fairbioheaders:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - fair-bioheaders:
          type: string
          description: The name of the tool
      - bioheaders --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
