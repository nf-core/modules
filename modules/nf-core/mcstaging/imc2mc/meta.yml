# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "mcstaging_imc2mc"
description: Staging module for MCMICRO transforming Imaging Mass Cytometry .txt files
  to .tif files with OME-XML metadata. Includes optional hot pixel removal.
deprecated: true
keywords:
  - imaging
  - ome-tif
  - staging
  - MCMICRO
tools:
  - "mcstaging":
      description: "Staging modules for MCMICRO"
      homepage: "https://github.com/SchapiroLabor/imc2mc"
      documentation: "https://github.com/SchapiroLabor/imc2mc"
      tool_dev_url: "https://github.com/SchapiroLabor/imc2mc"
      licence: ["GPL-3.0 license"]
      identifier: ""

input:
  # Only when we have meta
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - txtfile:
        type: file
        description: Acquisition .txt file
        pattern: "*.{txt}"
        ontologies: []
output:
  #Only when we have meta
  tif:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.tif":
          type: file
          description: One output .tif file containing acquisition and metadata
          pattern: "*.{tif}"
          ontologies: []
  versions_imc2mc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - imc2mc:
          type: string
          description: The name of the tool
      - "python /imc2mc/scripts/imc2mc.py --version | sed 's/v//g'":
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - imc2mc:
          type: string
          description: The name of the tool
      - "python /imc2mc/scripts/imc2mc.py --version | sed 's/v//g'":
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@MargotCh"
maintainers:
  - "@MargotCh"
