name: "mcstaging_macsima2mc"
description: Staging module for MCMICRO transforming MACSima data sets for being
  registered with ASHLAR in MCMICRO.
keywords:
  - imaging
  - ome-tif
  - mcmicro
  - staging
  - spatial-omics
  - macsima
tools:
  - "macsima2mc":
      description: "Staging module for MCMICRO"
      homepage: "https://github.com/SchapiroLabor/macsima2mc"
      documentation: "https://github.com/SchapiroLabor/macsima2mc"
      tool_dev_url: "https://github.com/SchapiroLabor/macsima2mc"
      licence:
        - "BSD-3-Clause"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input_dir:
        type: directory
        description: Absolute path to the the ROI folder containing cycle folders following the pattern of the X_Cycle_N, where N represents the cycle
          number, containing the raw tiles.
        pattern: "ROI*"
    - output_dir:
        type: string
        description: Absolute path to the directory in which the outputs will be
          saved. If the output directory doesn't exist it will be created.
output:
  out_dir:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${output_dir}/*:
          type: directory
          description: |
            Output directory containing subdirectories per well-rack-roi-exp combination.
            Each subdirectory contains a markers.csv table and a raw/ folder with ome.tif files.
          pattern: "*/"
  versions_macsima2mc:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - macsima2mc:
          type: string
          description: The tool name
      - 'python -m pip show macsima2mc | grep "Version" | sed -e "s/Version: //g"':
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - macsima2mc:
          type: string
          description: The tool name
      - 'python -m pip show macsima2mc | grep "Version" | sed -e "s/Version: //g"':
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@EfraMP"
maintainers:
  - "@EfraMP"
  - "@VictorDidier"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/python_macsima2mc:e3c1eb940a13b88b
      build_id: bd-e3c1eb940a13b88b_1
      scan_id: sc-25be4d73977209e3_1
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/python_macsima2mc:1eb779069d7f6426
      build_id: bd-1eb779069d7f6426_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/2f/2f571113c86e3216bf5fd714885f5521b813c4599a2852a15867d5bf3137a235/data