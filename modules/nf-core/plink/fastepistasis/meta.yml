name: "plink_fastepistasis"
description: Fast Epistasis in PLINK, analyzing how the effects of one gene depend on the presence of others.
keywords:
  - interactions
  - variants
  - regression
tools:
  - "plink":
      description: "Whole genome association analysis toolset, designed to perform a range of basic, large-scale analyses in a computationally efficient manner."
      homepage: "https://www.cog-genomics.org/plink"
      documentation: "https://www.cog-genomics.org/plink/1.9/data#recode"
      tool_dev_url: "https://www.cog-genomics.org/plink/1.9/dev"
      licence: ["GPL"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
          meta is associated to the PLINK native file input
    - bed:
        type: file
        description: PLINK binary biallelic genotype table file
        pattern: "*.{bed}"
        ontologies: []
    - bim:
        type: file
        description: PLINK extended MAP file
        pattern: "*.{bim}"
        ontologies: []
    - fam:
        type: file
        description: PLINK sample information file
        pattern: "*.{fam}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information,
          e.g. [ id:'test', single_end:false ]
          meta2 is associated to VCF file input
    - vcf:
        type: file
        description: Variant calling file (vcf)
        pattern: "*.{vcf}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing sample information,
          e.g. [ id:'test', single_end:false ]
          meta3 is associated to BCF file input
    - bcf:
        type: file
        description: PLINK variant information + sample ID + genotype call binary file
        pattern: "*.{bcf}"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing sample information,
          e.g. [ id:'test', single_end:false ]
          meta4 is associated to phenotype file input
    - phe:
        type: file
        description: PLINK file containing phenotype information. This phenotype information can be read from the third column with the --pheno option or from a specific column with the --pheno-name option.
        pattern: "*.{phe}"
        ontologies: []
output:
  fepi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.epi.cc":
          type: file
          description: PLINK fast-epistasis file
          pattern: "*.{epi.cc}"
          ontologies: []
  fepisummary:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.epi.cc.summary":
          type: file
          description: PLINK fast-epistasis summary file
          pattern: "*.{epi.cc.summary}"
          ontologies: []
  flog:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.log":
          type: file
          description: PLINK fast-epistasis log file
          pattern: "*.{log}"
          ontologies: []
  fnosex:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.nosex":
          type: file
          description: Ambiguous sex ID file
          pattern: "*.{nosex}"
          ontologies: []
  versions_plink:
    - - "${task.process}":
          type: string
          description: The name of the process
      - plink:
          type: string
          description: The name of the tool
      - "plink --version 2>&1 | sed 's/^PLINK v//;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - plink:
          type: string
          description: The name of the tool
      - "plink --version 2>&1 | sed 's/^PLINK v//;s/ .*//'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@davidebag"
maintainers:
  - "@davidebag"
