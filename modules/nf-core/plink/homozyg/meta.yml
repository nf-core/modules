# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: plink_homozyg
description: Runs of homozygosity (ROH) detection with PLINK 1.9 (--homozyg)
keywords:
  - roh
  - homozyg
  - plink
  - inbreeding
tools:
  - plink:
      description: Whole genome association analysis toolset.
      homepage: https://www.cog-genomics.org/plink
      documentation: https://www.cog-genomics.org/plink/1.9/
      licence: ["GPL"]
      identifier: biotools:plink
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - bed:
        type: file
        description: PLINK binary genotype table
        pattern: "*.bed"
        ontologies:
          - edam: http://edamontology.org/format_3003 # BED
    - bim:
        type: file
        description: PLINK variant table
        pattern: "*.bim"
    - fam:
        type: file
        description: PLINK sample table
        pattern: "*.fam"
output:
  hom:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.hom":
          type: file
          description: ROH segments, one line per segment
          pattern: "*.hom"
  hom_indiv:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.hom.indiv":
          type: file
          description: ROH totals per individual
          pattern: "*.hom.indiv"
  hom_summary:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.hom.summary":
          type: file
          description: ROH summary statistics
          pattern: "*.hom.summary"
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.log":
          type: file
          description: PLINK log
          pattern: "*.log"
  versions_plink:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - plink:
          type: string
          description: The tool name
      - plink --version 2>&1 | sed 's/^PLINK v//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - plink:
          type: string
          description: The tool name
      - plink --version 2>&1 | sed 's/^PLINK v//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Othmanaljurayyad"
maintainers:
  - "@Othmanaljurayyad"
containers:
  docker:
    linux/amd64:
      name: community.wave.seqera.io/library/plink:1.90b6.21--0baa44af6db8f28d
      build_id: bd-0baa44af6db8f28d_1
      scan_id: sc-588ceddb77be18ec_2
  singularity:
    linux/amd64:
      name: oras://community.wave.seqera.io/library/plink:1.90b6.21--95e2ee960c26adef
      build_id: bd-95e2ee960c26adef_1
      https: https://community-cr-prod.seqera.io/docker/registry/v2/blobs/sha256/59/5901c2e9a6b11094536c8b0ab0932bd61bb55dbfe9ad270d3babc8f7246a4759/data
  conda:
    linux/amd64:
      lock_file: modules/nf-core/plink/homozyg/.conda-lock/linux_amd64-bd-0baa44af6db8f28d_1.txt
