# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: plink_homozyg
description: Runs of homozygosity (ROH) detection with PLINK 1.9 (--homozyg)
keywords:
  - roh
  - homozyg
  - plink
  - inbreeding
tools:
  - plink:
      description: Whole genome association analysis toolset.
      homepage: https://www.cog-genomics.org/plink
      documentation: https://www.cog-genomics.org/plink/1.9/
      licence: ["GPL"]
      identifier: biotools:plink
input:
  - - meta:
        type: map
        description: Groovy Map containing sample information
    - bed:
        type: file
        description: PLINK binary genotype table
        pattern: "*.bed"
        ontologies:
          - edam: http://edamontology.org/format_3003 # BED
    - bim:
        type: file
        description: PLINK variant table
        pattern: "*.bim"
    - fam:
        type: file
        description: PLINK sample table
        pattern: "*.fam"
output:
  hom:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.hom":
          type: file
          description: ROH segments, one line per segment
          pattern: "*.hom"
  hom_indiv:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.hom.indiv":
          type: file
          description: ROH totals per individual
          pattern: "*.hom.indiv"
  hom_summary:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.hom.summary":
          type: file
          description: ROH summary statistics
          pattern: "*.hom.summary"
  log:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.log":
          type: file
          description: PLINK log
          pattern: "*.log"
  versions_plink:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - plink:
          type: string
          description: The tool name
      - plink --version 2>&1 | sed 's/^PLINK v//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - plink:
          type: string
          description: The tool name
      - plink --version 2>&1 | sed 's/^PLINK v//;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@Othmanaljurayyad"
maintainers:
  - "@Othmanaljurayyad"
