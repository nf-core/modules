name: bcftools_query
description: Extracts fields from VCF or BCF files and outputs them in user-defined format.
keywords:
  - query
  - variant calling
  - bcftools
  - VCF
tools:
  - query:
      description: |
        Extracts fields from VCF or BCF files and outputs them in user-defined format.
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      doi: 10.1093/bioinformatics/btp352
      licence:
        - "MIT"
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - vcf:
        type: file
        description: |
          The vcf file to be queried.
        pattern: "*.{vcf.gz, vcf}"
        ontologies: []
    - tbi:
        type: file
        description: |
          The tab index for the VCF file to be inspected.
        pattern: "*.tbi"
        ontologies: []
  - regions:
      type: file
      description: |
        Optionally, restrict the operation to regions listed in this file.
      ontologies: []
  - targets:
      type: file
      description: |
        Optionally, restrict the operation to regions listed in this file (doesn't rely upon index files)
      ontologies: []
  - samples:
      type: file
      description: |
        Optional, file of sample names to be included or excluded.
        e.g. 'file.tsv'
      ontologies: []
output:
  output:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.txt":
          type: file
          description: BCFTools query output file
          pattern: "*.txt"
          ontologies: []
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - "bcftools --version | sed '1!d; s/^.*bcftools //'":
          type: eval
          description: The command used to generate the version of the tool
