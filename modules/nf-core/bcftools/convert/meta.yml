name: "bcftools_convert"
description: Converts certain output formats to VCF
keywords:
  - bcftools
  - convert
  - vcf
  - gvcf
tools:
  - "bcftools":
      description: "BCFtools is a set of utilities that manipulate variant calls in the Variant Call Format (VCF) and its binary counterpart BCF. All commands work transparently with both VCFs and BCFs, both uncompressed and BGZF-compressed.  Most commands accept VCF, bgzipped VCF and BCF with filetype detected automatically even when streaming from a pipe. Indexed VCF and BCF will work in all situations. Un-indexed VCF and BCF and streams will work in most, but not all situations."
      homepage: "https://samtools.github.io/bcftools/bcftools.html"
      documentation: "https://samtools.github.io/bcftools/bcftools.html#convert"
      tool_dev_url: "https://github.com/samtools/bcftools"
      doi: "10.1093/gigascience/giab008"
      licence:
        - "GPL"
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input:
        type: file
        description: |
          The input format. Each format needs a separate parameter to be specified in the `args`:
          - GEN/SAMPLE file: `--gensample2vcf`
          - gVCF file: `--gvcf2vcf`
          - HAP/SAMPLE file: `--hapsample2vcf`
          - HAP/LEGEND/SAMPLE file: `--haplegendsample2vcf`
          - TSV file: `--tsv2vcf`
        pattern: "*.{gen,sample,g.vcf,hap,legend}{.gz,}"
        ontologies: []
    - input_index:
        type: file
        description: (Optional) The index for the input files, if needed
        pattern: "*.bed"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: (Optional) The reference fasta, only needed for gVCF conversion
        pattern: "*.{fa,fasta}"
        ontologies: []
  - bed:
      type: file
      description: (Optional) The BED file containing the regions for the VCF file
      pattern: "*.bed"
      ontologies: []
output:
  vcf_gz:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz":
          type: file
          description: VCF merged output file (bgzipped) => when `--output-type z` is used
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf":
          type: file
          description: VCF merged output file => when `--output-type v` is used
          pattern: "*.vcf"
          ontologies:
            - edam: http://edamontology.org/format_3989
  bcf_gz:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bcf.gz":
          type: file
          description: BCF merged output file (bgzipped) => when `--output-type b` is used
          pattern: "*.bcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  bcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bcf":
          type: file
          description: BCF merged output file => when `--output-type u` is used
          pattern: "*.bcf"
          ontologies: []
  hap:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.hap.gz":
          type: file
          description: hap format used by IMPUTE2 and SHAPEIT
          pattern: "*.hap.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  legend:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.legend.gz":
          type: file
          description: legend format used by IMPUTE2 and SHAPEIT
          pattern: "*.legend.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  samples:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.samples":
          type: file
          description: samples format used by IMPUTE2 and SHAPEIT
          pattern: "*.samples"
          ontologies: []
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{tbi,csi}":
          type: file
          description: VCF file index
          pattern: "*.{tbi,csi}"
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - bcftools --version | sed '1!d; s/^.*bcftools //':
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
