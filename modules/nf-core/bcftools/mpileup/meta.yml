name: bcftools_mpileup
description: Compresses VCF files
keywords:
  - variant calling
  - mpileup
  - VCF
tools:
  - mpileup:
      description: |
        Generates genotype likelihoods at each genomic position with coverage.
      homepage: http://samtools.github.io/bcftools/bcftools.html
      documentation: http://www.htslib.org/doc/bcftools.html
      doi: 10.1093/bioinformatics/btp352
      licence:
        - "MIT"
      identifier: biotools:bcftools
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: Input BAM file
        pattern: "*.{bam}"
        ontologies: []
    - intervals_mpileup:
        type: file
        description: Input intervals file. A file (commonly '.bed') containing regions to subset used by mpileup
        ontologies: []
    - intervals_call:
        type: file
        description: Input intervals file. A file (commonly '.bed') containing regions to subset used by call but need a fourth column with REF,ALT
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: FASTA reference file
        pattern: "*.{fasta,fa}"
        ontologies: []
    - fai:
        type: file
        description: FASTA reference file index
        pattern: "*.fai"
        ontologies: []
  - save_mpileup:
      type: boolean
      description: Save mpileup file generated by bcftools mpileup
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{bcf,vcf}{,.gz}":
          type: file
          description: VCF gzipped output file
          pattern: "*.{bcf,vcf}{,.gz}"
          ontologies: []
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{tbi,csi}":
          type: file
          description: VCF file index
          pattern: "*.{tbi,csi}"
  stats:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*stats.txt":
          type: file
          description: Text output file containing stats
          pattern: "*{stats.txt}"
          ontologies: []
  mpileup:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.mpileup.gz":
          type: file
          description: mpileup gzipped output for all positions
          pattern: "{*.mpileup.gz}"
          ontologies: []
  versions_bcftools:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - bcftools --version | sed '1!d; s/^.*bcftools //':
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bcftools:
          type: string
          description: The tool name
      - bcftools --version | sed '1!d; s/^.*bcftools //':
          type: eval
          description: The command used to generate the version of the tool
