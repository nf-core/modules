name: sentieon_rsempreparereference
description: Prepare a reference genome for RSEM
keywords:
  - rsem
  - genome
  - index
  - sentieon
tools:
  - sentieon:
      description: |
        Sentieon® provides complete solutions for secondary DNA/RNA analysis for a variety of sequencing platforms, including short and long reads.
        Our software improves upon BWA, STAR, Minimap2, GATK, HaplotypeCaller, Mutect, and Mutect2 based pipelines and is deployable on any generic-CPU-based computing system.
      homepage: https://www.sentieon.com/
      documentation: https://www.sentieon.com/
      doi: "10.1101/115717"
      publication:
        author: "Freed, D., Aldana, R., Weber, J. A. & Edwards, J. S."
        year: 2017
        title: "The Sentieon Genomics Tools - A fast and accurate solution to variant calling from next-generation sequence data"
        source: "bioRxiv"
      identifier: ""
  - rseqc:
      description: |
        RSEM: accurate transcript quantification from RNA-Seq data with or without a reference genome
      homepage: https://github.com/deweylab/RSEM
      documentation: https://github.com/deweylab/RSEM
      doi: 10.1186/1471-2105-12-323
      licence:
        - "GPL-3.0-or-later"
      identifier: biotools:rsem
input:
  - fasta:
      type: file
      description: The Fasta file of the reference genome
      pattern: "*.{fasta,fa}"
      ontologies: []
  - gtf:
      type: file
      description: The GTF file of the reference genome
      pattern: "*.gtf"
      ontologies: []
output:
  index:
    - rsem:
        type: directory
        description: RSEM index directory
        pattern: "rsem"
  transcript_fasta:
    - "*transcripts.fa":
        type: file
        description: Fasta file of transcripts
        pattern: "rsem/*transcripts.fa"
        ontologies: []
  versions_rsem:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rsem:
          type: string
          description: The tool name
      - 'rsem-calculate-expression --version | sed -e "s/Current version: RSEM v//g"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_star:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - star:
          type: string
          description: The tool name
      - 'STAR --version | sed -e "s/STAR_//g"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_sentieon:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - sentieon:
          type: string
          description: The tool name
      - 'sentieon driver --version 2>&1 | sed -e "s/sentieon-genomics-//g"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
