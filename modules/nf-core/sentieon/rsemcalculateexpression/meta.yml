name: sentieon_rsemcalculateexpression
description: Calculate expression with RSEM
keywords:
  - rsem
  - expression
  - quantification
  - sentieon
tools:
  - sentieon:
      description: |
        Sentieon® provides complete solutions for secondary DNA/RNA analysis for a variety of sequencing platforms, including short and long reads.
        Our software improves upon BWA, STAR, Minimap2, GATK, HaplotypeCaller, Mutect, and Mutect2 based pipelines and is deployable on any generic-CPU-based computing system.
      homepage: https://www.sentieon.com/
      documentation: https://www.sentieon.com/
      doi: "10.1101/115717"
      publication:
        author: "Freed, D., Aldana, R., Weber, J. A. & Edwards, J. S."
        year: 2017
        title: "The Sentieon Genomics Tools - A fast and accurate solution to variant calling from next-generation sequence data"
        source: "bioRxiv"
      identifier: ""
  - rsem:
      description: |
        RSEM: accurate transcript quantification from RNA-Seq data with or without a reference genome
      homepage: https://github.com/deweylab/RSEM
      documentation: https://github.com/deweylab/RSEM
      doi: 10.1186/1471-2105-12-323
      publication:
        author: "Li, B. & Dewey, C. N."
        year: 2011
        title: "RSEM: accurate transcript quantification from RNA-Seq data with or without a reference genome"
        source: "BMC Bioinformatics"
      licence: ["GPL-3.0-or-later"]
      identifier: biotools:rsem
  - star:
      description: |
        STAR is a software package for mapping DNA sequences against
        a large reference genome, such as the human genome.
      homepage: https://github.com/alexdobin/STAR
      doi: "10.1093/bioinformatics/bts635"
      publication:
        author: "Dobin, A., Davis, C. A., Schlesinger, F., Drenkow, J., Zaleski, C., Jha, S., Batut, P., Chaisson, M. & Gingeras, T. R."
        year: 2012
        title: "STAR: ultrafast universal RNA-seq aligner"
        source: "Bioinformatics"
      manual: https://github.com/alexdobin/STAR/blob/master/doc/STARmanual.pdf
      licence: ["MIT"]
      identifier: biotools:star
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: Input reads for quantification
        pattern: "*.fastq.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
  - index:
      type: file
      description: RSEM index
      pattern: "rsem/*"
      ontologies: []
output:
  counts_gene:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.genes.results":
          type: file
          description: Expression counts on gene level
          pattern: "*.genes.results"
          ontologies: []
  counts_transcript:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.isoforms.results":
          type: file
          description: Expression counts on transcript level
          pattern: "*.isoforms.results"
          ontologies: []
  stat:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.stat":
          type: file
          description: RSEM statistics
          pattern: "*.stat"
          ontologies: []
  logs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.log":
          type: file
          description: RSEM logs
          pattern: "*.log"
          ontologies: []
  bam_star:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.STAR.genome.bam":
          type: file
          description: BAM file generated by STAR (optional)
          pattern: "*.STAR.genome.bam"
          ontologies: []
  bam_genome:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}.genome.bam:
          type: file
          description: Genome BAM file (optional)
          pattern: "*.genome.bam"
          ontologies: []
  bam_transcript:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - ${prefix}.transcript.bam:
          type: file
          description: Transcript BAM file (optional)
          pattern: "*.transcript.bam"
          ontologies: []
  versions_rsem:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rsem:
          type: string
          description: The tool name
      - 'rsem-calculate-expression --version | sed -e "s/Current version: RSEM v//g"':
          type: eval
          description: The expression to obtain the version of the tool
  versions_star:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - star:
          type: string
          description: The tool name
      - STAR --version | sed -e "s/STAR_//g":
          type: eval
          description: The expression to obtain the version of the tool
  versions_sentieon:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - sentieon:
          type: string
          description: The tool name
      - sentieon driver --version 2>&1 | sed -e "s/sentieon-genomics-//g":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - rsem:
          type: string
          description: The tool name
      - 'rsem-calculate-expression --version | sed -e "s/Current version: RSEM v//g"':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - star:
          type: string
          description: The tool name
      - STAR --version | sed -e "s/STAR_//g":
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - sentieon:
          type: string
          description: The tool name
      - sentieon driver --version 2>&1 | sed -e "s/sentieon-genomics-//g":
          type: eval
          description: The expression to obtain the version of the tool

