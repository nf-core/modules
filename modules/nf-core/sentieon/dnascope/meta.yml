name: sentieon_dnascope
description: DNAscope algorithm performs an improved version of Haplotype
  variant calling.
keywords:
  - dnascope
  - sentieon
  - variant_calling
tools:
  - sentieon:
      description: |
        Sentieon® provides complete solutions for secondary DNA/RNA analysis for a variety of sequencing platforms, including short and long reads.
        Our software improves upon BWA, STAR, Minimap2, GATK, HaplotypeCaller, Mutect, and Mutect2 based pipelines and is deployable on any generic-CPU-based computing system.
      homepage: https://www.sentieon.com/
      documentation: https://www.sentieon.com/
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM file.
        pattern: "*.bam"
        ontologies: []
    - bai:
        type: file
        description: BAI file
        pattern: "*.bai"
        ontologies: []
    - intervals:
        type: file
        description: bed or interval_list file containing interval in the
          reference that will be used in the analysis
        pattern: "*.{bed,interval_list}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing meta information for fasta.
    - fasta:
        type: file
        description: Genome fasta file
        pattern: "*.{fa,fasta}"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing meta information for fasta index.
    - fai:
        type: file
        description: Index of the genome fasta file
        pattern: "*.fai"
        ontologies: []
  - - meta4:
        type: map
        description: |
          Groovy Map containing meta information for dbsnp.
    - dbsnp:
        type: file
        description: Single Nucleotide Polymorphism database (dbSNP) file
        pattern: "*.vcf.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989
  - - meta5:
        type: map
        description: |
          Groovy Map containing meta information for dbsnp_tbi.
    - dbsnp_tbi:
        type: file
        description: Index of the Single Nucleotide Polymorphism database (dbSNP)
          file
        pattern: "*.vcf.gz.tbi"
        ontologies: []
  - - meta6:
        type: map
        description: |
          Groovy Map containing meta information for machine learning model for Dnascope.
    - ml_model:
        type: file
        description: machine learning model file
        pattern: "*.model"
        ontologies: []
  - pcr_indel_model:
      type: string
      description: |
        Controls the option pcr_indel_model for Dnascope.
        The possible options are "NONE" (used for PCR free samples), and "HOSTILE", "AGGRESSIVE" and "CONSERVATIVE".
        See Sentieons documentation for further explanation.
  - emit_vcf:
      type: string
      description: |
        Controls the vcf output from Dnascope.
        Possible options are "all", "confident" and "variant".
        See Sentieons documentation for further explanation.
  - emit_gvcf:
      type: boolean
      description: If true, the haplotyper will output a gvcf
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information.
            e.g. [ id:'test', single_end:false ]
      - "*.unfiltered.vcf.gz":
          type: file
          description: Compressed VCF file
          pattern: "*.unfiltered.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  vcf_tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information.
            e.g. [ id:'test', single_end:false ]
      - "*.unfiltered.vcf.gz.tbi":
          type: file
          description: Index of VCF file
          pattern: "*.unfiltered.vcf.gz.tbi"
          ontologies: []
  gvcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information.
            e.g. [ id:'test', single_end:false ]
      - "*.g.vcf.gz":
          type: file
          description: Compressed GVCF file
          pattern: "*.g.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  gvcf_tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing reference information.
            e.g. [ id:'test', single_end:false ]
      - "*.g.vcf.gz.tbi":
          type: file
          description: Index of GVCF file
          pattern: "*.g.vcf.gz.tbi"
          ontologies: []
  versions_sentieon:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - sentieon:
          type: string
          description: The tool name
      - sentieon driver --version | sed "s/.*-//g":
          type: eval
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - sentieon:
          type: string
          description: The tool name
      - sentieon driver --version | sed "s/.*-//g":
          type: eval
          description: The command used to generate the version of the tool
