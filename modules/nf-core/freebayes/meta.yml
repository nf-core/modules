name: freebayes
description: A haplotype-based variant detector
keywords:
  - variant caller
  - SNP
  - genotyping
  - somatic variant calling
  - germline variant calling
  - bacterial variant calling
  - bayesian
tools:
  - freebayes:
      description: Bayesian haplotype-based polymorphism discovery and genotyping
      homepage: https://github.com/freebayes/freebayes
      documentation: https://github.com/freebayes/freebayes
      tool_dev_url: https://github.com/freebayes/freebayes
      doi: "10.48550/arXiv.1207.3907"
      licence:
        - "MIT"
      identifier: biotools:freebayes
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - input_1:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
          - edam: http://edamontology.org/format_3462 # CRAM
          - edam: http://edamontology.org/format_2573 # SAM
    - input_1_index:
        type: file
        description: BAM/CRAM/SAM index file
        pattern: "*.{bai,crai}"
        ontologies:
          - edam: http://edamontology.org/format_3327 # BAI/CRAI index
    - input_2:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies:
          - edam: http://edamontology.org/format_2572 # BAM
          - edam: http://edamontology.org/format_3462 # CRAM
          - edam: http://edamontology.org/format_2573 # SAM
    - input_2_index:
        type: file
        description: BAM/CRAM/SAM index file
        pattern: "*.{bai,crai}"
        ontologies:
          - edam: http://edamontology.org/format_3327 # BAI/CRAI index
    - target_bed:
        type: file
        description: Optional - Limit analysis to targets listed in this BED-format FILE.
        pattern: "*.bed"
        ontologies:
          - edam: http://edamontology.org/format_3003 # BED
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information.
          e.g. [ id:'test_reference' ]
    - fasta:
        type: file
        description: reference fasta file
        pattern: ".{fa,fa.gz,fasta,fasta.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information.
          e.g. [ id:'test_reference' ]
    - fasta_fai:
        type: file
        description: reference fasta file index
        pattern: "*.{fa,fasta}.fai"
        ontologies:
          - edam: http://edamontology.org/format_3327 # FASTA index
  - - meta4:
        type: map
        description: |
          Groovy Map containing meta information for the samples file.
          e.g. [ id:'test_samples' ]
    - samples:
        type: file
        description: Optional - Limit analysis to samples listed (one per line) in the FILE.
        pattern: "*.txt"
        ontologies:
          - edam: http://edamontology.org/format_2330 # Textual format
  - - meta5:
        type: map
        description: |
          Groovy Map containing meta information for the populations file.
          e.g. [ id:'test_populations' ]
    - populations:
        type: file
        description: Optional - Each line of FILE should list a sample and a population which it is part of.
        pattern: "*.txt"
        ontologies:
          - edam: http://edamontology.org/format_2330 # Textual format
  - - meta6:
        type: map
        description: |
          Groovy Map containing meta information for the cnv file.
          e.g. [ id:'test_cnv' ]
    - cnv:
        type: file
        description: |
          A copy number map BED file, which has either a sample-level ploidy:
          sample_name copy_number
          or a region-specific format:
          seq_name start end sample_name copy_number
        pattern: "*.bed"
        ontologies:
          - edam: http://edamontology.org/format_3003 # BED
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.vcf.gz":
          type: file
          description: Compressed VCF file
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  versions_freebayes:
    - - ${task.process}:
          type: string
          description: The name of the process
      - freebayes:
          type: string
          description: The name of the tool
      - freebayes --version 2>&1 | sed "s/version:\s*v//g":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - freebayes:
          type: string
          description: The name of the tool
      - freebayes --version 2>&1 | sed "s/version:\s*v//g":
          type: eval
          description: The expression to obtain the version of the tool
