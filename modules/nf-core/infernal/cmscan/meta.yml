# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "infernal_cmsearch"
description: Search covariance models against a sequence collection using cmscan
keywords:
  - rrna
  - covariance model
  - sequence search
  - cmscan
tools:
  - "infernal":
      description: "Infernal is for searching DNA sequence databases for RNA structure
        and sequence similarities."
      homepage: "http://eddylab.org/infernal/Userguide.pdf"
      documentation: "http://eddylab.org/infernal/Userguide.pdf"
      tool_dev_url: "https://github.com/EddyRivasLab/infernal"
      doi: "10.1093/bioinformatics/btt509"
      licence:
        - "BSD-3-clause"
      identifier: biotools:infernal
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: |
          A FASTA file of sequences to search against the covariance models.
          Can be gzipped.
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - - meta2:
        type: map
        description: |
          Groovy Map containing sample information for the covariance model directory
          e.g. [ id:'test' ]
    - cmdb:
        type: file
        description: |
          A directory containing calibrated Infernal covariance model (.cm) files.
        ontologies:
          - edam: http://edamontology.org/data_4388 # Covariance model
  - clanin:
      type: file
      description: |
          A clan inflation file (clanin) for clan detection during search.
          When provided, cmscan automatically uses --clanin, --fmt 2, and --oclan.
      ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.txt.gz":
          type: file
          description: Human readable output summarising cmscan search results
          pattern: "*.{txt.gz}"
          ontologies:
            - edam: http://edamontology.org/data_3671 # Text
  tbl:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - "*.tbl.gz":
          type: file
          description: Tabular (space-delimited) summary of per-target output
          pattern: "*.{tbl.gz}"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_infernal:
    - - ${task.process}:
          type: string
          description: The name of the process
      - infernal:
          type: string
          description: The name of the tool
      - cmscan -h | sed '2!d;s/.*INFERNAL //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
  versions_gzip:
    - - ${task.process}:
          type: string
          description: The name of the process
      - gzip:
          type: string
          description: The name of the tool
      - gzip --version |& sed '1!d;s/gzip //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - infernal:
          type: string
          description: The name of the tool
      - cmscan -h | sed '2!d;s/.*INFERNAL //;s/ .*//':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@sainsachiko"
maintainers:
  - "@sainsachiko"
