name: "sam2lca_analyze"
description: Calling lowest common ancestors from multi-mapped reads in SAM/BAM/CRAM
  files
keywords:
  - LCA
  - alignment
  - bam
  - metagenomics
  - Ancestor
  - multimapper
tools:
  - "sam2lca":
      description: "Lowest Common Ancestor on SAM/BAM/CRAM alignment files"
      homepage: "https://github.com/maxibor/sam2lca"
      documentation: "https://sam2lca.readthedocs.io"
      doi: "10.21105/joss.04360"
      licence: ["GPL v3"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
    - bai:
        type: file
        description: BAM/CRAM/SAM index
        pattern: "*.{bai,.crai}"
        ontologies: []
  - database:
      type: file
      description: Directory containing the sam2lca database
      pattern: "*"
      ontologies: []
output:
  csv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.csv":
          type: file
          description: CSV file containing the sam2lca results
          pattern: "*.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.json":
          type: file
          description: JSON file containing the sam2lca results
          pattern: "*.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bam":
          type: file
          description: Optional sorted BAM/CRAM/SAM file annotated with LCA taxonomic
            information
          pattern: "*.bam"
          ontologies: []
  versions_sam2lca:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sam2lca:
          type: string
          description: The name of the tool
      - "sam2lca --version | sed 's/.*version //'":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - sam2lca:
          type: string
          description: The name of the tool
      - "sam2lca --version | sed 's/.*version //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@maxibor"
maintainers:
  - "@maxibor"
