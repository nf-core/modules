name: metaphlan_metaphlan
description: Profile the taxonomic composition of microbial communities from metagenomic shotgun sequencing data
keywords:
  - metagenomics
  - classification
  - taxonomic profiling
  - microbiome
  - fastq
  - fasta
  - sam
tools:
  - metaphlan:
      description: Identify clades (phyla to species) present in the metagenome obtained from a microbiome sample and their relative abundance
      homepage: https://huttenhower.sph.harvard.edu/metaphlan/
      documentation: https://github.com/biobakery/MetaPhlAn/wiki/MetaPhlAn-4.3
      tool_dev_url: https://github.com/biobakery/MetaPhlAn
      doi: "10.1038/s41587-023-01688-w"
      licence:
        - "MIT License"
      args_id: "$args"
      identifier: biotools:metaphlan
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - input:
        type: file
        description: Reads (FASTQ or FASTA), a `mapout` file, or a SAM file of alignments to the marker database
        pattern: "*.{fastq,fq,fastq.gz,fq.gz,fastq.bz2,fq.bz2,fasta,fna,fa,fasta.gz,fna.gz,fa.gz,fasta.bz2,fna.bz2,fa.bz2,mapout,mapout.bz2,sam,sam.bz2}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3989 # GZIP format
          - edam: http://edamontology.org/format_2573 # SAM
  - - meta2:
        type: map
        description: |
          Groovy Map containing database information
          e.g. `[ id:'mpa_vJan26' ]`
    - db_metaphlan_latest:
        type: directory
        description: MetaPhlAn database directory (e.g. from `metaphlan/makedb`); with `--long_reads` it must hold the `.mmi` index
        pattern: "*/"
  - - meta3:
        type: map
        description: |
          Groovy Map containing marker list information
          e.g. `[ id:'ignore_list' ]`
    - ignore_markers:
        type: file
        description: Optional. Text file with one marker name per line to exclude from profiling
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_3671 # Text
  - save_samfile:
      type: boolean
      description: Whether to save the SAM file of read alignments (always saved with `--profile_vsc`)
output:
  profile:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}_profile.txt:
          type: file
          description: Optional. Tab-separated taxon relative abundances, absent with `--biom_format_output`
          pattern: "*_profile.txt"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  biom:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.biom:
          type: file
          description: Optional. Profile in BIOM format, only with `--biom_format_output` (replaces the text profile)
          pattern: "*.biom"
          ontologies:
            - edam: http://edamontology.org/format_3746 # BIOM format
  mapout:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.mapout.bz2:
          type: file
          description: Optional. Bzip2-compressed mapping to the marker database, reusable as input (FASTQ or FASTA input only)
          pattern: "*.mapout.bz2"
          ontologies: []
  sam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.sam.bz2:
          type: file
          description: Optional. Bzip2-compressed SAM of marker alignments, with `save_samfile` or `--profile_vsc` (FASTQ or FASTA input only)
          pattern: "*.sam.bz2"
          ontologies:
            - edam: http://edamontology.org/format_2573 # SAM
  vsc:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}_vsc.tsv:
          type: file
          description: Optional. Viral sequence cluster profile, only with `--profile_vsc` and reads hitting viral markers
          pattern: "*_vsc.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  subsampled:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.subsampled.${input_type}.gz:
          type: file
          description: Optional. Gzipped subsampled reads, only with `--subsampling N` on FASTQ or FASTA input and N below the read count
          pattern: "*.subsampled.{fastq,fasta}.gz"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
            - edam: http://edamontology.org/format_1929 # FASTA
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_metaphlan:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - metaphlan:
          type: string
          description: The tool name
      - metaphlan --version 2>&1 | head -n 1 | cut -d ' ' -f 3:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - metaphlan:
          type: string
          description: The tool name
      - metaphlan --version 2>&1 | head -n 1 | cut -d ' ' -f 3:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@MGordon09"
  - "@LilyAnderssonLee"
maintainers:
