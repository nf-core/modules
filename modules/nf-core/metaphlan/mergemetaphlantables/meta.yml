name: "metaphlan_mergemetaphlantables"
description: Merge MetaPhlAn abundance tables (text profiles) of several samples into one table with `merge_metaphlan_tables.py`
keywords:
  - metagenomics
  - classification
  - merge
  - table
  - profiles
tools:
  - metaphlan:
      description: Identify clades (phyla to species) present in the metagenome obtained from a microbiome sample and their relative abundance
      homepage: https://huttenhower.sph.harvard.edu/metaphlan/
      documentation: https://github.com/biobakery/MetaPhlAn/wiki/MetaPhlAn-4.3
      tool_dev_url: https://github.com/biobakery/MetaPhlAn
      doi: "10.1038/s41587-023-01688-w"
      licence:
        - "MIT License"
      args_id: "$args"
      identifier: biotools:metaphlan
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test', single_end:false ]`
    - profiles:
        type: file
        description: List of per-sample MetaPhlAn taxonomic abundance tables (text profiles)
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
output:
  txt:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - ${prefix}.txt:
          type: file
          description: Combined MetaPhlAn abundance table
          pattern: "*.txt"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_metaphlan:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - metaphlan:
          type: string
          description: The tool name
      - metaphlan --version 2>&1 | head -n 1 | cut -d ' ' -f 3:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - metaphlan:
          type: string
          description: The tool name
      - metaphlan --version 2>&1 | head -n 1 | cut -d ' ' -f 3:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@jfy133"
  - "@LilyAnderssonLee"
maintainers:
  - "@jfy133"
  - "@LilyAnderssonLee"
  - "@plazanas"
