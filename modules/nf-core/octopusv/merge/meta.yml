name: "octopusv_merge"
description: "Merge and harmonize structural variant calls from multiple samples."
keywords:
  - structural variants
  - merge
  - genomics
  - svcf
tools:
  - "octopusv":
      description: "End-to-end structural variant post-processing: standardize, merge, compare, and export SVs."
      homepage: "https://github.com/ylab-hi/OctopuSV"
      documentation: "https://github.com/ylab-hi/OctopuSV"
      tool_dev_url: "https://github.com/ylab-hi/octopusV"
      doi: "10.1093/bioinformatics/btaf599"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - svcfs:
        type: file
        description: SVCF files to stage for merging. If input_list is not supplied, these are
          passed as --input-file. If input_list is supplied, these must include every
          local SVCF referenced by the list, and list entries should use the staged
          filenames (for example, `sample.svcf`).
        pattern: "*.svcf"
        optional: true
        ontologies:
          - edam: "http://edamontology.org/format_3016"
    - input_list:
        type: file
        description: |
          Optional text file containing one staged SVCF filename per line, optionally
          followed by a tab and a caller or sample label. Relative paths are resolved
          relative to this file. Files referenced by the list must also be supplied in
          svcfs so Nextflow stages them.
        pattern: "*.txt"
        ontologies:
          - edam: "http://edamontology.org/format_2330"
    - specific_svcfs:
        type: string
        description: |
          One or more of the input SVCF files to extract SVs supported by them. Only used when strategy_flag
          is specific.
        pattern: "*.svcf"
        optional: true
        ontologies:
          - edam: "http://edamontology.org/format_3016"
    - strategy_flag:
        type: string
        optional: true
        description: |
          Merge strategy. Valid values include union, intersect, specific,
          min-support, exact-support, max-support and expression. An empty
          value defaults to union. Strategies taking a scalar value include
          it in this string, for example "min-support 2". The specific
          strategy obtains its files from specific_svcfs.
output:
  svcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.svcf":
          type: file
          description: Sorted VCF file
          pattern: "*.svcf"
          ontologies:
            - edam: "http://edamontology.org/format_3016"
  upset_plot:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.png":
          type: file
          description: Upset plot comparing the variants in the input SVCF files (generated with --upsetr-output flag)
          pattern: "*.png"
          ontologies:
            - edam: "http://edamontology.org/format_3603"
  versions_octopusv:
    - - ${task.process}:
          type: string
          description: The name of the process
      - octopusv:
          type: string
          description: The name of the tool
      - python -c "import importlib.metadata as m; print(m.version('octopusv'))":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - octopusv:
          type: string
          description: The name of the tool
      - python -c "import importlib.metadata as m; print(m.version('octopusv'))":
          type: eval
          description: The expression to obtain the version of the tool
