name: pbbam_pbmerge
description: The pbbam software package provides components to create, query, & edit
  PacBio BAM files and associated indices. These components include a core C++ library,
  bindings for additional languages, and command-line utilities.
deprecated: true
keywords:
  - pbbam
  - pbmerge
  - bam
tools:
  - pbbam:
      description: PacBio BAM C++ library
      homepage: https://github.com/PacificBiosciences/pbbioconda
      documentation: https://pbbam.readthedocs.io/en/latest/tools/pbmerge.html
      tool_dev_url: https://github.com/pacificbiosciences/pbbam/
      licence: ["BSD-3-Clause-Clear"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bam:
        type: file
        description: BAM files to merge
        pattern: "*.bam"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.bam":
          type: file
          description: The merged bam file
          pattern: "*.bam"
          ontologies: []
  pbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.pbi":
          type: file
          description: BAM Pacbio index file
          pattern: "*.bam.pbi"
          ontologies: []
  versions_pbbam:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pbbam:
          type: string
          description: The name of the tool
      - "pbmerge --version | head -n1 | sed 's/pbmerge //' | sed -E 's/ .+//'":
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pbbam:
          type: string
          description: The name of the tool
      - "pbmerge --version | head -n1 | sed 's/pbmerge //' | sed -E 's/ .+//'":
          type: string
          description: The expression to obtain the version of the tool
authors:
  - "@sguizard"
maintainers:
  - "@sguizard"
