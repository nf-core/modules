name: "aldy_genotype"
description: Genotype and phase pharmacogenes using star-allele nomenclature
keywords:
  - pharmacogenomics
  - star-allele
  - genotyping
  - phasing
  - cyp2d6
tools:
  - "aldy":
      description: "Allelic decomposition and exact genotyping of highly polymorphic and structurally variant pharmacogenes"
      homepage: "https://github.com/0xTCG/aldy"
      documentation: "https://aldy.readthedocs.io/en/latest/"
      tool_dev_url: "https://github.com/0xTCG/aldy"
      doi: "10.1101/gr.277075.122"
      licence:
        - "Aldy/IURTC License (free for academic/non-commercial use)"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - input:
        type: file
        description: Alignment (SAM/BAM/CRAM) or variant (VCF) file mapped to hg19 or hg38
        pattern: "*.{sam,bam,cram,vcf,vcf.gz}"
        ontologies:
          - edam: http://edamontology.org/format_2573
          - edam: http://edamontology.org/format_2572
          - edam: http://edamontology.org/format_3462
          - edam: http://edamontology.org/format_3016
    - index:
        type: file
        description: Index of the input file
        pattern: "*.{bai,crai,csi,tbi}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'genome' ]`
    - fasta:
        type: file
        description: Reference genome FASTA file, required for CRAM input
        pattern: "*.{fa,fasta,fna}"
        ontologies:
          - edam: http://edamontology.org/format_1929
  - - meta3:
        type: map
        description: |
          Groovy Map containing profile information
          e.g. `[ id:'profile' ]`
    - profile_file:
        type: file
        description: Optional custom sequencing profile (e.g. generated with `aldy profile`). When provided, it takes precedence over `profile`.
        pattern: "*"
        ontologies: []
  - gene:
      type: string
      description: |
        Gene (or comma-separated list of genes) to genotype, e.g. `CYP2D6`.
        Use `all` to genotype every supported gene.
  - profile:
      type: string
      description: |
        Name of a built-in sequencing profile. Ignored when `profile_file` is provided.
      pattern: "illumina|wgs|pgx1|pgx2|pgx3|pgrnseq-v1|pgrnseq-v2|pgrnseq-v3|10x|exome|wxs|wes|pacbio-hifi-targeted|pacbio-hifi-targeted-twist"
output:
  aldy:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.aldy":
          type: file
          description: Tab-separated file with the star-allele decomposition of each solution
          pattern: "*.aldy"
          ontologies:
            - edam: http://edamontology.org/format_3475
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.log":
          type: file
          description: Aldy log file
          pattern: "*.log"
          ontologies: []
  versions_aldy:
    - - ${task.process}:
          type: string
          description: The name of the process
      - aldy:
          type: string
          description: The name of the tool
      - aldy help 2>&1 | grep -o 'Aldy v[0-9.]*' | cut -c7-:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - aldy:
          type: string
          description: The name of the tool
      - aldy help 2>&1 | grep -o 'Aldy v[0-9.]*' | cut -c7-:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@JoseEspinosa"
maintainers:
  - "@JoseEspinosa"
