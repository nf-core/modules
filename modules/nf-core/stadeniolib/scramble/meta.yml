name: "stadeniolib_scramble"
description: Advanced sequence file format conversions
keywords:
  - sam
  - bam
  - cram
  - compression
tools:
  - "scramble":
      description: "Staden Package 'io_lib' (sometimes referred to as libstaden-read by distributions). This contains code for reading and writing a variety of Bioinformatics / DNA Sequence formats."
      homepage: "https://github.com/jkbonfield/io_lib"
      documentation: "https://github.com/jkbonfield/io_lib/blob/master/README.md"
      tool_dev_url: "https://github.com/jkbonfield/io_lib"
      licence: ["BSD"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: BAM/CRAM/SAM file
        pattern: "*.{bam,cram,sam}"
        ontologies: []
  - fasta:
      type: file
      description: Reference genome in FASTA format
      pattern: "*.{fa,fasta}"
      ontologies: []
  - fai:
      type: file
      description: FASTA index file from samtools faidx
      pattern: "*.{fai}"
      ontologies: []
  - gzi:
      type: file
      description: Optional gzip index file for BAM inputs
      pattern: "*.gzi"
      ontologies: []
output:
  cram:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{cram,bam}":
          type: file
          description: Compressed BAM/CRAM file
          pattern: "*.{cram,bam}"
          ontologies: []
  gzi:
    - "*.gzi":
        type: file
        description: gzip index file for BAM outputs
        pattern: ".{bam.gzi}"
        ontologies: []
  versions_scramble:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scramble:
          type: string
          description: The name of the tool
      - scramble -h | head -n 1 | sed 's/^.*version //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - scramble:
          type: string
          description: The name of the tool
      - scramble -h | head -n 1 | sed 's/^.*version //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@matthdsm"
maintainers:
