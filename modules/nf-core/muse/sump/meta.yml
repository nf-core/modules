# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "muse_sump"
description: Computes tier-based cutoffs from a sample-specific error model which
  is generated by muse/call and reports the finalized variants
keywords:
  - variant calling
  - somatic
  - wgs
  - wxs
  - vcf
tools:
  - "muse":
      description: "Somatic point mutation caller based on Markov substitution model
        for molecular evolution"
      homepage: "https://bioinformatics.mdanderson.org/public-software/muse/"
      documentation: "https://github.com/wwylab/MuSE"
      tool_dev_url: "https://github.com/wwylab/MuSE"
      doi: "10.1186/s13059-016-1029-6"
      publication:
        author: "Fan, Y., Xi, L., Hughes, D. S. T., Zhang, J., Zhang, J., Futreal, P. A., Wheeler, D. A. & Wang, W."
        year: 2016
        title: "MuSE: accounting for tumor heterogeneity using a sample-specific error model improves sensitivity and specificity in mutation calling from sequencing data"
        source: "Genome Biology"
      licence: ["https://github.com/danielfan/MuSE/blob/master/LICENSE"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - muse_call_txt:
        type: file
        description: single input file generated by 'MuSE call'
        pattern: "*.MuSE.txt"
        ontologies: []
    - ref_vcf:
        type: file
        description: |
          dbSNP vcf file that should be bgzip compressed, tabix indexed and
          based on the same reference genome used in 'MuSE call'
        pattern: ".vcf.gz"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
    - ref_vcf_tbi:
        type: file
        description: Tabix index for the dbSNP vcf file
        pattern: ".vcf.gz.tbi"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.vcf.gz":
          type: map
          description: bgzipped vcf file with called variants
          pattern: "*.vcf.gz"
  tbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.vcf.gz.tbi":
          type: map
          description: tabix index of bgzipped vcf file with called variants
          pattern: "*.vcf.gz.tbi"
  versions_muse:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - muse:
          type: string
          description: The tool name
      - "MuSE --version | sed -e 's/MuSE, version //g' | sed -e 's/MuSE v//g'":
          type: string
          description: The command used to generate the version of the tool
  versions_bgzip:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bgzip:
          type: string
          description: The tool name
      - "bgzip --version | sed -n 's/bgzip (htslib) \\([0-9.]*\\)/\\1/p'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - muse:
          type: string
          description: The tool name
      - "MuSE --version | sed -e 's/MuSE, version //g' | sed -e 's/MuSE v//g'":
          type: string
          description: The command used to generate the version of the tool
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - bgzip:
          type: string
          description: The tool name
      - "bgzip --version | sed -n 's/bgzip (htslib) \\([0-9.]*\\)/\\1/p'":
          type: string
          description: The command used to generate the version of the tool
authors:
  - "@famosab"
maintainers:
  - "@famosab"
