name: "motus_preplong"
description: Taxonomic meta-omics profiling using universal marker genes
keywords:
  - classify
  - metagenomics
  - fastq
  - taxonomic profiling
tools:
  - "motus":
      description: "Marker gene-based operational taxonomic unit (mOTU) profiling"
      homepage: "https://motu-tool.org/"
      documentation: "https://github.com/motu-tool/mOTUs/wiki"
      tool_dev_url: "https://github.com/motu-tool/mOTUs"
      doi: "10.1186/s40168-022-01410-z"
      licence:
        - "GPL v3"
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - reads:
        type: file
        description: Long read file to convert, can be fasta(.gz) or fastq(.gz)
        pattern: "*.{gz}"
        ontologies:
          - edam: http://edamontology.org/format_3989 # GZIP format
  - db:
      type: directory
      description: |
        mOTUs database downloaded by `motus downloadDB`
        pattern: "db_mOTU/"
output:
  out:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.gz":
          type: file
          description: converted file (gzipped), ready to be used by motus profile
          pattern: "*.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_motus:
    - - ${task.process}:
          type: string
          description: The name of the process
      - motus:
          type: string
          description: The name of the tool
      - 3.1.0:
          type: string
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - motus:
          type: string
          description: The name of the tool
      - 3.1.0:
          type: string
          description: The expression to obtain the version of the tool

authors:
  - "@sofstam"
maintainers:
  - "@sofstam"
