name: ucsc_bigwigaverageoverbed
description: compute average score of bigwig over bed file
keywords:
  - bigwig
  - bedGraph
  - ucsc
tools:
  - ucsc:
      description: Compute average score of big wig over each bed, which may have introns.
      homepage: http://hgdownload.cse.ucsc.edu/admin/exe/
      documentation: http://www.genome.ucsc.edu/goldenPath/help/bigWig.html
      licence: ["varies; see http://genome.ucsc.edu/license"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - bed:
        type: file
        description: bed file
        pattern: "*.{bed}"
        ontologies: []
  - bigwig:
      type: file
      description: bigwig file
      pattern: "*.{bigwig,bw}"
      ontologies: []
output:
  tab:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.tab":
          type: file
          description: tab file
          pattern: "*.{tab}"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_ucsc:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ucsc:
          type: string
          description: The name of the tool
      - "482":
          type: string
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - ucsc:
          type: string
          description: The name of the tool
      - "482":
          type: string
          description: The expression to obtain the version of the tool
