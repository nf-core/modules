name: "spotiflow"
description: Spotiflow, accurate and efficient spot detection with stereographic flow.
keywords:
  - imaging
  - image
  - microscopy
  - transcriptomics
  - spatial
  - spot
  - detection
tools:
  - "spotiflow":
      description: "Spotiflow allows for accurate and efficient spot detection with stereographic flow"
      homepage: "https://weigertlab.github.io/spotiflow/"
      documentation: "https://weigertlab.github.io/spotiflow/"
      tool_dev_url: "https://github.com/weigertlab/spotiflow"
      doi: "10.1101/2024.02.01.578426"
      licence:
        - "BSD-3"
      identifier: ""

## Spotiflow requires only an input image file
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - image_2d:
        type: file
        description: 2D TIF Image file with the spots to be detected
        pattern: "*.{tif,tiff,png,jpg,jpeg}"
        ontologies: []
output:
  spots:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.csv":
          type: file
          description: CSV file with the X, Y positions of the detected spots.
          pattern: "*.{csv}"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  versions_spotiflow:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spotiflow":
          type: string
          description: The name of the tool
      - "python -m pip show spotiflow | grep 'Version' | sed -e 's/Version: //g'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "spotiflow":
          type: string
          description: The name of the tool
      - "python -m pip show spotiflow | grep 'Version' | sed -e 's/Version: //g'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@migueLib"
maintainers:
  - "@migueLib"
