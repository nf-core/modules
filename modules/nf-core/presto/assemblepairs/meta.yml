name: "presto_assemblepairs"
description: |
  Assembles paired-end reads into single reads using pRESTO AssemblePairs.py.
  The `mode` input selects the subcommand: `align`, `join`, `reference` or `sequential`.
  The subcommands share the same inputs, outputs and options, so they are exposed
  through one module rather than four; only `reference` and `sequential` use the
  reference input.
  The `reference` and `sequential` modes default to `--aligner usearch`, which is not
  in the container; pass `--aligner blastn` through `ext.args`.
  The module sets `--nproc ${task.cpus}`; with more than one process the order of
  the output records is not deterministic.
  Output FASTQ file names follow the input extension (e.g. `.fastq` or `.fq.gz`).
keywords:
  - immcantation
  - airrseq
  - paired-end
  - assembly
  - immunoinformatics
  - fastq
tools:
  - "presto":
      description: "A bioinformatics toolkit for processing high-throughput lymphocyte
        receptor sequencing data."
      homepage: "https://immcantation.readthedocs.io"
      documentation: "https://presto.readthedocs.io/en/stable/tools/AssemblePairs.html"
      tool_dev_url: "https://github.com/immcantation/presto"
      doi: "10.1093/bioinformatics/btu138"
      licence:
        - "AGPL v3"
      identifier: biotools:presto
      args_id: "$args"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - reads_1:
        type: file
        description: FASTQ file of the first read of each pair (R1)
        pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
    - reads_2:
        type: file
        description: FASTQ file of the second read of each pair (R2)
        pattern: "*.{fastq,fastq.gz,fq,fq.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1930 # FASTQ
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'reference' ]`
    - reference:
        type: file
        description: |
          Optional. Reference sequences in FASTA format.
          Required by the `reference` and `sequential` modes, ignored otherwise.
        pattern: "*.{fasta,fa,fasta.gz,fa.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
  - mode:
      type: string
      description: AssemblePairs subcommand. One of `align`, `join`, `reference` or `sequential`.
output:
  reads:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_assemble-pass.{fastq,fastq.gz,fq,fq.gz}:
          type: file
          description: |
            Optional. Successfully assembled reads.
            Only emitted when at least one pair assembles.
          pattern: "*_assemble-pass.{fastq,fastq.gz,fq,fq.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  reads_fail:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}-{1,2}_assemble-fail.{fastq,fastq.gz,fq,fq.gz}:
          type: file
          description: |
            Optional. Reads of pairs that failed assembly, one file per read (R1 and R2).
            Only emitted when at least one pair fails.
          pattern: "*-{1,2}_assemble-fail.{fastq,fastq.gz,fq,fq.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1930 # FASTQ
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_assemble.log:
          type: file
          description: Per-pair assembly log written by AssemblePairs.py
          pattern: "*_assemble.log"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text
  command_log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - ${prefix}_command_log.txt:
          type: file
          description: Standard output of AssemblePairs.py
          pattern: "*_command_log.txt"
          ontologies:
            - edam: http://edamontology.org/format_3671 # Plain text
  versions_presto:
    - - ${task.process}:
          type: string
          description: The name of the process
      - presto:
          type: string
          description: The name of the tool
      - AssemblePairs.py --version | grep -o "[0-9][0-9.]*" | head -n 1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - presto:
          type: string
          description: The name of the tool
      - AssemblePairs.py --version | grep -o "[0-9][0-9.]*" | head -n 1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
