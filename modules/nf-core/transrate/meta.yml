name: "transrate"
description: |
  Reference-free and reference-based quality assessment of de novo transcriptome
  assemblies. Only sequence-based (--assembly) and reference-based (--reference) metrics
  are supported. Read-based metrics (--left/--right) are not: they hard-require the
  `bam-read` binary, which isn't published on any conda channel, and their aligner
  (snap-aligner, pinned to an old dev build) segfaults building an index for at least
  small test genomes.
keywords:
  - transcriptome
  - assembly
  - quality control
  - qc
  - de novo
tools:
  - "transrate":
      description: "Reference free quality assessment of de-novo transcriptome assemblies"
      homepage: "https://github.com/blahah/transrate/"
      documentation: "http://hibberdlab.com/transrate/"
      tool_dev_url: "https://github.com/blahah/transrate/"
      doi: "10.1101/gr.196469.115"
      licence: ["MIT"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - assembly:
        type: file
        description: Transcriptome assembly FASTA file to be evaluated
        pattern: "*.{fasta,fa}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
    - reference:
        type: file
        description: Optional reference proteome or transcriptome FASTA file, to enable reference-based comparative metrics. Pass `[]` to skip.
        pattern: "*.{fasta,fa}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA

output:
  assemblies:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.assemblies.csv":
          type: file
          description: One-row-per-assembly summary of quality metrics
          pattern: "*.assemblies.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  contigs:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.contigs.csv":
          type: file
          description: Per-contig quality metrics
          pattern: "*.contigs.csv"
          ontologies:
            - edam: "http://edamontology.org/format_3752" # CSV
  versions_transrate:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "transrate":
          type: string
          description: The name of the tool
      - "transrate --version":
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - transrate:
          type: string
          description: The name of the tool
      - transrate --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@erikrikarddaniel"
maintainers:
  - "@erikrikarddaniel"
