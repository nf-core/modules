name: "longphase_haplotag"
description: LongPhase is an ultra-fast program for simultaneously co-phasing SNPs, small indels, large SVs, and (5mC) modifications for Nanopore and PacBio platforms.
keywords:
  - haplotag
  - long-read
  - genomics
tools:
  - "longphase":
      description: "LongPhase is an ultra-fast program for simultaneously co-phasing SNPs, small indels, large SVs, and (5mC) modifications for Nanopore and PacBio platforms."
      homepage: "https://github.com/twolinin/longphase"
      documentation: "https://github.com/twolinin/longphase"
      tool_dev_url: "https://github.com/twolinin/longphase"
      doi: "10.1093/bioinformatics/btac058"
      licence:
        - "GPL v3"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Sorted BAM/CRAM file
        pattern: "*.{bam,cram}"
        ontologies: []
    - bai:
        type: file
        description: Index of sorted BAM/CRAM file
        pattern: "*.{bai,crai,csi}"
        ontologies: []
    - snps:
        type: file
        description: VCF file with SNPs (and INDELs)
        pattern: "*.{vcf,vcf.gz}"
        ontologies: []
    - svs:
        type: file
        description: VCF file with SVs
        pattern: "*.{vcf,vcf.gz}"
        ontologies: []
    - mods:
        type: file
        description: modcall-generated VCF with modifications
        pattern: "*.{vcf,vcf.gz}"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'hg38' ]`
    - fasta:
        type: file
        description: Reference fasta file
        pattern: "*.fasta"
        ontologies: []
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. `[ id:'hg38' ]`
    - fai:
        type: file
        description: Reference fai index
        pattern: "*.fai"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.{bam,cram}":
          type: file
          description: BAM file with haplotagged reads
          pattern: "*.bam"
          ontologies: []
  log:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.log":
          type: file
          description: Log file
          pattern: "*.log"
          ontologies: []
  versions_longphase:
    - - ${task.process}:
          type: string
          description: The name of the process
      - longphase:
          type: string
          description: The name of the tool
      - "longphase --version | head -n 1 | sed 's/^LongPhase Ver //'":
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - longphase:
          type: string
          description: The name of the tool
      - "longphase --version | head -n 1 | sed 's/^LongPhase Ver //'":
          type: eval
          description: The expression to obtain the version of the tool
authors:
