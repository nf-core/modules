name: "datavzrd"
description: Datavzrd is a tool to create visual HTML reports from collections of CSV/TSV tables.
keywords:
  - visualisation
  - tsv
  - csv
tools:
  - datavzrd:
      description: Datavzrd is a tool to create visual HTML reports from collections of CSV/TSV tables.
      homepage: https://datavzrd.github.io/
      documentation: https://datavzrd.github.io/docs/index.html
      tool_dev_url: https://github.com/datavzrd/datavzrd
      licence: ["MIT"]
      identifier: ""
      args_id: "$args"

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test' ]
    - config_file:
        type: file
        description: Path to a config file in YAML format
        pattern: "*.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
    - files:
        type: file
        description: One or more files referenced in the config file, e.g. CSV/TSV
          tables
        pattern: "*"
        ontologies:
          - edam: http://edamontology.org/format_3752 # CSV
          - edam: http://edamontology.org/format_3475 # TSV
output:
  report:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test' ]
      - ${prefix}:
          type: directory
          description: directory with HTML report of provided CSV/TSV files
          pattern: "${prefix}"
  versions_datavzrd:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - datavzrd:
          type: string
          description: The tool name
      - "datavzrd --version | sed -e 's/[^0-9.]//g'":
          type: string
          description: The command used to generate the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The process the versions were collected from
      - datavzrd:
          type: string
          description: The tool name
      - "datavzrd --version | sed -e 's/[^0-9.]//g'":
          type: string
          description: The command used to generate the version of the tool
authors:
