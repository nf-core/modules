name: "kivvi"
description: Calls copy number and sequence variants in large-unit variable number tandem repeats from PacBio HiFi reads
keywords:
  - kivvi
  - genotyper
  - tandem repeat
  - vntr
  - hifi
tools:
  - "kivvi":
      description: "HiFi-based genotyper for large-unit VNTRs including KIV2 and D4Z4"
      homepage: "https://github.com/PacificBiosciences/kivvi"
      documentation: "https://github.com/PacificBiosciences/kivvi/blob/main/README.md"
      tool_dev_url: "https://github.com/PacificBiosciences/kivvi"
      doi: "10.64898/2026.04.10.717730"
      licence:
        - "Pacific Biosciences Software License (https://github.com/PacificBiosciences/kivvi/blob/main/LICENSE.md)"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - bam:
        type: file
        description: |
          BAM file containing PacBio HiFi whole-genome reads aligned to GRCh38,
          or a subset covering the target KIV2 or D4Z4 regions
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572"
    - bai:
        type: file
        description: |
          BAI index file corresponding to the BAM file
        pattern: "*.bai"
        ontologies:
          - edam: "http://edamontology.org/format_2573"
  - command:
      type: string
      description: The command used to run the tool, i.e. kiv2 (LPA KIV2 repeat) or d4z4 (D4Z4 repeat)
output:
  json:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.kivvi.*.json":
          type: file
          description: JSON report containing genotyping results for the target KIV2 or D4Z4 region
          pattern: "*.kivvi.*.json"
          ontologies:
            - edam: "http://edamontology.org/format_3464"
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.kivvi.*.vcf":
          type: file
          description: Variant calls for the target KIV2 or D4Z4 region
          pattern: "*.kivvi.*.vcf"
          ontologies:
            - edam: "http://edamontology.org/format_3016"
  svg:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.kivvi.*.svg":
          type: file
          description: Optional SVG visualisation of genotyping results for the target KIV2 or D4Z4 region
          pattern: "*.kivvi.*.svg"
          ontologies: []
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.kivvi.*.bam":
          type: file
          description: |
            Reads realigned to a single repeat unit of the target KIV2 or D4Z4
            region, with HP tags identifying repeat copies
          pattern: "*.kivvi.*.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572"
  bai:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.kivvi.*.bam.bai":
          type: file
          description: BAI index file corresponding to the realigned BAM file
          pattern: "*.kivvi.*.bam.bai"
          ontologies:
            - edam: "http://edamontology.org/format_2573"
  versions_kivvi:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kivvi:
          type: string
          description: The name of the tool
      - kivvi --version | sed 's/.* //g':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - kivvi:
          type: string
          description: The name of the tool
      - kivvi --version | sed 's/.* //g':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@sofiademmou"
maintainers:
  - "@sofiademmou"
