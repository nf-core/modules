name: "custom_collectfeaturecounts"
description: |
  Collects one or more subread/featureCounts raw output files (typically one per sample,
  for the same feature type/ORF caller) into a single long-format table with per-sample
  TPM (Transcripts Per Million)  computed.
keywords:
  - featurecounts
  - collect
  - counts
  - tpm
tools:
  - "collectfeaturecounts":
      description: |
        In-house R script that reshapes one or more raw featureCounts output files into a
        single long-format table (one row per feature/sample), computing transcripts per million (TPMs) per sample.
      tool_dev_url: "https://github.com/nf-core/modules/blob/master/modules/nf-core/custom/collectfeaturecounts/main.nf"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - inputfiles:
        type: file
        description: |
          One or more raw featureCounts output files (as produced by `subread/featurecounts`),
          typically one per sample against the same feature set/ORF caller. The sample name
          is taken from each file's count column header (its BAM filename, with a trailing
          `.sorted.bam` stripped).
        pattern: "*.featureCounts.tsv"
        ontologies:
          - edam: "http://edamontology.org/format_3475" # TSV
output:
  counts:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test' ]`
      - "${prefix}.counts.tsv.gz":
          type: file
          description: |
            Long-format table (`orf`, `chr`, `start`, `end`, `strand`, `length`, `sample`,
            `count`, `tpm`) with one row per feature/sample, `count` > 0 rows only.
          pattern: "*.counts.tsv.gz"
          ontologies:
            - edam: "http://edamontology.org/format_3475" # TSV
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
topics:
  versions:
    - versions.yml:
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: "http://edamontology.org/format_3750" # YAML
