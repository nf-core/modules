name: "CUSTOM_CLUSTERMETRICS"
description: "Computes clustering quality metrics (silhouette, Calinski-Harabasz, Davies-Bouldin), performs k-sweep and k-distance analysis"
keywords:
  - clustering
  - metrics
  - silhouette
  - calinski-harabasz
  - davies-bouldin
  - k-distance
  - evaluation
tools:
  - "scikit-learn":
      description: "Machine learning library for clustering metrics"
      homepage: "https://scikit-learn.org/"
      documentation: "https://scikit-learn.org/stable/modules/clustering.html"
      licence:
        - "BSD-3-Clause"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - features:
        type: file
        description: |
          Sample-by-feature matrix: TSV with a `sample_id` column, or a
          PLINK2 `.eigenvec` file (`#FID IID PC1 ...` or `#IID PC1 ...`).
          Family/source ID columns are dropped; remaining columns are
          numeric features (e.g. PCA scores).
        pattern: "*.{tsv,txt,eigenvec}"
        ontologies:
          - edam: http://edamontology.org/format_3475 # TSV
    - clusters:
        type: file
        description: |
          Comma-separated cluster assignments with `sample_id` and integer
          `cluster` columns. Label -1 is treated as DBSCAN noise.
        pattern: "*.csv"
        ontologies:
          - edam: http://edamontology.org/format_3752 # CSV
output:
  metrics:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.metrics.tsv":
          type: file
          description: TSV with selected cluster quality metrics
          pattern: "*.metrics.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  k_sweep:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.k_sweep.csv":
          type: file
          description: CSV with metrics for different values of k
          pattern: "*.k_sweep.csv"
          ontologies:
            - edam: http://edamontology.org/format_3752 # CSV
  selected:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.selected.json":
          type: file
          description: JSON with the selected/best metrics
          pattern: "*.selected.json"
          ontologies:
            - edam: http://edamontology.org/format_3464 # JSON
  plots:
    - - meta:
          type: map
          description: Groovy Map containing sample information
      - "*.png":
          type: file
          description: Optional PNG plots (elbow, silhouette, etc.)
          pattern: "*.png"
          ontologies: []
  versions:
    - "versions.yml":
        type: file
        description: File containing software versions
        pattern: "versions.yml"
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@dbaku42"
maintainers:
  - "@dbaku42"
