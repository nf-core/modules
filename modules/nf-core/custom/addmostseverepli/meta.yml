name: "custom_addmostseverepli"
description: Annotate a VEP annotated VCF with the most severe pLi field
keywords:
  - annotation
  - vep
  - pli
  - vcf
tools:
  - "custom":
      description: "Custom module to annotate a VEP annotated VCF with the most severe pLi field"
      tool_dev_url: "https://github.com/nf-core/modules/blob/master/modules/nf-core/custom/addmostseverepli/main.nf"
      licence:
        - "MIT"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - vcf:
        type: file
        description: VEP annotated VCF file
        pattern: "*.{vcf,vcf.gz}"
        ontologies: []
output:
  vcf:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.vcf.gz":
          type: file
          description: Annotated VCF file
          pattern: "*.vcf.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989
  versions_addmostseverepli:
    - - ${task.process}:
          type: string
          description: The name of the process
      - addmostseverepli:
          type: string
          description: The name of the tool
      - 1.2.0:
          type: string
          description: The expression to obtain the version of the tool
  versions_bgzip:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bgzip:
          type: string
          description: The name of the tool
      - bgzip --version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - addmostseverepli:
          type: string
          description: The name of the tool
      - 1.2.0:
          type: string
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - bgzip:
          type: string
          description: The name of the tool
      - bgzip --version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
