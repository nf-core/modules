name: "pasty"
description: Serogroup Pseudomonas aeruginosa assemblies
keywords:
  - bacteria
  - serogroup
  - fasta
  - assembly
tools:
  - "pasty":
      description: "A tool for in silico serogrouping of Pseudomonas aeruginosa isolates"
      homepage: "https://github.com/rpetit3/pasty"
      documentation: "https://github.com/rpetit3/pasty"
      tool_dev_url: "https://github.com/rpetit3/pasty"
      licence:
        - "Apache-2.0"
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: An assembly in FASTA format
        pattern: "*.{fasta,fasta.gz,fna,fna.gz,fa,fa.gz}"
        ontologies: []
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}.tsv:
          type: file
          description: A tab-delimited file with the predicted serogroup
          pattern: "*.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  blast:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}.blastn.tsv:
          type: file
          description: A tab-delimited file of all blast hits
          pattern: "*.blastn.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  details:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - ${prefix}.details.tsv:
          type: file
          description: A tab-delimited file with details for each serogroup
          pattern: "*.details.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_pasty:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pasty:
          type: string
          description: The name of the tool
      - pasty --version 2>&1 | sed 's/^.*pasty, version //;':
          type: eval
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pasty:
          type: string
          description: The name of the tool
      - pasty --version 2>&1 | sed 's/^.*pasty, version //;':
          type: eval
          description: The expression to obtain the version of the tool

authors:
  - "@rpetit3"
maintainers:
  - "@rpetit3"
