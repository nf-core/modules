name: cnvkit_referencepooled
description: Compile a pooled copy-number reference from per-sample coverage files (normal samples).
keywords:
  - cnvkit
  - reference
  - pooled
  - cnv
  - copy number
tools:
  - cnvkit:
      description: |
        CNVkit is a Python library and command-line software toolkit to infer and visualize copy number from high-throughput DNA sequencing data.
        It is designed for use with hybrid capture, including both whole-exome and custom target panels, and short-read sequencing platforms such as Illumina and Ion Torrent.
      homepage: https://cnvkit.readthedocs.io/en/stable/index.html
      documentation: https://cnvkit.readthedocs.io/en/stable/index.html
      tool_dev_url: https://github.com/etal/cnvkit
      doi: 10.1371/journal.pcbi.1004873
      licence:
        - "Apache-2.0"
      identifier: biotools:cnvkit
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - coverages:
        type: file
        description: |
          List of per-sample *.targetcoverage.cnn and *.antitargetcoverage.cnn files
          produced by cnvkit/coverage for the normal samples to pool. CNVkit pairs
          target and antitarget coverage files by filename.
        pattern: "*.cnn"
        ontologies: []
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: |
          Reference genome FASTA, optional. Supply it to apply GC and edge-bias
          correction when the coverage files were built without it.
        pattern: "*.{fasta,fa}"
        ontologies: []
    - fasta_fai:
        type: file
        description: FASTA index, optional companion to fasta
        pattern: "*.fai"
        ontologies: []
output:
  cnn:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.reference.cnn":
          type: file
          description: Pooled copy-number reference (required for CNV calling in tumor_only mode)
          pattern: "*.reference.cnn"
          ontologies: []
  versions_cnvkit:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cnvkit:
          type: string
          description: The name of the tool
      - 'cnvkit.py version | sed -e "s/cnvkit v//g"':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - cnvkit:
          type: string
          description: The name of the tool
      - 'cnvkit.py version | sed -e "s/cnvkit v//g"':
          type: eval
          description: The expression to obtain the version of the tool
