name: "syncon_build"
description: Build syncmer databases for syncon
keywords:
  - fasta
  - decontamination
  - syncmer
tools:
  - "syncon":
      description: "Identifies and removes contaminant contigs from draft genome assemblies"
      homepage: "https://github.com/c-zhou/syncon"
      documentation: "https://github.com/c-zhou/syncon"
      tool_dev_url: "https://github.com/c-zhou/syncon"
      doi: ""
      licence: ["MIT"]

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - sequences:
        type: file
        description: FASTA/FASTQ file to build syncmer database from
        pattern: "*.{fa,fasta,fq,fastq,fa.gz,fasta.gz,fastq.gz,fq.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
          - edam: "http://edamontology.org/format_1930" # FASTQ

output:
  onekhash:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.1khash":
          type: file
          description: Syncmer 1khash file
          pattern: "*.1khash"
          ontologies: []
  onesyncseq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.1syncseq":
          type: file
          description: Syncmer 1khash file
          pattern: "*.1syncseq"
          ontologies: []
  versions_syncon:
    - - "${task.process}":
          type: string
          description: The name of the process
      - "syncon":
          type: string
          description: The name of the tool
      - "1.0":
          type: string
          description: The expression to obtain the version of the tool

topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - syncon:
          type: string
          description: The name of the tool
      - "1.0":
          type: string
          description: The expression to obtain the version of the tool

authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
