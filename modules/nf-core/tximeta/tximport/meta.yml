# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "tximeta_tximport"
description: |
  Import transcript-level abundances and estimated counts for gene-level
  analysis packages. `ext.args` accepts `--tx_col`, `--gene_id_col` and
  `--gene_name_col` to select tx2gene columns, and `--ignore_tx_version true`
  to strip trailing version suffixes from transcript IDs in both the
  quantifications and the tx2gene before matching them. With it, the
  transcript-level tables and `tx2gene_augmented.tsv` use the stripped IDs.
keywords:
  - gene
  - kallisto
  - pseudoalignment
  - rsem
  - salmon
  - transcript
tools:
  - "tximeta":
      description: "Transcript Quantification Import with Automatic Metadata"
      homepage: "https://bioconductor.org/packages/release/bioc/html/tximeta.html"
      documentation: "https://bioconductor.org/packages/release/bioc/vignettes/tximeta/inst/doc/tximeta.html"
      tool_dev_url: "https://github.com/thelovelab/tximeta"
      doi: "10.1371/journal.pcbi.1007664"
      licence: ["GPL-2"]
      identifier: biotools:tximeta

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing information related to the experiment as a whole
          e.g. `[ id:'SRP123456' ]`
    - "quants/*":
        type: file
        description: |
          Quantification files

  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information related to the species
          reference e.g. `[ id:'yeast' ]`
    - tx2gene:
        type: file
        description: A transcript to gene mapping table such as those generated by custom/tx2gene
        pattern: "*.{csv,tsv}"
        ontologies:
          - edam: http://edamontology.org/format_3752 # CSV
          - edam: http://edamontology.org/format_3475 # TSV
  - quant_type:
      type: string
      description: Quantification type, `kallisto`, `salmon`, or `rsem`
output:
  tpm_gene:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*gene_tpm.tsv":
          type: file
          description: |
            Abundance (TPM) values derived from tximport output after
            summarizeToGene(), without a 'countsFromAbundance' specification
          pattern: "*gene_tpm.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  counts_gene:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*gene_counts.tsv":
          type: file
          description: |
            Count values derived from tximport output after
            summarizeToGene(), without a 'countsFromAbundance' specification
          pattern: "*gene_counts.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  counts_gene_length_scaled:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*gene_counts_length_scaled.tsv":
          type: file
          description: |
            Count values derived from tximport output after summarizeToGene(), with
            a 'countsFromAbundance' specification of 'lengthScaledTPM'
          pattern: "*gene_counts_length_scaled.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  counts_gene_scaled:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*gene_counts_scaled.tsv":
          type: file
          description: |
            Count values derived from tximport output after summarizeToGene(), with
            a 'countsFromAbundance' specification of 'scaledTPM'
          pattern: "*gene_counts_scaled.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  lengths_gene:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*gene_lengths.tsv":
          type: file
          description: |
            Length values derived from tximport output after summarizeToGene(),
            without a 'countsFromAbundance' specification
          pattern: "*gene_lengths.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  tpm_transcript:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*transcript_tpm.tsv":
          type: file
          description: |
            Abundance (TPM) values derived from tximport output without
            summarizeToGene(), without a 'countsFromAbundance' specification
          pattern: "*transcript_tpm.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  counts_transcript:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*transcript_counts.tsv":
          type: file
          description: |
            Count values derived from tximport output without
            summarizeToGene(), without a 'countsFromAbundance' specification
          pattern: "*transcript_counts.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  counts_transcript_scaled:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*transcript_counts_scaled.tsv":
          type: file
          description: |
            Count values derived from tximport output without summarizeToGene(),
            with a 'countsFromAbundance' specification of 'scaledTPM'
          pattern: "*transcript_counts_scaled.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  counts_transcript_dtu_scaled:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*transcript_counts_dtu_scaled.tsv":
          type: file
          description: |
            Count values derived from tximport output without summarizeToGene(),
            with a 'countsFromAbundance' specification of 'dtuScaledTPM', the
            recommended input for differential transcript usage analysis with
            e.g. DRIMSeq or DEXSeq. Transcripts missing from the input tx2gene
            are treated as the only isoform of their own gene.
          pattern: "*transcript_counts_dtu_scaled.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  lengths_transcript:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*transcript_lengths.tsv":
          type: file
          description: |
            Length values derived from tximport output without summarizeToGene(),
            without a 'countsFromAbundance' specification
          pattern: "*transcript_lengths.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  tx2gene_augmented:
    - - meta:
          type: map
          description: |
            Groovy Map containing information related to the experiment as a whole
            e.g. `[ id:'SRP123456' ]`
      - "*tx2gene_augmented.tsv":
          type: file
          description: |
            tx2gene mapping table actually used by tximport, equal to the input
            tx2gene with self-mappings appended for any transcripts present in
            the quantification output but missing from the input. Use this file
            (not the input tx2gene) to reproduce the published gene-level
            outputs from the per-sample quantification files.
          pattern: "*tx2gene_augmented.tsv"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions:
    - versions.yml:
        type: file
        description: YAML file containing versions of tools used in the module
        ontologies:
          - edam: http://edamontology.org/format_3750 # YAML
topics:
  versions:
    - versions.yml:
        type: string
        description: The name of the process
authors:
  - "@pinin4fjords"
maintainers:
  - "@pinin4fjords"
