    linux/amd64:
      name: community.wave.seqera.io/library/raven-assembler:1.6.1--2388e7e21e19cd95
      build_id: bd-2388e7e21e19cd95_1
      scan_id: sc-ac0a656e22de0e15_1
  singularity:
