# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "xbqsr_recalibrate"
description: Cross-vendor GPU-accelerated generation of Base Quality Score Recalibration (BQSR) tables
keywords:
  - base quality score recalibration
  - bqsr
  - recalibrate
  - table
  - gpu-accelerated
  - sycl
tools:
  - "xbqsr":
      description: |
        X-BQSR is an open-source, vendor-agnostic GPU-accelerated Base Quality Score Recalibration (BQSR)
        engine implemented in SYCL via AdaptiveCpp, supporting NVIDIA CUDA and AMD ROCm accelerators.
      homepage: "https://github.com/ikabadzhov/xbqsr"
      documentation: "https://github.com/ikabadzhov/xbqsr#readme"
      tool_dev_url: "https://github.com/ikabadzhov/xbqsr"
      doi: "10.48550/arXiv.2611.31062"
      licence:
        - "Apache-2.0"
      identifier: ""
      publication:
        title: "X-BQSR: Holistic Acceleration of Base Quality Recalibration for Scalable Genomic Analysis"
        author: "Marinelli, E., Kabadzhov, I. D. & Appuswamy, R."
        source: "arXiv"
        year: 2026
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          e.g. `[ id:'test' ]`
    - input:
        type: file
        description: Input sorted BAM file from alignment
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
    - input_index:
        type: file
        description: BAI index file corresponding to the input BAM file
        pattern: "*.{bai,bam.bai}"
        ontologies:
          - edam: "http://edamontology.org/format_3327" # BAI
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference information.
          e.g. `[ id:'genome' ]`
    - fasta:
        type: file
        description: Reference genome FASTA file (uncompressed)
        pattern: "*.{fasta,fa,fna}"
        ontologies:
          - edam: "http://edamontology.org/format_1929" # FASTA
  - - meta3:
        type: map
        description: |
          Groovy Map containing known sites information.
          e.g. `[ id:'known_sites' ]`
    - known_sites:
        type: file
        description: One or more VCF / gzipped VCF files containing known variant sites
        pattern: "*.{vcf,vcf.gz}"
        ontologies:
          - edam: "http://edamontology.org/format_3016" # VCF
output:
  table:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information.
            e.g. `[ id:'test' ]`
      - "*.table":
          type: file
          description: Recalibration table generated by X-BQSR
          pattern: "*.table"
          ontologies: []
  versions_xbqsr:
    - - ${task.process}:
          type: string
          description: The name of the process
      - xbqsr:
          type: string
          description: The name of the tool
      - bqsr --version | sed 's/bqsr //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - xbqsr:
          type: string
          description: The name of the tool
      - bqsr --version | sed 's/bqsr //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ikabadzhov"
maintainers:
  - "@ikabadzhov"
