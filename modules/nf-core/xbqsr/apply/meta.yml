# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "xbqsr_apply"
description: Cross-vendor GPU-accelerated application of Base Quality Score Recalibration (BQSR) tables to BAM alignments
keywords:
  - base quality score recalibration
  - bqsr
  - applybqsr
  - bam
  - gpu-accelerated
  - sycl
tools:
  - "xbqsr":
      description: |
        X-BQSR is an open-source, vendor-agnostic GPU-accelerated Base Quality Score Recalibration (BQSR)
        engine implemented in SYCL via AdaptiveCpp. Note: this nf-core module currently only supports
        NVIDIA CUDA (`ghcr.io/ikabadzhov/xbqsr:cuda`); upstream also builds an AMD ROCm image
        (`ghcr.io/ikabadzhov/xbqsr:rocm`), and ROCm support may be added to the module in the future.
      homepage: "https://github.com/ikabadzhov/xbqsr"
      documentation: "https://github.com/ikabadzhov/xbqsr#readme"
      tool_dev_url: "https://github.com/ikabadzhov/xbqsr"
      doi: "10.48550/arXiv.2611.31062"
      licence:
        - "Apache-2.0"
      identifier: ""
      publication:
        title: "X-BQSR: Holistic Acceleration of Base Quality Recalibration for Scalable Genomic Analysis"
        author: "Marinelli, E., Kabadzhov, I. D. & Appuswamy, R."
        source: "arXiv"
        year: 2026
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information.
          e.g. `[ id:'test' ]`
    - input:
        type: file
        description: Input sorted BAM file with original base quality scores
        pattern: "*.bam"
        ontologies:
          - edam: "http://edamontology.org/format_2572" # BAM
    - input_index:
        type: file
        description: BAI index file corresponding to the input BAM file
        pattern: "*.{bai,bam.bai}"
        ontologies:
          - edam: "http://edamontology.org/format_3327" # BAI
    - table:
        type: file
        description: Recalibration table generated by xbqsr/recalibrate or gatk4/baserecalibrator
        pattern: "*.table"
        ontologies: []
output:
  bam:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information.
            e.g. `[ id:'test' ]`
      - "*.bam":
          type: file
          description: BAM file with recalibrated base quality scores
          pattern: "*.bam"
          ontologies:
            - edam: "http://edamontology.org/format_2572" # BAM
  versions_xbqsr:
    - - ${task.process}:
          type: string
          description: The name of the process
      - xbqsr:
          type: string
          description: The name of the tool
      - bqsr --version | sed 's/bqsr //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - xbqsr:
          type: string
          description: The name of the tool
      - bqsr --version | sed 's/bqsr //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@ikabadzhov"
maintainers:
  - "@ikabadzhov"
