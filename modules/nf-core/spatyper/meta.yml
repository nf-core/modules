name: spatyper
description: Computational method for finding spa types.
keywords:
  - fasta
  - spatype
  - spa
tools:
  - spatyper:
      description: Computational method for finding spa types.
      homepage: https://github.com/HCGB-IGTP/spaTyper
      documentation: https://github.com/HCGB-IGTP/spaTyper
      tool_dev_url: https://github.com/HCGB-IGTP/spaTyper
      doi: 10.5281/zenodo.4063625
      licence: ["LGPL v3"]
      identifier: ""
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - fasta:
        type: file
        description: FASTA assembly file
        pattern: "*.{fasta,fasta.gz,fa,fa.gz,fna,fna.gz}"
        ontologies: []
  - repeats:
      type: file
      description: spa repeat sequences in FASTA format (Optional)
      pattern: "*.{fasta}"
      ontologies: []
  - repeat_order:
      type: file
      description: spa types and order of repeats (Optional)
      pattern: "*.{txt}"
      ontologies: []
output:
  tsv:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.tsv":
          type: file
          description: Tab-delimited results
          pattern: "*.{tsv}"
          ontologies:
            - edam: http://edamontology.org/format_3475 # TSV
  versions_spatyper:
    - - ${task.process}:
          type: string
          description: The name of the process
      - spatyper:
          type: string
          description: The name of the tool
      - spaTyper --version 2>&1 | sed 's/^.*spaTyper //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - spatyper:
          type: string
          description: The name of the tool
      - spaTyper --version 2>&1 | sed 's/^.*spaTyper //':
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@rpetit3"
maintainers:
  - "@rpetit3"
