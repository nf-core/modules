name: "bwamem3_mem"
description: Align fastq reads to a fasta reference using bwa-mem3
keywords:
  - mem
  - bwa
  - alignment
  - map
  - fastq
  - bam
  - sam
tools:
  - "bwamem3":
      description: "Short-read aligner derived from bwa-mem2 with correctness fixes, performance improvements, and methylation-aware alignment."
      homepage: "https://github.com/fg-labs/bwa-mem3"
      documentation: "https://github.com/fg-labs/bwa-mem3"
      tool_dev_url: "https://github.com/fg-labs/bwa-mem3"
      licence: ["MIT AND Apache-2.0"]
      identifier: ""
  - "samtools":
      description: "Tools for dealing with SAM, BAM and CRAM files"
      homepage: "http://www.htslib.org"
      documentation: "http://www.htslib.org/doc/samtools.html"
      doi: "10.1093/bioinformatics/btp352"
      publication:
        author: "Li, H., Handsaker, B., Wysoker, A., Fennell, T., Ruan, J., Homer, N., Marth, G., Abecasis, G., Durbin, R. & 1000 Genome Project Data Processing Subgroup"
        year: 2009
        title: "The Sequence Alignment/Map format and SAMtools"
        source: "Bioinformatics"
      licence: ["MIT"]
      identifier: "biotools:samtools"
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. [ id:'test', single_end:false ]
    - reads:
        type: file
        description: |
          List of input FastQ files of size 1 and 2 for single-end and paired-end data,
          respectively.
        ontologies:
          - edam: "http://edamontology.org/data_2044"
          - edam: "http://edamontology.org/format_1930"
  - - meta2:
        type: map
        description: |
          Groovy Map containing reference/index information
          e.g. [ id:'test' ]
    - index:
        type: file
        description: |
          bwa-mem3 genome index files. Methylation-aware alignment (`ext.args = '--meth=taps'`
          for TAPS; the `=` is required) needs an index built with `bwa-mem3 index --meth`,
          which adds the `*.meth.*` seed index. Aligning against a `--meth` index needs about
          1.7x the memory of a plain index (measured on human chr21 with bwa-mem3 0.16.0);
          for a human genome that is tens of GB. Since bwa-mem3 0.17.0, bare `--meth`
          (bisulfite/EM-seq) scores mismatches as `--meth-scoring genomic`; pass
          `--meth-scoring collapsed` to keep the 0.16.0 scores, MAPQ and placements.
        pattern: "Directory containing bwa-mem3 index *.{amb,ann,bwt.2bit.64,pac}"
        ontologies:
          - edam: "http://edamontology.org/data_3210"
  - - meta3:
        type: map
        description: |
          Groovy Map containing reference information
          e.g. [ id:'genome' ]
    - fasta:
        type: file
        description: Reference genome in FASTA format
        pattern: "*.{fa,fasta,fna}"
        ontologies:
          - edam: "http://edamontology.org/data_2044"
          - edam: "http://edamontology.org/format_1929"
  - sort_bam:
      type: boolean
      description: use samtools sort (true) or samtools view (false)
  - index_format:
      type: string
      description: |
        Index to write alongside the sorted output: `bai` or `csi` for BAM, `crai` for CRAM.
        Leave empty (`''`) to write no index. Requires `sort_bam = true`.
      pattern: "bai|csi|crai"
output:
  aligned:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{sam,bam,cram}":
          type: file
          description: Output SAM/BAM/CRAM file containing read alignments
          pattern: "*.{sam,bam,cram}"
          ontologies:
            - edam: "http://edamontology.org/format_2573"
            - edam: "http://edamontology.org/format_2572"
            - edam: "http://edamontology.org/format_3462"
  index:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. [ id:'test', single_end:false ]
      - "*.{bai,csi,crai}":
          type: file
          description: Index file for the aligned BAM/CRAM file
          pattern: "*.{bai,csi,crai}"
          ontologies: []
  versions_bwamem3:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bwamem3:
          type: string
          description: The name of the tool
      - bwa-mem3 version | sed -nE '1 s/^([0-9]+(\.[0-9]+)+).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
  versions_samtools:
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bwamem3:
          type: string
          description: The name of the tool
      - bwa-mem3 version | sed -nE '1 s/^([0-9]+(\.[0-9]+)+).*/\1/p':
          type: eval
          description: The expression to obtain the version of the tool
    - - ${task.process}:
          type: string
          description: The name of the process
      - samtools:
          type: string
          description: The name of the tool
      - samtools version | sed '1!d;s/.* //':
          type: eval
          description: The expression to obtain the version of the tool
