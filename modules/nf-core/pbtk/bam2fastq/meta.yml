# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/yaml-schema.json
name: "pbtk_bam2fastq"
description: converts pacbio bam files to fastq.gz using PacBioToolKit (pbtk) bam2fastq
keywords:
  - convert
  - bam
  - genomics
  - pacbio
tools:
  - "pbtk":
      description: "pbtk - PacBio BAM toolkit"
      homepage: "https://github.com/PacificBiosciences/pbtk"
      documentation: "https://github.com/PacificBiosciences/pbtk#usage"
      tool_dev_url: "https://github.com/PacificBiosciences/pbtk"
      doi: "no DOI available"
      licence: ["BSD-3-clause-Clear"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'test' ]`
    - bam:
        type: file
        description: PacBio BAM file
        pattern: "*.bam"
        ontologies: []
    - pbi:
        type: file
        description: PacBio BAM file index (.pbi)
        pattern: "*.pbi"
        ontologies: []
output:
  fastq:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'test', single_end:false ]`
      - "*.$extension":
          type: file
          description: Gzipped FASTQ file
          pattern: "*.fastq.gz"
          ontologies:
            - edam: http://edamontology.org/format_3989 # GZIP format
  versions_bam2fastq:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bam2fastq:
          type: string
          description: The name of the tool
      - bam2fastq --version 2>&1 | sed -n 's/.*bam2fastq //p' | cut -d' ' -f1:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - bam2fastq:
          type: string
          description: The name of the tool
      - bam2fastq --version 2>&1 | sed -n 's/.*bam2fastq //p' | cut -d' ' -f1:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@mbeavitt"
  - "@gallvp"
maintainers:
  - "@mbeavitt"
  - "@gallvp"
