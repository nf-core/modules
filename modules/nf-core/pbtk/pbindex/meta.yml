# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/modules/meta-schema.json
name: "pbtk_pbindex"
description: Minimalistic tool which creates an index file that enables random access
  into PacBio BAM files
keywords:
  - genomics
  - bam
  - index
  - pacbio
tools:
  - "pbtk":
      description: "pbtk - PacBio BAM toolkit"
      homepage: "https://github.com/PacificBiosciences/pbtk"
      documentation: "https://github.com/PacificBiosciences/pbtk"
      tool_dev_url: "https://github.com/PacificBiosciences/pbtk"
      licence: ["BSD-3-clause-Clear"]
      identifier: ""

input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1', single_end:false ]`
    - bam:
        type: file
        description: Input BAM file
        pattern: "*.bam"
        ontologies: []
output:
  pbi:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1', single_end:false ]`
      - "*.pbi":
          type: file
          description: Index file
          pattern: "*.bam.pbi"
          ontologies: []
  versions_pbindex:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pbindex:
          type: string
          description: The name of the tool
      - pbindex --version | head -n1 | cut -d' ' -f2:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - pbindex:
          type: string
          description: The name of the tool
      - pbindex --version | head -n1 | cut -d' ' -f2:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@GallVp"
maintainers:
  - "@GallVp"
