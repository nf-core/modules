name: "semibin_concatenatefasta"
description: Concatenate multiple sample FASTAs to a single FASTA with the correct header format for SemiBin2
keywords:
  - concatenate
  - fasta
  - binning
tools:
  - "semibin":
      description: "Metagenomic binning with semi-supervised siamese neural network"
      homepage: "https://github.com/BigDataBiology/SemiBin"
      documentation: "https://semibin.readthedocs.io/en/latest/"
      tool_dev_url: "https://github.com/BigDataBiology/SemiBin"
      doi: "10.1038/s41467-022-29843-y"
      licence: ["MIT"]
      identifier: biotools:semibin
input:
  - - meta:
        type: map
        description: |
          Groovy Map containing sample information
          e.g. `[ id:'sample1' ]`
    - fastas:
        type: file
        description: Input FASTAs, per sample.
        pattern: "*.{fa,fa.gz}"
        ontologies:
          - edam: http://edamontology.org/format_1929 # FASTA
          - edam: http://edamontology.org/format_3989 # GZIP
output:
  concat_fasta:
    - - meta:
          type: map
          description: |
            Groovy Map containing sample information
            e.g. `[ id:'sample1' ]`
      - "*.fasta*":
          type: file
          description: Output concatenated FASTA.
          pattern: "*.{fasta,fasta.gz}"
          ontologies:
            - edam: http://edamontology.org/format_1929 # FASTA
            - edam: http://edamontology.org/format_3989 # GZIP
  versions_semibin:
    - - ${task.process}:
          type: string
          description: The name of the process
      - semibin:
          type: string
          description: The name of the tool
      - SemiBin2 --version:
          type: eval
          description: The expression to obtain the version of the tool
topics:
  versions:
    - - ${task.process}:
          type: string
          description: The name of the process
      - semibin:
          type: string
          description: The name of the tool
      - SemiBin2 --version:
          type: eval
          description: The expression to obtain the version of the tool
authors:
  - "@prototaxites"
maintainers:
  - "@prototaxites"
