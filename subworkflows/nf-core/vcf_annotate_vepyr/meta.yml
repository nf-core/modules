# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "vcf_annotate_vepyr"
description: |
  Optionally download a vepyr cache from Hugging Face and normalise a VCF with
  bcftools norm, then annotate it with Ensembl VEP consequences using vepyr and
  return the bgzip VCF with its tabix index.

  Give the cache either as `ch_cache` or as a Hugging Face dataset in
  `val_hf_repo`, such as `biodatageeks/vepyr_116_GRCh38_ensembl`; setting both,
  or neither, is an error. The repository is downloaded once and shared across
  all samples. To pin the cache or download only some contigs, add `--revision`
  and `--include` to `HUGGINGFACE_DOWNLOAD`'s `ext.args`. A partial download
  must include every entity's manifest and all contigs present in the VCF:

  ```
  withName: 'HUGGINGFACE_DOWNLOAD' {
      ext.args = "--revision <commit> --include '*/chr22.parquet' --include '*/chrom_manifest.json'"
  }
  ```

  What bcftools norm does comes from `BCFTOOLS_NORM`'s `ext.args`. Keep its
  output bgzip VCF (`--output-type z`): `VEPYR_ANNOTATE` runs a single pipeline
  for BCF (`-Ob`, `-Ou`) and plain VCF (`-Ov`). vepyr's Ensembl VEP parity tests
  use this configuration, which splits multiallelic records without
  left-aligning indels. `--write-index=tbi` is optional and saves the tabix step
  in `VEPYR_ANNOTATE`:

  ```
  withName: 'BCFTOOLS_NORM' {
      ext.args = '--multiallelics -both --do-not-normalize --output-type z --write-index=tbi'
  }
  ```
keywords:
  - vcf
  - annotation
  - normalisation
  - vep
  - vepyr
  - bcftools
  - huggingface
components:
  - bcftools/norm
  - huggingface/download
  - vepyr/annotate
input:
  - ch_vcf:
      description: |
        VCF to normalise and annotate, with its optional tabix/CSI index (pass [] for none)
        Structure: [ val(meta), path(vcf), path(tbi) ]
  - ch_cache:
      description: |
        vepyr Parquet cache directory produced by vepyr's cache build. Must be
        a value channel (e.g. `channel.value(...)` or `.collect()`): a queue
        channel annotates only the first sample. Pass [[], []] when
        val_hf_repo is set.
        Structure: [ val(meta2), path(cache) ]
  - ch_fasta:
      description: |
        Reference FASTA, its samtools faidx index and, for a bgzip FASTA, its
        .gzi index (pass [] for an uncompressed FASTA). Required: vepyr always
        annotates with `--everything`, which needs it, and bcftools norm reads
        it when `val_normalize` is true. Must be a value channel: a queue
        channel annotates only the first sample.
        Structure: [ val(meta3), path(fasta), path(fai), path(gzi) ]
  - val_cache_version:
      type: integer
      description: Ensembl cache version to assert against the cache metadata, or [] to skip the check
  - ch_plugin_cache:
      description: |
        Root of a vepyr plugin cache tree holding plugin/<name>/ directories (optional, pass [ [], [] ])
        Structure: [ val(meta4), path(plugin_cache) ]
  - val_normalize:
      type: boolean
      description: Run BCFTOOLS_NORM before annotation. Pipelines should default this to true.
  - val_hf_repo:
      type: string
      description: |
        Hugging Face dataset holding the vepyr Parquet cache, e.g.
        `biodatageeks/vepyr_116_GRCh38_ensembl` (a `datasets/` prefix is
        optional). Downloaded once and shared across samples. Pass '' or [] to
        use ch_cache instead.
output:
  - vcf_tbi:
      description: |
        Annotated bgzip VCF and its tabix index
        Structure: [ val(meta), path(vcf), path(tbi) ]
authors:
  - "@mwiewior"
maintainers:
  - "@mwiewior"
