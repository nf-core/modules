# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: deepvariant
description: DeepVariant is an analysis pipeline that uses a deep neural network to call genetic variants from next-generation DNA sequencing data
keywords:
  - variant calling
  - machine learning
  - neural network
components:
  - deepvariant/makeexamples
  - deepvariant/callvariants
  - deepvariant/postprocessvariants
input:
  - ch_input:
      type: list
      description: |
        Input aligned reads in bam or cram format, with index, and optional intervals BED file
        Structure: [ val(meta), path(bam_or_cram), path(bai_or_crai), path(intervals_bed) ]
  - ch_fasta:
      type: file
      description: |
        Reference genome
        Structure: [ val(meta2), path(fasta) ]
  - ch_fai:
      type: string
      description: |
        Reference genome index in fai format
        Structure: [ val(meta3), path(fai) ]
  - ch_gzi:
      type: string
      description: |
        Reference genome index in gzi format (either gzi or fai should be used)
        Structure: [ val(meta4), val(gzi) ]
  - ch_par_bed:
      type: string
      description: |
        bed file of pseudoautosomal regions (optional)
        Structure: [ val(meta5), val(par_bed) ]
      pattern: "*.bed"
  - with_phasing:
      type: boolean
      description: |
        Whether to enable haplotype phasing of the variant calls
output:
  - vcf:
      type: file
      description: |
        Variant calls
        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
  - vcf_index:
      type: file
      description: |
        Index for variant call file
        Structure: [ val(meta), path(vcf_index) ]
      pattern: "*.tbi"
  - gvcf:
      type: file
      description: |
        Variant call file with genomic coverage information
        Structure: [ val(meta), path(gvcf) ]
      pattern: "*.g.vcf.gz"
  - gvcf_index:
      type: file
      description: |
        Index for the GVCF.
        Structure: [ val(meta), path(gvcf_index) ]
      pattern: "*.tbi"
  - phased_reads_switches:
      type: file
      description: |
        Phase set stitching status for each shard and region, from the merge
        of the phased read inputs. Only created when with_phasing is true.
        Structure: [ val(meta), path(phased_reads_switches) ]
      pattern: "*.phased_reads_switches.tsv"
  - phased_reads_corrected:
      type: file
      description: |
        Corrected phase of each read after the merge of the phased read
        inputs. Only created when with_phasing is true.
        Structure: [ val(meta), path(phased_reads_corrected) ]
      pattern: "*.phased_reads_corrected.tsv"
authors:
  - "@abhi18av"
  - "@ramprasadn"
  - "@fa2k"
maintainers:
  - "@abhi18av"
  - "@ramprasadn"
  - "@fa2k"
