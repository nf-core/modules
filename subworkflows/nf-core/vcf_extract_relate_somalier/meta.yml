# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "vcf_extract_relate_somalier"
description: Perform somalier extraction, relatedness, and ancestry analyses on input VCFs
keywords:
  - somalier
  - stats
  - vcf
  - ped
  - relatedness
  - ancestry
components:
  - htslib/bgziptabix
  - somalier/extract
  - somalier/relate
  - somalier/ancestry
input:
  - ch_vcfs:
      description: |
        The input VCFs to perform the stats on, optionally with their indices.
        The count is the expected number of input VCFs in the same family or case group.
        Providing it allows relatedness and ancestry analyses to start as soon as all VCFs in a group arrive.
        Structure: [ val(meta), path(vcf), path(tbi), val(count) ]
  - ch_fasta:
      description: |
        The reference FASTA used to create the VCF files
        Structure: [ path(fasta) ]
  - ch_fasta_fai:
      description: |
        The index of the reference FASTA
        Structure: [ path(fasta_fai) ]
  - ch_somalier_sites:
      description: |
        A VCF containing the common sites for Somalier (with INFO/AF), used by extract and relate
        Structure: [ val(meta), path(somalier_sites_vcf) ]
  - ch_peds:
      description: |
        A channel containing an optional PED file for the corresponding families. This channel has to be given, but can be like `[meta, []]`.
        When you don't want to use a PED file, you must supply a channel
        containing the meta and an empty value (`[]`) instead of a PED
        Structure: [ val(meta), path(ped) ]
  - ch_sample_groups:
      description: |
        Optional - A text file describing how the samples should be grouped
        Structure: [ path(txt) ]
  - ch_ancestry_reference:
      description: |
        Optional labels and Somalier files for reference samples with known ancestry.
        Supply a single reference tuple, which is reused for every family or case group.
        Supply an empty channel to skip ancestry analysis; do not supply a tuple with empty file values.
        Structure: [ val(meta), path(labels_tsv), path(labelled_somalier_files) ]
  - val_common_id:
      description: |
        Optional - The name of the meta map key used to group VCFs for both relatedness and ancestry,
        for example family_id or case_id. Its value becomes meta.id in both analyses' outputs.
        Input meta maps for a group must match apart from meta.id, and the PED input must use the resulting grouped meta map.
        When no key is supplied, VCFs are grouped using their unchanged meta maps.
output:
  - extract:
      description: |
        The extract file created with Somalier extract
        Structure: [ val(meta), path(extract) ]
  - html:
      description: |
        An HTML file containing an interactive graph on the relatedness of the samples
        Structure: [ val(meta), path(html) ]
  - pairs_tsv:
      description: |
        A TSV file detailing the relatedness between pairs of samples
        Structure: [ val(meta), path(tsv) ]
  - samples_tsv:
      description: |
        A TSV file detailing the relatedness between all samples with the same meta
        Structure: [ val(meta), path(tsv) ]
  - ancestry_tsv:
      description: |
        One TSV file per group containing ancestry information for each query sample and the labelled reference samples.
        The meta.id and filename prefix use the group identifier when val_common_id is supplied.
        Structure: [ val(meta), path(tsv) ]
  - ancestry_html:
      description: |
        One HTML file per group containing an interactive ancestry plot for the query and labelled reference samples.
        The meta.id and filename prefix use the group identifier when val_common_id is supplied.
        Structure: [ val(meta), path(html) ]
authors:
  - "@nvnieuwk"
maintainers:
  - "@nvnieuwk"
