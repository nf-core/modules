# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: bam_create_som_pon_gatk
description: Perform variant calling on a set of normal samples using mutect2 panel of normals mode. Group them into a genomicsdbworkspace using genomicsdbimport, then use this to create a panel of normals using createsomaticpanelofnormals.
keywords:
  - gatk4
  - mutect2
  - genomicsdbimport
  - createsomaticpanelofnormals
  - variant_calling
  - genomicsdb_workspace
  - panel_of_normals
components:
  - gatk4/mutect2
  - gatk4/genomicsdbimport
  - gatk4/createsomaticpanelofnormals
  - gatk4/mergevcfs
  - gatk4/mergemutectstats
input:
  - ch_input:
      type: list
      description: |
        One or more BAM/CRAM files with their index/indices.

        Structure: [ val(meta), path(input), path(input_index) ]
  - ch_fasta:
      type: list
      description: |
        Reference fasta file.

        Structure: [ val(meta), path(fasta) ]
  - ch_fai:
      type: list
      description: |
        Reference fasta file index, and the gzip index when the reference is compressed.

        Structure: [ val(meta), path(fai), path(gzi) ]
  - ch_dict:
      type: list
      description: |
        GATK sequence dictionary.

        Structure: [ val(meta), path(dict) ]
  - val_pon_norm:
      type: string
      description: |
        Name given to the panel of normals, used as the sample id of the genomicsdb
        workspace and of the resulting panel of normals.
  - ch_intervals_gendb:
      type: file
      description: Interval file used for GenomicsDBImport
      pattern: "*.{bed,interval_list}"
  - ch_intervals_num:
      type: list
      description: |
        Intervals channel for scatter and gather strategy. Each item is a tuple of
        an interval file and the total number of intervals. Use [ [], 0 ] if no intervals.

        Structure: [ path(intervals), val(num_intervals) ]
output:
  - genomicsdb:
      type: directory
      description: |
        Directory containing the files that compose the genomicsdb workspace.

        Structure: [ val(meta), path(genomicsdb) ]
      pattern: "path/name_of_workspace"
  - mutect2_index:
      type: file
      description: |
        Index of the mutect2 vcf file.

        Structure: [ val(meta), path(tbi) ]
      pattern: "*.vcf.gz.tbi"
  - mutect2_stats:
      type: file
      description: |
        Stats file that pairs with the mutect2 vcf file.

        Structure: [ val(meta), path(stats) ]
      pattern: "*.vcf.gz.stats"
  - mutect2_vcf:
      type: file
      description: |
        Compressed vcf file used to make the gendb workspace.

        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
  - pon_index:
      type: file
      description: |
        Index of the panel of normals vcf file.

        Structure: [ val(meta), path(tbi) ]
      pattern: "*.vcf.gz.tbi"
  - pon_vcf:
      type: file
      description: |
        Panel of normals as a compressed vcf file.

        Structure: [ val(meta), path(vcf) ]
      pattern: "*.vcf.gz"
authors:
  - "@GCJMackenzie"
maintainers:
  - "@GCJMackenzie"
  - "@maxulysse"
