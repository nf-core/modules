name: "bam_vcf_impute_glimpse2"
description: |
  Subworkflow to impute VCF and BAM files using GLIMPSE V2 software. The subworkflow
  takes VCF files, phased reference panel, and genetic maps to perform imputation
  and outputs phased and imputed VCF files.
  Meta map of all channels, except ch_input, will be used to perform joint operations.
  "regionout", "regionoutPadded", "regionSize" keys will be added to the meta map to distinguish
  the different files before ligation and therefore should not be used.
keywords:
  - glimpse
  - chunk
  - phase
  - ligate
  - split_reference
components:
  - glimpse2/chunk
  - glimpse2/phase
  - glimpse2/ligate
  - glimpse2/splitreference
  - bcftools/index
input:
  - ch_input:
      type: file
      description: |
        Target dataset in CRAM, BAM or VCF/BCF format.
        Index file of the input file.
        File containing the list of files to be imputed and their sample names (for CRAM/BAM input).
        File with sample names and ploidy information.
        Structure: [ meta, file, index, bamlist, ploidy ]
  - ch_ref:
      type: file
      description: |
        Reference panel of haplotypes in VCF/BCF format.
        Index file of the Reference panel file.
        Target region, usually a full chromosome (e.g. chr20:1000000-2000000 or chr20).
        The file could possibly be without GT field (for efficiency reasons a file containing only the positions is recommended).
        Structure: [ meta, vcf, csi, region ]
  - ch_chunks:
      type: string
      description: |
        Channel containing the chunking regions for each chromosome.
        Structure: [ meta, region with buffer, region without buffer ]
  - ch_map:
      type: file
      description: |
        Genetic map file for each chromosome.
        Structure: [ meta, gmap ]
  - ch_fasta:
      type: file
      description: |
        Reference genome in fasta format.
        Reference genome index in fai format
        Structure: [ meta, fasta, fai ]
  - chunk:
      type: boolean
      description: Whether to perform chunking of the input data before imputation.
  - chunk_model:
      type: string
      description: |
        Chunking model to use.
        Options: "sequential", "recursive"
  - splitreference:
      type: boolean
      description: Whether to split the reference panel and convert it to binary files before imputation.

output:
  - chunks:
      type: string
      description: |
        Channel containing the chunking regions for each chromosome.
      structure:
        - meta:
            type: map
            description: Metadata map with chromosome information
        - regionin:
            type: string
            description: Region chunk with buffer
        - regionout:
            type: string
            description: Region chunk without buffer
  - vcf_index:
      description: |
        Channel emitting imputed VCF/BCF files and their indexes.
        Regions imputed in multiple chunks are ligated into a single file.
        Regions imputed as a single chunk are emitted unchanged.
      structure:
        - meta:
            type: map
            description: |
              Metadata map combined with the posfile, chunks and map data map.
        - vcf:
            type: file
            description: VCF imputed file
            pattern: "*.{vcf,bcf,vcf.gz}"
        - index:
            type: file
            description: VCF index file
            pattern: "*.{tbi,csi}"
authors:
  - "@LouisLeNezet"
maintainers:
  - "@LouisLeNezet"
