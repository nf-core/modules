# yaml-language-server: $schema=https://raw.githubusercontent.com/nf-core/modules/master/subworkflows/yaml-schema.json
name: "VCF_PHASE_SHAPEIT5"
description: |
  Subworkflow to phase a reference panel VCF file using SHAPEIT5.
  The panel is first chunked by chromosome by glimpse2/chunk (if no chunks provided),
  then genotypes are phased with shapeit5/phasecommon and
  finally the chunks are merged back together by shapeit5/ligate by chromosomes.
  Meta map of all channels will be used to perform joint operations.
  "regionout", "regionoutPadded", "regionSize" keys will be added to the meta map to distinguish
  the different files before ligation and therefore should not be used.
keywords:
  - VCF
  - phase
  - shapeit5
  - haplotype
components:
  - glimpse2/chunk
  - shapeit5/phasecommon
  - shapeit5/ligate
  - bcftools/index
input:
  - ch_input:
      description: Channel with target VCF files
      structure:
        - meta:
          type: map
          description: Metadata map
        - vcf:
          type: file
          description: VCF file
          pattern: "*.{vcf,bcf,vcf.gz}"
        - index:
          type: file
          description: VCF index file
          pattern: "*.{tbi,csi}"
        - pedigree:
          type: file
          description:
            Pedigree information in the following format: offspring father mother.
          pattern: "*.{txt, tsv}"
        - reference_vcf:
          type: file
          description: Reference panel VCF file
          pattern: "*.{vcf,bcf,vcf.gz}"
        - reference_index:
          type: file
          description: Reference panel VCF index file
          pattern: "*.{tbi,csi}"
        - scaffold_vcf:
          type: file
          description: Scaffold VCF file
          pattern: "*.{vcf,bcf,vcf.gz}"
        - scaffold_index:
          type: file
          description: Scaffold VCF index file
          pattern: "*.{tbi,csi}"
        - map:
          type: file
          description: Map file in GLIMPSE format
          pattern: "*.map"
        - region:
          type: string
          description: Region to perform the chunking on using GLIMPSE2_chunk
          pattern: "[chr]+[0-9]+:[0-9]+-[0-9]+"
        - chunks:
          type: array
          description: List of region to perform the phasing on
          pattern: "[([chr]+[0-9]+:[0-9]+-[0-9]+)(,[chr]+[0-9]+:[0-9]+-[0-9]+)+]"
  - chunk_model:
      description: Chunk model for GLIMPSE2_chunk
      type: string
      enum:
        - recursive
        - sequential
output:
  - chunks:
      description: Channel with chunks regions
      structure:
        - meta:
          type: map
          description: Metadata map
        - regionout:
          type: string
          description: Region to perform the phasing on
          pattern: "[chr]+[0-9]+:[0-9]+-[0-9]+"
  - vcf_index:
      description: Channel with phased VCF files
      structure:
        - meta:
          type: map
          description: Metadata map
        - vcf:
          type: file
          description: VCF file
          pattern: "*.{vcf,bcf,vcf.gz}"
        - index:
          type: file
          description: VCF index file
          pattern: "*.{tbi,csi}"
authors:
  - "@louislenezet"
maintainers:
  - "@louislenezet"
